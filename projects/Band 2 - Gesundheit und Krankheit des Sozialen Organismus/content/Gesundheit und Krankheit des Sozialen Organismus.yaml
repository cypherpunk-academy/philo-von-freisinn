  # FELD 2 — GEIST → WIRTSCHAFT
  # ══════════════════════════════════════════════════════════════════════

  - id: dm-02g
    feld: 2
    richtung: "Geist -> Wirtschaft"
    pol: gesund
    titel: "Fähigkeiten befruchten die Wirtschaft"
    aspekte:
      - schlagwort: Bedürfnisse
        schlagsatz: Das Bedürfnis ist der Anfang — und kommt nicht aus der Wirtschaft.
        kurztext: >
          Bedürfnisse haben eine doppelte Wurzel: die natürlichen — Essen, Dach — und die, die aus Bildung und Erfahrung wachsen. Ein gesundes Geistesleben befähigt Menschen, ihre wirklichen Bedürfnisse zu erkennen; Urteilskraft ist auch Konsumreife. In der Erzeuger-Verwender-Gemeinschaft sprechen die Verwender zuerst — das ist der Anfang des Wirtschaftsprozesses. Schweigt das Geistesleben, erzeugt der Erzeuger auch das Bedürfnis nach der Ware. Wer zuerst spricht, entscheidet über den ganzen Prozess.
        text: >
          Bedürfnisse haben eine doppelte Wurzel. Die natürlichen sind jedem gegeben: Essen, Trinken, ein Dach über dem Kopf. Darüber hinaus entstehen sie aus Bildung, Lebenserfahrung und kultureller Entwicklung. Ein gesundes Geistesleben befähigt Menschen, ihre wirklichen Bedürfnisse zu erkennen und auszusprechen – Urteilskraft ist auch Konsumreife. In der Erzeuger-Verwender-Gemeinschaft sprechen die Verwender aus ihrer Kultursphäre, und diese Artikulation ist der Anfang des Wirtschaftsprozesses. Eine Wirtschaft kann nur so gut versorgen, wie ihr Bedürfnisse entgegenkommen. Sie muss die elementaren Bedürfnisse befriedigen, aber auch offen sein für das, was aus der Freiheit des Geisteslebens kommt. Ein Geistesleben, das schweigt, überlässt der Wirtschaft die Bedürfnisdefinition – dann erzeugt der Erzeuger auch das Bedürfnis nach der Ware. Das gesunde Geistesleben spricht zuerst. Wer zuerst spricht, entscheidet über den ganzen Prozess: Spricht der Verwender, beginnt die Wirtschaft bei einem Bedürfnis; schweigt er, erfindet sich das Angebot eines.
        zitate: []
      - schlagwort: Ideen
        schlagsatz: Die Idee befeuert die Produktion — nicht Gewinn, nicht Zwang.
        kurztext: >
          Der schöpferische Einfall gibt der Arbeit Inhalt und Ziel. Der Geist bietet an — Einsicht, Erfindung, Sachkenntnis — und die Wirtschaft nimmt an, weil die Idee trägt, nicht weil jemand sie verordnet. Wert entsteht in der richtigen Reihenfolge: Naturprodukt durch Arbeit, Arbeitsprodukt durch den Geist, der die Arbeit ordnet. Auch der Wettstreit gehört hierher: Unter Ideen darf jeder die bessere übernehmen; unter Erzeugern wird daraus der Kampf gegen den anderen.
        text: >
          Der schöpferische Einfall gibt der Arbeit ihren Inhalt und ihr Ziel. Der Geist wirkt mit seinen ureigenen Mitteln: Einsicht, Erfindung, Sachkenntnis, Urteilskraft. Er befiehlt nicht, er bietet an – und die Wirtschaft nimmt an, weil die Idee trägt, nicht weil jemand sie verordnet hat. So entsteht Wert in seiner richtigen Reihenfolge: Das Naturprodukt wird durch Arbeit wertvoll, das Arbeitsprodukt durch den Geist, der die Arbeit ordnet. Erst diese geistige Organisation löst den Wert von der Natur und macht ihn zu etwas Eigenständigem. Der entscheidende Punkt ist das freie Angebot. Auch der Wettstreit gehört hierher und nicht in die Wirtschaft: Unter Ideen ist er fruchtbar, weil jeder die bessere übernehmen darf – unter Erzeugern wird daraus der Kampf gegen den anderen.
        zitate: []
      - schlagwort: Materialisierung
        schlagsatz: Der Gedanke vermehrt sich beim Teilen — das Brot nicht.
        kurztext: >
          Wer einen Gedanken weitergibt, hat ihn immer noch — darum steht er außerhalb der Wirtschaft. Er tritt in sie ein, sobald er Stoff, Arbeitszeit und Werkzeuge bindet, die es nur einmal gibt. Was endlich ist, muss verteilt werden: Das ist der Grund für Brüderlichkeit, keine moralische Zugabe. Was materialisiert ist, gehört dem Bedarf, nicht dem Urheber. Was diesseits bleibt — Unterricht, Forschung, Rat — wird nie Ware; es lebt aus Schenkung, nicht aus Tausch.
        text: >
          Wer einen Gedanken weitergibt, hat ihn immer noch. Damit steht er außerhalb der Wirtschaft. Er tritt in sie ein, sobald er sich materialisiert: sobald er Stoff, Arbeitszeit und Werkzeuge bindet, die es nur einmal gibt. Materiell heißt dabei nicht nur stofflich — auch die Stunde, in der jemand arbeitet, und die Maschine, die währenddessen läuft, sind endlich. Und was endlich ist, muss verteilt werden. Hier liegt der Grund für Brüderlichkeit: Sie ist keine moralische Zugabe zum Wirtschaften, sondern dessen Bedingung. Wo etwas für alle gleichzeitig da ist, braucht es sie nicht. An dieser Schwelle gibt der Geist zugleich etwas ab. Was materialisiert ist, gehört nicht mehr dem Urheber, sondern dem Bedarf. Was diesseits bleibt — Unterricht, Forschung, Rat — wird nie Ware, auch wenn es bezahlt wird; es lebt aus Schenkung, nicht aus Tausch.
        zitate: []
      - schlagwort: Wettstreit
        schlagsatz: Das Bessere gewinnt.
        kurztext: >
          Unter Ideen ist Konkurrenz fruchtbar, weil das Bessere nicht geschlagen, sondern übernommen wird. Open Source lebt davon: Jeder darf kopieren, prüfen, weiterführen — das Original wird reicher, nicht ärmer. Dasselbe gilt in Wissenschaft, Medizin, Handwerk: Der Kniff des einen wird Können aller. Der Wettstreit richtet sich auf die Sache, nicht gegen den anderen. Was im Geistesleben frei gereift ist, tritt als bessere Idee in die Produktion ein.
        text: >
          Unter Ideen ist Konkurrenz fruchtbar, weil das Bessere nicht geschlagen wird, sondern übernommen werden darf. Wer eine bessere Lösung zeigt, verliert sie nicht — er gibt sie weiter, und beide haben sie. Das ist der Ort des Wettstreits: in der Kultursphäre, nicht in der Wirtschaft. Open Source lebt davon: Jeder darf jedes Projekt kopieren, prüfen und in eine eigene Richtung weiterführen. Wer einen besseren Weg findet, teilt ihn, und das Original wird dadurch nicht ärmer, sondern reicher. Dasselbe Prinzip gilt überall dort, wo Ideen arbeiten: in der Wissenschaft, wo das bessere Argument das schwächere ablöst; in der Medizin, wo ein Verfahren geteilt wird, sobald es wirkt; im Handwerk, wo der Kniff des einen zum Können aller wird. Der Wettstreit richtet sich auf die Sache, nicht gegen den anderen — und genau deshalb bringt er die Wirtschaft voran: Was im Geistesleben frei gereift ist, tritt als bessere Idee in die Produktion ein und hebt das Ganze.
        zitate: []
      - schlagwort: Überblick
        schlagsatz: Wer das Ganze übersieht, arbeitet für andere.
        kurztext: >
          Brüderlichkeit lässt sich nicht verordnen. Wer nur seinen Handgriff kennt, arbeitet für den Lohn. Wer sieht, wessen Bedarf am Ende seiner Arbeit steht, arbeitet für diesen Bedarf — weil es die sachlich richtige Handlung ist. Diesen Überblick liefert kein Wirtschaftsprozess von selbst; er kommt aus dem Geistesleben, oder er kommt nicht. Eine Zahl ist kein Überblick: Sie zeigt, was sich zählen lässt, nicht den Menschen hinter dem Bedarf.
        text: >
          Brüderlichkeit lässt sich nicht verordnen und nicht anappellieren; sie setzt voraus, dass jemand den Zusammenhang durchschaut, in dem er steht. Wer nur seinen Handgriff kennt, kann gar nicht anders, als für seinen Lohn zu arbeiten. Wer sieht, wessen Bedarf am Ende seiner Arbeit steht, arbeitet für diesen Bedarf — nicht aus Opferbereitschaft, sondern weil es die sachlich richtige Handlung ist. Diesen Überblick liefert kein Wirtschaftsprozess von selbst; er kommt aus dem Geistesleben, oder er kommt nicht. Eine Zahl ist kein Überblick: Sie zeigt, was sich zählen lässt, nicht den Menschen, dessen Bedarf am Ende der Arbeit steht. Hier liegt der Grund, warum eine Wirtschaft ohne freies Geistesleben moralisch predigen muss, was sie nicht erzeugen kann.
        zitate: []
      - schlagwort: Aufgaben
        schlagsatz: Fähigkeit trifft Aufgabe — besetzt nach Können, nicht nach Rang oder Ausbildung.
        kurztext: >
          Ein freies Geistesleben entdeckt die Fähigkeiten jedes Einzelnen und findet den Platz dafür. Die Wirtschaft stellt die Aufgaben dar — ein Buffet, eine Issue-Liste —, bestimmt aber nicht, was die Menschen tun. Wer sich einer Aufgabe zuwendet, übernimmt die Verantwortung für die Ausführung: Die Wahl ist frei, die Bindung an das Gewählte nicht. Der Platz folgt dem Können, nicht dem Auftritt. Open Source beweist es: Menschen leisten ihre beste Arbeit, wenn sie selbst bestimmen, woran sie arbeiten.
        text: >
          Ein freies Geistesleben entdeckt und pflegt die Fähigkeiten jedes Einzelnen, es findet den richtigen Platz für ihn. Die Wirtschaft darf nicht nach Belieben Menschen an ihren Arbeitsplatz schicken, sie würde über ihren Egoismus, wegen Konkurrenzdenken oder Beziehungen, Menschen anziehen, deren bester Platz, da wo sie ihre Fähigkeiten am besten entfalten können, anderswo ist. Die Wirtschaft gestaltet die Arbeitsplätze so, dass sich die Fähigkeiten von den Menschen, die sich dort einfinden, entfalten können. Sie stellt die vorhandenen Aufgaben dar, aber bestimmt nicht, was die einzelnen Menschen tun. Es ist ein Aufgaben-Buffet (Issue-Liste), von der sich Menschen bedienen können. Wer sich einer Aufgabe zuwendet, übernimmt damit aber auch die Verantwortung für ihre Ausführung – die Wahl ist frei, die Bindung an das Gewählte ist es nicht. Der Platz folgt dem Können, nicht dem Auftritt – wer sich erst darstellen muss, um gebraucht zu werden, steht schon am falschen Ort. Open Source ist der Beweis: Menschen leisten ihre beste Arbeit, wenn sie selbst bestimmen, woran sie arbeiten.
        zitate: []
      - schlagwort: Korrektur
        schlagsatz: Pull Request statt Beschwerde — Kritik als Gabe.
        kurztext: >
          Wer einen Fehler findet, reicht einen konkreten Vorschlag ein, offen einsehbar für alle. Kein Appell an Vorgesetzte — der holt Macht statt Einsicht herein. Kritik ist hier eine Gabe: Sie fügt der Sache hinzu, was ihr fehlte. Das setzt Urteilskraft voraus und eine Kultur, in der ein Einwand nichts kostet. Jede angenommene Korrektur ist ein neu ausgesprochenes Bedürfnis — und dort beginnt der Prozess von vorn.
        text: > 
          Wer einen Fehler findest oder eine Verbesserungsmöglichkeit sieht, reicht einen konkreten Vorschlag ein, offen einsehbar für alle. Kein Jammern, kein Appell an Vorgesetzte — denn der Appell nach oben holt ein fremdes Mittel herein, er sucht Macht statt Einsicht. Kritik ist hier keine Anklage, sondern eine Gabe: Sie fügt der Sache etwas hinzu, das ihr fehlte. Das setzt Urteilsbildung voraus, und es setzt eine Kultur voraus, in der ein Einwand nichts kostet. Damit bleibt der ganze Kreis in Bewegung — denn jede angenommene Korrektur ist ein neu ausgesprochenes Bedürfnis, und dort, beim Bedürfnis, beginnt der Prozess wieder von vorn.
        zitate: []

  - id: dm-02k
    feld: 2
    richtung: "Geist -> Wirtschaft"
    pol: krank
    titel: "Der Glaube diktiert die Produktion"
    aspekte:
      - schlagwort: Bedarfserfindung
        schlagsatz: Der Anbieter sucht nach einem Bedürfnis
        kurztext: >
          Das Geistesleben erfindet Produkte, nach denen niemand gefragt hat, und nennt es Innovation: die Beduftung des Autoinnenraums, die App für ein Problem, das erst mit ihr entsteht. Am Anfang steht keine erkannte Not, sondern eine Fähigkeit, die sich ein Feld sucht. Eine ganze Industrie — Trendforschung, Innovationsberatung — arbeitet dafür, dass das Angebot nicht aufhört zu wachsen. Die Einsicht in einen Bedarf wird ersetzt durch den Einfall für ein Angebot: die Antwort auf eine Frage, die niemand gestellt hat.
        text: >
          Das Geistesleben erfindet Produkte, nach denen niemand gefragt hat — und nennt es Innovation. Die Beduftung des Autoinnenraums, die Gestensteuerung am Herd, die App für ein Problem, das erst mit ihr entsteht: Am Anfang steht kein erkanntes Bedürfnis, sondern eine Fähigkeit, die sich ein Anwendungsfeld sucht. Dahinter steht der Glaube, dass Neues besser ist, Wachstum gut und Stillstand gefährlich. Eine ganze Industrie lebt davon, Lücken zu finden, die keine sind: Produktentwicklung, Innovationsberatung, Trendforschung — geistige Arbeit von hohem Rang, aufgewendet nicht dafür, dass Menschen besser versorgt werden, sondern dafür, dass das Angebot nicht aufhört zu wachsen. Was dabei entsteht, überflutet den Markt mit Dingen, deren Nutzen unklar ist, und verdeckt so auch das Nützliche. Das Geistesleben liefert dann nicht die Einsicht in einen Bedarf, sondern den Einfall für ein Angebot — die Antwort auf eine Frage, die niemand gestellt hat.
        zitate: []
      - schlagwort: Verführung
        schlagsatz: Das Bedürfnis wird gemacht — von dem, der es erfüllt.
        kurztext: >
          Dieselben geistigen Mittel, die gesund die Idee tragen, tragen hier das Bild. Die Verführung verkauft das Gleiche noch einmal — in neuer Farbe, neuer Saison, neuem Gefühl. Die Werbung heftet Freiheit an das Auto, Liebe an das Parfum; entschieden wird über das Gefühl, nicht über die Sache. Ein Bedürfnis braucht der Mensch zum Leben; ein Wunsch lässt sich beliebig vermehren. Der Berater auf Provision dreht Sachverstand gegen den Ratsuchenden: Wer pro Abschluss bezahlt wird, hat ein Interesse am Verkauf, nicht an dir.
        text: >
          Dieselben geistigen Mittel — Erfindungskraft, Menschenkenntnis, Bildkunst —, die gesund die Idee in die Wirtschaft tragen, tragen hier das Bild. Wo die Bedarfserfindung neue Produkte in die Welt setzt, verkauft die Verführung das Gleiche noch einmal — in einer neuen Farbe, einer neuen Saison, einem neuen Gefühl. Niemand braucht das iPhone in einer anderen Farbe, die Jacke im Schnitt des nächsten Jahres, die limitierte Edition, die sich vom Original nur durch die Verpackung unterscheidet. Die Werbung liefert die Bilder dazu: Das Auto wird als Freiheit verkauft, das Parfum als Liebe, die Uhr als Erfolg — entschieden wird nicht über die Sache, sondern über das angeheftete Gefühl. Dabei verwischt die Unterscheidung, auf die alles ankommt: Ein Bedürfnis ist, was ein Mensch zum Leben und zur Entwicklung braucht; ein Wunsch, was ihm gerade begehrenswert erscheint. Der Wunsch wird lieber bearbeitet, weil er sich beliebig vermehren lässt — das reale Bedürfnis nicht. Die Kultursphäre spricht dann nicht mehr für den Verwender, sondern im Auftrag des Erzeugers. Was die Werbung im Großen tut, tut der Berater im Kleinen: Der Makler, der Versicherungsvertreter, der Anwalt haben Sachverstand und Vertrauen, und die Provision dreht beides gegen den Ratsuchenden; wer pro Abschluss bezahlt wird, hat ein Interesse am Verkauf, nicht an dir.
        zitate: []
      - schlagwort: Goldener Käfig
        schlagsatz: Wer hinein ist, kommt nicht mehr heraus.
        kurztext: >
          Auf das geweckte Bedürfnis folgt das Einsperren. Apple: Gerät, Store, Reparatur — jedes Stück brauchbar, zusammen ein Raum, dessen Tür nur nach innen aufgeht. Streaming: Was gekauft aussieht, ist geliehen; mit der Kündigung sind die Filme weg. Was bindet, ist nicht die Güte, sondern der Preis des Austritts. Firmengeheimnis und proprietäre Software machen den Ausstieg teuer. Die besten Köpfe arbeiten daran, den Verwender zum Bestand zu machen, und nennen das Kundenbindung.
        text: >
          Auf das geweckte Bedürfnis folgt das Einsperren. Apple: das Gerät, der Store, die Reparatur, die Schnittstellen — jedes Stück für sich brauchbar, zusammen ein Raum mit einer Tür, die nur nach innen aufgeht. Streaming: Was gekauft aussieht, ist geliehen — mit der Kündigung sind die Filme weg, die Merkliste, zehn Jahre Sehgewohnheit. Was bindet, ist nicht die Güte der Sache, sondern der Preis des Austritts; und weil er mit jedem Jahr steigt, muss das Angebot mit der Zeit nicht besser werden, sondern nur unentbehrlich bleiben. Das Mittel dazu ist die Undurchsichtigkeit: Firmengeheimnis, proprietäre Software, Schnittstellen, die sich jederzeit ändern dürfen. Man bleibt, weil man nicht hineinsieht und deshalb nicht hinauskommt. Dazu kommt die künstliche Knappheit an dem, was sich beim Teilen vermehrt: Software hinter Kopierschutz, Musik, die mit dem Abo verschwindet. Wo ein Gedanke behandelt wird wie ein Stoff, verwaltet einer die Knappheit — und mit ihr den Verwender. Das Geistesleben liefert hier nicht die Einsicht, die frei macht, sondern die Konstruktion, die bindet: Die besten Köpfe arbeiten daran, den Ausstieg teuer zu machen, und nennen das Kundenbindung. Der Verwender hat das Bedürfnis nicht ausgesprochen, es wurde ihm gemacht, und nun kann er es nicht einmal mehr woanders stillen — kein Gesprächspartner der Wirtschaft mehr, sondern ein Bestand.
        zitate: []
      - schlagwort: Kennzahl
        schlagsatz: Wer die Zahl sieht, sieht die Sache nicht mehr.
        kurztext: >
          Entscheidungen trifft das Dashboard, nicht der Sachverstand. Die Kennzahl scheint Überblick zu liefern, zeigt aber nur, was sich zählen lässt, und lässt weg, was sich nicht zählen lässt: Haltbarkeit, Vertrauen, den Verwender hinter der Nachfrage. Und sie gilt für gestern, nicht für heute. Sobald eine Zahl zum Ziel wird, hört sie auf, ein Maß zu sein: Man verstellt das Thermometer statt zu heizen. Der gesunde Überblick lässt sehen, wessen Bedarf am Ende steht; die Zahl gibt ein Scheinziel.
        text: >
          Entscheidungen trifft das Dashboard, nicht der Sachverstand. Die Kennzahl trennt das Entscheiden vom Tun: Wer entscheidet, hat das Produkt nie in der Hand gehabt; wer es tut, tut es im Hinblick auf bessere Zahlen, nicht um der Sache willen. Das Tückische ist, dass die Kennzahl genau das zu liefern scheint, was hier fehlt — den Überblick. Sie ist aber ein Ersatz: Sie zeigt, was sich zählen lässt, und lässt weg, was sich nicht zählen lässt — die Haltbarkeit, die Zusammenarbeit, das Vertrauen, den Impuls dessen, der es macht, den Verwender hinter der Nachfrage. Und sie ist ein Überblick von gestern: Eine Statistik gilt für das letzte Jahr, den letzten Monat, nicht für heute. Dazu kommt der Hebel: Weil die Zahl nicht die Sache ist, lässt sie sich leichter ändern als die Sache selbst. Ist es im Raum zu kalt, kann man heizen oder das Thermometer verstellen — das Verstellen ist billiger, schneller und wird belohnt. Also werden Kennzahlen geglättet, Fälle umdefiniert, Messpunkte verlegt, Wartezeiten anders gezählt; sobald eine Zahl zum Ziel wird, hört sie auf, ein Maß zu sein, und was sie anzeigt, ist nicht mehr die Arbeit, sondern die Darstellung der Arbeit. Der gesunde Überblick lässt den Arbeitenden sehen, wer in der Kette beteiligt ist und wessen Bedarf am Ende steht — dann arbeitet er für diesen Bedarf. Die Zahl gibt ihm ein Scheinziel: Nach der einen Seite erscheint das erfundene Bedürfnis als Nachfrage, nach der anderen die Darstellung als Leistung.
        zitate: []
      - schlagwort: Konkurrenz
        schlagsatz: Die bessere Darstellung schlägt die bessere Ware.
        kurztext: >
          Das Geistesleben bringt seinen Wettstreit an die falsche Stelle. Unter Ideen darf jeder aus der besseren lernen; im Wirtschaftsleben wird daraus das Sich-Durchsetzen gegen den anderen. Gefördert werden Rhetorik, Platzierung, Timing — nicht Haltbarkeit und Genauigkeit. Fünf Betriebe entwickeln denselben Apparat, vier Entwicklungen werden vernichtet. Der Weg der Ware zum Käufer kostet mehr als ihre Herstellung. Gesund darf das Bessere übernommen werden. Hier muss es geschlagen werden.
        text: >
          Das Geistesleben bringt seinen Wettstreit an die falsche Stelle. Unter Ideen ist Konkurrenz fruchtbar, weil jeder aus der besseren lernen kann; im Wirtschaftsleben wird daraus das Sich-Durchsetzen gegen den anderen. Die Frage lautet nicht mehr, was gebraucht wird, sondern: Wie setze ich mich gegen die anderen durch, auch wenn mein Produkt nicht besser ist? Wie stelle ich es besser dar? Damit werden die falschen Fähigkeiten gefördert — Rhetorik, Platzierung, Vertrieb, Verhandlungsgeschick, das Timing eines Produktstarts. Das sind wirkliche Fähigkeiten, sie werden ausgebildet und hoch bezahlt; nur richten sie sich nicht auf die Sache. Die sachlichen Eigenschaften liegen daneben brach: Haltbarkeit, Reparierbarkeit, Genauigkeit, die geduldige Nachbesserung. Wer sie pflegt, verliert gegen den, der sie behauptet. Die Folgen: Fünf Betriebe entwickeln denselben Apparat nebeneinander her, vier Entwicklungen werden vernichtet, ohne dass ein einziges Bedürfnis gedeckt wurde. Der Weg der Ware zum Käufer kostet mehr als ihre Herstellung. Ganze Abteilungen arbeiten daran, dass eine andere Abteilung anderswo umsonst gearbeitet hat. Der Kampf um das Regal, um die erste Seite der Suche, um den Rahmenvertrag geht auch dort weiter, wo niemand mehr verführt werden muss. Gesund ist der Wettstreit dort, wo das Bessere übernommen werden darf. Hier darf es nicht übernommen werden — darum muss es geschlagen werden.
      - schlagwort: Selbstvermarktung
        schlagsatz: Besetzt wird nach Auftritt, nicht nach Können.
        kurztext: >
          Nicht nur das Produkt wird vermarktet, auch der Mensch. Er arbeitet nicht dort, wo seine Fähigkeiten passen, sondern dort, wo er hineinkommt. Personal Brand und Cultural Fit entscheiden. Beide Seiten malen Bilder: der Bewerber Fähigkeiten, die er nicht hat; der Betrieb einen Arbeitsplatz, den es so nicht gibt. Abgeglichen wird Bild mit Bild. Befugnisse folgen dem Organigramm, nicht dem Können — und Menschen herrschen über Dinge, die sie nicht beherrschen.
        text: >
          Nicht nur das Produkt wird vermarktet, auch der Mensch. Er arbeitet nicht an dem Ort, wo seine Fähigkeiten passen, sondern dort, wo er hineinkommt und eine gute Position hat. Dafür muss er sich vermarkten. Die „Personal Brand", der „Cultural Fit" entscheiden. Statt seinen Platz nach den eigenen Fähigkeiten zu finden, presst er sich in ein vorgegebenes Raster, behauptet Fähigkeiten, die er nicht hat, und verschweigt die, auf die es ihm ankommt. Auf der anderen Seite geschieht dasselbe: Weil alle um Mitarbeiter konkurrieren, ersetzt die Erzählung die treffende Beschreibung des Arbeitsplatzes — alle malen ein schönes Bild, und niemand findet mehr den Ort, an dem seine Eigenart wirklich gebraucht wird. Beide Seiten werben, keine beschreibt; abgeglichen wird ein Bild mit einem Bild. Und Ziel ist, so viele Befugnisse wie möglich zu bekommen, am besten Weisungsbefugnisse. So entsteht eine Strukturhierarchie an der Stelle, an der ein Fähigkeitsnetz stehen müsste — nicht wer die Sache am tiefsten durchschaut, hat das letzte Wort, sondern wer im Organigramm höher steht. So trennen sich Fähigkeiten und Befugnisse immer weiter und immer öfter herrschen Menschen über Dinge, die sie nicht beherrschen.
        zitate: []
      - schlagwort: Verkümmerung
        schlagsatz: Wer Bedürfnisse erfindet, erkennt keine mehr.
        kurztext: >
          Wer jahrelang gelernt hat, Bedürfnisse zu erfinden, verliert den Sinn dafür, was wirklich gebraucht wird — und merkt es nicht, weil die Zahlen steigen. Die Korrektur, die gesund den Bedarf genauer erkennen lässt, verbessert hier nur das Erfinden. Der Verwender landet im Beschwerdekanal, der Mitarbeiter beim Vorgesetzten: Der Einwand geht nach oben statt in die Sache, und er kostet den, der ihn vorbringt. Wer dann noch ändern will, braucht Macht, nicht das bessere Argument.
        text: >
          Die Fähigkeit, den Bedarf überhaupt noch zu erkennen, verkümmert. Wer jahrelang gelernt hat, Bedürfnisse zu erfinden statt sie zu erkennen, verliert den Sinn dafür, was wirklich gebraucht wird — und merkt es nicht, weil die Zahlen weiter steigen. Damit schließt sich der Kreis nicht mehr, der dieses Feld gesund macht: Gesund kommt die Korrektur zurück und lässt den Bedarf genauer erkennen und besser decken. Hier verbessert sie nur das Erfinden. Wer etwas einwendet, findet keinen Ort dafür: Der Verwender landet im Beschwerdekanal, der Mitarbeiter bei seinem Vorgesetzten. In beiden Fällen geht der Einwand nach oben statt in die Sache, und er kostet den, der ihn vorbringt — darum kommt er immer seltener. Wer dann noch etwas ändern will, braucht dafür Macht und nicht mehr das bessere Argument. Ihr Ausfall hält alle Krankheiten dieses Feldes fest: Der Bedarfserfindung widerspricht niemand, die Verführung muss keinen Einwand mehr fürchten, die Abhängigkeit wird nicht gekündigt, die Kennzahl nicht bestritten, die Konkurrenz nicht durchschaut, die Selbstvermarktung nicht abgelegt. Ein Organ, das nicht gebraucht wird, bildet sich zurück — und mit ihm die Fähigkeit, seinen Verlust zu bemerken.
