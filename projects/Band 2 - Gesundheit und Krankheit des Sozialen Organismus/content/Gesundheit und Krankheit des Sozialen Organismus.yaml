      - schlagwort: Schenkung
        schlagsatz: Aufgabe der Wirtschaft ist geben, ohne zu diktieren.
        kurztext: >
          Bildungs- und Kultureinrichtungen sind dem Markt entzogen. Ihre Finanzierung kommt aus den Überschüssen des assoziativ organisierten Wirtschaftslebens; das Rechtsleben sichert den Zufluss rechtlich. Die Schenkung ist keine Gnade, sondern Notwendigkeit: Überschüsse stauen sich nicht in Grund und Boden, sie fließen dem Geist zu. Mit der Sicherung der Mittel endet die Zuständigkeit des Rechts — wohin sie fließen, entscheidet das Geistesleben allein.
        text: >
          Bildungs- und Kultureinrichtungen sind dem Markt entzogen. Ihre Finanzierung kommt aus den Überschüssen des assoziativ organisierten Wirtschaftslebens; das Rechtsleben sichert diesen Mittelzufluss rechtlich. Die Schenkung ist dabei keine Gnade, sondern strukturelle Notwendigkeit: Sie sorgt dafür, dass Überschüsse sich nicht in Grund und Boden stauen, sondern dem Geistesleben zufließen. Hier liegt die Übergabe: Mit der Sicherung der Mittel endet die Zuständigkeit des Rechts — wohin sie fließen, entscheidet das Geistesleben allein. So wie das fertige Gesetz vom Geistesleben ins Recht übergeht, gehen die Mittel gesichert vom Recht ins Geistesleben über.
