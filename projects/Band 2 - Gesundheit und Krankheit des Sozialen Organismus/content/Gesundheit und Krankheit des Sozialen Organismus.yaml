      - schlagwort: Richten
        schlagsatz: Persönliches Richten ohne Vorgabe.
        kurztext: >
          Der Richter ist vom Gerichteten vor der Anklage selbst gewählt — aus Sachkenntnis und persönlicher Kenntnis. Das Richten entspringt der Urteilskraft des Einzelnen, nicht einer staatlichen Vorgabe. Das Rechtsleben schützt es vor Weisung und wirtschaftlicher Abhängigkeit und fügt hinzu, was das Geistesleben nicht selbst leisten kann: die Geltung. Es macht das Urteil verbindlich, auch gegenüber denen, die den Richter nicht gewählt haben. Der Geist urteilt, das Recht trägt das Urteil.
        text: >
          Dass Richter aus Sachkenntnis und persönlicher Kenntnis des Angeklagten wirken, ist eine innere Angelegenheit des Geisteslebens: Der Richter ist vom Gerichteten vor der Zeit der Anklage selbst gewählt. Das Richten entspringt der begründeten Urteilskraft des Einzelnen, nicht einer staatlichen Vorgabe. Das Rechtsleben schafft dafür nur den Rahmen — es schützt das Richten vor staatlichen Weisungen und wirtschaftlichen Abhängigkeiten. Was es dann hinzufügt, kann das Geistesleben nicht selbst leisten: die Geltung. Das Rechtsleben macht es für alle verbindlich und sorgt dafür, dass es vollzogen wird — auch gegenüber denen, die den Richter nicht gewählt haben. So bleibt das Richten eine freie geistige Tat, die im Rechtsleben ihre äußere Geltung findet: Der Geist urteilt, das Recht trägt das Urteil. Und so kehrt das Richten zurück zu seinen Ursprüngen: dem Richten im Sinne von Berichtigen.
