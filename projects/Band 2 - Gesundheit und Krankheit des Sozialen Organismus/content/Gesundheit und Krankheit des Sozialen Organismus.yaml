  - id: dm-04k
    feld: 4 
    richtung: "Recht -> Wirtschaft"
    pol: krank
    titel: "Die Politik entscheidet wer gewinnt"
    aspekte:
      - schlagwort: Erlaubnis
        schlagsatz: Arbeiten darf, wem es erlaubt wird.
        kurztext: >
          Wer wirtschaftlich tätig sein darf, entscheiden nicht Können und Vertrauen, sondern behördliche Erlaubnis — oder Geld. Lizenzen und Berufsverbote legen fest, wer anbieten darf. Der Staat, dem verwehrt sein müsste, Arbeit zuzuweisen, weist sie zu: über das Erlauben und Verbieten. Weil die Erlaubnis knapp gehalten wird, wird sie selbst zur Ware: Konzessionen werden gehandelt und vererbt. Die Tüchtigen ohne Erlaubnis bleiben draußen, die Erlaubten ohne Tüchtigkeit bleiben drin. Den Zutritt zur eigenen Arbeit muss man kaufen.
        text: >
          Wer wirtschaftlich tätig sein darf, entscheiden nicht das Können und das Vertrauen der Beteiligten, sondern behördliche Erlaubnis — oder Geld. Lizenzen, Konzessionen und Berufsverbote legen fest, wer einen Betrieb eröffnen, ein Gewerbe ausüben, eine Leistung anbieten darf. Der Staat, dem verwehrt sein müsste, Arbeit zuzuweisen, weist sie zu — auf dem Umweg über das Erlauben und Verbieten: Was einer arbeitet, entscheidet nicht er selbst aus seinen Fähigkeiten, sondern die Behörde aus ihren Listen. Und weil die Erlaubnis knapp gehalten wird, wird sie selbst zur Ware: Konzessionen werden gehandelt, verpachtet, vererbt — wer sie bezahlen kann, braucht kein Können mehr, und wer nur Können hat, kommt nicht hinein. So entsteht die doppelte Sperre: Die Tüchtigen ohne Erlaubnis bleiben draußen, die Erlaubten ohne Tüchtigkeit bleiben drin. Der Mensch, den das Recht aus dem Warenverkehr heraushalten sollte, muss sich den Zutritt zur eigenen Arbeit erst kaufen.
      - schlagwort: Bodenrente
        schlagsatz: Wer wohnen muss, zahlt, was der Hortende verlangt.
        kurztext: >
          Boden und Wohnraum, auf die jeder angewiesen ist, werden Objekt von Spekulation. Naturgrundlage und eingearbeitete Leistung verschmelzen in einem Kaufpreis — auch das, was niemand geschaffen hat, wird gehandelt. Wer hortet, muss nicht nutzen; die Preise steigen, weil die Not derer wächst, die nicht ausweichen können. Die Rendite kommt ohne Leistung: aus der Miete derer, die wohnen müssen, aus der Pacht derer, die anbauen wollen. Der gesicherte Anspruch wird zur Beute des Zahlungskräftigsten — und das Recht schützt die Beute.
        text: >
          Eigentum an der Grundversorgung wird absolut gesetzt: Boden und Wohnraum, auf die jeder Mensch angewiesen ist, werden Objekt von Spekulation und Monopolbildung. Die Trennlinie im Boden wird eingeebnet — Naturgrundlage und eingearbeitete Leistung verschmelzen in einem Kaufpreis, und gehandelt wird fortan beides zusammen: auch das, was niemand geschaffen hat. Wer hortet, muss nicht nutzen; die Preise steigen nicht, weil Werte entstehen, sondern weil die Not derer wächst, die nicht ausweichen können. Die Rendite kommt ohne Leistung: Sie wird aus dem Grundbedürfnis gezogen — bezahlt mit der Miete derer, die wohnen müssen, mit der Pacht derer, die anbauen wollen, mit der Verdrängung derer, die nicht mithalten. So unterdrückt das absolute Eigentum genau die Bedürfnisse, deren Befriedigung der Boden dienen sollte: Der gesicherte Anspruch, den das Recht der Wirtschaft öffnen müsste, wird zur Beute des Zahlungskräftigsten — und das Recht schützt die Beute.
      - schlagwort: Willkürpreis
        schlagsatz: Der Preis sagt, wer stärker ist — nicht, was es kostet.
        kurztext: >
          Der Preis wird nicht gerechnet, sondern gebildet — und Bildung heißt Macht. Monopole setzen, Kartelle sprechen sich ab, Spekulanten treiben Kurse. Von der anderen Seite greift der Staat zu: Preisdeckel, Subventionen aus politischem Kalkül. Dazwischen verschwindet der gerechnete Preis: Kein Erzeuger weist aus, kein Verwender kann nachrechnen. Der Preis zeigt nicht, wo Hände fehlen, sondern wo Macht sitzt. Was eine Anzeige sein sollte, wird zum Hebel — und wer am Hebel sitzt, bestimmt, wer gedeiht.
        text: >
          Der Preis wird nicht gerechnet, sondern gebildet — und Bildung heißt hier Macht. Von der einen Seite greift die Wirtschaft zu: Monopole setzen, was ihnen passt; Kartelle sprechen sich ab; Spekulanten treiben die Kurse, bis der Preis nur noch den Druck der Nachfrage und die Macht des Angebots ausdrückt, nicht mehr die Kosten der Herstellung. Von der anderen Seite greift der Staat zu: Preisdeckel, Mindestpreise, Subventionen, die das eine verbilligen und das andere verteuern — nicht aus Sachkenntnis, sondern aus politischem Kalkül. Dazwischen verschwindet der gerechnete Preis, der offenlegen würde, was ein Erzeugnis tatsächlich kostet: Kein Erzeuger weist aus, kein Verwender kann nachrechnen, kein Zusammenhang zwischen Lebensunterhalt, Produktionsmitteln und Vorleistungen ist sichtbar. Damit ist der Preis blind: Er zeigt nicht, wo Hände fehlen und wo zu viele stehen, sondern wo Macht sitzt und wo Ohnmacht leidet. Was eine Anzeige sein sollte, wird zum Hebel — und wer am Hebel sitzt, bestimmt, wer gedeiht und wer verkümmert.
      - schlagwort: Papiermacht
        schlagsatz: Papier verfügt — Können geht leer aus.
        kurztext: >
          Verfügungsrechte werden zur Ware: Aktien, Optionen, Verbriefungen zirkulieren losgelöst von Fähigkeit und Produktion. Wer nie einen Betrieb geführt hat, verfügt über tausende; wer ihn führt, gehört zur Verfügungsmasse. Das Patent löst Wissen vom Menschen ab. Geld kann kein Geld verdienen — was wächst, sind Ansprüche an fremde Arbeit. Der Zins ist das Urbild: Einkommen, weil Geld da war. Das Fundament ist das Geld selbst, auch das Papier: Der Staat erklärt es zum Zahlungsmittel, seine Deckung ist Macht. Erzeugt eine Stelle Geld aus dem Nichts, lösen sich die Papiere von ihrem Boden.
        text: >
          Verfügungsrechte werden zur Ware: Aktien, Optionen, Futures, Verbriefungen — Papiere zirkulieren losgelöst von Fähigkeit und Produktion. Wer nie einen Betrieb geführt hat, verfügt über tausende; wer ihn führt, gehört zur Verfügungsmasse. Das Verfügungsrecht, das dem Fähigen zufallen müsste, wird gekauft, gebündelt, weiterverkauft und gegen sich selbst gewettet — in Schichten, die von der Werkbank aus nicht mehr zu sehen sind. Das Patent löst das Wissen vom Menschen ab und macht es zum Vermögenswert, den kaufen kann, wer nie geforscht hat. Geld kann kein Geld verdienen — denn das, was wächst, sind Ansprüche an fremde Arbeit, die irgendwann jemand einlösen muss. So kommt das Eigentum zur Ruhe statt in Bewegung: Es folgt dem Erbgang und dem Meistbietenden, und die Fähigkeit arbeitet für die Papiere anderer. Der Zins ist das Urbild: Einkommen allein dafür, dass Geld da war. Und das Fundament aller Papiere ist das Geld selbst — auch das ist Papier: Der Staat erklärt es zum Zahlungsmittel, jeder muss es annehmen, seine Deckung ist keine Leistung, nicht Gold, sondern bloße Macht. Preis, Geldmenge, Deckung und Lebensdauer — alles, was den Wirtschaftsprozess abbilden müsste — wird durch die Politik gesetzt und auf Druck der Wirtschaft manipuliert. Erzeugt eine Stelle Geld aus dem Nichts, löst sich die Menge von dem, was sie abbilden soll — und die Papiere darüber verlieren ihren Boden.
      - schlagwort: Vorrechte
        schlagsatz: Das Recht bevorzugt – und nennt es Rahmen.
        kurztext: >
          Das Recht, das nur binden dürfte, bestimmt: Subventionen für die einen, Auflagen für die anderen, Vergaben, die vor der Ausschreibung entschieden sind. Der Vertrag ist nicht mehr leer, wenn das Recht ihn reicht — die Bedingungen stehen schon darin. Der Wettbewerb verlagert sich vom Erzeugnis auf den Einfluss. Zölle dienen als Waffe; Bauern und Verbraucher werden zu Geiseln fremder Konflikte. Das Rechtsleben, das den fairen Rahmen sichern sollte, wird selbst zum Markt — gehandelt wird der Rahmen.
        text: >
          Das Recht, das nur binden dürfte, bestimmt: Wirtschaftliche Sanktionen und Vorrechte per Gesetz entscheiden, wer gewinnt und wer verliert — nicht die wirtschaftliche Sacherkenntnis. Subventionen für die einen, Auflagen für die anderen; Ausnahmeregelungen, die sich die Begünstigten in die Entwürfe schreiben lassen; Vergaben, die vor der Ausschreibung entschieden sind. Der Vertrag ist nicht mehr leer, wenn das Recht ihn reicht: Die Bedingungen stehen schon darin, bevor die Beteiligten zu verhandeln beginnen. Damit verlagert sich der Wettbewerb vom Erzeugnis auf den Einfluss — nicht wer besser herstellt, gewinnt, sondern wer die Gesetzgebung besser erreicht. Die Assoziationen, die aus Sachkenntnis urteilen sollten, was ein Erzeugnis wert ist und wohin es gehen soll, urteilen ins Leere: Über Wert und Weg hat das Dekret schon entschieden. Auch über die Landesgrenze hinweg greift das Recht in den Handel: Zölle dienen als Waffe der Bestrafung und Erpressung, der Güteraustausch wird nicht aus Sachgründen unterbrochen, sondern aus Machtkalkül — Bauern, Betriebe und Verbraucher werden zu Geiseln fremder Konflikte. So wird das Rechtsleben, das den fairen Rahmen sichern sollte, selbst zum lukrativsten Markt — und gehandelt wird dort, was es nie geben dürfte: der Rahmen selbst.
      - schlagwort: Zwangsabgabe
        schlagsatz: Bezahlt wird, was festgesetzt ist — nicht, was geschieht.
        kurztext: >
          Abgaben bemessen sich nicht an der wirtschaftlichen Realität, sondern an politischen Setzungen. Die Zwangsgebühr wird erhoben, ob du das Angebot nutzt oder nicht. Das Steuersystem ist so kompliziert, dass du einen Berater brauchst; die Last bemisst sich an seiner Kunst. Gesund trägt jeder die Folgen dessen, was er verursacht; hier zahlt jeder, was ihm zugeschrieben wird. Steuern lassen sich nur in Staatsgeld entrichten — so erzwingt das Steuerrecht die Nachfrage nach dem Staatsgeld. Die Einkommensteuer greift zu, bevor irgendein Bedarf entstanden ist.
        text: >
          Abgaben werden nicht an der wirtschaftlichen Realität bemessen, sondern an politischen Setzungen. Die Zwangsfernsehgebühr wird erhoben, ob du das Angebot nutzt oder nicht — unterstellt wird eine fiktive Nutzung. Das Steuersystem ist so kompliziert, dass du einen Berater brauchst, um deine Pflichten zu erfüllen: Die Last bemisst sich nicht an deiner realen Lage, sondern an der Kunst des Beraters oder an seinem Mut, das Gewünschte aus den Formularen herauszulesen. Das ist die Umkehrung der Haftung: Gesund trägt jeder die Folgen dessen, was er verursacht — hier zahlt jeder, was ihm zugeschrieben wird, ob er verursacht, nutzt oder nachfragt. Wer wirkliche Schäden anrichtet, kommt oft davon; wer nichts veranlasst hat, zahlt die Fiktion. Tiefer greift der Steuerzwang in der staatlichen Währung: Steuern lassen sich in nichts anderem entrichten — damit erzwingt das Steuerrecht die Nachfrage nach dem Staatsgeld und macht alternativen Währungen das Leben schwer. Und Steiner geht weiter: Wer Einkommen besteuert, besteuert eine Abstraktion — das Zeichen, nicht das Gut. Die Einkommensteuer greift beim Zufluss zu, bevor irgendein Bedarf entstanden ist, und macht den Staat zum Komplizen der abstrakten Geldwirtschaft, über die er sich beklagt.
      - schlagwort: Verschleierung
        schlagsatz: Vor Gericht steht eine Konstruktion — kein Mensch.
        kurztext: >
          AG, GmbH, Holdings, Briefkästen: Juristische Konstrukte machen undurchschaubar, wer entscheidet. Der Mensch haftet mit allem, die Konstruktion mit dem Stammkapital — Gesellschaft mit beschränkter Haftung. Beschränkt wird nicht nur die Haftung, sondern die Auffindbarkeit der Verantwortung. Wer einen Missstand öffentlich machen will, findet keinen Verantwortlichen: Die Kette endet im Ausland, die Klage bei einer Hülle, die sich auflöst. Was niemandem zurechenbar ist, verbessert niemand. Die Macht wirtschaftet im Verborgenen — nicht gegen das Recht, sondern durch es.
        text: >
          Juristische Konstrukte verschleiern wirtschaftliche Macht: Rechtsformen wie AG, GmbH oder Stiftungen, verschachtelt über Holdings und Briefkästen, machen undurchschaubar, wer wirklich entscheidet. Die rechtliche Verbindlichkeit wird zur Intransparenz, die Gleichheit vor dem Gesetz zur leeren Hülle: Der Mensch haftet mit allem, die Konstruktion mit dem Stammkapital — schon der Name sagt es: Gesellschaft mit beschränkter Haftung. Beschränkt wird aber nicht nur die Haftung, sondern die Auffindbarkeit der Verantwortung selbst. Damit läuft der Einspruch ins Leere: Wer einen Missstand öffentlich machen will, findet keinen Verantwortlichen — die Kette der Beteiligungen endet im Ausland, die Auskunft beim Geschäftsgeheimnis, die Klage bei einer Hülle, die sich auflöst und andernorts neu gründet. Was niemandem zurechenbar ist, kann niemand beanstanden; und was niemand beanstanden kann, verbessert auch niemand. So wirtschaftet die Macht im Verborgenen — nicht gegen das Recht, sondern durch es: Die Verschleierung ist ordnungsgemäß eingetragen.

  # ══════════════════════════════════════════════════════════════════════
  # FELD 5 — WIRTSCHAFT → RECHT
  # ══════════════════════════════════════════════════════════════════════

  - id: dm-05g
    feld: 5
    richtung: "Wirtschaft -> Recht"
    pol: gesund
    titel: "Die Wirtschaft trägt den Staat"
    aspekte:
      - schlagwort: Ertrag
        schlagsatz: Ohne Ertrag kein Rechtsstaat.
        kurztext: >
          Das Rechtsleben erzeugt keine Güter und braucht doch Gebäude, Wege und Menschen. Alles gemeinschaftlich Genutzte wird aus den Erträgen der wirtschaftlichen Arbeit betrieben. Die Wirtschaft gibt, ohne zu diktieren: Über die Abgaben entscheidet das Rechtsleben unter Gleichen, nicht der Zahler. Die Herkunft der Mittel ist wirtschaftlich, ihre Verwendung ist es nicht. Kein Betrieb erwirbt mit seiner Steuer ein Stimmrecht. Die Wirtschaft trägt den Rechtsstaat, wie das Fundament das Haus trägt: Es entscheidet nicht, wer darin wohnt.
        text: >
          Das Rechtsleben erzeugt keine Güter — und braucht doch Gebäude,
          Geräte, Wege und Menschen, die darin arbeiten. Alles gemeinschaftlich
          Genutzte — Gerichte, Behörden, Straßen, Schulen, Krankenhäuser —
          wird aus den Erträgen der wirtschaftlichen Arbeit betrieben:
          Steuern, Abgaben und Beiträge sind der Anteil der Wirtschaft am
          Gemeinsamen. Sie gibt dabei, ohne zu diktieren — so wie sie das
          Geistesleben durch Schenkung trägt, trägt sie das Rechtsleben durch
          Abgabe. Der Unterschied liegt im Empfänger: Über die geschenkten
          Mittel entscheidet das Geistesleben frei aus der Sache; über die
          Abgaben entscheidet das Rechtsleben demokratisch unter Gleichen.
          Beiden gemeinsam ist die Richtung: Die Herkunft der Mittel ist
          wirtschaftlich, ihre Verwendung ist es nicht. Kein Betrieb erwirbt
          mit seiner Steuer ein Stimmrecht, kein großer Zahler ein größeres
          Gewicht. Die Wirtschaft trägt den Rechtsstaat, wie das Fundament
          das Haus trägt: Es entscheidet nicht, wer darin wohnt.
        zitate: []
      - schlagwort: Durchsetzung
        schlagsatz: Geltung braucht Werkzeuge.
        kurztext: >
          Was das Recht dem Urteil hinzufügt — die Geltung —, braucht Mittel, um wirklich zu sein. Ein Recht, das sich nicht durchsetzen lässt, gilt nur auf dem Papier. Die Wirtschaft stellt die Werkzeuge bereit: Justizgebäude, Vollstreckung, Unterhalt derer, die das Recht wahren. Das Geistesleben findet das Urteil, das Rechtsleben verleiht Geltung, die Wirtschaft gibt der Geltung ihre Hände. Wer die Vollstreckung finanziert, erwirbt keinen Einfluss darauf, was vollstreckt wird. Gleichheit vor dem Gesetz beginnt damit, dass die Mittel des Rechts niemandem gehören, der selbst Partei sein könnte.
        text: >
          Was das Recht dem frei gefundenen Urteil hinzufügt — die Geltung —,
          braucht Mittel, um wirklich zu sein: Gerichte müssen tagen können,
          Urteile vollstreckt, Verstöße verfolgt werden. Ein Recht, das sich
          nicht durchsetzen lässt, gilt nur auf dem Papier — und ein Papier
          schützt niemanden. Die Wirtschaft stellt die Werkzeuge dieser
          Geltung bereit: die Justizgebäude und ihre Ausstattung, die Mittel
          der Vollstreckung, den Unterhalt derer, die das Recht wahren. So
          schließt sich ein Bogen durch die Sphären: Das Geistesleben findet
          das Urteil, das Rechtsleben verleiht ihm Geltung, die Wirtschaft
          gibt der Geltung ihre Hände. Die Rollenteilung bleibt dabei strikt:
          Wer die Vollstreckung finanziert, erwirbt keinen Einfluss darauf,
          was vollstreckt wird — gegen wen das Recht sich durchsetzt,
          bestimmt allein das Recht. Denn Gleichheit vor dem Gesetz beginnt
          damit, dass die Mittel des Rechts niemandem gehören, der selbst
          Partei sein könnte.
        zitate: []
      - schlagwort: Sicherung
        schlagsatz: Die Wirtschaft erzeugt — wer erhält, sagt das Recht.
        kurztext: >
          Krankheit, Alter, Unfall, Arbeitslosigkeit — was den Einzelnen trifft, trägt die Gemeinschaft. Das Rechtsleben bestimmt, was jedem zusteht, weil er Mensch ist; die Wirtschaft speist die Kassen. Wer mehr einzahlt, hat keinen näheren Anspruch; wer wenig einzahlen konnte, keinen ferneren. Weil die Arbeitskraft keine Ware ist, darf auch die Sicherung des Arbeitenden keine sein — sie folgt seinem Menschsein, nicht seinem Marktwert. Wirtschaftlicher Überschuss wird zur rechtlichen Gewissheit: dass keiner fällt, weil ihn niemand mehr braucht.
        text: >
          Krankheit, Alter, Unfall, Arbeitslosigkeit — was den Einzelnen
          trifft, trägt die Gemeinschaft. Das Rechtsleben bestimmt, was jedem
          zusteht, weil er Mensch ist; die Wirtschaft speist die Kassen, aus
          denen dieser Anspruch erfüllt wird: die Beiträge zur Kranken-,
          Renten- und Arbeitslosenversicherung, die Mittel des Ausgleichs
          zwischen Starken und Schwachen. Die Arbeitsteilung ist klar: Die
          Wirtschaft stellt bereit, das Rechtsleben setzt die
          Verteilungsregeln — nach Bedarf und gleichem Recht, nicht nach
          Beitragsmacht. Wer mehr einzahlt, hat keinen näheren Anspruch;
          wer wenig einzahlen konnte, keinen ferneren. Das ist die
          Konsequenz aus dem Schutz der Arbeit: Weil die Arbeitskraft keine
          Ware ist, darf auch die Sicherung des Arbeitenden keine sein —
          sie folgt seinem Menschsein, nicht seinem Marktwert. So verwandelt
          sich wirtschaftlicher Überschuss in rechtliche Gewissheit: dass
          keiner fällt, weil ihn niemand mehr braucht.
        zitate: []
      - schlagwort: Versorgung
        schlagsatz: Geld ist Versprechen; Nahrung ist Wirklichkeit.
        kurztext: >
          Richterinnen, Polizisten, Abgeordnete erzeugen selbst kein Brot — und leben doch von alledem. Geld ist nur die Anweisung; eingelöst wird sie von der realen Produktion. Die Wirtschaft ernährt, kleidet und behaust die Menschen, die im Rechtsleben arbeiten. Mit der Versorgung endet ihr Beitrag. Was die Versorgten leisten, gehört allein dem Rechtsleben; keine Lieferung begründet eine Weisung. Sie trägt die Tragenden — und trägt ihnen nichts auf.
        text: >
          Richterinnen, Polizisten, Verwaltungsangestellte, Abgeordnete erzeugen selbst kein Brot, keine Kleidung, kein Haus — und leben doch von alledem. Was sie erhalten, ist zunächst Geld; aber Geld ist nur die Anweisung, eingelöst wird sie von der realen Produktion. Das eigentliche Tragen geschieht darum nicht in den Kassen, sondern in den Feldern, Werkstätten und Betrieben: Die Wirtschaft ernährt, kleidet und behaust die Menschen, die im Rechtsleben arbeiten — sie trägt die Träger des Rechts. Hier liegt die Übergabe: Mit der Versorgung endet der Beitrag der Wirtschaft. Was die Versorgten leisten — Recht sprechen, verwalten, beschließen —, gehört allein dem Rechtsleben; keine Lieferung begründet eine Weisung. So wie die Mittel gesichert vom Recht ins Geistesleben übergehen und die verbindliche Form vom Recht in die Wirtschaft, geht hier die reale Leistung von der Wirtschaft ins Recht über: Sie trägt die Tragenden — und trägt ihnen nichts auf.
        zitate: []
      - schlagwort: Lieferung
        schlagsatz: Das Recht bestellt, die Wirtschaft liefert.
        kurztext: >
          Gerichtsgebäude, Stimmzettel, Verwaltungsnetze: Die Beschlüsse des Rechtslebens werden zu Aufträgen an die Wirtschaft. Das Ob und Wofür bestimmt das Rechtsleben demokratisch aus den Vorschlägen des Geisteslebens. Das Wie verantwortet die Wirtschaft aus eigener Kompetenz, verhandelt in ihren Assoziationen. Der Auftrag ist ein Vertrag: Das Recht bestellt und bindet sich wie jeder andere, die Wirtschaft liefert. So dient die Wirtschaft dem Gemeinwesen, ohne ihm zu gehören — und das Gemeinwesen empfängt, ohne selbst wirtschaften zu müssen.
        text: >
          Gerichtsgebäude werden gebaut, Stimmzettel gedruckt, Fahrzeuge geliefert, Verwaltungsnetze betrieben — die Beschlüsse des Rechtslebens werden zu Aufträgen an die Wirtschaft. Sie erbringt diese Sachleistungen als das, was sie am besten kann: herstellen, organisieren, liefern. Die Verantwortung ist dabei sauber geteilt. Das Ob und Wofür bestimmt das Rechtsleben demokratisch aus den Vorschlägen des Geisteslebens — welche Schule gebaut, welche Ausstattung beschafft wird. Das Wie verantwortet die Wirtschaft aus eigener Kompetenz — Material, Verfahren, Wege, verhandelt in ihren Erzeuger-Verwender-Gemeinschaften. Keine Behörde muss produzieren können, kein Betrieb beschließen dürfen; jede Seite bleibt in ihrer Stärke. Die Form dafür kennt das Nachbarfeld schon: Der Auftrag ist ein Vertrag — das Recht bestellt und bindet sich an die Abmachung wie jeder andere Vertragspartner auch, die Wirtschaft füllt die Abmachung und liefert. So dient die Wirtschaft dem Gemeinwesen, ohne ihm zu gehören — und das Gemeinwesen empfängt, ohne selbst wirtschaften zu müssen.
        zitate: []
      - schlagwort: Freistellung
        schlagsatz: Keine freie Zeit — kein freies Urteil.
        kurztext: >
          Demokratie lebt von Menschen, die Zeit einbringen: Abgeordnete, Schöffen, Wahlhelfer, Bürger an öffentlichen Projekten. Mitwirken kann nur, wer freigestellt wird. Die Wirtschaft gibt hier ihre knappste Ressource ab: Arbeitszeit. Sie trägt den Ausfall, hält den Platz offen — wer zurückkehrt, findet ihn unverändert; wer ganz in den öffentlichen Dienst geht, wird aus dem Gemeinsamen versorgt. Gesetze, die jeder verstehen können muss, brauchen auch jeden, der sie mitgestalten kann. Die Wirtschaft gibt den Bürger frei, für die Zeit, in der er nicht Arbeitskraft ist, sondern Rechtsgenosse.
        text: >
          Demokratie lebt nicht allein von Geld, sondern von Menschen, die ihre Zeit einbringen. Das Rechtsleben braucht Abgeordnete und Kommunalpolitiker, die sich ganz der öffentlichen Sache widmen; Schöffen und Wahlhelfer, die das Recht im Einzelfall tragen; Bürger, die an Projekten für die Allgemeinheit arbeiten; und Menschen, die Wahlen organisieren, Transparenz herstellen und die Kommunikation des Gemeinwesens pflegen. Mitwirken kann nur, wer dafür freigestellt wird. Deshalb gibt die Wirtschaft hier ihre knappste Ressource ab: Arbeitszeit. Sie trägt den Ausfall, hält den Arbeitsplatz offen und sorgt dafür, dass öffentliches Engagement kein berufliches Risiko bedeutet — wer zurückkehrt, findet seinen Platz im Betrieb unverändert vor; wer ganz in den öffentlichen Dienst geht, wird aus dem Gemeinsamen versorgt, nicht aus dem Betrieb bezahlt. Denn Gesetze, die jeder verstehen können muss, brauchen auch jeden, der sie mitgestalten kann. So gleicht sich die Leistung aus: Wie das Recht den Menschen aus dem Warenverkehr herausnimmt, gibt die Wirtschaft den Bürger frei — für die Stunden, Monate oder Jahre, in denen er nicht Arbeitskraft ist, sondern Rechtsgenosse unter Gleichen.
        zitate: []
      - schlagwort: Enthaltung
        schlagsatz: Wer zahlt, bestimmt nicht.
        kurztext: >
          Die Wirtschaft stellt das Geld bereit und führt die Zahlungen aus, entscheidet aber nicht, wohin die Mittel fließen. Ob ein Verfahren vorgezogen oder eine Straße gebaut wird, bestimmt das Rechtsleben unter Gleichen — nicht der Kostenträger. Das ist der schwerste Beitrag, denn die Versuchung liegt in der Sache: Wer zahlt, könnte bestimmen wollen. Das Recht zieht von außen die Grenze, dass nicht alles käuflich ist; die Wirtschaft hält sie von innen ein. Erst die Trennung von Zahlen und Bestimmen macht alle anderen Beiträge gesund. Das Geld kann die Regeln nicht kaufen, nach denen es selbst gilt.
        text: >
          Die Wirtschaft stellt das Geld bereit und führt die Zahlungen aus, aber sie entscheidet nicht darüber, wohin die Mittel fließen. Ob ein Verfahren vorgezogen, eine Leistung bewilligt oder eine Straße gebaut wird, bestimmt das Rechtsleben demokratisch unter Gleichen – nicht der Kostenträger. Diese Enthaltung ist der schwerste Beitrag der Wirtschaft, denn die Versuchung liegt in der Sache: Wer zahlt, könnte bestimmen wollen. Das Recht zieht von außen die Grenze, dass nicht alles käuflich ist. Die Wirtschaft hält von innen die Grenze ein, indem sie gibt, ohne mit der Gabe etwas zu erwerben. Erst diese Trennung von Zahlen und Bestimmen macht alle anderen Beiträge gesund. Mit ihr wird das Tragen zum Dienst, ohne sie würde es zur Leine. Das Recht bleibt unbestechlich aus Struktur, nicht bloß aus Tugend. Das Geld kann die Regeln nicht kaufen, nach denen es selbst gilt, weil die Wirtschaft strukturell keinen Einfluss auf die Rechtsetzung hat. Die Unbestechlichkeit des Rechts ist also keine Frage des Charakters, sondern eine Frage der Ordnung.        zitate: []

  - id: dm-05k
    feld: 5
    richtung: "Wirtschaft -> Recht"
    pol: krank
    titel: "Die Wirtschaft kauft die Politik"
    aspekte:
      - schlagwort: Erpressung
        schlagsatz: Wer Macht hat, droht dem Haus.
        kurztext: >
          Konzerne drohen mit Abwanderung, um Steuerbefreiungen und niedrigere Standards zu erzwingen. Die Abgabe, die den Rechtsstaat tragen sollte, wird zum Druckmittel: Nicht der Beitrag verschafft Gewicht, sondern die Drohung, ihn zu entziehen. Gemeinden unterbieten einander, Steueroasen bieten Briefkästen statt Standorte. Steiner nannte diese Konkurrenz zwischen Wirtschaftsgebieten eine Vorform des Krieges. Bezahlt wird das Entgegenkommen von denen, die nicht drohen können: Handwerk und Angestellte tragen, was die Drohenden sich ersparen. Das Fundament verhandelt über die Statik.
        text: >
          Konzerne drohen mit Abwanderung, um Sonderregelungen, Steuerbefreiungen oder die Absenkung von Sozialstandards zu erzwingen — das Recht wird zum Verhandlungsobjekt. Die Abgabe, die den Rechtsstaat tragen sollte, wird als Druckmittel eingesetzt: Nicht der Beitrag verschafft Gewicht, sondern die Drohung, ihn zu entziehen. Je größer der Zahler, desto lauter die Drohung — und desto williger das Entgegenkommen: Gemeinden unterbieten einander mit Gewerbesteuersätzen, Staaten konkurrieren um die niedrigsten Standards, Steueroasen bieten Briefkästen statt Standorte — und wer am glaubwürdigsten gehen kann, diktiert den Bleibenden die Bedingungen. Steiner nannte diese Konkurrenz zwischen Wirtschaftsgebieten eine Vorform des Krieges; sie beginnt beim Gewerbesteuersatz und geht über Sanktionen und Handelskriege bis zu militärischen Auseinandersetzungen. Bezahlt wird das Entgegenkommen von denen, die nicht drohen können: Der Handwerksbetrieb, die Angestellte, die Bäckerei an der Ecke zahlen den vollen Satz und tragen mit, was die Drohenden sich ersparen — sie sind an den Ort gebunden, den der Konzern als Faustpfand hält. So kehrt sich das Tragen um: Das Fundament trägt das Haus nicht mehr — es verhandelt über die Statik und lässt gelegentlich spüren, dass es auch nachgeben könnte.
      - schlagwort: Machtspiel
        schlagsatz: Zu groß, um belangt zu werden.
        kurztext: >
          Wenn der Staat auf Steuern oder Kredite großer Akteure angewiesen ist, fehlt ihm die Kraft, gegen sie vorzugehen. Die Bank, deren Zusammenbruch das Land erschüttern würde, wird gerettet statt bestraft. Die Werkzeuge sind da — Gerichte, Paragraphen —, aber die Hand gehorcht der Abhängigkeit. Der Ladendieb wird bestraft, der Bilanzfälscher bekommt eine Abfindung. Hinter der juristischen Person verschwindet die Verantwortung. Substanzlose Finanztitel machen den Akteur „systemrelevant“: nicht weil er etwas Wertvolles hält, sondern weil sein Zusammenbruch alles andere mitrisse. Nichts zersetzt den Rechtssinn gründlicher als Geltung, die vor der Größe haltmacht.
        text: >
          Wenn der Staat selbst auf die Steuereinnahmen oder Kredite großer Wirtschaftsakteure angewiesen ist, fehlt ihm der Wille oder die Kraft, gegen diese Akteure rechtlich vorzugehen. Die Bank, deren Zusammenbruch, durch Korruption verursacht wird, würde das Land erschüttern. Sie wird gerettet statt bestraft; der Konzern, an dem eine Region hängt, wird geschont statt geprüft; der Gläubiger, der die Anleihen hält, wird hofiert. Die Werkzeuge sind alle vorhanden — Gerichte, Behörden, Paragraphen —, aber die Hand, die sie führen müsste, gehorcht der Abhängigkeit: Man vollstreckt nicht gegen den, von dem man lebt. So entsteht ein Recht mit Größenvorbehalt, das nur noch nach unten durchgreift: Der Ladendieb wird bestraft, der Bilanzfälscher bekommt eine Abfindung; die Schwarzfahrerin sitzt ein, der Steuertrickser verhandelt – aber auch nur wenn es um Millionen geht. Die Gleichheit vor dem Gesetz endet genau dort, wo die Abhängigkeit beginnt — und jeder im Land weiß es. Verschärft wird das Machtspiel durch die juristische Person: Nicht ein Mensch haftet, sondern eine Rechtsform — und hinter ihr verschwindet die Verantwortung. Wer nicht persönlich haftet, droht leichter, verhandelt härter, und der Staat steht vor der Frage, wen er überhaupt belangen soll, wenn die Entscheidung in einem Vorstand fiel, der sich auf den Aufsichtsrat beruft, der sich auf den Markt beruft. Verstärkt wird die Abhängigkeit durch substanzlose Finanztitel — Derivate, Verbriefungen, Forderungen auf Forderungen —, die den Akteur „systemrelevant" machen: Nicht weil er etwas Wertvolles hält, sondern weil sein Zusammenbruch alles andere mitrisse. Nichts zersetzt den Rechtssinn gründlicher als Geltung, die vor der Größe haltmacht.
      - schlagwort: Schutzabbau
        schlagsatz: Der Vorschrift fällt, damit die Rendite steigt.
        kurztext: >
          Wirtschaftsakteure erzwingen die Abschaffung von Arbeits-, Umwelt- und Verbraucherschutz — im Namen der Wettbewerbsfähigkeit, in Wahrheit um Haftung zu umgehen. Deregulierung klingt nach Befreiung; befreit wird die Macht von der Pflicht. Gestrichen wird nicht das überflüssige Formular, sondern die Vorschrift, die den Schwächeren deckte. Was jedem zustand, weil er Mensch ist, muss sich wieder rechnen. Daneben die leisere Strategie: das Geschäft so bauen, dass das Gesetz nicht greift. Plattformarbeit umgeht das Arbeitsrecht, Scheinselbstständigkeit das Sozialrecht — man schafft den Schutz nicht ab, man baut um ihn herum.
        text: >
          Wirtschaftsakteure erzwingen die Abschaffung von Schutzgesetzen — Arbeitsrecht, Umweltrecht, Verbraucherschutz — mit dem Argument der Wettbewerbsfähigkeit, tatsächlich aber, um Haftung und Verantwortung zu umgehen, und um den Börsenkurs zu erhöhen. „Deregulierung" klingt nach Befreiung; befreit wird aber nicht der Mensch vom Amt, sondern die Macht von der Pflicht. Was als Bürokratieabbau firmiert, ist Schutzabbau: Gestrichen wird nicht das überflüssige Formular, sondern die Vorschrift, die den Schwächeren deckte — der Kündigungsschutz, der Grenzwert, das Widerrufsrecht. Die Sicherung läuft damit rückwärts: In einer gesunden Wirtschaft verwandelt sich Überschuss in rechtliche Gewissheit — dass keiner fällt, nur weil ihn niemand mehr braucht. Hier verwandelt sich rechtliche Gewissheit zurück in wirtschaftliches Risiko, das der Einzelne trägt: Der Kranke verhandelt mit der Kasse, der Alte rechnet mit der Rente, der Entlassene steht im Wettbewerb um seinen eigenen Schutz. Was jedem zustand, weil er Mensch ist, muss sich wieder rechnen — und was sich nicht rechnet, verfällt. Neben der offenen Abschaffung gibt es die leisere Strategie: das Geschäft so bauen, dass das Gesetz nicht greift. Plattformarbeit umgeht das Arbeitsrecht, Scheinselbstständigkeit das Sozialrecht, Software as a Service die Copyleft-Pflicht — man schafft den Schutz nicht ab, man baut um ihn herum, und das Ergebnis ist dasselbe.
      - schlagwort: Bestechung
        schlagsatz: Die Lieferung wird zur Anweisung.
        kurztext: >
          Richter, Staatsanwälte, Aufsicht sollen Verstöße nicht verfolgen. Der grobe Weg ist die Bestechung; leiser wirkt die Drohung; am unauffälligsten die Beziehung. Am weitesten reicht die Drehtür: Der Aufseher von heute ist der Vorstand von morgen — die milde Prüfung ist die Bewerbung für später. Gesund trägt die Wirtschaft die Träger des Rechts und trägt ihnen nichts auf. Hier sucht sich die Zahlung den direkten Weg in die Hand, die urteilen soll. Ein gekaufter Richter richtet nicht mehr — er liefert. Und wer weiß, dass Urteile käuflich sind, glaubt auch dem unbestochenen nicht mehr.
        text: >
          Das Ziel ist immer dasselbe: Richter, Staatsanwälte oder Aufsichtsbehörden sollen Rechtsverstöße nicht verfolgen oder nur milde ahnden. Der gröbste Weg dahin ist die Bestechung. Leiser wirkt die Drohung, oft genügt schon die Andeutung, dass man etwas weiß. Am unauffälligsten wirkt die Beziehung: der gemeinsame Golfclub, das Abendessen, die Gefälligkeit, über die niemand spricht und die doch jeder versteht. Am weitesten aber reicht die Drehtür: Der Aufseher von heute ist der Vorstand von morgen — und weiß es heute schon. Die milde Prüfung ist die Bewerbung für später; die Zahlung heißt Karriere und wird erst nach dem Ausscheiden fällig, wenn keine Vorschrift mehr greift. Niemand muss bestochen werden — die Aussicht genügt. Damit kippt die Versorgung in ihr Gegenteil: Gesund trägt die Wirtschaft die Träger des Rechts — ernährt, kleidet, behaust sie — und trägt ihnen nichts auf. Hier sucht sich die Zahlung den direkten Weg: nicht über Kassen und Besoldung, durch die alle gleich versorgt werden, sondern an der Ordnung vorbei in die Hand, die urteilen soll. Aus dem Unterhalt, der unabhängig macht, wird der Umschlag, der abhängig macht; aus der Lieferung, die keine Anweisung begründet, die Anweisung selbst. Ein gekaufter Richter richtet nicht mehr — er liefert. Und wer weiß, dass Urteile käuflich sind, glaubt auch dem unbestochenen Richter nicht mehr.
      - schlagwort: Privatjustiz
        schlagsatz: Die Wirtschaft richtet sich selbst.
        kurztext: >
          Gesund liefert die Wirtschaft Gebäude und Netze. Krank liefert sie Urteile. Schiedsklauseln zwingen Streit vor private Tribunale, deren Sprüche kein Gericht nachprüft. ISDS erlaubt Konzernen, Staaten zu verklagen, wenn Gesetze ihre Rendite schmälern. Nutzungsbedingungen funktionieren als Gesetz für Milliarden — ohne Einspruch, ohne öffentliche Verhandlung. Interne Compliance ermittelt und sanktioniert ohne öffentliches Verfahren. Die Wirtschaft baut ein paralleles Rechtssystem: Sie umgeht den Staat nicht, indem sie sein Recht bricht, sondern indem sie um es herumliefert.
        text: >
          Gesund liefert die Wirtschaft dem Rechtsleben Gebäude, Fahrzeuge und Netze — reale Güter durch reale Verträge, nach staatlicher Bestellung. Krank liefert sie Urteile. Schiedsklauseln in Verträgen zwingen Streitigkeiten vor private Tribunale, die kein Parlament gewählt hat und deren Sprüche kein Gericht nachprüft. Schiedsverfahren (z. B. ISDS) erlauben Konzernen, Staaten vor privaten Schiedsgerichten zu verklagen, wenn Gesetze ihre Rendite schmälern — das Recht, das die Wirtschaft schützen soll, wird zum Angriffsziel der Wirtschaft. Nutzungsbedingungen funktionieren als Gesetz für Milliarden: Sie regeln Zugang, Ausschluss und Bestrafung ohne demokratische Legitimation, ohne Einspruch, ohne öffentliche Verhandlung — und wer nicht zustimmt, darf nicht teilnehmen. Interne Compliance-Abteilungen ermitteln, urteilen und sanktionieren, ohne dass ein öffentliches Verfahren stattfände. So baut sich die Wirtschaft ein paralleles Rechtssystem: Sie umgeht den Staat nicht, indem sie sein Recht bricht, sondern indem sie um es herumliefert — eigene Gerichte, eigene Regeln, eigene Vollstreckung. Der Auftrag, der ein Vertrag sein sollte, wird zur Eigenjustiz; die Lieferung, die dem Gemeinwesen dienen sollte, ersetzt es.
        zitate: []
      - schlagwort: Sklaventum
        schlagsatz: Der Mensch wird zum Posten in der Kalkulation.
        kurztext: >
          Die Wirtschaft entscheidet eigenmächtig, wer wo arbeitet, wie lange und zu welchem Preis — obwohl Maß und Art der Arbeit dem Rechtsleben zustehen. Gesund werden die Arbeitsverhältnisse vor der Produktion auf dem Boden des Rechts vereinbart. Hier vereinbart sie der Markt, als wäre Arbeitskraft eine Ware wie jede andere. Wer seine Arbeitskraft verkauft, verkauft sich — denn die Kraft ist nicht vom Menschen zu trennen. Steiner nannte das die Grundkrankheit des sozialen Organismus: rechtlich frei und wirtschaftlich leibeigen.
        text: >
          Die Wirtschaft entscheidet eigenmächtig, wer wo arbeitet, wie lange und zu welchem Preis — obwohl Maß und Art der Arbeit dem Rechtsleben zustehen. Im gesunden Zustand werden die Arbeitsverhältnisse vor der Produktion vereinbart, auf dem Boden des Rechts: nicht als Gegenstand des Marktes, sondern als Voraussetzung, unter der überhaupt produziert werden darf. Hier vereinbart sie der Markt — nach Angebot und Nachfrage, als wäre menschliche Arbeitskraft eine Ware wie jede andere. Die Grenze, die das Recht ziehen müsste, zieht die Wirtschaft selbst und zieht sie zu ihren Gunsten: Sie bestimmt die Stunden, den Ort, den Lohn und die Bedingungen, unter denen ein Mensch seine Kraft hergeben muss, um zu leben. Wer seine Arbeitskraft verkauft, verkauft sich — denn die Kraft ist nicht vom Menschen zu trennen, der sie ausübt. Steiner nannte das die Grundkrankheit des sozialen Organismus: Solange Arbeit gekauft und verkauft wird wie ein Stück Stoff, ist der Mensch selbst zur Ware geworden — rechtlich frei und wirtschaftlich leibeigen.
        zitate: []
      - schlagwort: Lobbykauf
        schlagsatz: Wer zahlt, bestimmt doch.
        kurztext: >
          Wirtschaftsgruppen finanzieren Wahlkämpfe und setzen eigene Gesetzentwürfe durch. Die Wirtschaft gibt nicht mehr, ohne mit der Gabe etwas zu erwerben — sie investiert. Die Spende ist eine Anzahlung, der fertige Entwurf eine Bestellung, der Termin im Ministerium eine Abnahme. Wer zahlt, bestimmt doch — nur leiser, früher und gründlicher, nämlich schon im Entwurf. Fällt die Trennung von Zahlen und Bestimmen, kippen alle anderen Beiträge mit. Ist die Ordnung selbst gekauft, hilft auch kein Charakter mehr.
        text: >
          Wirtschaftliche Interessengruppen finanzieren Wahlkämpfe und setzen eigene Gesetzentwürfe durch — das Recht dient nicht mehr dem Gemeinwohl, sondern Einzelinteressen. Die Wirtschaft gibt nicht mehr, ohne mit der Gabe etwas zu erwerben — sie investiert. Die Wahlkampfspende ist keine Schenkung, sondern eine Anzahlung; der fertige Entwurf aus der Kanzlei keine Hilfestellung, sondern eine Bestellung; der Termin im Ministerium kein Gespräch, sondern eine Abnahme. So wird aus „Wer zahlt, bestimmt nicht" das Gegenteil: Wer zahlt, bestimmt doch — nur leiser, früher und gründlicher, nämlich schon im Entwurf. Die Trennung von Zahlen und Bestimmen machte alle anderen Beiträge gesund; fällt sie, kippen sie alle mit: Der Ertrag wird zur Erpressung, die Durchsetzung zur Lähmung, die Sicherung zum Schutzabbau, die Versorgung zur Bestechung, die Lieferung zur Privatjustiz, die Freistellung zur Drehtür. Die Unbestechlichkeit des Rechts war eine Frage der Ordnung, nicht des Charakters — ist die Ordnung selbst gekauft, hilft auch kein Charakter mehr.

