  - id: dm-01g
    feld: 1
    richtung: "Geist -> Recht"
    pol: gesund
    titel: "Sachkenntnis prägt das Recht"
    aspekte:
      - schlagwort: Entfaltung
        schlagsatz: Jeder kann das werden, was in ihm steckt.
        kurztext: >
          Das freie Geistesleben lässt jeden seine Fähigkeiten entfalten und macht zugleich sichtbar, welche Aufgaben die Gesellschaft braucht. Schulen unterrichten aus dem, was die Kinder mitbringen; Lehrer erneuern die Inhalte aus eigener Arbeit — kein Erlass legt fest, was jeder zu wissen hat. Das Geistesleben liefert dem Recht keine Weltanschauung und kein fertiges Programm, sondern Fähigkeiten und Einsicht. Der politische Bereich behält seine Aufgabe: zu bestimmen, was unter Gleichen gilt.
        text: >
            Das freie Geistesleben schafft die Voraussetzungen, dass jeder Mensch seine individuellen Fähigkeiten entfalten kann — und macht zugleich die gesamtgesellschaftlichen Herausforderungen sichtbar. Schulen gestalten ihren Unterricht aus dem, was die Kinder mitbringen, und die Lehrer erneuern die Inhalte fortlaufend aus ihrer eigenen Arbeit; kein Erlass legt fest, was jeder zu wissen hat. Das Geistesleben liefert dem Recht keine Weltanschauung und kein fertiges Programm, sondern Fähigkeiten und Einsicht — Schule und Lehre bleiben frei, Überzeugungen werben, sie gelten nicht. Dadurch finden sich für alle Herausforderungen Menschen, die sie aus eigenem Antrieb und Können erfüllen. Der politische Bereich erhält so eine verlässliche Grundlage an Fähigkeiten, aus der er schöpfen kann — und behält seine eigene Aufgabe: zu bestimmen, was unter Gleichen gilt und was jeder versteht.
        erklaerung: >
          Entfaltung heißt hier nicht Selbstverwirklichung als Privatangelegenheit, sondern die gesellschaftliche Voraussetzung dafür, dass für jede Aufgabe Menschen da sind, die sie aus eigenem Können erfüllen können. Das Geistesleben liefert dem Recht keine Weltanschauung und kein fertiges Programm, sondern Fähigkeiten und Einsicht. Schule und Lehre bleiben frei, weil kein Erlass den Inhalt festlegt; Überzeugungen werben, sie gelten nicht. Die Politik behält dadurch ihre eigene Arbeit: zu entscheiden, was unter Gleichen gilt — nicht, was jeder zu denken hat.
        zitate:
      - schlagwort: Erfahrung
        schlagsatz: Gesetze aus Erfahrung — nicht durch Mehrheiten.
        kurztext: >
          Sachkundige Urteile entstehen nicht aus Abstimmung oder Machtwort — bei Schule, Gesundheit oder Forschung hilft kein Abzählen von Stimmen. Wer ein Gesetz gestaltet, hat selbst in der Sache gestanden. Während der Entstehung ist der Inhalt eine Geistesfrage; Gesetz wird nur, was alle gleich betrifft und jeder Erwachsene verstehen kann. Der Politiker liefert nicht den Inhalt, er wählt aus dem, was das Geistesleben anbietet, das Gesetz oder die Aufgabe, die den Menschen dient, für die er spricht.
        text: >
          Das Rechtsleben kann aus Abstimmungen und Machtverhältnissen keine sachkundigen Urteile fällen — bei technischen, medizinischen, pädagogischen Fragen hilft keine Auszählung und kein Machtwort. Solche Fragen beantworten Menschen, die aus eigener Arbeit im jeweiligen Feld urteilen: Wer ein Gesetz über Schule, Gesundheit oder Forschung gestaltet, hat selbst darin gestanden. Die Inhalte der Gesetze sind während ihrer Entstehung Geistesfragen und werden erst mit Fertigstellung zu Rechtsfragen — und Gesetz wird nur, was alle gleich betrifft und was jeder erwachsene Mensch verstehen kann. Werden sie weiterentwickelt, dann wiederum nicht durch Politik oder Politiker, sondern wieder durch Menschen, die die nötige persönliche Erfahrung haben. Die Aufgabe des Politikers ist damit nicht der Inhalt — den liefert das Geistesleben fertig —, sondern die Auswahl: Er schaut auf die Menschen, für die er spricht, und wählt aus dem, was angeboten wird, das Gesetz, das ihnen am besten dient.
      - schlagwort: Miturteil
        schlagsatz: Vier Augen sehen alles, bevor es gilt.
        kurztext: >
          Wer das Gesetz, das Urteil macht, das Vorhaben entwickelt, bezieht in seinem Tun alle ein, die er für wichtig hält. Aus diesem Tun wird der Pull Request — und der geht an einen. Review ist das Urteil eines Zweiten am konkreten Schritt, nicht die Sitzung eines Gremiums. Bis zur Einführung bleibt der Verfasser frei, wen er hinzuzieht; niemand weist ihm die Gutachter zu. Erst was so gesehen wurde, liegt den Beteiligten als Ergebnis vor, bevor es gilt.
        text: >
          Miturteil ist das Paar Pull Request und Review. Wer das Gesetz, das Urteil macht, das Vorhaben entwickelt, bezieht in seinem Tun alle ein, die er für wichtig hält: den, der die benachbarte Stelle kennt, den, den die Änderung trifft, den, der die Historie trägt, den, dessen Urteil er traut. Aus diesem Tun wird der Pull Request — und der geht an einen. Review ist das Urteil eines Zweiten am konkreten Unterschied zum geltenden Stand, auf Augenhöhe, aus der Sache: zustimmen, ändern, nachfragen. Der Verfasser nimmt auf, lässt begründet stehen, zieht in der Arbeit weitere hinzu. Bis zur Einführung bleibt er frei, wen er hinzuzieht und wann der Schritt reif ist — keine Pflichtstation, kein Ausschuss, keine Gegenzeichnung von Referat zu Abteilung. Das verhindert, dass ein Einzelner aus Blindheit oder Eigennutz entscheidet, ohne dass eine Hierarchie ihm die Augen zuweist. Das Geistesleben stellt die Menschen bereit, die so urteilen können; formale Abschlüsse ersetzen sie nicht. Erst was so Schritt für Schritt gesehen wurde, liegt den Beteiligten als Ergebnis vor — bevor es gilt.
        erklaerung: >
          Miturteil ist nicht die Endabnahme eines fertigen Gesetzes durch viele Gutachter und nicht die Pflichtkette der Hierarchie. Im Tun bezieht der Verfasser ein, wen er für wichtig hält; der Pull Request geht an einen. Bis zur Einführung bleibt er frei in dieser Wahl. Die Prüfung kommt aus der Sache, nicht aus dem Amt. Was danach gilt, kann unter Mitwirken noch widersprochen werden; Miturteil geschieht vorher, am Schritt selbst.
        zitate:
          - >
            Es ist eben durchaus zweierlei: zu urteilen und sich zum Urteil den Weg zeigen lassen. (Rudolf Steiner, Lucifer-Gnosis. Grundlegende Aufsätze zur Anthroposophie und Berichte aus der Anthroposophie)
      - schlagwort: Verständlichkeit
        schlagsatz: Gesetze muss jeder mündige Bürger verstehen können.
        kurztext: >
          Ein Gesetz, das nur Fachleute durchschauen, schließt die meisten von der Mitbestimmung aus. Das freie Geistesleben formuliert klar und allgemeinverständlich — und stellt die Unterstützung bereit, die Texte zu verstehen: im Zusammenhang, in der Vertiefung, in der Historie. Erst wenn jeder mündige Bürger versteht, was gilt, geht es ins Rechtsleben über. Nur so ist Demokratie mehr als eine Illusion.
        text: >
          Ein Gesetz, das nur Fachleute durchschauen, schließt die meisten von der Mitbestimmung aus. Das freie Geistesleben formuliert Gesetze und Verordnungen in klarer, allgemeinverständlicher Sprache — und stellt die Unterstützung bereit, sie zu verstehen: im Zusammenhang, in der Vertiefung, in der Historie. Das Rechtsleben ist zuständig für alles, was jeder mündige Bürger verstehen kann. Erst wenn ein Gesetz so weit frei formuliert und erschlossen ist, dass jeder es verstehen kann, geht es über ins Rechtsleben. Nur so ist Demokratie mehr als eine Illusion.
        erklaerung: >
          Verständlichkeit ist mehr als einfache Sprache. Allgemeinverständlich geschrieben reicht nicht, wenn Zusammenhang, Vertiefung und Geschichte des Textes verschlossen bleiben. Das Geistesleben hält beides bereit: die klare Fassung und die Hilfen, sie zu verstehen. Erst was so erschlossen ist, dass jeder mündige Bürger es prüfen kann, geht ins Rechtsleben über.
        zitate:
          - >
            Ich habe übrigens die Überzeugung, dass dies noch in weit höherem Maße der Fall sein könnte, wenn bei Rechtssprechungen mehr der Geist der Gesetze und weniger der Buchstabe derselben ausschlaggebend wäre, oder besser gesagt: wenn der letztere dazu benutzt würde, besser in den ersteren einzudringen. Man kann Prozesse erleben, deren Gang dem Laien ein Schaudern erregt über die Fülle der aufgewendeten juristischen Sophisterei und den doch der gelehrte Jurist als schlechtweg naturgemäß erklärt. (Rudolf Steiner, Methodische Grundlagen der Anthroposophie)
      - schlagwort: Mitwirken
        schlagsatz: Einsprechen, nachdem es gilt.
        kurztext: >
          Was gilt, bleibt korrigierbar. Wer erkennt, dass ein Gesetz nicht aus der Sache kommt oder nicht für alle gleich gilt, bringt den Einwand öffentlich vor — sichtbar dort, wo das Gesetz steht. Der Einwand ist ein Vorschlag: Er benennt den Fehler und die bessere Fassung. Das Geistesleben pflegt die Urteilskraft und eine Kultur, in der ein Einwand nichts kostet. So erstarrt das Recht nicht zum Buchstaben.
        text: >
          Was einmal gilt, bleibt korrigierbar. Wer erkennt, dass ein Gesetz nicht aus der Sache kommt oder nicht für alle gleich gilt, bringt seinen Einwand öffentlich vor — sichtbar an der Stelle, an der das Gesetz steht. Der Einwand ist keine Anklage, sondern ein Vorschlag: Er benennt nicht nur den Fehler, sondern die bessere Fassung. Das Geistesleben pflegt das Urteilsvermögen, aus dem ein solcher Einwand überhaupt erst begründet werden kann — und es pflegt die Kultur, in der ein Einwand nichts kostet. So bleibt das Recht in Bewegung und erstarrt nicht zum Buchstaben.
        zitate:
          - >
            Der Staat wird zu warten haben auf dasjenige, was ihm von diesem freien Geistesleben aus überantwortet wird. Er wird befruchtet werden von den lebendigen Ideen, die nur aus einem solchen Geistesleben erstehen können. (Rudolf Steiner, Die Kernpunkte der sozialen Frage)
      - schlagwort: Zutrauen
        schlagsatz: Richter aus Zutrauen — gewählt auf Zeit.
        kurztext: >
          Im Geistesleben stellen sich Menschen als Richter zur Verfügung, die in dem Gebiet, über das sie urteilen, selbst gearbeitet haben. Jeder wählt aus dieser Gruppe auf Zeit seinen Richter — und nur der darf über ihn richten. Das Urteil kommt aus Sachkenntnis und persönlichem Vertrauen, nicht aus Ernennung. Der Richter wirkt, weil er gebraucht wird, nicht weil er eine Position bekleidet.
        text: >
          Im Geistesleben stellen sich Menschen als Richter zur Verfügung, die in dem Gebiet, über das sie urteilen, selbst gearbeitet haben. Jeder Einzelne wählt aus dieser Gruppe auf Zeit seinen Richter — und nur der darf über ihn richten. So kommt das Urteil aus Sachkenntnis und persönlichem Vertrauen, nicht aus bürokratischer Ernennung. Jedes Urteil ist öffentlich unbegrenzt nachvollziehbar; der Richter wirkt, weil er gebraucht wird, nicht weil er eine Position bekleidet.
      - schlagwort: Rechtssinn
        schlagsatz: Wer einsieht, braucht keinen Zwang.
        kurztext: >
          Das Geistesleben bildet nicht nur Fähigkeiten aus, sondern den Sinn für das, was allgemein gilt. Wer aus eigener Anschauung urteilen gelernt hat, erkennt im Einzelfall, was der Sache entspricht — nicht was ihm nützt. Wer aus Einsicht handelt, gehorcht dem Gesetz, weil er seine Notwendigkeit durchschaut, nicht weil es befohlen ist. Ohne diesen Sinn bleiben die anderen Aspekte Mechanismen ohne Fundament.
        text: >
          Das Geistesleben bildet nicht nur die Fähigkeiten des Einzelnen aus, sondern pflegt auch den Sinn für das, was allgemein gilt — eine Fähigkeit, die nicht angeboren ist. Wer aus eigener Anschauung urteilen gelernt hat, erkennt im Einzelfall, was über ihn hinausweist: nicht was ihm nützt, sondern was der Sache entspricht. Wer aus Einsicht handelt, gehorcht dem Gesetz nicht, weil es befohlen ist, sondern weil er dessen Notwendigkeit durchschaut. Ohne diese innere Grundlage blieben Entfaltung, Erfahrung, Miturteil, Verständlichkeit, Mitwirken und Zutrauen bloße Mechanismen ohne tragendes Fundament.

  - id: dm-01k
    feld: 1
    richtung: "Geist -> Recht"
    pol: krank
    titel: "Die Weltsicht wird zum Gesetz"
    aspekte:
      - schlagwort: Vorschrift
        schlagsatz: Die Überzeugung Einzelner wird zum Gesetz.
        kurztext: >
          Das kranke Geistesleben liefert dem Recht keine Fähigkeiten, sondern eine fertige Weltsicht: Gottesgesetz, Rassenlehre, das Dogma vom grenzenlosen Wachstum. Was zuerst Lehre war, soll für alle gelten; der Lehrplan sorgt dafür, dass schon die Kinder es lernen. Eine Überzeugung wird zum Paragraphen — auch für die, die sie nie geteilt haben. Recht und Politik beschließen nur noch, was die Lehre verlangt. So gilt Fiat-Geld, weil das Gesetz es sagt, und duldet keine Alternative.
        text: >
          Das kranke Geistesleben liefert dem Rechtsleben keine Fähigkeiten, sondern eine fertige Weltsicht. Ein Gottesgesetz, eine Rassenlehre, das Dogma vom grenzenlosen Wachstum und der Gewinnmaximierung — was zuerst Lehre war, soll für alle gelten. Der Lehrplan sorgt dafür, dass es schon die Kinder lernen: Per Erlass steht fest, was jeder zu wissen hat, und was einmal festgeschrieben ist, veraltet dort über Generationen, weil niemand aus der lebendigen Arbeit es erneuern darf. Eine Überzeugung verlässt ihre freie Sphäre: Sie wird zum Paragraphen, der Glaube zur Pflicht, die Weltanschauung zur Rechtsordnung — auch für die, die sie nie geteilt haben. Die Richtung hat sich umgekehrt. Nicht Menschen tragen aus ihrer eigenen Entwicklung heraus ihr Können in den politischen Bereich. Der politische Bereich erhält fertige Inhalte, die er nur noch beschließen muss. Recht und Politik verlieren ihre eigene Aufgabe: Sie bestimmen nicht mehr, was unter Gleichen gilt, was jeder versteht, sondern machen aus einer vorhandenen Lehre das Gesetz, das niemand hinterfragen soll. So wird die Lehre vom Geld dem Recht vorgeschrieben: Es gilt, weil das Gesetz es sagt, Fiat-Währungen (Dollar, Euro etc.) gelten — und dulden keine Alternative.
      - schlagwort: Verhaltensnorm
        schlagsatz: Gesetze aus Gesinnung — je nach Mehrheit.
        kurztext: >
          Wo das gesunde Geistesleben Erfahrung liefert, liefert das kranke Überzeugungen — und die brauchen eine Mehrheit, keine Bewährung. Das Gesetz entsteht aus Kompromiss, Gefälligkeit und Lobby, nicht nur aus dem, was sich am Fall bewährt hat. Wechselt die Mehrheit, verbietet die nächste, was die vorige vorgeschrieben hat. Der Politiker bestellt beim Geistesleben, was er braucht, und würzt die Bestellung mit den Interessen seiner Geldgeber.
        text: >
          Wo das gesunde Geistesleben dem Recht die Erfahrung von Menschen liefert, die in der Sache selbst stehen, liefert das kranke ihm Überzeugungen — und die brauchen keine Erfahrung, sondern eine Mehrheit. Das Gesetz entsteht dann nicht aus dem, was sich am einzelnen Fall bewährt hat, sondern aus dem, was sich durchsetzen lässt: Kompromisse zwischen Fraktionen, Gefälligkeiten zwischen Akteuren, Abhängigkeiten von Geldgebern, Lobbyisten und Koalitionspartnern. Ob sich die neue Norm bewährt hat, prüft niemand; es genügt, dass genug Stimmen sie tragen. Was gestern noch Meinung war, ist morgen Vorschrift — und gilt auch für die, die sie nie geteilt haben. Wechselt die Mehrheit, verbietet die nächste per Erlass, was die vorige vorgeschrieben hat — nicht weil sich die Erfahrung geändert hat, sondern weil sich die Machtverhältnisse verschoben haben. Beide greifen nach demselben Hebel: dem Leben der anderen. Und die Richtung ist umgekehrt: Statt aus dem Geistesleben das Gesetz zu empfangen, das am besten zu den Menschen passt, bestellt der Politiker beim Geistesleben, was er braucht — und würzt die Bestellung mit eigenen Interessen und denen seiner Geldgeber.
      - schlagwort: Dienstweg
        schlagsatz: Die Hierarchie bestimmt, wer prüft – und mitredet.
        kurztext: >
          Üblich sind Aufträge, die die Hierarchie hinuntergehen, und Gremien, die sie hinauf absegnen: Referentenentwurf, Ressortabstimmung, geladene Sachverständige, Ausschuss nach Fraktionslinie, Gegenzeichnung von Referat zu Abteilung. Hier wählt nicht der Verfasser, wer prüft — die Hierarchie weist ihm den Prüfer zu. Geladen wird, wer ins Haus passt; gezeichnet wird, weil der Rang es verlangt. Der Verfasser darf nicht bestimmen, wen die Sache braucht; er muss vorlegen, wem der Dienstweg das Vorlegen zuweist.
        text: >
          Gesund bezieht, wer das Gesetz, das Urteil macht, das Vorhaben entwickelt, in seinem Tun alle ein, die er für wichtig hält. Der Pull Request geht an einen. Bis zur Einführung bleibt er frei, wen er hinzuzieht. Das ist heute nicht der Brauch. Üblich sind Aufträge, die die Hierarchie hinuntergehen, und Gremien, die sie hinauf absegnen: der Referentenentwurf aus dem Haus, die Ressortabstimmung, die Anhörung geladener Sachverständiger, die Ausschussberatung nach Fraktionslinie, die Gegenzeichnung von Referat zu Abteilung. Hier wählt nicht der Verfasser, wer prüft — die Hierarchie weist ihm den Prüfer zu. Geladen wird, wer ins Haus passt; abgestimmt wird nach Linie; gezeichnet wird, weil der Rang es verlangt. Gesetze, Urteile, Vorhaben durchlaufen diese Stationen. Der Verfasser darf nicht fragen, wen die Sache braucht; er muss vorlegen, wem der Dienstweg das Vorlegen zuweist.
        erklaerung: >
          Dienstweg ist das gekippte Miturteil. Gesund: Einbeziehen im Tun, Pull Request an einen, Freiheit bis zur Einführung. Krank: Auftrag von oben, Gremium nach oben. Die Hierarchie ersetzt die Einladung. Scheinprüfung und Gefälligkeitsgutachten gehören nicht hierher, sondern zur Desinformation.
      - schlagwort: Wortverstrickung
        schlagsatz: Gesetze, die absichtlich keiner versteht.
        kurztext: >
          Gesetze werden so komplex formuliert, dass nur Juristen, Beamte und Lobbyisten sie auslegen können. Das ist Machttechnik: Verstünde jeder die Texte, könnte jeder mitbestimmen. Formal darf jeder mitreden, faktisch redet nur mit, wer die Sprache der Paragraphen beherrscht. Die Auslegung wird zur eigentlichen Gesetzgebung. Das Recht kehrt seinen Adressaten den Rücken — geschrieben, um verwaltet, nicht um verstanden zu werden.
        text: >
          Gesetze werden bewusst so komplex und unverständlich formuliert, dass nur noch eine Kaste von Spezialisten — Juristen, Beamte, Lobbyisten — sie durchschauen und auslegen kann. Das ist kein handwerklicher Mangel, sondern eine Machttechnik: Verstünde jeder mündige Bürger die Texte, könnte jeder mitbestimmen. Die Unverständlichkeit zieht eine unsichtbare Grenze durch die Demokratie — formal darf jeder mitreden, faktisch redet mit, wer die Sprache der Paragraphen beherrscht. Wer sie nicht beherrscht, muss sich vertreten lassen und wird damit abhängig von denen, die er eigentlich kontrollieren sollte. Die Auslegung wird zur eigentlichen Gesetzgebung: Nicht was beschlossen wurde, gilt, sondern was die Ausleger daraus machen. So entsteht ein Recht, das seinen Adressaten den Rücken zukehrt — geschrieben nicht, um verstanden, sondern um verwaltet zu werden. Die Demokratie bleibt als Fassade stehen; dahinter regiert der Buchstabe.
        zitate:
          - >
            Man kann Prozesse erleben, deren Gang dem Laien ein Schaudern erregt
            über die Fülle der aufgewendeten juristischen Sophisterei und den
            doch der gelehrte Jurist als schlechtweg naturgemäß erklärt.
            (Rudolf Steiner, Methodische Grundlagen der Anthroposophie)
# Hier geht's weiter.
      - schlagwort: Vorverurteilung
        schlagsatz: Das Urteil fällt ohne Verfahren.
        kurztext: >
          Ein Missstand kommt offen auf den Tisch — das ist gesund. Die Krankheit beginnt einen Schritt nach der Offenlegung. Dann fällt man über den Menschen ein Urteil; daraus wird Strafe ohne Verfahren — Ausschluss, Entzug der Arbeit, Rufzerstörung. Das rechtskräftige Urteil dagegen steht erst am Ende des Verfahrens; bis dahin keine Nachteile. Auch der Schuldige hat ein Verfahren verdient, sonst hat es niemand.
        text: >
          Ein Missstand wird benannt und alles, was geschehen ist, kommt auf den Tisch — offen, ohne Zurückhalten, so wie es war. Das ist gesund: So arbeitet die Kultursphäre, und genau das muss sie tun. Die Krankheit beginnt einen Schritt nach der Offenlegung. Dann fällt man über den Menschen ein Urteil. Daraus wird die Forderung nach Handlung, dann die Strafe: Ausschluss, Entzug der Arbeit, Vernichtung des Namens. Ein Ruf wird zerstört nach einem Shitstorm von der einen Seite, nach einer Denunziation von der anderen — die Lager wechseln, das Verfahren bleibt aus. Niemand hat geladen, niemand gehört, niemand die Verhältnismäßigkeit geprüft. Die Überzeugung vollstreckt selbst, was sie erkannt zu haben glaubt. Dabei bleibt gleichgültig, ob der Vorwurf zutrifft — auch der Schuldige hat ein Verfahren verdient, sonst hat es niemand. Das rechtskräftige Urteil dagegen steht erst am Ende des Verfahrens: Erst dann dürfen Nachteile folgen. Bis dahin gibt es keine. Das Aufdecken war nötig; das Vorverurteilen und Ausgrenzen ohne Verfahren ist der Übergriff — krankes Geistesleben, das dem Recht die Arbeit wegnimmt.
      - schlagwort: Expertokratie
        schlagsatz: Experten entscheiden, was die Politiker wollen — Bürger schauen zu.
        kurztext: >
          Sachverstand wird zum Vorwand, demokratische Entscheidungen zu umgehen. Ernannte Experten entscheiden über das, was alle angeht — Alternativlosigkeit ist ihr Lieblingswort. Krank wird es, wenn der Sachverstand von der Öffentlichkeit abgekoppelt wird und die Ergebnisse nicht Schritt für Schritt in einem öffentlich zugänglichen Repository abgelegt werden. Gesund wirkt der Fachkundige, weil er es als seine Aufgabe erkannt hat und Zugang zu allen öffentlichen Informationen hat. Der Politiker entscheidet nur, wen er für die Menschen seines Gebiets für den fähigsten hält. Fachkundige machen Gesetze, Analysen, Restrukturierungen, Verfahren, Untersuchungen und Verordnungen — nicht die Politiker.
        text: >
          Sachverstand wird zum Vorwand, demokratische Entscheidungen zu umgehen. Eine Kaste ernannter „Experten" entscheidet über das, was alle angeht — Alternativlosigkeit ist ihr Lieblingswort —, und entzieht es der öffentlichen Kontrolle. Die Krankheit liegt nicht im Sachverstand selbst: Auch das gesunde Rechtsleben braucht die Fachkundigen. Krank wird es, wenn der Sachverstand von der Öffentlichkeit abgekoppelt wird und die Ergebnisse nicht Schritt für Schritt in einem öffentlich zugänglichen Repository abgelegt werden. Die Öffentlichkeit muss jeden seiner Schritte nachvollziehen können. Der gesunde Fachkundige wirkt, weil er es als seine Aufgabe erkannt hat und Zugang zu allen öffentlichen Informationen hat. Der Politiker entscheidet nur, welchen Fachkundigen er für die Menschen in seinem Gebiet für den fähigsten hält. Solche Fachkundigen machen nicht nur Gesetze, sondern auch Analysen und Restrukturierungen, entwerfen Verfahren, führen Untersuchungen und formulieren Verordnungen — nicht die Politiker. Der Expertokrat wirkt, weil er ernannt wurde — von denen, deren Entscheidungen er absichern soll. Nicht gewählt als der Fähigste für die Menschen eines Gebiets, sondern bestellt, um fertige Entscheide zu decken; seine Begründungen bleiben im Gutachten verschlossen. So verkehrt sich die Funktion: Statt dass Kompetenz dem Vertrauen dient, dient der Titel der Herrschaft. Und weil die Bürger den Unterschied spüren, trifft ihr wachsendes Misstrauen am Ende beide — die falschen Experten und die echten.
      - schlagwort: Desinformation
        schlagsatz: Macht verkleidet die Lüge als Wahrheit.
        kurztext: >
          Das kranke Geistesleben liefert dem Recht kontrollierte Information: Geheimdienstberichte, die niemand prüfen darf, Gefälligkeitsgutachten, deren Auftraggeber das Ergebnis bezahlt, Scheinprüfungen, die zum gewünschten Resultat führen oder nie stattfinden. Das Recht urteilt auf einer Grundlage, die es nicht durchschauen kann. Wer später echte Prüfung fordert, wird auf die erledigte verwiesen. Wo die Informationsgrundlage vergiftet ist, kann sich kein Rechtssinn bilden. Überzeugen kann ein solches Recht nicht mehr — nur noch gehorchen lassen.
        text: >
          Das kranke Geistesleben liefert dem Rechtsleben nicht Wahrheit, sondern kontrollierte Information: Geheimdienstberichte, die niemand prüfen darf, Deutungen, die als Tatsachen auftreten, Gefälligkeitsgutachten, deren Auftraggeber ihr Ergebnis bezahlt. Die Untersuchung wird angekündigt und findet nie statt, oder sie findet statt und führt zum gewünschten Ergebnis — das ist die Scheinprüfung. Der Gutachter ist ausgewählt, die Kommission besetzt, das Resultat vorab bekannt. Nach außen sieht alles aus wie Kontrolle; die Prüfung verbraucht den Namen der gegenseitigen. Wer künftig wissende Augen fordert, dem kann man auf die absolvierte Scheinprüfung verweisen. So immunisiert sich die Entscheidung doppelt: Sie ist gefällt, und sie ist „geprüft“. Das Recht urteilt dann auf einer Grundlage, die es nicht durchschauen kann — und die Bürger erst recht nicht. Damit ist die tiefste Schicht getroffen: Wo die Informationsgrundlage vergiftet ist, kann sich kein Rechtssinn bilden. Wer aus Einsicht handeln wollte, findet nichts, worin er Einsicht gewinnen könnte; ihm bleiben nur Glauben oder Gehorsam. Und wie auf der gesunden Seite der Rechtssinn das tragende Fundament aller anderen Aspekte ist, ist die Desinformation das Fundament aller anderen Pathologien: Die Vorschrift braucht sie, die Verhaltensnorm stützt sich auf sie, der Dienstweg beruft sich auf sie, die Wortverstrickung schützt sie, die Vorverurteilung verteidigt sie, die Expertokratie verwaltet sie. Ein Recht auf vergifteter Grundlage kann nur noch gehorchen lassen — überzeugen kann es nicht mehr. Das Vertrauen, das Prüfung stiften soll, wird planmäßig aufgezehrt — bis niemand mehr einer Untersuchung glaubt, auch keiner ehrlichen. Die Wahrheitsfindung stirbt nicht am Widerspruch, sondern an ihrer Inszenierung.
        erklaerung: >
          Desinformation ist nicht der Dienstweg. Der Dienstweg weist die Augen zu; Desinformation füllt, was sie sehen. Scheinprüfung und Gefälligkeitsgutachten gehören hierher: Die Untersuchung führt zum bestellten Ergebnis oder findet nie statt. Wer später echte Prüfung fordert, wird auf die erledigte verwiesen.
          
