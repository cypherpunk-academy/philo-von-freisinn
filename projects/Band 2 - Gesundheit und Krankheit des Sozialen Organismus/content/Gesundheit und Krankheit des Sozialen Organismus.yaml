  - id: dm-04g
    feld: 4
    richtung: "Recht -> Wirtschaft"
    pol: gesund
    titel: "Das Gesetz sichert den fairen Rahmen"
    aspekte:
      - schlagwort: Arbeit
        schlagsatz: Deine Arbeitskraft ist keine Ware.
        kurztext: >
          Das Rechtsleben bestimmt Art, Maß und Zeit der Arbeit, bevor irgendein Markt beginnt: unter Gleichen als Bürgern, nicht unter Ungleichen als Käufer und Verkäufer. Wer seine Arbeitskraft verkauft, verkauft ein Stück seiner selbst; darum nimmt das Recht den Menschen aus dem Warenverkehr. Auf dem Markt wird über Leistungen verhandelt, nie über den, der sie hervorbringt. Der Schutz wirkt nach zwei Seiten: Die Wirtschaft darf Arbeit nicht erzwingen, der Staat sie nicht zuweisen. Der Mensch gibt der Wirtschaft seine Leistung, nicht sich selbst.
        text: >
          Das Rechtsleben bestimmt, unter welchen Bedingungen gearbeitet wird — bevor irgendein Markt beginnt. Art, Maß und Zeit der Arbeit sind Rechtsfragen, keine Handelsfragen: Sie werden unter Gleichen als Bürgern geregelt, nicht unter Ungleichen als Käufer und Verkäufer. Denn wer seine Arbeitskraft verkaufen muss, verkauft immer ein Stück seiner selbst mit; darum nimmt das Recht den Menschen aus dem Warenverkehr heraus. Auf dem Markt wird dann nur noch über Leistungen und Erzeugnisse verhandelt — nie über den Menschen, der sie hervorbringt. Dieser Schutz wirkt nach zwei Seiten: Er verwehrt der Wirtschaft, Arbeit zu erzwingen, und dem Staat, Arbeit zuzuweisen. Was einer arbeitet, entscheidet er selbst — aus den Fähigkeiten, die das Geistesleben in ihm pflegt. Wie viel und wie lange gearbeitet wird, sichert das Recht; was die Arbeit hervorbringt, verwaltet die Wirtschaft. So steht der Mensch in der Wirtschaft, ohne ihr zu gehören: Er gibt ihr seine Leistung, nicht sich selbst.
        zitate: []
      - schlagwort: Boden
        schlagsatz: Der Boden ist keine Ware — was man an ihm arbeitet, schon.
        kurztext: >
          Durch den Boden läuft eine Trennlinie. Was Menschen an ihm gearbeitet haben — Rodung, Bauten —, ist wirtschaftlicher Wert. Was vor aller Arbeit da war — Naturgrundlage, Wasser, Rohstoffe —, ist niemandes Erzeugnis und keine Ware. Das Rechtsleben vergibt Nutzungsrechte nach Bedarf und Fähigkeit, nicht nach Geldmacht. Wer ausscheidet, erhält seine Arbeit vergütet, nicht den Boden. Horten kann keiner, was er nicht nutzt. Wie das Recht dem Geist die Tür zum Wissen öffnet, öffnet es der Wirtschaft den Zugang zur Natur: als Anspruch, nicht als Beute.
        text: >
          Durch den Boden läuft eine Trennlinie: Was Menschen an ihm gearbeitet haben — Rodung, Entwässerung, Bauten —, ist ein wirtschaftlicher Wert wie jeder andere und kann als Leistung vergütet werden. Aber was vor aller Arbeit da war — die Naturgrundlage selbst, das Wasser, die Rohstoffe im Grund —, ist niemandes Erzeugnis und kann darum nicht wie eines bewertet werden. Das Rechtsleben ordnet deshalb den Zugang: Es vergibt Nutzungsrechte nach Bedarf und Fähigkeit zur Nutzung, nicht nach Geldmacht. Wer Boden bearbeitet, erhält das Recht dazu — solange er es tut und so, dass die Grundlage für die Nachkommenden erhalten bleibt. Scheidet er aus, wird ihm seine Arbeit vergütet, nicht der Boden bezahlt: So ist der Spekulation entzogen, was niemand geschaffen hat — horten kann keiner, was er nicht nutzt. Wie das Recht dem Geistesleben die Tür zum Wissen öffnet, öffnet es der Wirtschaft den Zugang zur Natur: als gesicherten Anspruch, nicht als Beute des Stärkeren.
        zitate: []
      - schlagwort: Preis
        schlagsatz: Der Preis sagt, was es kostet — nicht, was es einbringt.
        kurztext: >
          Ein Preis ist richtig, wenn er dem Erzeuger erlaubt, dasselbe noch einmal zu tun — nicht mehr und nicht weniger. Gerechnet wird in der Assoziation: Wer verkauft, weist aus, woraus der Preis besteht; wer kauft, kann nachrechnen. Zins und Rente stehen nicht darin, denn sie decken nichts, was wiederholt werden müsste. Weil der Preis gerechnet wird, fällt die Preissteuerung weg. Wo zu viele dasselbe herstellen, läuft der Preis ins Leere; wo zu wenige stehen, bleibt Bedarf. Die Assoziation spricht es aus; wer hingeht, geht selbst. Wer am Preis dreht, kuriert am Thermometer statt an der Kälte.
        text: >
          Ein Preis ist richtig, wenn er dem Erzeuger erlaubt, dasselbe noch einmal zu tun — nicht mehr und nicht weniger. Das Rechtsleben sichert, dass dieser Grundsatz gilt und dass die Rechnung offenliegt. Gerechnet wird in der Assoziation, wo Erzeuger, Handel und Verwender zusammensitzen: Wer verkauft, weist aus, woraus sein Preis sich zusammensetzt — Lebensunterhalt, Erneuerung der Produktionsmittel, Vorleistungen und ein Spielraum für das Weiterkommen. Wer kauft, kann nachrechnen. Keine Stelle setzt Preise fest, keine Behörde und kein Kartell — aber jeder Preis lässt sich prüfen, weil seine Bestandteile offen sind. Zins und Rente stehen nicht darin, denn sie decken nichts, was wiederholt werden müsste. Weil der Preis gerechnet wird und nicht am Markt entsteht, fällt die Preissteuerung weg — und an ihre Stelle tritt eine andere Korrektur: die Bewegung von Menschen. Der Preis hängt an der Zahl derer, die auf einem bestimmten Feld arbeiten. Wo zu viele dasselbe herstellen, finden ihre Erzeugnisse keinen Bedarf mehr — der richtig gerechnete Preis läuft ins Leere. Wo zu wenige stehen, bleibt der Bedarf ungedeckt. Die Assoziation sieht beides, weil sie den Überblick über Erzeugung und Bedarf hat, und spricht es aus; wer hingeht, geht selbst. Das überschüssige Kapital dient dazu, den Arbeitern etwas beizubringen, um sie in andere Berufszweige überzuführen. Wer die Preise über den Geldwert korrigieren wollte, machte dasselbe, als brächte er bei Kälte die Thermometersäule zum Steigen: Er kurierte am Anzeiger statt an der Wirklichkeit.
        zitate: []
      - schlagwort: Eigentumszeit
        schlagsatz: Nutzen auf Zeit statt Besitz für immer.
        kurztext: >
          Werkstätten, Maschinen, Betriebe gehören dem, der sie fähig führt — und nur solange. Eigentum ist Verfügungsrecht auf Zeit, gebunden an Leistung. Die Arbeit erweist die Fähigkeit, das Geistesleben erkennt sie an, das Recht vollzieht den Übergang: nicht an den Erben, nicht an den Meistbietenden. Dem Ausscheidenden wird die eigene Arbeit vergütet; die Verfügung wandert unentgeltlich weiter, denn sie war nie Ware. Der Boden ist niemandes Werk; die Produktionsmittel sind das Werk vieler — darum fallen sie an die Gemeinschaft zurück, wenn keiner sie führt.
        text: >
          Werkstätten, Maschinen, Betriebe — die Produktionsmittel gehören dem, der sie fähig führt, und nur solange er sie fähig führt. Eigentum an ihnen ist kein ewiger Besitz, sondern ein Verfügungsrecht auf Zeit, gebunden an tatsächliche Leistung. Die Arbeit erweist die Fähigkeit, das Geistesleben erkennt sie an — und das Recht vollzieht dann den Übergang: Es bestimmt nicht, wer der Fähige ist, es sorgt nur dafür, dass die Verfügung ihm ungehindert zufällt statt dem Erben oder dem Meistbietenden. Dem Ausscheidenden wird vergütet, was er an eigener Arbeit eingebracht hat; die Verfügung selbst aber wandert unentgeltlich weiter, denn sie war nie Ware. Der Unterschied zum Boden liegt in der Herkunft: Der Boden ist niemandes Werk, die Produktionsmittel sind das Werk vieler — darum fallen sie an die Gemeinschaft zurück, wenn keiner sie führt. So bleibt Eigentum in Bewegung, weil es der Fähigkeit folgt statt dem Erbgang: Der Geist bestimmt, das Recht vollzieht.
        zitate: []
      - schlagwort: Vertrag
        schlagsatz: Das Recht bindet, ohne zu bestimmen.
        kurztext: >
          Verträge sind das Rückgrat des Wirtschaftslebens: Was vereinbart ist, gilt. Aber was vereinbart wird — Preise, Mengen, Wege —, bestimmt das Recht nicht. Das entscheiden die Assoziationen, in denen Erzeuger, Handel und Verwender gemeinsam urteilen. Das Recht reicht den leeren Vertrag, die Assoziation schreibt hinein. Eine Grenze bleibt: Das Recht selbst ist unverkäuflich — kein Gesetz gegen Geld, kein Amt für Vermögen; und das Geistige ebenso: kein Schulplatz nach Kontostand. Innerhalb dieser Grenze verhandelt die Wirtschaft frei; außerhalb gilt: nicht verhandelbar.
        text: >
          Verträge sind das Rückgrat des Wirtschaftslebens: Lieferungen, Abnahmen, Preise — alles beruht darauf, dass Abmachungen halten. Das Rechtsleben verleiht ihnen diese Verbindlichkeit: Was vereinbart ist, gilt, und wer sich nicht daran hält, wird daran gehalten. Aber was vereinbart wird — Preise, Mengen, Qualitäten, Wege —, bestimmt das Recht nicht. Das entscheiden die Beteiligten selbst: die Erzeuger-Verwender-Gemeinschaften (Assoziationen), in denen die, die herstellen, handeln und verbrauchen, gemeinsam urteilen, was ein Erzeugnis wert ist und wohin es gehen soll. So wie die Mittel gesichert vom Recht ins Geistesleben übergehen, geht die verbindliche Form vom Recht in die Wirtschaft über: Das Recht reicht den leeren Vertrag, die Assoziation schreibt hinein. Kein Preis wird verordnet, keiner diktiert — aber jeder vereinbarte gilt. Dabei kennt der Vertrag eine Grenze: Das Recht selbst ist unverkäuflich — kein Gesetz gegen Geld, kein Urteil gegen Zahlung, kein Amt für Vermögen; und das Geistige ist es ebenso: kein Schulplatz nach Kontostand, keine Diagnose nach Zahlungskraft. Innerhalb dieser Grenze verhandelt die Wirtschaft frei; außerhalb gilt: nicht verhandelbar.
        zitate: []
      - schlagwort: Haftung
        schlagsatz: Wer verursacht, trägt die Folgen.
        kurztext: >
          Was die Wirtschaft hervorbringt, wirkt über den Kauf hinaus: verbrauchte Natur, belastete Gesundheit, Abfall, der bleibt. Das Rechtsleben sichert, dass diese Folgen bei dem bleiben, der sie verursacht. Erst die Haftung macht den Preis wahr: Ein Erzeugnis, dessen Schäden andere tragen, ist nicht billig, sondern unbezahlt. Was sich der Prüfung entzieht, entzieht sich der Verbesserung; was sich der Haftung entzieht, entzieht sich der Wahrheit. Das Recht schreibt nicht vor, was erzeugt wird — aber es sorgt dafür, dass keine Rechnung offen bleibt.
        text: >
          Was die Wirtschaft hervorbringt, wirkt über den Kaufakt hinaus: verbrauchte Natur, belastete Gesundheit, Abfall, der bleibt. Das Rechtsleben sichert, dass diese Folgen bei dem bleiben, der sie verursacht — sie dürfen nicht auf die Allgemeinheit, die Nachbarn oder die Kommenden abgewälzt werden. Erst die Haftung macht den Preis wahr: Ein Erzeugnis, dessen Schäden andere tragen, ist nicht billig, sondern unbezahlt. Hier findet die Produktinformation, die das Recht dem Geistesleben öffnet, ihr Gegenstück: Dort wird sichtbar, wie etwas hergestellt wird — hier wird getragen, was die Herstellung kostet. Was sich der Prüfung entzieht, entzieht sich der Verbesserung; was sich der Haftung entzieht, entzieht sich der Wahrheit. Das Recht schreibt der Wirtschaft nicht vor, was sie erzeugt und wie — aber es sorgt dafür, dass keine Rechnung offen bleibt. So kann die Wirtschaft frei wirtschaften, ohne auf Kosten derer zu leben, die nicht mitverhandeln.
        zitate: []
      - schlagwort: Einspruch
        schlagsatz: Kein Missstand bleibt verborgen.
        kurztext: >
          Wirtschaft beruht auf Vertrauen, und Vertrauen braucht Korrigierbarkeit. Darum garantiert das Rechtsleben jedem — Arbeiter, Verbraucher, Nachbar —, Missstände öffentlich zu machen, ohne Nachteil zu fürchten. Die Einwände werden dort erfasst, wo sie hingehören: am Erzeugnis, am Betrieb, am Verfahren — ohne Vorprüfung. Was die Assoziationen von innen leisten, leistet dieses Recht von außen: Es hält die Wirtschaft korrigierbar für die, die in ihren Verträgen nicht mit am Tisch sitzen.
        text: >
          Wirtschaft beruht auf Vertrauen, und Vertrauen braucht Korrigierbarkeit. Darum garantiert das Rechtsleben jedem — dem Arbeiter im Betrieb, dem Verbraucher am Produkt, dem Nachbarn an der Fabrik —, Missstände öffentlich zu machen, ohne Nachteil zu fürchten: Wer aufdeckt, wird geschützt, nicht verfolgt. Die Einwände werden dort sichtbar erfasst, wo sie hingehören — am Erzeugnis, am Betrieb, am Verfahren —, formal gesammelt, ohne Vorprüfung ihres Werts; so zeigt sich, was viele bewegt, ohne dass eine Instanz entscheidet, was gehört wird. Was die Assoziationen von innen leisten — den Bedarf wahrnehmen, den Mangel bemerken, die Preise berichtigen —, leistet dieses Recht von außen: Es hält die Wirtschaft korrigierbar für die, die in ihren Verträgen nicht mit am Tisch sitzen. So bleibt das Wirtschaftsleben in Bewegung und wirtschaftet nicht im Verborgenen — denn was niemand beanstanden kann, verbessert auch niemand.
