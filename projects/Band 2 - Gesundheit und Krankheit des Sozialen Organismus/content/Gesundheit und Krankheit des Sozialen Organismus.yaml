  - id: dm-03k
    feld: 3
    richtung: "Recht -> Geist"
    pol: krank
    titel: "Die Politik lenkt das Denken"
    aspekte:
      - schlagwort: Vorgabe
        schlagsatz: Der Plan greift dir ins Denken.
        kurztext: >
          Lehrinhalte werden verordnet, nicht in der Begegnung gefunden. Der Lehrplan legt fest, was ein Kind in welchem Jahr zu wissen hat — bevor der Lehrer dieses Kind je angeschaut hat. Inhalte wandern weiter, weil sie im Plan stehen, nicht weil sie tragen. Der Lehrer wird zum Vollzugsorgan von Papier. Das Rechtsleben, das nur den Schutzraum schaffen soll, bestimmt die Inhalte selbst. Die Freiheit, die es freigeben müsste, verwaltet es — und nennt die Verwaltung Bildung.
        text: >
          Lehrinhalte werden nicht in der Begegnung mit den Schülern und Studenten gefunden, sondern verordnet. Der Lehrplan legt fest, was ein Kind in welchem Jahr zu wissen hat — bevor der Lehrer dieses Kind je angeschaut hat. Manche Inhalte sind hundert Jahre alt und werden weitergereicht, weil sie im Plan stehen; niemand fragt mehr, ob sie noch tragen. Zum Beispiel wird die Mathematik der höheren Klassen nirgends im Leben gebraucht, Programmieren von Apps aber durchaus. Der Lehrer wird zum Vollzugsorgan von Papier, die Begegnung zur Durchführung, das Schuljahr zum Abarbeiten. Das Rechtsleben, das nur den äußeren Schutzraum schaffen soll, bestimmt hier die Inhalte selbst — es greift in das hinein, was allein zwischen Lehrendem und Lernendem entstehen kann. Der Schutzraum, den das Recht gewähren sollte, wird zur Anstalt: Die Freiheit, die es freigeben müsste, verwaltet es — und nennt die Verwaltung Bildung.
        zitate:
          - >
            Niemand gibt Vorschriften, der nicht gleichzeitig selbst im
            lebendigen Unterrichten und Erziehen drinnen steht. Kein Parlament,
            keine Persönlichkeit, die vielleicht einmal unterrichtet hat, aber
            dies nicht mehr selbst tut, sprechen mit. (Rudolf Steiner, Die
            Kernpunkte der sozialen Frage)
      - schlagwort: Vorenthaltung
        schlagsatz: Wissen ist Entgegenkommen — kein Anspruch.
        kurztext: >
          Was der Staat weiß, behandelt er als Eigentum. Auskunft wird zum Gnadenakt: Anträge, Gebühren, Fristen, am Ende Geschwärztes. Die Verzögerung ist Methode — was zu spät kommt, ändert nichts mehr. Auch Bildung wird zur Leistung, die gewährt und entzogen werden kann. Verborgen bleibt, wie entschieden wird: Maßstäbe, Algorithmen, „interner Vorgang“. Die Tür, die das Recht öffnen sollte, bewacht es — und das Denken hungert, ohne zu merken, dass es hungert.
        text: >
          Was der Staat weiß, behandelt er als sein Eigentum. Auskunft wird zum Gnadenakt: Wer wissen will, was mit öffentlichen Mitteln, in öffentlichem Auftrag, über ihn selbst entschieden wurde, stellt Anträge, zahlt Gebühren, wartet Fristen ab, die verstreichen, und erhält am Ende Geschwärztes. Aus Wochen werden Monate, aus Monaten Jahre — die Verzögerung ist keine Panne, sondern Methode: Was zu spät kommt, kann nichts mehr ändern. Auch Bildung wird nicht als Anspruch behandelt, der jedem zusteht, weil er Mensch ist, sondern als Leistung, die gewährt, bemessen und entzogen werden kann. Verborgen bleibt nicht nur, was geschah, sondern auch, wie entschieden wird: nach welchen Maßstäben eine Behörde urteilt, warum ein Antrag abgelehnt wurde, wie ein Algorithmus sortiert — Dienstgeheimnis, Betriebsgeheimnis, „interner Vorgang". Sperrfristen reichen über die Lebenszeit der Beteiligten hinaus; Ausschüsse werden belogen; was für die Öffentlichkeit ist, bleibt verschlossen. Das Erkennen lebt vom Wirklichen — es kann nur verarbeiten, was ihm gegeben wird. Die Tür, die das Recht öffnen sollte, bewacht es — und das Denken hungert, ohne zu merken, dass es hungert.
      - schlagwort: Vermessung
        schlagsatz: Gleiches Raster für verschiedene Menschen.
        kurztext: >
          Die Verwaltung will alle Schulen angleichen: Module, Punkte, Raster, Abschlüsse. Was im Recht Tugend ist — Gleichheit, Ordnung — wird im Geistesleben zum Gift. Geprüft wird mit gleichen Fragen für alle, ohne Hilfsmittel, ohne Zusammenarbeit; hier heißt sie Betrug. Ob einer etwas verstanden hat, zeigt sich im Leben — die Prüfung zeigt, wie gut er für Prüfungen trainiert. Fähigkeit ist nicht mehrheitsfähig. Gemessen wird nicht, was einer kann, sondern wie genau er ins Raster passt.
        text: >
          Die Verwaltung will alle Schulen aneinander angleichen: Vergleichbarkeit, Vermessung, einheitliche Module, Punkte, Raster, Abschlüsse. Was im Rechtsleben Tugend ist — Gleichheit, Verlässlichkeit, Ordnung — wird im Geistesleben zum Gift: Die Ideale der einen Sphäre zerstören die Freiheit der anderen. Geprüft wird entsprechend: gleiche Fragen für alle, ausgedachte Aufgaben statt Lebensprüfung, feste Zeit, keine Hilfsmittel — und vor allem keine Zusammenarbeit, obwohl sie das Wichtigste im sozialen Miteinander ist; hier heißt sie Betrug. Ob ein Mensch etwas verstanden hat, zeigt sich daran, was er damit im Leben anfangen kann — im Werkstück, im Gespräch, in der bewältigten Situation. Stattdessen zeigt die Prüfung nur, wie gut einer für Prüfungen trainiert. Dahinter steckt ein tieferer Fehler: Im Geistesleben darf nicht abgestimmt werden — Fähigkeit ist nicht mehrheitsfähig, und sie wird es nicht dadurch, dass man sie zur Wahl stellt. So kippt die Gleichheit der Voraussetzungen in die Gleichheit der Formen: Gemessen wird nicht, was einer kann, sondern wie genau er ins Raster passt.
      - schlagwort: Goldener Zügel
        schlagsatz: Wer zahlt, bestimmt.
        kurztext: >
          Die Mittel kommen aus der Staatskasse — und mit ihnen die Bedingungen. Bewilligt wird, was ins Programm passt; das Programm schreibt die zahlende Instanz. Das Geistesleben lernt zu beantragen, was bewilligt wird, statt zu tun, was nötig ist. Die vorauseilende Anpassung braucht keinen Zensor mehr. Die Stiftung treibt es auf die Spitze: Ein Verstorbener gibt Vorschriften, die Stiftungsaufsicht vollstreckt den Willen des Toten. Was als Schenkung frei machen sollte, wird zur Leine.
        text: > 
            Die Mittel kommen aus der Staatskasse — und mit ihnen die Bedingungen. Fördertöpfe, Zweckbindungen, Anträge, Evaluationen, Zielvereinbarungen: Bewilligt wird, was ins Programm passt, und das Programm schreibt die zahlende Instanz. Welche Forschung förderfähig ist, welche Kunst unterstützt, welche Schule genehmigt wird, entscheidet nicht das Geistesleben aus seinen eigenen Notwendigkeiten, sondern die Behörde aus den ihren. So wird das Geistesleben zum Antragsteller: Es lernt zu beantragen, was bewilligt wird, statt zu tun, was nötig ist — und richtet sich innerlich nach dem Geldgeber aus, lange bevor der eine Auflage ausspricht. Die vorauseilende Anpassung ist die feinste Form der Herrschaft: Sie braucht keinen Zensor mehr. Die staatlich anerkannte Stiftung treibt dieses Prinzip auf die Spitze: Ein Verstorbener gibt dem Geistesleben Vorschriften — ohne selbst in der lebendigen Arbeit zu stehen, ohne je widerlegt werden zu können. Die Stiftungsaufsicht prüft nicht, ob gut gefördert wird, sondern ob der Wille des Toten vollstreckt wird; sie ist nicht das Korrektiv der Vergangenheit, sondern ihr Vollstrecker. Was als Schenkung frei machen sollte — Mittel, die fließen, ohne zu diktieren —, wird zur Leine: Sie ist lang genug, um Bewegung zu erlauben, und kurz genug, um die Richtung zu bestimmen.
        zitate:
          - >
            Diese Schrift muß die heute wenig beliebte Aufgabe übernehmen, zu
            zeigen, daß die Verworrenheit unseres öffentlichen Lebens von der
            Abhängigkeit des Geisteslebens vom Staate und der Wirtschaft
            herrührt. [...] Die weitere Beibehaltung dieses Zustandes ist aber
            ein schwerer sozialer Irrtum. (Rudolf Steiner, Die Kernpunkte der
            sozialen Frage)
      - schlagwort: Überwachung
        schlagsatz: Wer mitgelesen wird, denkt leiser.
        kurztext: >
          Die Privatsphäre ist die Grenze, an der die Zuständigkeit des Rechts endet. Genau hier kehrt es sich um: Register, Scoring, Vorratsdaten, Kameras, Hintertüren in der Verschlüsselung. Gläsern ist der Bürger, verschlossen die Macht. Ein Gedanke braucht das Unbeobachtete, um zu reifen. Wer weiß, dass mitgelesen wird, denkt vorsichtiger, glatter, unverfänglicher. Verboten wird nichts — und doch bleibt ungedacht, was sich nur in der Vertraulichkeit hervorwagt.
        text: >
          Die Privatsphäre des Einzelnen ist der Bereich, den das Recht vor Einblick schützen soll — die Grenze, an der seine Zuständigkeit endet. Genau hier kehrt es sich um: Register, Meldepflichten, Scoring, Datenabgleich, Vorratsdatenspeicherung, und noch perfider: Kameraüberwachung, Trojapferde und Hintertüren in der Verschlüsselung, die selbst das vertrauliche Wort öffnen. Was schützen soll, durchleuchtet. Gläsern ist der Bürger, verschlossen die Macht: die exakte Umkehrung dessen, was ein gesundes Rechtsleben sichert. Das Geistesleben verliert damit seinen Keimraum. Ein Gedanke braucht das Unbeobachtete, um zu reifen: das Gespräch unter vier Augen, den Brief, den Entwurf, der noch irren darf. Wer weiß, dass mitgelesen wird, denkt anders — vorsichtiger, glatter, unverfänglicher. Verboten wird nichts, und doch bleibt ungedacht, was sich nur im Schutz der Vertraulichkeit hervorwagt.
      - schlagwort: Weisungsjustiz
        schlagsatz: Der Richter spricht, was der Dienstherr duldet.
        kurztext: >
          Der Richter soll aus Sachkenntnis urteilen. Der Staat macht ihn zum Beamten: Laufbahn statt Urteilskraft, weisungsgebundene Staatsanwaltschaft, Versetzung für unbequeme Urteile, Beförderung für erwünschte. Die Wahl folgt dem Parteibuch, nicht dem Zutrauen derer, die das Urteil tragen müssen. Das Richten wird zum Verwaltungsakt. Was Geltung und Vollzug hinzufügen sollte, entzieht dem Urteil die Freiheit, aus der es wächst — und nennt die Abhängigkeit Unabhängigkeit.
        text: >
          Der Richter soll aus Sachkenntnis und persönlicher Kenntnis urteilen — eine innere Angelegenheit des Geisteslebens. Doch der Staat macht ihn zum Beamten: verbeamtet, in Laufbahnen eingesperrt, die der Gehorsam bestimmt statt die Urteilskraft. Die Staatsanwaltschaft ist weisungsgebunden; der Minister kann anordnen, welche Fälle verfolgt und welche fallengelassen werden. Wer unbequem urteilt, wird versetzt; wer erwünscht urteilt, befördert. Die Wahl der Richter folgt dem Parteibuch, nicht dem Zutrauen derer, die ihr Urteil tragen müssen. So wird das Richten, das eine freie geistige Tat sein sollte, zum Verwaltungsakt: Das Urteil trägt die Handschrift des Dienstherrn, nicht des Urteilenden. Was das Rechtsleben dem Geistesleben hinzufügen sollte — Geltung und Vollzug —, kehrt sich um: Es entzieht dem Urteil die Freiheit, aus der allein es wachsen kann, und nennt die Abhängigkeit Unabhängigkeit.
      - schlagwort: Zensur
        schlagsatz: Wer nicht gehört wird, verstummt.
        kurztext: >
          Der Einwand hat seinen vorgeschriebenen Weg — und der führt im Kreis. Die Beschwerde geht an die Stelle, über die sie sich beschwert; die Dienstaufsicht beaufsichtigt sich selbst. Zehntausend gleiche Einwände bleiben zehntausend Einzelvorgänge. Wo öffentlich kommentiert werden darf, geschieht es nach Vorprüfung: Freigegeben wird, was nicht stört. Das Geistesleben verliert Korrektur und Widerspruch nicht durch ein Verbot, das man anklagen könnte, sondern durch Zermürbung, die keinen Täter kennt.
        text: >
          Der Einwand hat seinen vorgeschriebenen Weg — und der führt im Kreis. Die Beschwerde geht an die Stelle, über die sie sich beschwert; die Dienstaufsicht beaufsichtigt sich selbst. Der Eingang wird bestätigt, die Sache versandet — nicht durch Verbot, sondern durch Verfahren. Nichts wird gesammelt, nichts bleibt sichtbar: Zehntausend gleiche Einwände bleiben zehntausend Einzelvorgänge, und niemand erfährt je, was viele bewegt. Wo öffentlich kommentiert werden darf, geschieht es nach Vorprüfung: Freigegeben wird, was nicht stört — gelöscht, was unbequem ist. Die Plattform, die jedem eine Stimme verspricht, entscheidet zugleich, welche Stimmen gehört werden; der Staat setzt die Regeln, der Betreiber vollzieht sie. Wer keinen Namen trägt, spricht ungehört; wer einen trägt, spricht auf Bewährung. So verliert das Geistesleben das, wovon es lebt — Korrektur und Widerspruch — nicht durch eine Unterdrückung, die man anklagen könnte, sondern durch Zermürbung, Vorprüfung und Unsichtbarkeit, die keinen Täter kennen.

