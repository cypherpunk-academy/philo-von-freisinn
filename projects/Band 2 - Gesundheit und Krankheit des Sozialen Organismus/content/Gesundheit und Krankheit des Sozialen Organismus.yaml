  # FELD 6 — WIRTSCHAFT → GEIST
  # ══════════════════════════════════════════════════════════════════════

  - id: dm-06g
    feld: 6
    richtung: "Wirtschaft -> Geist"
    pol: gesund
    titel: "Die Wirtschaft versorgt den Geist"
    aspekte:
      - schlagwort: Unterhalt
        schlagsatz: Wer lehrt, muss essen.
        kurztext: >
          Lehrer, Forscherinnen, Künstler stellen kein Brot her — und leben doch von alledem. Die Wirtschaft versorgt sie mit dem Notwendigen, damit sie tun können, was sonst niemand tut. Das ist kein Lohn für gelieferte Ware, denn was der Geist hervorbringt, lässt sich nicht bestellen und nicht aufwiegen. Eine Gemeinschaft trägt ihre Geistesarbeiter, wie ein Bauer sein Saatgut beiseitelegt: Es fehlt am Tisch, aber ohne dieses Fehlen gäbe es keine nächste Ernte. Die Kraft, die der Kampf ums Auskommen verzehrt, fehlt der eigentlichen Arbeit.
        text: >
          Lehrer, Forscherinnen, Künstler und Therapeuten stellen kein Brot her, keine Kleidung, kein Haus – und doch leben sie von alledem. Was für die Träger des Rechts gilt, gilt für die Arbeiter des Geistes genauso: Die Wirtschaft versorgt sie mit dem Notwendigen, damit sie tun können, was sonst niemand tut. Diese Versorgung ist kein Lohn für gelieferte Ware, denn was der Geist hervorbringt, lässt sich nicht bestellen und nicht aufwiegen – sie ist die Voraussetzung dafür, dass überhaupt etwas hervorgebracht werden kann. Eine Gemeinschaft trägt ihre Geistesarbeiter, wie ein Bauer sein Saatgut beiseitelegt: Es fehlt am Tisch, aber ohne dieses Fehlen gäbe es keine nächste Ernte. Wer geistig arbeitet, soll nicht nebenher um das tägliche Auskommen kämpfen müssen – denn die Kraft, die dieser Kampf verzehrt, fehlt der eigentlichen Arbeit. So beginnt die Versorgung des Geistes am Einfachsten und Konkretesten: bei denen, die ihn tragen.
        zitate: []
      - schlagwort: Werk- und Wirkstätten
        schlagsatz: Der Geist braucht Dach und Werkzeug.
        kurztext: >
          Denken kann man überall — Forschen braucht ein Labor, Lehren ein Schulhaus, Kunst eine Bühne. Das Geistesleben ist auf Orte und Werkzeuge angewiesen, die es nicht selbst herstellt. Die Wirtschaft baut und erhält sie. Das Wie des Bauens verantwortet sie aus eigener Sachkenntnis; was in den Räumen geschieht, bestimmt allein das Geistesleben. Kein Hörsaal trägt die Bedingung seines Stifters in sich. Die Wände sind wirtschaftliches Werk, der Raum dazwischen ist frei. Die Wirtschaft gibt dem Geist eine Herberge — und betritt sie nur als Gast.
        text: >
          Denken kann man überall – aber Forschen braucht ein Labor, Lehren ein Schulhaus, Heilen eine Praxis, Kunst ein Atelier und eine Bühne. Das Geistesleben ist auf Orte und Werkzeuge angewiesen, die es nicht selbst herstellen kann: Gebäude, Instrumente, Bücher, Rechner, Bühnen. Die Wirtschaft baut und erhält sie – das ist ihre eigene Kompetenz: bauen, ausstatten, instand halten. Die Verantwortung ist dabei klar geteilt. Das Wie des Bauens verantwortet die Wirtschaft aus eigener Sachkenntnis. Aber was in den Räumen geschieht – wie gelehrt, was erforscht, was gespielt wird – das bestimmt allein das Geistesleben. Kein Hörsaal trägt die Bedingung seines Stifters in sich, kein Labor die Erwartung eines bestimmten Ergebnisses. Die Wände sind wirtschaftliches Werk, der Raum dazwischen ist frei. So gibt die Wirtschaft dem Geist eine Herberge – und betritt sie nur als Gast, nicht als Hausherr.
        zitate: []
      - schlagwort: Verlässlichkeit
        schlagsatz: Getragen wird in Jahren, nicht in Stunden.
        kurztext: >
          Geistige Arbeit lässt sich nicht in Stundenzettel pressen. Die Wirtschaft bestimmt nicht, wie ein Geistesarbeiter seine Zeit einteilt — das ist Sache des sich selbst verwaltenden Geisteslebens. Was sie leisten muss: die Versorgung dauerhaft sicherstellen, ohne zu bewerten, ob dieses Jahr etwas hervorbringt. Was von außen wie Stillstand aussieht, kann innere Reifung sein. Wer nicht weiß, ob er im nächsten Jahr noch arbeiten kann, hat keine Muße, sondern eine Frist. Ob eine Arbeit fruchtbar war, zeigt sich in der freien Aufnahme durch die Fachgenossen. Die Wirtschaft trägt die Zeit — das Urteil über die Zeit trägt der Geist.
        text: >
          Geistige Arbeit lässt sich nicht in Zeitkontingente pressen. Erkenntnis reift nicht im Takt der Stundenzettel, und ein Gedanke, der etwas verändert, kommt nicht nach Fahrplan. Deshalb kann die Wirtschaft nicht bestimmen, wie ein Geistesarbeiter seine Zeit einteilt. Das ist allein Sache des sich selbst verwaltenden Geisteslebens. Was die Wirtschaft leisten kann und muss, ist etwas anderes: Sie kann die Versorgung dauerhaft sicherstellen. Sie gibt nicht nur das tägliche Brot, sondern die Gewissheit, dass der Geistesarbeiter auch morgen forschen kann – ohne zu bewerten, ob seine Arbeit in diesem Jahr etwas hervorbringt. Dieses Urteil steht ihr nicht zu, denn ihre Maßstäbe greifen hier nicht. Was von außen wie Stillstand aussieht, kann innere Reifung sein. Genau weil die Wirtschaft nicht beurteilen kann, was fruchtbar ist, muss ihre Unterstützung verlässlich sein. Wer nicht weiß, ob er im nächsten Jahr noch arbeiten kann, hat keine Muße, sondern eine Frist. Diese Verlässlichkeit ist keine Gnade, sondern Pflicht: Die Wirtschaft lebt von den Erkenntnissen, die im Geistesleben heranreifen. Ob eine Arbeit fruchtbar war, zeigt sich allein in der freien Aufnahme durch die Fachgenossen. Die Wirtschaft trägt die Zeit – das Urteil über die Zeit trägt der Geist.
        zitate: []
      - schlagwort: Gabe
        schlagsatz: Mit der Gabe endet der Anspruch.
        kurztext: >
          Das Geistesleben lässt sich nicht nach Marktgesetzen organisieren; seine Finanzierung ist Schenkungsgeld: Mittel ohne vereinbarte Gegenleistung. Das Rechtsleben sichert den Zufluss; das Geben ist wirtschaftliche Tat. Mit der Gabe endet jeder wirtschaftliche Anspruch — wohin die Mittel fließen, entscheidet das Geistesleben allein. Es prüft sich selbst: durch die Aufnahme derer, die lernen, und durch das Urteil der Fachgenossen. Wem niemand zuhört, den trägt auch das freieste Geistesleben nicht. Wo freie Arbeit blüht, wird gern geschenkt; wo die Gaben versiegen, verkümmert die Arbeit. Aus Zahlungsmittel wird Möglichkeit.
        text: >
          Das Geistesleben lässt sich nicht nach Marktgesetzen
          organisieren; seine Finanzierung muss das Schenkungsgeld sein:
          Mittel, die gegeben werden, ohne dass eine Gegenleistung
          vereinbart wäre — Stiftungen, Mäzenatentum, freie Beiträge.
          Das Rechtsleben sichert den Zufluss rechtlich; das eigentliche
          Geben aber ist wirtschaftliche Tat. Hier liegt die Übergabe des
          Feldes: Mit der Gabe endet jeder wirtschaftliche Anspruch —
          wohin die Mittel fließen, entscheidet das Geistesleben allein.
          Das ist kein Freibrief, denn das Geistesleben prüft sich
          selbst: durch die freie Aufnahme derer, die lernen und sich
          anvertrauen, und durch das Urteil der Fachgenossen. Wem niemand
          zuhört, den trägt auch das freieste Geistesleben nicht.
          Zugleich ist die Schenkung mehr als eine individuelle Geste:
          Geistesleben und Schenkungsstrom nähren einander im Kreislauf.
          Wo freie Arbeit blüht, wird gern geschenkt; wo die Gaben
          versiegen, verkümmert die Arbeit — und mit ihr der Anlass zu
          geben. An diesem Puls lesen die Assoziationen die Gesundheit
          des Ganzen ab: Aus Zahlungsmittel wird Möglichkeit, und der
          Strom selbst wird zum Lebenszeichen.
        zitate: []
      - schlagwort: Verzicht
        schlagsatz: Wer bestellt, bekommt nur Bestelltes.
        kurztext: >
          Dass mit der Gabe der Anspruch endet, muss im Geber errungen werden. Die Versuchung liegt nahe: Themen vorschlagen, Fristen setzen, Nützlichkeit rechnen. Wer bestellt, bekommt Auftragsarbeit — nie mehr, als der Besteller sich vorstellen konnte. Freie Forschung findet, wonach niemand fragte; bestellte Forschung findet, was erwartet wurde, und zur Not auch dann, wenn es nicht stimmt. Was die Wirtschaft dem Recht gegenüber als Enthaltung übt, übt sie hier als Verzicht: geben, ohne den Inhalt zu lenken. Beim Recht lockt die Macht, beim Geist der Nutzen — und der Verzicht auf den nahen Nutzen ist die Bedingung des fernen.
        text: >
          Dass mit der Gabe der Anspruch endet, ist schnell gesagt — im
          Geber muss es errungen werden. Denn die Versuchung liegt nahe:
          Themen vorschlagen, Ergebnisse erwarten, Fristen setzen, die
          Nützlichkeit rechnen. Der Verzicht darauf ist keine
          Großzügigkeit, sondern Klugheit: Wer bestellt, bekommt
          Auftragsarbeit — nützlich vielleicht, aber nie mehr, als der
          Besteller sich vorstellen konnte. Freie Forschung findet,
          wonach niemand fragte; bestellte Forschung findet, was erwartet
          wurde, und zur Not auch dann, wenn es nicht stimmt. Was die
          Wirtschaft dem Rechtsleben gegenüber als Enthaltung übt —
          zahlen, ohne den Rang zu wägen —, übt sie hier als Verzicht:
          geben, ohne den Inhalt zu lenken. Beide Male hält sie von innen
          die Grenze ein, die das Recht von außen zieht. Der Unterschied
          ist die Versuchung: Beim Recht lockt die Macht, beim Geist der
          Nutzen — und der Verzicht auf den nahen Nutzen ist die
          Bedingung des fernen.
