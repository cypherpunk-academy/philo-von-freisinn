      - schlagwort: Betriebsgeheimnis
        schlagsatz: Das Dach wird zum Deckel.
        kurztext: >
          Unternehmen entziehen Wissen der öffentlichen Prüfung, obwohl sie in Leben und Denken Dritter eingreifen: Chemikalien, Algorithmen, Wirkungsdaten. Das Patent zeigt wenigstens den Zaun; das Geschäftsgeheimnis hält den Geist in der Dunkelkammer. Steiner nannte die Technik einen durchsichtigen Kristall: Was wir selbst gebaut haben, überschauen wir ganz. Proprietäre Software erzeugt die Undurchsichtigkeit neu. Gesund baut die Wirtschaft die Orte des Geistes und betritt sie als Gast. Hier wird der Gast zum Hausherrn und schließt ab. Was niemand prüfen kann, ist keine Erkenntnis mehr, sondern Behauptung mit Marktzugang.
        text: >
          Unternehmen entziehen Wissen und Verfahren der öffentlichen Prüfung, obwohl sie in Leben und Denken Dritter eingreifen: Chemikalien in Produkten, Algorithmen, die den öffentlichen Diskurs sortieren, Sicherheits- und Wirkungsdaten. Das Patent zeigt wenigstens, was es einzäunt: Man sieht den Zaun und den Baum dahinter, nur pflücken darf man nicht. Doch auch hier wird das Ausschließen wertvoller als das Können — Patenttrolle, Patentdickichte, Sperrpatente auf Verfahren, die niemand nutzen soll. Das Geschäftsgeheimnis dagegen hält den Geist in der Dunkelkammer des Betriebs gefangen. Steiner nannte die Technik „einen durchsichtigen Kristall" — natürlich seelisch verstanden: Was wir selbst gebaut haben, überschauen wir ganz. Proprietäre Software erzeugt die Undurchsichtigkeit neu, die die Technik gerade überwunden hatte. In einem gesunden sozialen Leben baut und erhält die Wirtschaft die Orte des Geistes und betritt sie nur als Gast: Die Wände sind ihr Werk, der Raum dazwischen ist frei. Hier wird der Gast zum Hausherrn und schließt ab, was drinnen geschieht. Was niemand prüfen kann, kann niemand widerlegen — und was unwiderlegbar ist, ist keine Erkenntnis mehr, sondern Behauptung mit Marktzugang.
        zitate:
          - quelle: "GA 73a, S. 386 (17. Juni 1920)"
            text: "Jetzt ist es zum ersten Mal, daß wir vor einer Welt stehen, die nun gewissermaßen seelisch durchsichtig ist. Die Welt der Naturforschung ist in einer gewissen Weise seelisch undurchsichtig; man blickt nicht auf den Grund. Die Welt des Technischen ist so wie ein durchsichtiger Kristall — natürlich seelisch verstanden."
      - schlagwort: Kurzsichtigkeit
        schlagsatz: Gerechnet wird in Quartalen, nicht in Jahren.
        kurztext: >
          Verlage, Labels, Plattformen entscheiden nach Rendite, was öffentlich sichtbar wird. Das Werturteil über ein Werk fällt in der Kalkulation: Was sich nicht verkauft, existiert öffentlich nicht. Gesund zeigt sich Fruchtbarkeit in der freien Aufnahme; hier bewertet die Wirtschaft nach jedem Quartal — Auflage, Abruf, Verweildauer. Was wie Stillstand aussieht, könnte Reifung sein; die Kalkulation streicht beides. Wer nicht weiß, ob er im nächsten Jahr noch arbeiten kann, denkt nicht weiter, als die Förderperiode reicht. Gedanken, die länger brauchen, denkt dann niemand mehr.
        text: >
          Verlage, Labels, Plattformen und Kinoketten entscheiden nach Rendite, was öffentlich sichtbar wird. Das Werturteil über ein Werk — eine ureigene Sache des Geistes — fällt in der Kalkulation, nicht in der Begegnung: Was sich nicht verkauft, existiert öffentlich nicht. Damit maßt sich die Wirtschaft genau das Urteil an, das ihr nicht zusteht. Gesund zeigt sich die Fruchtbarkeit einer Arbeit allein in der freien Aufnahme durch die Menschen, die es brauchen, und die Wirtschaft trägt, ohne zu bewerten, ob dieses Jahr etwas hervorgebracht wurde. Hier bewertet sie nach jedem Quartal — und misst mit Maßstäben, die für geistige Arbeit blind sind: Auflage, Abruf, Verweildauer. Was von außen wie Stillstand aussieht, könnte innere Reifung sein; die Kalkulation kann den Unterschied nicht sehen und streicht beides. Ein Mensch, der im gleichen Fachgebiet arbeitet, könnte es sehen. So wird aus der Muße eine Frist: Wer nicht weiß, ob er im nächsten Jahr noch arbeiten kann, denkt nicht weiter, als die Förderperiode reicht. Und Gedanken, die länger brauchen, denkt dann niemand mehr.
        zitate: []
      - schlagwort: Rückkauf
        schlagsatz: Aus der Gabe wird eine Rechnung.
        kurztext: >
          Öffentlich finanzierte Forschung verschwindet hinter Bezahlschranken: Der Geist muss zurückkaufen, was er selbst hervorgebracht hat. Der Schenkungsstrom kehrt sich um. Wer ein Buch aus eigener Initiative mit Schenkgeld schreibt, ist für den Inhalt bereits getragen — Papier hat einen Preis, der Inhalt nicht. Der Verlag erwirbt Rechte oft umsonst, Gutachter arbeiten unbezahlt, die Bibliothek zahlt Lizenzen für Arbeiten ihrer eigenen Institute. Wer nicht zahlen kann, kann nicht anschließen. Aus dem Strom, der Leben trug, wird eine Mautstelle: Sie erzeugt nichts, sie steht im Weg und kassiert.
        text: >
          Öffentlich finanzierte Forschung verschwindet hinter Bezahlschranken kommerzieller Verlage — der Geist muss zurückkaufen, was er selbst hervorgebracht hat. Der Schenkungsstrom kehrt sich um: Statt in das Geistesleben zu fließen, fließen die Mittel aus ihm heraus. Beim Autor beginnt es: Wer ein Buch aus eigener Initiative mit Schenkgeld schreibt, ist für dieses Werk bereits getragen. Papier, Druck und Vertrieb haben ihren Preis, der Inhalt nicht: Das Urheberrecht schützt die Verbindung des Menschen mit seinem Werk, und ein Recht lässt sich nicht gegen Geld tauschen. Verlangt er trotzdem Geld dafür, ist das ein Übergriff: Aus dem Recht wird ein Zahlungsanspruch, und die getragene Arbeit wird zweimal bezahlt. Beim Verlag wird der Übergriff zum System: Er erwirbt die Rechte oft umsonst, Gutachter arbeiten unbezahlt, das Recht selbst wird verkauft, vererbt und bringt noch 70 Jahre nach dem Tod des Urhebers Ertrag. Die Bibliothek zahlt Lizenzen für Arbeiten ihrer eigenen Institute. Und die Schranke trennt: Wer nicht zahlen kann, kann nicht anschließen — die Wissenschaft ärmerer Länder arbeitet an Fragen, die anderswo längst beantwortet sind. Aus dem Strom, der Leben trug, wird eine Mautstelle: Sie erzeugt nichts, sie steht im Weg und kassiert.
        zitate: []
      - schlagwort: Bestellung
        schlagsatz: Bestellt wird die Frage — und die Antwort dazu.
        kurztext: >
          Konzerne finanzieren Forschung nach Profitlogik: Erforscht wird, was sich vermarkten lässt. Unbequeme Ergebnisse verschwinden in der Schublade, Zweifel wird industriell gesät. Das Geld diktiert die Fragen und die Antworten. Die Uni liefert Personal, keine Bildung — was sich nicht verwerten lässt, wird nicht gelehrt. Bestellte Forschung findet, was erwartet wurde, und zur Not auch dann, wenn es nicht stimmt. Wer gelernt hat, dass Studien käuflich sind, glaubt am Ende keiner mehr. Zurück bleibt eine Wissenschaft, die alles beweisen kann und darum nichts mehr.
        text: >
          Konzerne finanzieren Forschung nach Profitlogik: Erforscht wird, was sich vermarkten lässt, nicht was die Sache selbst oder der menschliche Bedarf fragt. Schwerer noch wiegt die zweite Stufe: Unbequeme Ergebnisse verschwinden in der Schublade, Studien werden zurückgehalten, Zweifel wird industriell gesät, neue Erfindungen können Märkte gefährden. Das Geld diktiert nicht nur die Fragen, sondern auch die Antworten. Das reicht bis in die Lehre: Die Uni liefert keine Bildung, sie liefert Personal — was sich nicht verwerten lässt, wird nicht gelehrt. Bestellte Forschung findet, was erwartet wurde, und zur Not auch dann, wenn es nicht stimmt. Der Schaden reicht über die einzelne Studie hinaus: Wo Zweifel planmäßig erzeugt wird, verliert auch die redliche Forschung ihre Wirkung — wer gelernt hat, dass Studien käuflich sind, glaubt am Ende keiner mehr. Die Krankheit trifft nicht nur, was erforscht wurde, sondern die Möglichkeit, überhaupt noch etwas zu glauben. Zurück bleibt eine Wissenschaft, die alles beweisen kann und darum nichts mehr.
        zitate: []
      - schlagwort: Vormund
        schlagsatz: Wer das Geld verwaltet, verwaltet den Geist.
        kurztext: >
          Stiftungsräte, Fördergremien, Vergabestellen entscheiden über geistige Arbeit, in der sie selbst nicht stehen. Das Urteil fällt nach Antragsprosa, Wirkungsindikatoren, strategischer Passung. Gesund entscheidet, wer die Sache kennt, weil er sie betreibt. In einer Stiftung entscheidet, wer das Geld kennt, weil er es verwaltet. Der Kapitalstock muss erhalten bleiben, also braucht es Rendite — ausgeschüttet werden nur die Erträge. Die Schenkung ist der nachrangige Zweck. Die Aufsicht prüft nicht, ob gut gefördert wird — sie prüft, ob das Geld noch da ist.
        text: >
          Stiftungsräte, Fördergremien, Vergabestellen — überall entscheiden Menschen über geistige Arbeit, in der sie selbst nicht stehen. Bei der Bestellung im nächsten Feld wird wenigstens offen gesagt, was verlangt wird; hier wird von außen beurteilt, was förderungswürdig ist, und das Urteil fällt nach Kriterien, die dem Feld fremd sind: Antragsprosa, Wirkungsindikatoren, strategische Passung. Gesund entscheidet über geistige Arbeit, wer selbst in ihr drinsteht — wer die Sache kennt, weil er sie betreibt oder aus eigener Erfahrung kennt. In einer Stiftung entscheidet, wer das Geld kennt, weil er es verwaltet. Das Geld wird dabei nicht hingegeben, sondern zurückgehalten: Der Kapitalstock muss erhalten bleiben, also braucht es Rendite, also muss das Vermögen in ertragbringenden Verhältnissen angelegt bleiben. Ausgeschüttet werden nur die Erträge — die Schenkung ist der nachrangige Zweck. Die Aufsicht prüft nicht, ob gut gefördert wird — sie prüft, ob das Geld noch da ist.
        zitate:
          - quelle: "GA 23/24"
            text: "Niemand gibt Vorschriften, der nicht gleichzeitig selbst in der lebendigen Arbeit drinsteht."
      - schlagwort: Berechnung
        schlagsatz: Gerechnet wird mit dem Menschen, nicht für ihn.
        kurztext: >
          Journalistische Inhalte richten sich nach Quote und Werbeumsatz, bis hin zur Plattform, deren Algorithmus nach Werbeertrag sortiert. Wer die Anzeigen bezahlt, bestimmt, was gesehen wird. Der Mensch ist nicht mehr der, für den gearbeitet wird, sondern das, womit gerechnet wird: nicht Leser, sondern Zielgruppe; nicht Gegenüber, sondern Verweildauer. Verkauft wird nicht ihm etwas — verkauft wird er. Am reinsten zeigt sich Brüderlichkeit, wo die Wirtschaft dem Geist gibt, der nichts tauschen kann; am schärfsten ihr Fehlen, wo genau dieser zur Ware gemacht wird.
        text: >
          Journalistische Inhalte richten sich nach Quote und Werbeumsatz statt nach Aufklärungswert, bis hin zur Plattform, deren Algorithmus allein nach Werbeertrag sortiert. „If you're not paying for it, you're not the customer; you're the product being sold", schrieb Andrew Lewis 2010. Wer die Anzeigen bezahlt, bestimmt, was gesehen wird — die Öffentlichkeit wird zur Reichweitenware. Damit ist die tiefste Schicht getroffen: Der Mensch ist nicht mehr der, für den gearbeitet wird, sondern das, womit gerechnet wird. Er ist nicht Leser, sondern Zielgruppe; nicht Gegenüber, sondern Verweildauer. Verkauft wird nicht ihm etwas — verkauft wird er. Und wie die Brüderlichkeit in einer gesunden Wirtschaft das Fundament ist, ohne das keine Struktur trägt, ist ihr Bruch hier das Fundament von Krankheiten: Die Überlastung lässt ihn allein, die Kurzsichtigkeit übersieht ihn, der Vormund verfügt über ihn, der Rückkauf kassiert ihn, die Bestellung nutzt ihn aus, das Betriebsgeheimnis verbirgt ihn. Wer rechnet, sieht keinen Bruder — er sieht einen Posten. Am reinsten zeigt sich Brüderlichkeit dort, wo die Wirtschaft dem Geist gibt, der nichts tauschen kann; am schärfsten zeigt sich ihr Fehlen dort, wo genau dieser zur Ware gemacht wird.
        zitate: []

