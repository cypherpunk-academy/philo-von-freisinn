      - schlagwort: Zugang
        schlagsatz: Wissen ist Anspruch, nicht Entgegenkommen.
        kurztext: >
          Das Rechtsleben sichert jedem Kind Schule und Studium als Anspruch, nicht als Gnade — unabhängig von Herkunft und Besitz; auch Eltern dürfen das nicht verweigern. Ebenso den Zugang zu den Informationen, die ein eigenes Urteil braucht: politisches Handeln, Herstellung der Dinge, was der Staat weiß. Wo Freigabe warten muss, sind die Fristen kurz. Gesetze, Urteile, Diagnosen, Algorithmen müssen in ihrem Wirken verstehbar sein — denn was verschlossen bleibt, entzieht sich der Prüfung. Das Recht verleiht kein Wissen, es öffnet die Tür.
        text: >
          Das Rechtsleben sichert jedem Kind und jedem Jugendlichen Schule und Studium — nicht als Pflicht, sondern als Anspruch: etwas, das jedem zusteht, weil er Mensch ist, unabhängig von Herkunft und Besitz. Und nicht einmal Eltern dürfen dem Kind das verweigern. Ebenso sichert es den Zugang zu allen Informationen, die für ein eigenes Urteil nötig sind: über politisches Handeln, über die Herstellung der Dinge, die du verwendest, über das, was der Staat weiß. Wo sofortige Freigabe nicht möglich ist, sind Verzögerungen begrenzt — Wochen, nicht Monate. Darüber hinaus sichert es die Einsicht in die Funktionsweise dessen, was das Zusammenleben bestimmt: Gesetze, Urteile, Baupläne, Diagnosen, Algorithmen müssen in ihrem Wirken verstehbar und veränderbar sein — denn was verschlossen bleibt, entzieht sich der Prüfung und damit der Verbesserung. Das Recht verleiht kein Wissen, es öffnet die Tür und macht sichtbar, was dahinter geschieht; was aus dem Zugang wird, entscheidet das freie Geistesleben.
