      - schlagwort: Schutzraum
        schlagsatz: Was reift, braucht Stille.
        kurztext: >
          Das Rechtsleben schützt den inneren Raum: den Brief, das Gespräch unter vier Augen, den Entwurf, der noch irren darf. Privatsphäre ist keine Ausnahme von der Offenheit, sondern ihr Gegenstück. Gläsern ist der Staat, geschützt der Bürger. Verschlüsselung und Briefgeheimnis sind Rechte, weil ein Gedanke das Unbeobachtete braucht, um zu reifen. Die Grenze liegt dort, wo etwas öffentlich wird: Das Denken davor gehört ihm allein.
        text: >
          Das Rechtsleben schützt den inneren Raum des Einzelnen: den Brief, das Gespräch unter vier Augen, den Entwurf, der noch irren darf. Privatsphäre ist keine Ausnahme von der Offenheit, sondern ihr Gegenstück — die Grenze, an der die Zuständigkeit des Rechts nach innen endet. Gläsern ist der Staat, geschützt der Bürger: Das Recht sorgt dafür, dass niemand mitliest, mithört oder aufzeichnet, was nicht für andere bestimmt ist. Verschlüsselung, Briefgeheimnis und Vertraulichkeit sind keine Zugeständnisse — sie sind Rechte, die das Geistesleben braucht, weil ein Gedanke das Unbeobachtete braucht, um zu reifen. Die Grenze liegt dort, wo etwas öffentlich wird: Erst wer seinen Beitrag einbringt, tritt ins Offene; das Denken davor gehört ihm allein.
