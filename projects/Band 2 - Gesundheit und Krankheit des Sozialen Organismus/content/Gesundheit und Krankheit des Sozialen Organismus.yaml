    pol: gesund
    titel: "Der Staat bewahrt die Freiheit des Einzelnen"
    aspekte:
      - schlagwort: Freiheit
        schlagsatz: Niemand greift dir ins Denken.
        kurztext: >
          Das Rechtsleben schützt die innere Freiheit nach zwei Seiten: gegen staatliche Bevormundung und gegen wirtschaftlichen Druck. Es bestimmt keine Inhalte — es schafft den äußeren Schutzraum, in dem geistige Arbeit ungehindert geschehen kann. Was du denkst, erkennst und gestaltest, bleibt dir und dem freien Geistesleben überlassen. Die Freiheit, die das Geistesleben braucht, ist kein Privileg, das es sich selbst verleiht, sondern ein garantiertes Recht: Das Rechtsleben stellt sie nicht her — es gibt sie frei.
        text: >
          Das Rechtsleben schützt deine innere Freiheit nach zwei Seiten: gegen staatliche Bevormundung und gegen wirtschaftlichen Druck. Es sorgt dafür, dass keiner dem anderen seine Gedanken aufzwingt und keiner dem anderen seine Arbeitskraft unterwirft. Dabei bestimmt es keine Inhalte — es schafft nur den äußeren Schutzraum, in dem geistige Arbeit ungehindert geschehen kann. Was du denkst, erkennst und gestaltest, bleibt allein dir und dem freien Geistesleben überlassen. So ist die Freiheit, die das Geistesleben braucht, kein Privileg, das es sich selbst verleiht, sondern ein garantiertes Recht: Das Rechtsleben stellt sie nicht her — es gibt sie frei.
