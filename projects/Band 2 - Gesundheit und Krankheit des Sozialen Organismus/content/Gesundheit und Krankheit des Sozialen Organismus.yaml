      - schlagwort: Mitreden
        schlagsatz: Kein Einwand geht verloren.
        kurztext: >
          Das Geistesleben lebt vom Einwand. Darum garantiert das Rechtsleben jedem, Ergebnisse dauerhaft zu kommentieren und Verbesserungen vorzuschlagen — ohne Vorprüfung. Ein Archiv urteilt nicht, es sammelt und macht sichtbar, was viele bewegt. Wer öffentlich einbringt, zeichnet mit seinem Namen: Autorschaft macht den Einwand verbindlich. Die Pflicht gilt für das, was jemand öffentlich einbringt, nie für das Denken davor. Was der Rechtssinn von innen leistet, leistet dieses Recht von außen.
        text: >
          Das Geistesleben lebt vom Einwand, von der Korrektur, vom Widerspruch — wer etwas verbessern will, muss gehört werden können. Darum garantiert das Rechtsleben jedem das Recht, Ergebnisse des Geisteslebens dauerhaft zu kommentieren und Verbesserungen vorzuschlagen — ohne Vorprüfung der Beiträge. Ein Archiv urteilt nicht, es sammelt: Es erfasst die Beiträge formal, bündelt sie technisch und macht sichtbar, was viele bewegt, ohne zu entscheiden, was richtig ist. Wer öffentlich einbringt, zeichnet mit seinem Namen — nicht weil der Staat es wissen will, sondern weil Verantwortung zur Freiheit gehört: Erst die Autorschaft macht den Einwand verbindlich und den Beitrag zurechenbar. Die Pflicht gilt für das, was jemand öffentlich einbringt, nie für das Denken davor — der Entwurf, der noch irren darf, bleibt geschützt. Was der Rechtssinn von innen leistet, leistet dieses Recht von außen: Es hält das Geistesleben in Bewegung, damit es nicht erstarrt.
