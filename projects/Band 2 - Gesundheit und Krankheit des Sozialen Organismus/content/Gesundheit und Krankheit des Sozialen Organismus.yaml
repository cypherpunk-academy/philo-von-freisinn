      - schlagwort: Chancen
        schlagsatz: Gleiche Voraussetzung für die eigene Entfaltung.
        kurztext: >
          Was im Geistesleben als Entfaltung geschieht, sichert das Rechtsleben als Bedingung: gleiche Zugangschancen zu Bildung und Kultur, unabhängig von Herkunft oder Einkommen — handwerklich, künstlerisch, organisatorisch, sozial. Zugang öffnet die Tür, Chancen ebnen den Weg dahinter: dass du nicht nur hineingelangst, sondern vorankommst. Das Recht gleicht die Startbedingungen aus, nicht die Ergebnisse. Die Verschiedenheit der Entfaltung bleibt Sache des Geisteslebens.
        text: >
          Was im Geistesleben als Entfaltung geschieht, sichert das Rechtsleben als Bedingung: gleiche Zugangschancen zu Bildung und Kultur, unabhängig von Herkunft oder Einkommen. Fähigkeiten meint dabei alle Kräfte der Seele — handwerkliche, künstlerische, organisatorische, technische, soziale. Der Unterschied zum Zugang liegt in der Richtung: Zugang öffnet die Tür, Chancen ebnen den Weg dahinter — dass du nicht nur hineingelangst, sondern darin auch vorankommst. Das Recht gleicht die Startbedingungen aus, nicht die Ergebnisse: Es wahrt die Gleichheit der Voraussetzungen, das Geistesleben die Verschiedenheit der Entfaltung.
