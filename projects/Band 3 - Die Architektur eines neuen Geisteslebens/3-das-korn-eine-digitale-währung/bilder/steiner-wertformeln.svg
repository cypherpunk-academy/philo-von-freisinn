<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Steiners zwei Wertformeln und der Bruch. Wert gleich Natur mal Arbeit verteuert und speist Warenmenge wie Geldmenge. Wert gleich Geist minus Arbeit verbilligt und speist nur die Warenmenge.">
  <rect width="760" height="470" fill="#23282a"/>

  <!-- Erste Formel: verteuert -->
  <text x="196" y="86" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="25" fill="#edeae1">Wert = Natur × Arbeit</text>
  <path d="M141 127 L141 110" stroke="#d9a441" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M136 118 L141 108 L146 119" stroke="#d9a441" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="155" y="124" font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#d9a441">verteuert</text>

  <!-- Zweite Formel: verbilligt -->
  <text x="564" y="86" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="25" fill="#edeae1">Wert = Geist − Arbeit</text>
  <path d="M507 109 L507 126" stroke="#d9756b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M502 117 L507 128 L512 116" stroke="#d9756b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="521" y="124" font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#d9756b">verbilligt</text>

  <!-- Von der Natur: in Zähler und Nenner -->
  <path d="M214 148 C 228 196, 238 250, 254 284" stroke="#d9a441" stroke-width="1.5" opacity="0.5" fill="none" stroke-linecap="round"/>
  <circle cx="255" cy="286" r="3" fill="#d9a441" opacity="0.75"/>
  <path d="M176 148 C 116 212, 148 320, 268 350" stroke="#d9a441" stroke-width="1.5" opacity="0.5" fill="none" stroke-linecap="round"/>
  <circle cx="270" cy="350" r="3" fill="#d9a441" opacity="0.75"/>

  <!-- Vom Geist: nur in den Zähler -->
  <path d="M552 148 C 544 196, 528 250, 508 284" stroke="#d9756b" stroke-width="1.5" opacity="0.5" fill="none" stroke-linecap="round"/>
  <circle cx="509" cy="286" r="3" fill="#d9756b" opacity="0.75"/>

  <!-- Der Bruch -->
  <text x="380" y="298" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="32" fill="#edeae1">Warenmenge</text>
  <path d="M262 318 C 322 316, 440 320, 502 317" stroke="#edeae1" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <text x="380" y="360" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="32" fill="#edeae1">Geldmenge</text>

  <!-- Schluss -->
  <text x="380" y="424" text-anchor="middle" font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#edeae1" opacity="0.75">Beide füllen den Zähler. Nur die Natur füllt den Nenner.</text>
</svg>
