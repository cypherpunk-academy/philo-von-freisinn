<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" role="img" aria-label="Steiners Bruch. Oben die beiden Wertformeln: Wert gleich Natur mal Arbeit, aufgewendete Arbeit, verteuert; Wert gleich Geist minus Arbeit, ersparte Arbeit, verbilligt. Darunter der Bruch: Gesundheit gleich Ware durch Geld. Ware ist, was die Arbeit aus der Natur gehoben hat, Geld ist, was der Geist aus der Arbeit gemacht hat. Aus dem Nenner fuehrt ein Weg ins freie Geistesleben, wo das Geld bis auf den Samen verschwindet, der zur Ware zurueckkehrt." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="590" fill="#23282a"/>

  <text x="380" y="52" text-anchor="middle" font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.6" fill="#edeae1" opacity="0.5">ZWEI RICHTUNGEN DER WERTBILDUNG</text>

  <text x="200" y="100" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="24" fill="#edeae1">Wert = Natur × Arbeit</text>
  <path d="M165 136 L165 118" stroke="#d9a441" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M160 126 L165 116 L170 127" stroke="#d9a441" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="178" y="133" font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#d9a441">verteuert</text>
  <text x="200" y="156" text-anchor="middle" font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#edeae1" opacity="0.5">aufgewendete Arbeit</text>

  <text x="560" y="100" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="24" fill="#edeae1">Wert = Geist − Arbeit</text>
  <path d="M527 117 L527 135" stroke="#d9756b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M522 126 L527 137 L532 125" stroke="#d9756b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="540" y="133" font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#d9756b">verbilligt</text>
  <text x="560" y="156" text-anchor="middle" font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#edeae1" opacity="0.5">ersparte Arbeit</text>

  <text x="380" y="182" text-anchor="middle" font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#edeae1" opacity="0.35">GA 340, Dreizehnter Vortrag</text>

  <path d="M110 210 L650 210" stroke="#edeae1" stroke-width="1" opacity="0.15" fill="none"/>

  <text x="380" y="244" text-anchor="middle" font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.6" fill="#edeae1" opacity="0.5">DER BRUCH — DIE GESUNDHEIT DES PROZESSES</text>

  <path d="M600 346 C 604 284, 496 260, 402 292" stroke="#d9a441" stroke-width="1.4" fill="none" opacity="0.3" stroke-linecap="round" stroke-dasharray="4 6"/>
  <path d="M410 285 L400 293 L410 299" stroke="#d9a441" stroke-width="1.4" fill="none" opacity="0.3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="268" y="322" text-anchor="end" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="23" fill="#edeae1" opacity="0.85">Gesundheit  =</text>

  <text x="352" y="310" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="32" fill="#edeae1">Ware</text>
  <path d="M298 330 C 334 328, 372 332, 406 329" stroke="#edeae1" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <text x="352" y="374" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="32" fill="#edeae1">Geld</text>

  <path d="M412 372 C 468 378, 528 370, 584 360" stroke="#d9756b" stroke-width="1.5" fill="none" opacity="0.45" stroke-linecap="round"/>
  <circle cx="466" cy="375" r="3.6" fill="#d9756b" opacity="0.55"/>
  <circle cx="516" cy="373" r="2.7" fill="#d9756b" opacity="0.45"/>
  <circle cx="558" cy="366" r="1.9" fill="#d9756b" opacity="0.35"/>
  <circle cx="600" cy="357" r="4" fill="#d9a441" opacity="0.9"/>

  <text x="600" y="340" text-anchor="middle" font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#d9a441" opacity="0.9">Samen</text>
  <text x="508" y="400" text-anchor="middle" font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#d9756b" opacity="0.8">ins freie Geistesleben</text>

  <text x="176" y="442" font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#edeae1" opacity="0.7">Ware = Naw — was die Arbeit aus der Natur gehoben hat</text>
  <text x="176" y="466" font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#edeae1" opacity="0.7">Geld = Agw — was der Geist aus der Arbeit gemacht hat: Geist im Umlauf</text>

  <text x="380" y="512" text-anchor="middle" font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#edeae1" opacity="0.8">Das Geld ist das Teilende: es schält den Naturwert in die Arbeitsteilung auseinander.</text>
  <text x="380" y="534" text-anchor="middle" font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#edeae1" opacity="0.8">Damit der Bruch gesund bleibt, darf der Nenner nicht anschwellen — überschüssiges</text>
  <text x="380" y="556" text-anchor="middle" font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#edeae1" opacity="0.8">Kapital geht ins freie Geistesleben und verschwindet dort bis auf den Samen.</text>

  <text x="380" y="580" text-anchor="middle" font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#edeae1" opacity="0.35">GA 340, Vierter Vortrag (S. 58, 62–64) · Siebenter Vortrag (S. 106)</text>
</svg>