freiheiten:
  - name: "Freiheit 0 – Ausführen (für jeden Zweck)"
    kurz: >
      Freiheit 0 ist die Freiheit, das Programm für jeden Zweck und auf jede Weise auszuführen. Jede Person oder Organisation darf es auf jedem System für jede Aufgabe nutzen, ohne sich beim Entwickler melden zu müssen. Sie ist die selbstverständlichste Freiheit und folgt rechtlich schon aus den anderen drei.
    text: >
      Freiheit 0 ist nach Richard Stallman die Freiheit, das Programm für jeden Zweck auszuführen, auf jede Weise, die man möchte. Die Definition präzisiert: Jede Art von Person oder Organisation darf es auf jeder Art von Computersystem für jede Art von Aufgabe nutzen, ohne verpflichtet zu sein, danach mit dem Entwickler oder einer anderen bestimmten Stelle in Verbindung zu treten. Man muss nicht um Erlaubnis fragen oder dafür bezahlen. Stallman nennt diese Freiheit „ziemlich offensichtlich“: Ein Programm, das man nicht einmal nach Belieben ausführen darf, wäre äußerst restriktiv. Tatsächlich gewähren die meisten Programme wenigstens Freiheit 0. Rechtlich folgt sie, so wie das Urheberrecht funktioniert, aus den Freiheiten 1, 2 und 3. Darum sind es diese drei, die Freie Software von üblicher Software unterscheiden, und Stallman verwendet den größten Teil seiner Begründung auf sie. Freiheit 0 hat dennoch eine eigene Bedeutung: Sie schließt aus, dass ein Lizenzgeber bestimmte Verwendungszwecke verbietet. Wer Freie Software nutzt, muss sich vor niemandem dafür rechtfertigen, wofür er sie gebraucht. Wie alle vier Freiheiten muss sie unwiderruflich sein, solange man nichts Unrechtes tut.
  - name: "Freiheit 1 – Untersuchen und Anpassen (sich selbst helfen)"
    kurz: >
      Freiheit 1 ist die Freiheit, zu untersuchen, wie das Programm arbeitet, und es den eigenen Bedürfnissen anzupassen. Stallman nennt sie die Freiheit, sich selbst zu helfen. Voraussetzung ist der Zugang zum Quellcode. Wer sie nicht hat, wird zum Gefangenen seiner Software.
    text: >
      Freiheit 1 ist nach der Definition die Freiheit, zu untersuchen, wie das Programm funktioniert, und es an die eigenen Bedürfnisse anzupassen; Zugang zum Quellcode ist dafür Voraussetzung. In seinem Vortrag nennt Richard Stallman sie die Freiheit, sich selbst zu helfen, indem man die Software verändert. Das kann heißen, Fehler zu beheben, neue Funktionen hinzuzufügen, das Programm auf ein anderes System zu übertragen oder alle Fehlermeldungen ins Navajo zu übersetzen; jede gewünschte Änderung soll man frei vornehmen dürfen. Nicht nur Berufsprogrammierer profitieren davon. Viele Menschen können genug lernen, um einfache Aufgaben zu erledigen, so wie früher viele Amerikaner lernten, Autos zu reparieren. Und wer gar keine Technik lernen will, kann einen befreundeten Programmierer bitten. Fehlt diese Freiheit, entsteht praktischer, materieller Schaden: Man wird zum Gefangenen seiner Software. Stallman erinnert an einen Laserdrucker, der schlecht arbeitete, den man aber nicht reparieren konnte. Der Schaden ist auch seelisch. Wer ständig frustriert mit dem Computer arbeitet, schützt sich, indem er aufhört, sich zu kümmern: „Ich bin heute zur Arbeit erschienen, mehr muss ich nicht tun.“ Das schadet den Menschen und der Gesellschaft als Ganzes.
  - name: "Freiheit 2 – Weitergeben (dem Nächsten helfen)"
    kurz: >
      Freiheit 2 ist die Freiheit, Kopien weiterzugeben, um dem Nächsten zu helfen. Teilen ist für Stallman ein grundlegender Akt der Freundschaft; der Geist der freiwilligen Hilfe ist die wichtigste Ressource einer Gesellschaft. Wer Teilen „Piraterie“ nennt, vergiftet diese Ressource. Da Kopien nichts kosten, ist ihr Verbot reine Verschwendung.
    text: >
      Freiheit 2 ist nach Richard Stallman die Freiheit, Kopien weiterzugeben, um dem Nächsten zu helfen, gratis oder gegen Gebühr, an jeden und überall. Für Wesen, die denken und lernen können, ist das Teilen nützlichen Wissens ein grundlegender Akt der Freundschaft; wo sie Computer nutzen, nimmt er die Form des Teilens von Software an. Dieser Geist des guten Willens, dem Nächsten freiwillig zu helfen, ist für Stallman die wichtigste Ressource der Gesellschaft. Er macht den Unterschied zwischen einer lebenswerten Gesellschaft und einem Dschungel, in dem jeder jeden frisst; die großen Religionen haben ihn seit Jahrtausenden gefördert. Im Kindergarten lernte Stallman noch, Süßigkeiten mit den anderen zu teilen. Heute sollen Lehrer nach dem Willen der Regierung das Gegenteil lehren: Wer Software teilt, ist ein Pirat, als sei es moralisch gleichwertig, dem Nächsten zu helfen oder ein Schiff zu überfallen. Diese psychosoziale Ressource ist nicht physisch wie saubere Luft, aber ebenso wirklich. Hinzu kommt materieller Schaden: Bei einem Auto spart ein Preis Ressourcen, weil jedes weitere Exemplar Material kostet. Eine Kopie von Software kostet fast nichts; wer ihre Nutzung verteuert, erzeugt absichtlich Verschwendung. Ökonomische Schlüsse, deren Voraussetzungen für Software nicht gelten, darf man nicht auf sie übertragen.
  - name: "Freiheit 3 – Verbessern und Veröffentlichen (die Gemeinschaft aufbauen)"
    kurz: >
      Freiheit 3 ist die Freiheit, das Programm zu verbessern und die Verbesserungen zu veröffentlichen, damit die ganze Gemeinschaft profitiert. Stallman nennt sie die Freiheit, die Gemeinschaft aufzubauen. Sie setzt Zugang zum Quellcode voraus. Sie bringt verlässlichere Software hervor und trägt den Geist wissenschaftlicher Zusammenarbeit.
    text: >
      Freiheit 3 ist nach der Definition die Freiheit, das Programm zu verbessern und die Verbesserungen der Öffentlichkeit zugänglich zu machen, so dass die ganze Gemeinschaft profitiert; auch sie setzt Zugang zum Quellcode voraus. Richard Stallman nennt sie die Freiheit, die Gemeinschaft aufzubauen. Gegen den Einwand, bei Freier Software werde niemand für seine Arbeit bezahlt, verweist er auf die Erfahrung: Hunderte werden bezahlt, über hunderttausend arbeiten freiwillig. Als er GNU Emacs veröffentlichte, kamen bald Fehlerkorrekturen und neue Funktionen, schließlich so viele, dass schon ihre Verarbeitung eine große Aufgabe war. Um 1990 bemerkte man, dass die Freie Software tatsächlich besser war, leistungsfähiger und verlässlicher; eine Messung mit Zufallsdaten ergab wiederholt, dass die GNU-Programme am seltensten abstürzten. Hier setzt die Open-Source-Bewegung an, die nur diese praktischen Vorteile anführt. Stallman spricht dagegen auch von Ethik und davon, in welcher Gesellschaft wir leben wollen: Man hat ein Recht auf diese Freiheiten. Fehlt Freiheit 3, so entsteht materieller Schaden, weil die gemeinschaftliche Entwicklung ausbleibt, und psychosozialer Schaden am Geist wissenschaftlicher Zusammenarbeit, an der Idee, gemeinsam das menschliche Wissen voranzubringen.
