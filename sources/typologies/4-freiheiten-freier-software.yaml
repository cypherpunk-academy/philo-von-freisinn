name: "4 Freiheiten Freier Software"
aliases:
  - "Vier Freiheiten"
  - "Four Freedoms"
  - "Freie Software"
  - "Free Software Definition"
  - "Richard Stallman"
  - "Freedom 0"
kurz: >
  Nach Richard Stallman ist ein Programm Freie Software, wenn seine Nutzer vier Freiheiten haben: es für jeden Zweck auszuführen, es zu untersuchen und anzupassen, Kopien weiterzugeben und verbesserte Versionen zu veröffentlichen. „Frei“ meint Freiheit, nicht Preis. Für Stallman ist das eine ethische Frage nach der Gesellschaft, in der wir leben wollen.
text: |
  Die **4 Freiheiten Freier Software** (englisch *four freedoms*) sind der Kern der Definition Freier Software, die Richard M. Stallman für das GNU-Projekt und die Free Software Foundation formuliert hat. „Free software is a matter of liberty, not price“: Es geht um Freiheit, nicht um den Preis.

  **Mitglieder:**
  - Freiheit 0 – das Programm für jeden Zweck auszuführen.
  - Freiheit 1 – zu untersuchen, wie das Programm arbeitet, und es den eigenen Bedürfnissen anzupassen.
  - Freiheit 2 – Kopien weiterzugeben, um dem Nächsten zu helfen.
  - Freiheit 3 – das Programm zu verbessern und die Verbesserungen zu veröffentlichen, damit die ganze Gemeinschaft profitiert.

  **Beschreibung:** Ein Programm ist Freie Software, wenn ein Nutzer alle vier Freiheiten hat; Stallman definiert sie ausdrücklich vom einzelnen Nutzer her. Für die Freiheiten 1 und 3 ist der Zugang zum Quellcode notwendige Bedingung. Die Freiheiten müssen unwiderruflich sein, solange man nichts Unrechtes tut. Frei heißt nicht nicht-kommerziell: Man darf Kopien auch verkaufen. Das Copyleft der GNU General Public License schützt die Freiheiten, indem niemand bei der Weitergabe neue Einschränkungen hinzufügen darf. Im Vortrag „Free Software: Freedom and Cooperation“ deutet Stallman die Freiheiten 1 bis 3 als Stufen: sich selbst helfen (1), dem Nächsten helfen (2), die Gemeinschaft aufbauen (3). Von der Open-Source-Bewegung trennt ihn die ethische Begründung: Diese nennt nur die praktischen Vorteile, die Freie-Software-Bewegung sagt dagegen, man habe ein Recht auf diese Freiheiten.
