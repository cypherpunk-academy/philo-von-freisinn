motive:
  - name: Egoismus und Klugheitsmoral (Vorstellung von Wohl und Lust)
    kurz: >
      Motiv ist die Vorstellung des eigenen oder fremden Wohls, nicht die Lust
      selbst, sondern die vorgestellte Lust. Der reine Egoismus sucht das eigene
      Glück rücksichtslos, auch auf Kosten anderer. Die Klugheitsmoral fördert
      fremdes Wohl, weil sie sich davon mittelbar Vorteile verspricht oder
      Schaden für das eigene Interesse fürchtet.
    text: >
      Die Motive der Sittlichkeit sind nach Rudolf Steiner Vorstellungen und
      Begriffe, nicht Gefühle. Manche Ethiker sehen zwar das Ziel des sittlichen
      Handelns in der Beförderung des größtmöglichen Quantums Lust. Die Lust
      selbst kann aber nicht Motiv werden, denn sie ist im Augenblick der
      Handlung noch nicht da, sondern soll erst durch sie hervorgebracht werden.
      Motiv werden kann nur die vorgestellte Lust. Mit Recht gilt darum die
      Vorstellung des eigenen oder fremden Wohls als Motiv des Wollens. Das
      Prinzip, durch sein Handeln die größte Summe eigener Lust, also die
      individuelle Glückseligkeit zu bewirken, heißt Egoismus. Er tritt in zwei
      Formen auf. Der reine Egoismus ist rücksichtslos nur auf das eigene Wohl
      bedacht und erstrebt es auch auf Kosten des Glücks anderer. Die
      Klugheitsmoral befördert das fremde Wohl, weil sie sich von glücklichen
      Mitmenschen mittelbar einen günstigen Einfluss auf die eigene Person
      verspricht oder weil sie fürchtet, mit der Schädigung anderer auch das
      eigene Interesse zu gefährden. Der besondere Inhalt egoistischer
      Sittlichkeitsprinzipien hängt davon ab, welche Vorstellung sich der Mensch
      von Glückseligkeit macht: Wohlleben, Hoffnung auf Seligkeit, Erlösung von
      verschiedenen Übeln. Bei diesem Motiv ist der wahrnehmbare Inhalt der
      Handlung selbst das Bestimmende; es bezieht sich auf die einzelne
      Handlung, nicht auf ein System von Grundsätzen.
    chunk_id: 694cdf8f-d559-4d15-9dd2-7edc38e6a83a
  - name: Autoritätsmoral und Gewissen (Unterwerfung unter sittliche Normgebote,
      äußere oder innere Autorität)
    kurz: >
      Motiv ist der rein begriffliche Inhalt einer Handlung, ihre Begründung aus
      einem System sittlicher Prinzipien. Man unterwirft sich dem Gebot als
      sittlicher Notwendigkeit und überlässt die Begründung der anerkannten
      Autorität: Familie, Staat, Sitte, Kirche, göttliche Offenbarung. Spricht
      das Gebot aus dem eigenen Innern, so heißt diese Stimme Gewissen.
    text: >
      Als weiteres Motiv nennt Rudolf Steiner den rein begrifflichen Inhalt
      einer Handlung. Er bezieht sich nicht, wie die Vorstellung der eigenen
      Lust, auf die einzelne Handlung allein, sondern auf ihre Begründung aus
      einem System sittlicher Prinzipien. Diese Moralprinzipien können in Form
      abstrakter Begriffe das sittliche Leben regeln, ohne dass der Einzelne
      sich um ihren Ursprung kümmert. Man empfindet dann einfach die
      Unterwerfung unter den sittlichen Begriff, der als Gebot über dem Handeln
      schwebt, als sittliche Notwendigkeit. Die Begründung dieser Notwendigkeit
      überlässt man dem, der die Unterwerfung fordert: der anerkannten
      sittlichen Autorität, sei es das Familienoberhaupt, der Staat, die
      gesellschaftliche Sitte, die kirchliche Autorität oder die göttliche
      Offenbarung. Eine besondere Art dieser Prinzipien liegt vor, wenn das
      Gebot sich nicht durch eine äußere Autorität kundgibt, sondern durch das
      eigene Innere; Steiner spricht hier von sittlicher Autonomie. Man vernimmt
      dann eine Stimme im eigenen Innern, der man sich zu unterwerfen hat, und
      der Ausdruck dieser Stimme ist das Gewissen. Auch das Gewissen ist in
      diesem Sinn noch eine Autorität: Nicht die Einsicht in den Grund, sondern
      die Unterwerfung bestimmt das Handeln. Wer so handelt, ist nach Steiner
      der Vollstrecker der Prinzipien seines Moralkodex, ein höherer Automat.
      Auf dem Weg zur Freiheit haben Normen gleichwohl ihre berechtigte Rolle.
    chunk_id: 9d48e2ea-49bc-40e5-af18-37a5d80ecda7
  - name: "Handeln aus sittlicher Einsicht (Bedürfnisse: Gesamtwohl der Menschheit,
      Kulturfortschritt, individuelle Sittlichkeitsziele)"
    kurz: >
      Es ist ein sittlicher Fortschritt, wenn der Mensch nicht einfach das Gebot
      einer Autorität befolgt, sondern den Grund einer Maxime einzusehen sucht.
      Er erforscht die Bedürfnisse des sittlichen Lebens: das größtmögliche Wohl
      der Gesamtmenschheit, den Kulturfortschritt und die Verwirklichung rein
      intuitiv erfasster individueller Sittlichkeitsziele.
    text: >
      Es bedeutet nach Rudolf Steiner einen sittlichen Fortschritt, wenn der
      Mensch zum Motiv seines Handelns nicht einfach das Gebot einer äußeren
      oder inneren Autorität macht, sondern den Grund einzusehen strebt, aus dem
      eine Maxime als Motiv in ihm wirken soll. Das ist der Schritt von der
      autoritativen Moral zum Handeln aus sittlicher Einsicht. Der Mensch sucht
      auf dieser Stufe die Bedürfnisse des sittlichen Lebens auf und lässt sich
      von ihrer Erkenntnis zum Handeln bestimmen. Steiner nennt drei solche
      Bedürfnisse. Erstens das größtmögliche Wohl der Gesamtmenschheit rein um
      dieses Wohls willen; es wird verschieden aufgefasst, und die Maxime
      verlangt nur, dass jeder tut, was nach seiner Ansicht dieses Wohl am
      meisten fördert. Zweitens der Kulturfortschritt oder die sittliche
      Entwicklung der Menschheit zu immer größerer Vollkommenheit. Wem sich an
      die Güter der Kultur ein Lustgefühl knüpft, für den ist er ein besonderer
      Fall des Gesamtwohls; wer in ihm eine sittliche Notwendigkeit sieht, für
      den ist er ein eigenes Prinzip. Drittens die Verwirklichung rein intuitiv
      erfasster individueller Sittlichkeitsziele. Gesamtwohl und
      Kulturfortschritt beruhen beide auf der Vorstellung, also auf der
      Beziehung sittlicher Ideen zu bestimmten Wahrnehmungen. Wer nur auf dem
      Boden der Kulturentwicklungsmoral steht, geht nach Steiner mit gebundener
      Marschroute durch die Welt: Jedem Geschehen hängt eine sittliche Etikette
      an. Das dritte Bedürfnis weist bereits über diese Stufe hinaus auf die
      begriffliche Intuition.
    chunk_id: f9d8914a-d050-4d6d-a951-289ce906eb0f
  - name: Begriffliche Intuition (Ideengehalt der Handlung; höchstes Motiv, wo
      Triebfeder und Motiv zusammenfallen)
    kurz: >
      Das höchste Motiv entspringt aus dem Quell der reinen Intuition und sucht
      erst nachher die Beziehung zum Leben. Nur der Ideengehalt der Handlung
      wirkt als Motiv; Triebfeder und Motiv fallen zusammen. Der Mensch handelt
      aus Liebe zur Tat, nicht aus Zwang oder Norm. Steiner nennt diesen
      Standpunkt ethischen Individualismus.
    text: >
      Das höchste denkbare Sittlichkeitsprinzip enthält nach Rudolf Steiner
      keine Beziehung zu bestimmten Wahrnehmungen von vornherein, sondern
      entspringt aus dem Quell der reinen Intuition und sucht erst nachher die
      Beziehung zum Leben. Es geht im Einzelfall nicht von einem bestimmten
      Sittlichkeitsziel aus, sondern legt allen Maximen einen gewissen Wert bei
      und fragt jeweils, welches Prinzip hier das wichtigere ist. Treten alle
      anderen Bestimmungsgründe an die zweite Stelle, so wirkt allein der
      Ideengehalt der Handlung als Motiv: die begriffliche Intuition. Auf dieser
      Stufe fallen Triebfeder und Motiv zusammen. Weder eine vorher bestimmte
      charakterologische Anlage noch ein äußeres, normativ angenommenes Prinzip
      wirkt; die Handlung ist weder schablonenmäßig noch automatenhaft, sondern
      schlechthin durch ihren idealen Gehalt bestimmt. Voraussetzung ist die
      Fähigkeit der moralischen Intuition, für den einzelnen Fall die besondere
      Maxime zu erleben. Den geraden Gegensatz bildet Kants kategorischer
      Imperativ, den Steiner den Tod aller individuellen Antriebe nennt: Nicht
      wie alle handeln würden, ist maßgebend, sondern was im individuellen Fall
      zu tun ist. Die Menschen sind dem Intuitionsvermögen nach verschieden; die
      Summe der in einem Menschen wirksamen Ideen ist sein Sittlichkeitsgehalt,
      und ihn ausleben zu lassen ist höchste Triebfeder und höchstes Motiv
      zugleich. Steiner nennt das ethischen Individualismus. Der so Handelnde
      vollzieht die Tat, weil er sie liebt. Erst dadurch ist sie seine Handlung,
      und erst hier ist er frei.
    chunk_id: 6a71dea7-949c-4388-b055-9cb3f07cd0b2
