      - schlagwort: Schutzabbau
        schlagsatz: Der Vorschrift fällt, damit die Rendite steigt.
        kurztext: >
          Wirtschaftsakteure erzwingen die Abschaffung von Arbeits-, Umwelt- und
          Verbraucherschutz — im Namen der Wettbewerbsfähigkeit, in Wahrheit um
          Haftung zu umgehen. Deregulierung klingt nach Befreiung; befreit wird
          die Macht von der Pflicht. Gestrichen wird nicht das überflüssige
          Formular, sondern die Vorschrift, die den Schwächeren deckte. Was
          jedem zustand, weil er Mensch ist, muss sich wieder rechnen. Daneben
          die leisere Strategie: das Geschäft so bauen, dass das Gesetz nicht
          greift. Plattformarbeit umgeht das Arbeitsrecht,
          Scheinselbstständigkeit das Sozialrecht — man schafft den Schutz nicht
          ab, man baut um ihn herum.
        text: >
          Wirtschaftsakteure erzwingen die Abschaffung von Schutzgesetzen —
          Arbeitsrecht, Umweltrecht, Verbraucherschutz — mit dem Argument der
          Wettbewerbsfähigkeit, tatsächlich aber, um Haftung und Verantwortung
          zu umgehen, und um den Börsenkurs zu erhöhen. „Deregulierung" klingt
          nach Befreiung; befreit wird aber nicht der Mensch vom Amt, sondern
          die Macht von der Pflicht. Was als Bürokratieabbau firmiert, ist
          Schutzabbau: Gestrichen wird nicht das überflüssige Formular, sondern
          die Vorschrift, die den Schwächeren deckte — der Kündigungsschutz, der
          Grenzwert, das Widerrufsrecht. Die Sicherung läuft damit rückwärts: In
          einer gesunden Wirtschaft verwandelt sich Überschuss in rechtliche
          Gewissheit — dass keiner fällt, nur weil ihn niemand mehr braucht.
          Hier verwandelt sich rechtliche Gewissheit zurück in wirtschaftliches
          Risiko, das der Einzelne trägt: Der Kranke verhandelt mit der Kasse,
          der Alte rechnet mit der Rente, der Entlassene steht im Wettbewerb um
          seinen eigenen Schutz. Was jedem zustand, weil er Mensch ist, muss
          sich wieder rechnen — und was sich nicht rechnet, verfällt. Neben der
          offenen Abschaffung gibt es die leisere Strategie: das Geschäft so
          bauen, dass das Gesetz nicht greift. Plattformarbeit umgeht das
          Arbeitsrecht, Scheinselbstständigkeit das Sozialrecht, Software as a
          Service die Copyleft-Pflicht — man schafft den Schutz nicht ab, man
          baut um ihn herum, und das Ergebnis ist dasselbe.
