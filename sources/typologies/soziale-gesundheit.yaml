        text: >
          Das Rechtsleben kann aus Abstimmungen und Machtverhältnissen keine
          sachkundigen Urteile fällen — bei technischen, medizinischen,
          pädagogischen Fragen hilft keine Auszählung und kein Machtwort. Solche
          Fragen beantworten Menschen, die aus eigener Arbeit im jeweiligen Feld
          urteilen: Wer ein Gesetz über Schule, Gesundheit oder Forschung
          gestaltet, hat selbst darin gestanden. Die Inhalte der Gesetze sind
          während ihrer Entstehung Geistesfragen und werden erst mit
          Fertigstellung zu Rechtsfragen — und Gesetz wird nur, was alle gleich
          betrifft und was jeder erwachsene Mensch verstehen kann. Werden sie
          weiterentwickelt, dann wiederum nicht durch Politik oder Politiker,
          sondern wieder durch Menschen, die die nötige persönliche Erfahrung
          haben. Die Aufgabe des Politikers ist damit nicht der Inhalt — den
          liefert das Geistesleben fertig —, sondern die Auswahl: Er schaut auf
          die Menschen, für die er spricht, und wählt aus dem, was angeboten
          wird, das Gesetz, das ihnen am besten dient.
