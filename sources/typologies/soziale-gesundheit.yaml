matrix_titel: "Soziale Gesundheit"
grundlage: "Rudolf Steiner, Die Kernpunkte der sozialen Frage (GA 23), Aufsätze
  über die Dreigliederung (GA 24)"
uebersicht_kurz: >
  Soziale Gesundheit beschreibt nach Rudolf Steiners Dreigliederung, wie
  Geistesleben, Rechtsleben und Wirtschaftsleben aufeinander wirken. Jedes Glied
  wirkt auf die beiden anderen; das ergibt sechs Felder. In jedem Feld steht ein
  gesunder einem kranken Pol gegenüber, je mit sieben Aspekten, die sich der
  Reihe nach entsprechen. Gesund gibt ein Glied, was es aus sich hervorbringt,
  ohne über das andere zu bestimmen; krank greift es in dessen Aufgabe ein.
uebersicht: |
  **Soziale Gesundheit** ist eine Matrix auf der Grundlage von Rudolf Steiners „Die Kernpunkte der sozialen Frage“ und seinen Aufsätzen über die Dreigliederung des sozialen Organismus. Der soziale Organismus hat drei Glieder: das Geistesleben, in dem Fähigkeiten, Erkenntnis und Urteil entstehen und Freiheit gilt; das Rechtsleben, in dem unter Gleichen bestimmt wird, was für alle gilt; das Wirtschaftsleben, in dem Güter erzeugt, verteilt und verbraucht werden und Brüderlichkeit die Bedingung ist.

  **Felder:** Jedes Glied wirkt auf die beiden anderen. Daraus ergeben sich sechs Richtungen: Geist -> Recht, Geist -> Wirtschaft, Recht -> Geist, Recht -> Wirtschaft, Wirtschaft -> Recht, Wirtschaft -> Geist.

  **Pole:** In jedem Feld steht ein gesunder einem kranken Pol gegenüber. Gesund gibt ein Glied dem anderen, was es aus seiner eigenen Mitte hervorbringt — Fähigkeiten, Rahmen, Mittel —, und bestimmt nicht, was das andere damit tut. Krank greift es in die Aufgabe des anderen ein: Die Weltsicht wird zum Gesetz, die Politik lenkt das Denken, die Wirtschaft kauft die Politik. Jeder Pol hat sieben Aspekte. Die Aspekte derselben Stelle sind Gegenstücke, etwa Entfaltung und Vorschrift, Freiheit und Vorgabe, Enthaltung und Lobbykauf.

  Die Felder, in denen zwei Glieder zugleich auf das dritte wirken, sind hier nicht ausgeführt.
