      - schlagwort: Rechtssinn
        schlagsatz: Wer einsieht, braucht keinen Zwang.
        kurztext: >
          Das Geistesleben bildet nicht nur Fähigkeiten aus, sondern den Sinn
          für das, was allgemein gilt. Wer aus eigener Anschauung urteilen
          gelernt hat, erkennt im Einzelfall, was der Sache entspricht — nicht
          was ihm nützt. Wer aus Einsicht handelt, gehorcht dem Gesetz, weil er
          seine Notwendigkeit durchschaut, nicht weil es befohlen ist. Ohne
          diesen Sinn bleiben die anderen Aspekte Mechanismen ohne Fundament.
        text: >
          Das Geistesleben bildet nicht nur die Fähigkeiten des Einzelnen aus,
          sondern pflegt auch den Sinn für das, was allgemein gilt — eine
          Fähigkeit, die nicht angeboren ist. Wer aus eigener Anschauung
          urteilen gelernt hat, erkennt im Einzelfall, was über ihn hinausweist:
          nicht was ihm nützt, sondern was der Sache entspricht. Wer aus
          Einsicht handelt, gehorcht dem Gesetz nicht, weil es befohlen ist,
          sondern weil er dessen Notwendigkeit durchschaut. Weder ein äußeres
          Gebot noch die innere Stimme ersetzt den Grund, den man selbst gesehen
          hat. Die Prüfung, die diesen Sinn trägt, hat kein bestelltes Ergebnis.
          Was einer gesehen hat, kann ein anderer an derselben Sache wieder
          sehen; Widerspruch hält sie lebendig. Die Politik entscheidet dann auf
          einer Grundlage, die sie durchschauen kann — und die Bürger ebenso.
          Nur wo jeder mündige Mensch urteilsfähig ist, gehört die Sache ins
          Recht. Ohne diese innere Grundlage blieben die anderen Aspekte
          Mechanismen ohne tragendes Fundament: die Entfaltung, weil keine Lehre
          zum Gesetz wird; die Erfahrung, weil das Gesetz aus der Sache kommt;
          das Miturteil, weil der Verfasser weiß, wen die Sache braucht; die
          Verständlichkeit, weil gilt, was jeder durchschaut; das Mitwirken,
          weil der Einwand am Gesetz steht; das Zutrauen, weil das Urteil
          nachvollziehbar ist und nicht aus der Ernennung stammt. Eine Politik
          auf dieser Grundlage kann überzeugen. Das Vertrauen, das Prüfung
          stiften soll, erneuert sich, sooft jemand die Sache selbst sieht.
