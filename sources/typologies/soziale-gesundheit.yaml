        kurztext: >
          Was gilt, bleibt korrigierbar. Wer erkennt, dass ein Gesetz nicht aus
          der Sache kommt oder nicht für alle gleich gilt, bringt den Einwand
          öffentlich vor — sichtbar dort, wo das Gesetz steht. Der Einwand ist
          ein Vorschlag: Er benennt den Fehler und die bessere Fassung. Das
          Geistesleben pflegt die Urteilskraft und eine Kultur, in der ein
          Einwand nichts kostet. So erstarrt das Recht nicht zum Buchstaben.
        text: >
          Was einmal gilt, bleibt korrigierbar. Wer erkennt, dass ein Gesetz
          nicht aus der Sache kommt oder nicht für alle gleich gilt, bringt
          seinen Einwand öffentlich vor — sichtbar an der Stelle, an der das
          Gesetz steht. Der Einwand ist keine Anklage, sondern ein praktischer
          Vorschlag: Er benennt nicht nur den Fehler, sondern liefert die
          bessere Fassung gleich mit. Ein Miturteil (Review) geschieht bevor es
          gilt; Mitwirken (Pull-Request) geschieht danach, am geltenden Text,
          den jeder mündige Bürger lesen und prüfen kann. Annehmen oder Ablehnen
          kann derjenige, der über das Gesetz wacht (Maintainer), aber er kann
          es nur im Offenen tun. Jeder kann sehen, was geschieht. Das
          Geistesleben pflegt das Urteilsvermögen, aus dem ein solcher Einwand
          überhaupt erst begründet werden kann — und es pflegt die Kultur, in
          der ein Einwand kein persönliches Risiko mit sich bringt. Der Staat
          wartet auf das, was ihm das freie Geistesleben überantwortet, und wird
          von den lebendigen Ideen befruchtet, die nur dort entstehen; der
          Einwand gehört zu dieser Überantwortung, nicht zur Selbstvollstreckung
          der Überzeugung. Wo die Vorverurteilung nach der Offenlegung sofort
          Strafe ohne Verfahren verhängt — Ausschluss, Rufzerstörung, oder
          niemand geladen wird, niemand gehört —, lässt Mitwirken das Recht
          seine Arbeit tun: erst das Verfahren, dann die Folgen. Wer nur
          anklagt, nimmt dem Recht die Entscheidung; wer vorschlägt, hält es in
          Bewegung. So bleibt das Recht lebendig und erstarrt nicht zum
          Buchstaben, den niemand mehr anfasst.
