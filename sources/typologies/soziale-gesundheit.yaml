  # ══════════════════════════════════════════════════════════════════════
  # FELD 5 — WIRTSCHAFT → RECHT
  # ══════════════════════════════════════════════════════════════════════

  - id: dm-05g
    feld: 5
    richtung: "Wirtschaft -> Recht"
    pol: gesund
    titel: "Die Wirtschaft trägt den Staat"
    kurz: >
      Das Rechtsleben erzeugt keine Güter und braucht doch Gebäude, Menschen und
      Zeit. Die Wirtschaft trägt es — durch Ausgabensteuer aus dem Kreislauf,
      wenn einzelne Menschen kaufen und Geld in den Verkehr geht: Sie gibt dem Recht die
      Mittel zur Durchsetzung, speist die Sicherung gegen Krankheit und Alter,
      versorgt die Menschen im Rechtsleben, liefert, was bestellt wird, und
      stellt Bürger frei. Über die Verwendung bestimmt sie nicht: Wer zahlt,
      bestimmt nicht.
    text: |
      Im gesunden Feld Wirtschaft -> Recht trägt die Wirtschaft den Staat, wie das Fundament das Haus trägt: Es entscheidet nicht, wer darin wohnt. Die Herkunft der Mittel ist wirtschaftlich, ihre Verwendung ist es nicht.

      Sieben Aspekte zeigen, wie das geschieht. **Ertrag:** Der Rechtsstaat lebt von der Ausgabensteuer — wenn Geld in den Wirtschaftsprozess übergeht; Bedarf und Verwendung bestimmt das Recht, die Verteilung die Assoziationen. **Durchsetzung:** Ein Recht braucht Mittel, um zu gelten; wer die Vollstreckung finanziert, erwirbt keinen Einfluss auf das, was vollstreckt wird. **Sicherung:** Was den Einzelnen trifft, trägt die Gemeinschaft; der Anspruch folgt dem Menschsein, nicht dem Marktwert. **Versorgung:** Die Wirtschaft ernährt und behaust die Menschen im Rechtsleben; keine Lieferung begründet eine Weisung. **Lieferung:** Ob und wofür bestimmt das Recht, das Wie verantwortet die Wirtschaft. **Freistellung:** Wer Abgeordneter, Schöffe oder Wahlhelfer ist, wird freigestellt und findet seinen Platz unverändert. **Enthaltung:** Die Wirtschaft zahlt und bestimmt nicht; erst diese Trennung macht alle anderen Beiträge gesund.

      Der Gegenpol ist „Die Wirtschaft kauft die Politik“: Dort wird aus dem Beitrag ein Druckmittel, und wer zahlt, bestimmt doch.
    aspekte:
      - schlagwort: Ertrag
        schlagsatz: Ohne Ertrag kein Rechtsstaat.
        kurztext: >
          Das Rechtsleben erzeugt keine Güter und braucht Gerichte, Verwaltung,
          Ordnung, Verteidigung, Vollzug, Verwaltungsgebäude und Reisen — der
          Bedarf öffentlichen Rechts. Die Menschen dafür
          reift das Geistesleben heran; getragen wird ihr Wirken von der
          Ausgabensteuer, wenn Geld in den Wirtschaftsprozess übergeht, nicht
          von Einkommen als bloßem Zeichen. Bedarf und Verwendung bestimmt das
          Rechtsleben; die Assoziationen verteilen die Forderung. Wer zahlt,
          kauft kein Stimmrecht. Der Kreislauf trägt den Staat, ohne zu
          bestimmen, wer wohnt.
        text: >
          Das Rechtsleben erzeugt keine Güter — und braucht doch Gesetzgebung,
          Verwaltung und Gerichtsbarkeit, Schutz der Ordnung und Verteidigung
          des Gemeinwesens, Vollstreckung und Haft, Verwaltungsgebäude und
          Reisen: alles, was Rechtseinrichtungen brauchen, damit unter Gleichen
          gelten kann, was für alle gilt. Die Menschen, die urteilen,
          verwalten und vollziehen, kommen aus dem Geistesleben; der Kreislauf
          bildet sie nicht, aber ihr Wirken im Recht kostet Güter und Geld.
          Alles Gemeinsame wird aus dem Wirtschaftskreislauf getragen, nicht aus
          besteuertem Einkommen: Geld ist ein Zeichen für Güter; besteuert
          werden darf, was wirklich wirtschaftet — wenn es ausgegeben wird und
          in den Prozess übergeht, auch wenn es vorher bei einer Bank liegt.
          So ist die Steuer Hingabe des Kreislaufs an die Allgemeinheit, kein
          Parasit an ihm. Steiner nennt das Ausgabensteuer, niemals
          Einkommensteuer: Sie fließt aus dem Portemonnaie des einzelnen
          Menschen, nicht aus Konsortien. Der Rechtsstaat steht dem Kreislauf
          als Konsumorganisation gegenüber: Er regelt, welcher Steuerbedarf
          gilt und wofür die Mittel verwendet werden; wie die Forderung auf die
          Wirtschaftszweige verteilt wird, obliegt den Assoziationen. Das
          Steuerrecht entsteht aus der Harmonisierung von Rechtsbewusstsein und
          Wirtschaftsleben. Die Wirtschaft gibt, ohne zu diktieren — über die
          Verwendung entscheidet das Rechtsleben demokratisch unter Gleichen.
          Wer zahlt, erwirbt kein Stimmrecht und kein größeres Gewicht. Der
          Kreislauf trägt den Staat, wie das Fundament das Haus trägt: Er
          entscheidet nicht, wer darin wohnt.
