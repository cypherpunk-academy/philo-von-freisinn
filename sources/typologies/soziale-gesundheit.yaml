  - id: dm-01g
    feld: 1
    richtung: "Geist -> Recht"
    pol: gesund
    titel: "Sachkenntnis prägt das Recht"
    kurz: >
      Das freie Geistesleben gibt dem Rechtsleben Fähigkeiten und Einsicht,
      keine Weltanschauung. Gesetze entstehen aus der Erfahrung derer, die in
      der Sache stehen und sind so formuliert, dass jeder mündige Bürger sie
      versteht. Was gilt, bleibt durch öffentlichen Einwand korrigierbar;
      Richter wählt man in seinem persönlichen Umfeld aus Zutrauen. Getragen
      wird das vom Rechtssinn: Wer einsieht, braucht keinen Zwang.
    text: |
      Im gesunden Feld Geist -> Recht überantwortet das freie Geistesleben dem Rechtsleben nicht eine Lehre, sondern urteilsfähige Menschen und Dokumente, die jeder mündige Bürger prüfen kann. Im Geistesleben entscheidet das sachverständige Urteil; im Rechtsleben gilt nur, was jeder mündige Mensch mit jedem gemein hat. Die Demokratie kann das Sachverständige nicht erzeugen; das Sachverständige darf das demokratische Entscheiden nicht ersetzen. Der Staat wartet auf das, was ihm das Geistesleben gibt, und bestimmt selbst, ob es unter Gleichen gilt.

      Darum darf Geist dem Recht keine Weltanschauung liefern. Ungleich sind die Menschen in ihren Fähigkeiten — das gehört ins freie Geistesleben. Gleich sind sie als Bürger — das gehört ins Recht. Wird die Ungleichheit der Einsicht zur Vorschrift, gilt die Lehre auch für die, die sie nie geteilt haben. Bleibt sie bei denen, die in der Sache stehen, schöpft das Recht, ohne sich zu unterwerfen: Der Politiker wählt aus, er liefert nicht den Inhalt.

      Was so übergeht, muss aus der Sache gesehen und vor jedem Bürger stehen können — gesehen von dem, der in ihr gestanden hat, und noch einmal durch einen Zweiten, bevor es gilt; gefasst so, dass niemand ausgeschlossen ist und der Einwand die bessere Fassung mitbringen kann. Getragen wird das vom Rechtssinn: Wer die Notwendigkeit durchschaut, braucht keinen Zwang.

      Der Gegenpol ist „Die Weltsicht wird zum Gesetz“: Dort liefert das Geistesleben die fertige Überzeugung, und das Recht beschließt nur noch, was die Lehre verlangt.
