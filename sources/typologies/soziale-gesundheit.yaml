      - schlagwort: Vormund
        schlagsatz: Wer das Geld verwaltet, verwaltet den Geist.
        kurztext: >
          Stiftungsräte, Fördergremien, Vergabestellen entscheiden über geistige
          Arbeit, in der sie selbst nicht stehen. Das Urteil fällt nach
          Antragsprosa, Wirkungsindikatoren, strategischer Passung. Gesund
          entscheidet, wer die Sache kennt, weil er sie betreibt. In einer
          Stiftung entscheidet, wer das Geld kennt, weil er es verwaltet. Der
          Kapitalstock muss erhalten bleiben, also braucht es Rendite —
          ausgeschüttet werden nur die Erträge. Die Schenkung ist der
          nachrangige Zweck. Die Aufsicht prüft nicht, ob gut gefördert wird —
          sie prüft, ob das Geld noch da ist.
        text: >
          Stiftungsräte, Fördergremien, Vergabestellen — überall entscheiden
          Menschen über geistige Arbeit, in der sie selbst nicht stehen. Bei der
          Bestellung im nächsten Feld wird wenigstens offen gesagt, was verlangt
          wird; hier wird von außen beurteilt, was förderungswürdig ist, und das
          Urteil fällt nach Kriterien, die dem Feld fremd sind: Antragsprosa,
          Wirkungsindikatoren, strategische Passung. Gesund entscheidet über
          geistige Arbeit, wer selbst in ihr drinsteht — wer die Sache kennt,
          weil er sie betreibt oder aus eigener Erfahrung kennt. In einer
          Stiftung entscheidet, wer das Geld kennt, weil er es verwaltet. Das
          Geld wird dabei nicht hingegeben, sondern zurückgehalten: Der
          Kapitalstock muss erhalten bleiben, also braucht es Rendite, also muss
          das Vermögen in ertragbringenden Verhältnissen angelegt bleiben.
          Ausgeschüttet werden nur die Erträge — die Schenkung ist der
          nachrangige Zweck. Die Aufsicht prüft nicht, ob gut gefördert wird —
          sie prüft, ob das Geld noch da ist.
