  - id: dm-01k
    feld: 1
    richtung: "Geist -> Recht"
    pol: krank
    titel: "Die Weltsicht wird zum Gesetz"
    kurz: >
      Das kranke Geistesleben liefert dem Recht eine fertige Weltsicht statt
      Fähigkeiten. Gesetze entstehen aus Gesinnung und Mehrheit, geprüft wird
      auf dem Dienstweg, formuliert so, dass nur Ausleger sie verstehen. Das
      Urteil fällt ohne Verfahren, Experten entscheiden, was die Politik will,
      und kontrollierte Information ersetzt die Prüfung. Eine solche Politik
      kann nicht mehr überzeugen, nur noch gehorchen lassen.
    text: |
      Im kranken Feld Geist -> Recht verlässt eine Überzeugung ihre freie Sphäre und wird zum Paragraphen, auch für die, die sie nie geteilt haben. Die Richtung kehrt sich um: Nicht Menschen tragen ihr Können ins Recht, sondern das Recht erhält fertige Inhalte, die es nur noch beschließen muss.

      Sieben Aspekte zeigen, wie das geschieht. **Vorschrift:** Gottesgesetz, Rassenlehre oder das Dogma vom grenzenlosen Wachstum werden für alle verbindlich, und der Lehrplan sorgt dafür, dass schon die Kinder es lernen. **Verhaltensnorm:** Gesetze entstehen aus Mehrheit, Kompromiss und Lobby; wechselt die Mehrheit, verbietet die nächste, was die vorige vorschrieb. **Dienstweg:** Die Hierarchie weist zu, wer prüft und wer mitredet. **Wortverstrickung:** Gesetze werden so verfasst, dass nur Juristen, Beamte und Lobbyisten sie auslegen können. **Vorverurteilung:** Nach der Offenlegung folgt Strafe ohne Verfahren. **Expertokratie:** Sachverstand wird zum Vorwand, demokratische Entscheidungen zu umgehen. **Desinformation:** Gefälligkeitsgutachten und ungeprüfte Berichte vergiften die Grundlage, auf der entschieden wird; ein Rechtssinn kann sich so nicht bilden.

      Der Gegenpol ist „Sachkenntnis prägt das Recht“: Dort gibt das Geistesleben Fähigkeiten und Einsicht, und das Recht bestimmt selbst, was unter Gleichen gilt.
    aspekte:
      - schlagwort: Vorschrift
        schlagsatz: Die Überzeugung Einzelner wird zum Gesetz.
        kurztext: >
          Das kranke Geistesleben liefert dem Recht keine Fähigkeiten, sondern
          eine fertige Weltsicht: Gottesgesetz, Rassenlehre, das Dogma vom
          grenzenlosen Wachstum. Was zuerst Lehre war, soll für alle gelten; der
          Lehrplan sorgt dafür, dass schon die Kinder es lernen. Eine
          Überzeugung wird zum Paragraphen — auch für die, die sie nie geteilt
          haben. Recht und Politik beschließen nur noch, was die Lehre verlangt.
          So gilt Fiat-Geld, weil das Gesetz es sagt, und duldet keine
          Alternative.
        text: >
          Das kranke Geistesleben liefert dem Rechtsleben keine Fähigkeiten,
          sondern eine fertige Weltsicht. Ein Gottesgesetz, eine Rassenlehre,
          das Dogma vom grenzenlosen Wachstum und der Gewinnmaximierung — was
          zuerst Lehre war, soll für alle gelten. Der Lehrplan sorgt dafür, dass
          es schon die Kinder lernen: Per Erlass steht fest, was jeder zu wissen
          hat, und was einmal festgeschrieben ist, veraltet dort über
          Generationen, weil niemand aus der lebendigen Arbeit es erneuern darf.
          Eine Überzeugung verlässt ihre freie Sphäre: Sie wird zum Paragraphen,
          der Glaube zur Pflicht, die Weltanschauung zur Rechtsordnung — auch
          für die, die sie nie geteilt haben. Die Richtung hat sich umgekehrt.
          Nicht Menschen tragen aus ihrer eigenen Entwicklung heraus ihr Können
          in den politischen Bereich. Der politische Bereich erhält fertige
          Inhalte, die er nur noch beschließen muss. Recht und Politik verlieren
          ihre eigene Aufgabe: Sie bestimmen nicht mehr, was unter Gleichen
          gilt, was jeder versteht, sondern machen aus einer vorhandenen Lehre
          das Gesetz, das niemand hinterfragen soll. So wird die Lehre vom Geld
          dem Recht vorgeschrieben: Es gilt, weil das Gesetz es sagt,
          Fiat-Währungen (Dollar, Euro etc.) gelten — und dulden keine
          Alternative.
