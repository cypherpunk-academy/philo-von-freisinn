      - schlagwort: Zugang
        schlagsatz: Wissen ist Anspruch, nicht Entgegenkommen.
        kurztext: >
          Das Rechtsleben garantiert jedem das Wissen, das er zum Urteilen
          braucht: über politisches Handeln, die Herstellung der Dinge und was
          der Staat weiß. Alles wird veröffentlicht, binnen Wochen, nicht
          Monaten. Gesetze, Urteile, Diagnosen, Algorithmen müssen verstehbar
          sein. Bildung ist Anspruch des Kindes: Will es in die Schule, zu
          seinem Lehrer oder den Mitschülern, dürfen nicht einmal die Eltern das
          verweigern. Das Recht verleiht kein Wissen, es öffnet die Tür.
        text: >
          Das Rechtsleben sichert den Zugang zu allen Informationen, die für ein
          eigenes Urteil nötig sind: was die Politik im Einzelnen tut, wie die
          Dinge produziert wurden, die man verwendet, und allgemein alles, was
          der Staat weiß. Wo sofortige Freigabe nicht möglich ist, sind
          Verzögerungen begrenzt — Wochen, nicht Monate. Darüber hinaus sichert
          es die Einsicht in die Funktionsweise dessen, was das Zusammenleben
          bestimmt: Gesetze, Urteile, Baupläne, Diagnosen, Algorithmen müssen in
          ihrem Wirken verstehbar sein — denn was verschlossen bleibt, entzieht
          sich der Prüfung. Auch Schule und Studium sind ein Anspruch, und zwar
          der des Kindes selbst: Will das Kind in die Schule, zu seinem Lehrer
          oder zu seinen Mitschülern, dann gilt dieser Anspruch, und nicht
          einmal die Eltern dürfen ihm das verweigern. Das Recht verleiht kein
          Wissen, es öffnet die Tür und macht sichtbar, was dahinter geschieht;
          was aus dem Zugang wird, entscheidet das freie Geistesleben.
