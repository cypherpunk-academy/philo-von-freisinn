      - schlagwort: Zutrauen
        schlagsatz: Richter aus Zutrauen — gewählt auf Zeit.
        kurztext: >
          Im Geistesleben stellen sich Menschen als Richter zur Verfügung, aus
          den verschiedensten Tätigkeiten und aus dem persönlichen Umfeld derer,
          über die zu richten ist. Die Verwaltung des Geisteslebens stellt sie
          auf; nach einer Zeit kehren sie in ihre eigene Arbeit zurück. Jeder
          wählt aus dieser Gruppe auf Zeit seinen Richter — und nur der darf
          über ihn richten. Das Urteil kommt aus Sachkenntnis und persönlichem
          Vertrauen, nicht aus Ernennung.
        text: >
          Im Geistesleben stellen sich Menschen als Richter zur Verfügung, aus
          den verschiedensten Tätigkeiten und aus dem persönlichen Umfeld derer,
          über die zu richten ist. Die Verwaltung des Geisteslebens stellt sie
          auf; nach einer Zeit kehren sie in ihre eigene Arbeit zurück. Jeder
          Einzelne wählt aus dieser Gruppe auf Zeit seinen Richter — für fünf
          oder zehn Jahre — und nur der darf über ihn richten. Ein Kläger wendet
          sich an den Richter, den der Beklagte gewählt hat. So kommt das Urteil
          aus Sachkenntnis und persönlichem Vertrauen, nicht aus bürokratischer
          Ernennung. Dasselbe Zutrauen, das Menschen zum Geistesleben zieht,
          bestimmt, wie das Gericht eingesetzt wird. Der Staat legt fest, welche
          Rechte zwischen Menschen gelten; die Urteilsfindung liegt beim
          Geistesleben. Neben den Richtenden stehen Menschen mit engerer
          Gesetzeskenntnis; sie richten nicht selbst. Die Berufungsgerichte
          werden aus derselben Verwaltung des Geisteslebens heraus gebildet.
