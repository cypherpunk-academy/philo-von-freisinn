  - id: dm-09g
    feld: 9
    richtung: "Recht + Wirtschaft -> Geist"
    pol: gesund
    titel: "Schutz und Versorgung befreien den Geist"
    einwort: "Befreiung"
    schlagsatz: >
      Wer geschützt und versorgt ist, kann frei denken.
    these: >
      Rechtsleben und Wirtschaft wirken gemeinsam auf das Geistesleben ein,
      jedes mit seinen eigenen Mitteln: das Recht schützt die Freiheit, die
      Wirtschaft stellt die materiellen Grundlagen bereit. Zusammen schaffen sie
      die Bedingungen, unter denen freies Geistesleben möglich wird.
    kurz_text: >
      Wenn der Staat die Geistesfreiheit schützt und die Wirtschaft die
      materiellen Grundlagen bereitstellt, kann das Geistesleben in voller
      Freiheit wirken. Der Lehrer ist geschützt vor politischer Einflussnahme
      und versorgt, ohne wirtschaftlichen Auflagen zu unterliegen — und kann
      deshalb lehren, was er als wahr erkennt.
    text: >
      Das Geistesleben braucht zweierlei, um frei wirken zu können: den Schutz
      seiner Freiheit und die Versorgung seiner materiellen Grundlagen. Beides
      kann es nicht aus sich selbst erzeugen — Dichter können sich kein
      Grundrecht schreiben, und Forscher können sich nicht selbst finanzieren.
      Im gesunden Fall übernehmen Recht und Wirtschaft diese Aufgaben — jedes
      aus seinem eigenen Wesen heraus. Das Recht schützt: Es garantiert
      Lehrfreiheit, Pressefreiheit, Religionsfreiheit, Kunstfreiheit — nicht als
      Gnade, sondern als Grundrecht. Die Wirtschaft versorgt: Sie stellt Mittel
      bereit, ohne inhaltliche Bedingungen zu stellen. Wenn beides
      zusammenkommt, entsteht ein Freiraum, in dem geistige Produktivität sich
      entfalten kann. Der Lehrer kann lehren, was er als wahr erkennt — nicht
      was der Staat vorschreibt (Feld 3k) und nicht was der Sponsor bestellt
      (Feld 6k). Der Forscher kann forschen, wohin die Frage führt — nicht wohin
      der Förderantrag zeigt. Dieser doppelte Schutzraum ist die höchste
      Leistung, die Recht und Wirtschaft für das Geistesleben erbringen können:
      die Abwesenheit von Einmischung bei gleichzeitiger Anwesenheit von
      Grundlagen.
    zitate:
      - text: "[Platzhalter — Steiner-Zitat zu Freiheit des Geisteslebens]"
        quelle: "GA 23 / GA 24"
    beispiele:
      - "Grundgesetzlich geschützte Wissenschaftsfreiheit + ausreichende
        Grundfinanzierung der Hochschulen"
      - "Freie Waldorfschulen: staatlich anerkannt (Schutz) und durch
        Elternbeiträge getragen (Versorgung)"
      - "Öffentlich-rechtlicher Rundfunk: gesetzlich unabhängig und
        gebührenfinanziert"
    gegenpol: dm-09k
    leitprinzip: "Gleichheit + Brüderlichkeit"
    eigene_mittel:
      - "Schutz"
      - "Grundrecht"
      - "Versorgung"
      - "Mittel"
    fremde_mittel: []
    aktualitaet: >
      Debatte um Grundfinanzierung vs. Wettbewerbsfinanzierung der Wissenschaft;
      Unabhängigkeit des öffentlich-rechtlichen Rundfunks.
    spannung: 4
    chunk_id: 52d543ad-4969-41ed-a7c4-bebf25889c7c

  - id: dm-09k
    feld: 9
    richtung: "Recht + Wirtschaft -> Geist"
    pol: krank
    titel: "Macht und Geld formen den Geist"
    einwort: "Formung"
    schlagsatz: >
      Wenn Staat und Kapital sich einig sind, hat die Wahrheit keine Chance.
    these: >
      Staatliche Macht und wirtschaftlicher Druck wirken gemeinsam auf das
      Geistesleben ein und formen es nach ihren Interessen. Das Geistesleben
      verliert seine Unabhängigkeit von zwei Seiten gleichzeitig — und damit
      jede Möglichkeit der Selbstkorrektur.
    kurz_text: >
      Wenn der Staat vorschreibt, was gedacht werden darf, und die Wirtschaft
      bestimmt, was sich denken lohnt, ist das Geistesleben in der Zange. Es
      kann weder gegen die Macht noch gegen das Geld aufbegehren, weil beide
      gleichzeitig auf es einwirken.
    text: >
      Dies ist die schärfste Krankheitsform — der Angriff auf das Geistesleben
      von zwei Seiten zugleich. Staatliche Macht bestimmt den Rahmen des
      Erlaubten, wirtschaftliche Macht bestimmt den Rahmen des Finanzierbaren —
      und dazwischen bleibt für freies Denken kein Raum. Das historische
      Beispiel ist die Verschmelzung von Partei und Kapital im Faschismus: Der
      Staat verbietet abweichendes Denken, die Wirtschaft finanziert nur
      linientreues Denken. Aber auch in Demokratien gibt es Formen dieser
      Doppelwirkung: wenn Forschungsförderung an politisch gewünschte Ergebnisse
      geknüpft wird und gleichzeitig die Privatwirtschaft nur noch
      „anwendungsorientierte" Forschung finanziert; wenn Medien gleichzeitig
      staatlicher Regulierung und wirtschaftlichem Konzentrationsdruck
      unterliegen; wenn Bildungsstandards vom Staat gesetzt und von der
      Wirtschaft diktiert werden — und beides in dieselbe Richtung zeigt. Die
      besondere Gefährlichkeit liegt darin, dass das Geistesleben seine
      Korrekturfunktion verliert: Es kann weder den Staat noch die Wirtschaft
      kritisieren, weil es von beiden abhängt. Damit fällt die einzige Instanz
      aus, die Übergriffe benennen könnte.
    zitate:
      - text: "[Platzhalter — Steiner-Zitat zu Unfreiheit des Geisteslebens]"
        quelle: "GA 23 / GA 24"
    beispiele:
      - "Faschismus: Partei und Kapital formen gemeinsam Kultur und Wissenschaft"
      - "Forschungslandschaft gleichzeitig unter politischem Ergebnisdruck und
        wirtschaftlichem Verwertungszwang"
      - "Medien unter staatlicher Regulierung und wirtschaftlichem
        Konzentrationsdruck"
      - "Bildungssystem gleichzeitig von Lehrplanvorgaben (Staat) und
        Employability-Druck (Wirtschaft) geformt"
    gegenpol: dm-09g
    leitprinzip: "Gleichheit + Brüderlichkeit (beide pervertiert)"
    eigene_mittel: []
    fremde_mittel:
      - "Macht"
      - "Geld"
      - "Zensur"
      - "Kaufdruck"
    aktualitaet: >
      Verschmelzung von Plattformökonomie und staatlicher Inhaltskontrolle
      (China, aber auch westliche Tendenzen); KI-Modelle unter Konzernkontrolle
      mit staatlichen Auflagen.
    spannung: 5
    chunk_id: 4f6c20e1-4b0e-4a73-aa14-3e92aaae29d
