      - schlagwort: Gabe
        schlagsatz: Mit der Gabe endet der Anspruch.
        kurztext: >
          Das Geistesleben lässt sich nicht nach Marktgesetzen organisieren;
          seine Finanzierung ist Schenkungsgeld: Mittel ohne vereinbarte
          Gegenleistung. Das Rechtsleben sichert den Zufluss; das Geben ist
          wirtschaftliche Tat. Mit der Gabe endet jeder wirtschaftliche Anspruch
          — wohin die Mittel fließen, entscheidet das Geistesleben allein. Es
          prüft sich selbst: durch die Aufnahme derer, die lernen, und durch das
          Urteil der Fachgenossen. Wem niemand zuhört, den trägt auch das
          freieste Geistesleben nicht. Wo freie Arbeit blüht, wird gern
          geschenkt; wo die Gaben versiegen, verkümmert die Arbeit. Aus
          Zahlungsmittel wird Möglichkeit.
        text: >
          Das Geistesleben lässt sich nicht nach Marktgesetzen organisieren;
          seine Finanzierung muss das Schenkungsgeld sein: Mittel, die gegeben
          werden, ohne dass eine Gegenleistung vereinbart wäre — Stiftungen,
          Mäzenatentum, freie Beiträge. Das Rechtsleben sichert den Zufluss
          rechtlich; das eigentliche Geben aber ist wirtschaftliche Tat. Hier
          liegt die Übergabe des Feldes: Mit der Gabe endet jeder
          wirtschaftliche Anspruch — wohin die Mittel fließen, entscheidet das
          Geistesleben allein. Das ist kein Freibrief, denn das Geistesleben
          prüft sich selbst: durch die freie Aufnahme derer, die lernen und sich
          anvertrauen, und durch das Urteil der Fachgenossen. Wem niemand
          zuhört, den trägt auch das freieste Geistesleben nicht. Zugleich ist
          die Schenkung mehr als eine individuelle Geste: Geistesleben und
          Schenkungsstrom nähren einander im Kreislauf. Wo freie Arbeit blüht,
          wird gern geschenkt; wo die Gaben versiegen, verkümmert die Arbeit —
          und mit ihr der Anlass zu geben. An diesem Puls lesen die
          Assoziationen die Gesundheit des Ganzen ab: Aus Zahlungsmittel wird
          Möglichkeit, und der Strom selbst wird zum Lebenszeichen.
