        text: >
          Miturteil ist das Paar Pull Request und Review. Wer das Gesetz, das
          Urteil macht, das Vorhaben entwickelt, bezieht in seinem Tun alle ein,
          die er für wichtig hält: den, der die benachbarte Stelle kennt, den,
          den die Änderung trifft, den, der die Historie trägt, den, dessen
          Urteil er traut. Aus diesem Tun wird der Pull Request — und der geht
          an einen. Review ist das Urteil eines Zweiten am konkreten Unterschied
          zum geltenden Stand, auf Augenhöhe, aus der Sache: zustimmen, ändern,
          nachfragen. Der Verfasser nimmt auf, lässt begründet stehen, zieht in
          der Arbeit weitere hinzu. Bis zur Einführung bleibt er frei, wen er
          hinzuzieht und wann der Schritt reif ist — keine Pflichtstation, kein
          Ausschuss, keine Gegenzeichnung von Referat zu Abteilung. Das
          verhindert, dass ein Einzelner aus Blindheit oder Eigennutz
          entscheidet, ohne dass eine Hierarchie ihm die Augen zuweist. Das
          Geistesleben stellt die Menschen bereit, die so urteilen können;
          formale Abschlüsse ersetzen sie nicht.           Erst was so Schritt
          für Schritt gesehen wurde, liegt den Beteiligten als Ergebnis vor —
          bevor es gilt.
