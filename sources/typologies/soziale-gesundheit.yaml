      - schlagwort: Freistellung
        schlagsatz: Keine freie Zeit — kein freies Urteil.
        kurztext: >
          Demokratie lebt von Menschen, die Zeit einbringen: Abgeordnete,
          Schöffen, Wahlhelfer, Bürger an öffentlichen Projekten. Mitwirken kann
          nur, wer freigestellt wird. Die Wirtschaft gibt hier ihre knappste
          Ressource ab: Arbeitszeit. Sie trägt den Ausfall, hält den Platz offen
          — wer zurückkehrt, findet ihn unverändert; wer ganz in den
          öffentlichen Dienst geht, wird aus dem Gemeinsamen versorgt. Gesetze,
          die jeder verstehen können muss, brauchen auch jeden, der sie
          mitgestalten kann. Die Wirtschaft gibt den Bürger frei, für die Zeit,
          in der er nicht Arbeitskraft ist, sondern Rechtsgenosse.
        text: >
          Demokratie lebt nicht allein von Geld, sondern von Menschen, die ihre
          Zeit einbringen. Das Rechtsleben braucht Abgeordnete und
          Kommunalpolitiker, die sich ganz der öffentlichen Sache widmen;
          Schöffen und Wahlhelfer, die das Recht im Einzelfall tragen; Bürger,
          die an Projekten für die Allgemeinheit arbeiten; und Menschen, die
          Wahlen organisieren, Transparenz herstellen und die Kommunikation des
          Gemeinwesens pflegen. Mitwirken kann nur, wer dafür freigestellt wird.
          Deshalb gibt die Wirtschaft hier ihre knappste Ressource ab:
          Arbeitszeit. Sie trägt den Ausfall, hält den Arbeitsplatz offen und
          sorgt dafür, dass öffentliches Engagement kein berufliches Risiko
          bedeutet — wer zurückkehrt, findet seinen Platz im Betrieb unverändert
          vor; wer ganz in den öffentlichen Dienst geht, wird aus dem
          Gemeinsamen versorgt, nicht aus dem Betrieb bezahlt. Denn Gesetze, die
          jeder verstehen können muss, brauchen auch jeden, der sie mitgestalten
          kann. So gleicht sich die Leistung aus: Wie das Recht den Menschen aus
          dem Warenverkehr herausnimmt, gibt die Wirtschaft den Bürger frei —
          für die Stunden, Monate oder Jahre, in denen er nicht Arbeitskraft
          ist, sondern Rechtsgenosse unter Gleichen.
