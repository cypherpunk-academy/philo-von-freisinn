        text: >
          Ein Gesetz, das nur Fachleute durchschauen, schließt die meisten von
          der Mitbestimmung aus. Das freie Geistesleben formuliert Gesetze und
          Verordnungen in klarer, allgemeinverständlicher Sprache — und stellt
          die Unterstützung bereit, sie zu verstehen: im Zusammenhang, in der
          Vertiefung, in der Historie. Allgemeinverständlich geschrieben reicht
          nicht, wenn der Zusammenhang des Textes verschlossen bleibt; das
          Geistesleben hält beides bereit. Das Rechtsleben ist zuständig für
          alles, was jeder mündige Bürger verstehen kann — dort steht jeder dem
          anderen als Gleicher gegenüber, weil nur verhandelt wird, worüber
          jeder gleich urteilsfähig ist. Erst wenn ein Gesetz so weit frei
          formuliert und erschlossen ist, dass jeder es prüfen kann, geht es
          über ins Rechtsleben. Dann gilt der Geist der Gesetze, nicht der
          Buchstabe als Machttechnik: Der Paragraph dient dem Sinn, er ersetzt
          ihn nicht. Wo die Wortverstrickung eine Kaste von Auslegern zur
          eigentlichen Gesetzgebung macht, öffnet Verständlichkeit jedem
          mündigen Bürger die Texte — formal mitreden reicht nicht, faktisch
          mitreden wird möglich. Wer das Gesetz liest, braucht keinen
          Dolmetscher der Paragraphen; er kann den Einwand am Gesetz selbst
          prüfen und unter Mitwirken vortragen. So bleibt Demokratie mehr als
          eine Fassade, hinter der der Buchstabe regiert. Nur so ist Demokratie
          mehr als eine Illusion.
