  # ══════════════════════════════════════════════════════════════════════
  # FELD 8 — GEIST + WIRTSCHAFT → RECHT
  # ══════════════════════════════════════════════════════════════════════

  - id: dm-08g
    feld: 8
    richtung: "Geist + Wirtschaft -> Recht"
    pol: gesund
    titel: "Einsicht und Mittel tragen den Staat"
    einwort: "Grundlegung"
    schlagsatz: >
      Das Recht steht auf zwei Beinen — Erkenntnis und Leistungskraft.
    these: >
      Geistesleben und Wirtschaft wirken gemeinsam auf das Rechtsleben ein,
      jedes mit seinen eigenen Mitteln: das Geistesleben mit Sachkenntnis und
      Urteil, die Wirtschaft mit materiellen Mitteln. Zusammen bilden sie das
      Fundament, auf dem der Staat stehen kann.
    kurz_text: >
      Wenn das Geistesleben dem Staat Sachkenntnis liefert und die Wirtschaft
      ihm die materiellen Grundlagen bereitstellt — jeweils ohne inhaltliche
      Bedingungen —, steht das Rechtsleben auf einem doppelten Fundament aus
      Erkenntnis und Leistungskraft. Es kann dann seinen eigentlichen Auftrag
      erfüllen: gleiche Rechte für alle.
    text: >
      Das Rechtsleben kann aus sich selbst heraus weder Erkenntnis erzeugen noch
      materielle Mittel. Es braucht beides von außen — und die Frage ist, ob es
      dieses Außen als Stütze erhält oder als Fessel. Im gesunden Fall wirken
      Geistesleben und Wirtschaft als zwei unabhängige Quellen: Die eine liefert
      Urteilsfähigkeit, die andere Leistungskraft. Sachverständige beraten den
      Gesetzgeber, ohne ihm vorzuschreiben. Die Wirtschaft finanziert den Staat
      durch Steuern, ohne dafür Einfluss zu kaufen. Beide tragen den Staat — wie
      zwei Säulen ein Dach tragen, ohne das Dach zu sein. Die Schwierigkeit
      dieses Feldes liegt darin, dass die Grenze zwischen Stütze und
      Einflussnahme schmal ist. Ein Sachverständiger, der nicht nur berät,
      sondern bestimmt, hat die Grenze überschritten. Ein Steuerzahler, der für
      seine Steuern politische Gegenleistung erwartet, hat die Grenze
      überschritten. Gesundes Tragen heißt: geben, ohne zu bestimmen.
    zitate:
      - text: "[Platzhalter — Steiner-Zitat zu den Grundlagen des Rechtslebens]"
        quelle: "GA 23"
    beispiele:
      - "Sachverständige beraten den Gesetzgeber, Wirtschaft finanziert
        Verwaltung — beides ohne Gegenleistungserwartung"
      - "Bürgerliche Steuerpflicht als solidarischer Beitrag, nicht als
        Kaufpreis für Einfluss"
      - "Unabhängige Medien und finanziell gesicherter Staat als doppelte
        demokratische Grundlage"
    gegenpol: dm-08k
    leitprinzip: "Freiheit + Brüderlichkeit"
    eigene_mittel:
      - "Sachkenntnis"
      - "Urteil"
      - "Mittel"
      - "Leistung"
    fremde_mittel: []
    aktualitaet: >
      Verhältnis von Wissenschaft und Politik; Steuergerechtigkeit als
      Voraussetzung eines handlungsfähigen Staates.
    spannung: 3
    chunk_id: 1a751e8f-37f5-4874-a43b-0baa6b103b8c

  - id: dm-08k
    feld: 8
    richtung: "Geist + Wirtschaft -> Recht"
    pol: krank
    titel: "Lehre und Kapital schreiben das Gesetz"
    einwort: "Oligarchie"
    schlagsatz: >
      Wenn Experten und Geldgeber gemeinsam regieren, braucht es keine Wahl mehr.
    these: >
      Ideologie und Wirtschaftsmacht vereinigen sich, um das Recht nach ihren
      Interessen zu formen. Think Tanks, die von Konzernen finanziert werden,
      schreiben Gesetzesentwürfe; Expertengremien mit wirtschaftlicher
      Rückendeckung setzen sich über demokratische Prozesse hinweg.
    kurz_text: >
      Wenn eine bestimmte Lehre — ökonomisch, technologisch oder weltanschaulich
      — mit wirtschaftlicher Macht verbunden ist, kann sie den demokratischen
      Prozess aushebeln. Gesetze entstehen dann nicht im Parlament, sondern in
      Think Tanks, deren Agenda von denen bestimmt wird, die sie finanzieren.
    text: >
      Dies ist die verschärfte Form der Felder 1k (Glaube wird Gesetz) und 5k
      (Geld kauft Recht): Hier wirken Ideologie und Kapital gemeinsam auf das
      Recht ein. Das Ergebnis ist eine Form der Oligarchie, die sich
      demokratisch verkleidet. Think Tanks, die von Konzernen finanziert werden,
      erzeugen „Sachkenntnis", die zufällig den Interessen der Geldgeber dient.
      Lobbyorganisationen geben sich als zivilgesellschaftliche Akteure aus,
      während sie wirtschaftliche Interessen vertreten. Rating-Agenturen
      bewerten Staaten nach Kriterien, die sie selbst definieren, und erzwingen
      damit Gesetze — ohne jemals gewählt worden zu sein. Der Mechanismus ist
      doppelt wirksam, weil er sich auf zwei Quellen der Legitimität berufen
      kann: die Autorität des Wissens und die Autorität des Geldes. Gegen beides
      anzukämpfen überfordert den demokratischen Prozess — und genau das ist der
      Punkt. Die Verschmelzung von Doktrin und Kapital erzeugt eine Macht, die
      das Recht nicht mehr kontrollieren kann, weil sie seine Grundlagen von
      beiden Seiten gleichzeitig untergräbt.
    zitate:
      - text: "[Platzhalter — Steiner-Zitat zu Oligarchie/Plutokratie]"
        quelle: "GA 23 / GA 24"
    beispiele:
      - "Konzernfinanzierte Think Tanks schreiben Gesetzesentwürfe"
      - "Rating-Agenturen erzwingen Austeritätspolitik ohne demokratische
        Legitimation"
      - "Tech-Konzerne setzen Standards, die faktisch zu Gesetzen werden
        (Quasi-Regulierung)"
      - "Lobbyverbände mit wissenschaftlichem Anstrich"
    gegenpol: dm-08g
    leitprinzip: "Freiheit + Brüderlichkeit (beide pervertiert)"
    eigene_mittel: []
    fremde_mittel:
      - "Doktrin"
      - "Kapital"
      - "Pseudo-Expertise"
      - "Lobbymacht"
    aktualitaet: >
      Big-Tech-Regulierungsdebatte, ESG-Rating-Macht, konzernfinanzierte
      Wissenschaft als Politikberatung getarnt.
    spannung: 5
    chunk_id: 6962eb54-8f4c-44d9-817d-a2f5d9921c43

  # ══════════════════════════════════════════════════════════════════════
  # FELD 9 — RECHT + WIRTSCHAFT → GEIST
  # ══════════════════════════════════════════════════════════════════════

  - id: dm-09g
    feld: 9
    richtung: "Recht + Wirtschaft -> Geist"
    pol: gesund
    titel: "Schutz und Versorgung befreien den Geist"
    einwort: "Befreiung"
    schlagsatz: >
      Wer geschützt und versorgt ist, kann frei denken.
    these: >
      Rechtsleben und Wirtschaft wirken gemeinsam auf das Geistesleben ein,
      jedes mit seinen eigenen Mitteln: das Recht schützt die Freiheit, die
      Wirtschaft stellt die materiellen Grundlagen bereit. Zusammen schaffen sie
      die Bedingungen, unter denen freies Geistesleben möglich wird.
    kurz_text: >
      Wenn der Staat die Geistesfreiheit schützt und die Wirtschaft die
      materiellen Grundlagen bereitstellt, kann das Geistesleben in voller
      Freiheit wirken. Der Lehrer ist geschützt vor politischer Einflussnahme
      und versorgt, ohne wirtschaftlichen Auflagen zu unterliegen — und kann
      deshalb lehren, was er als wahr erkennt.
    text: >
      Das Geistesleben braucht zweierlei, um frei wirken zu können: den Schutz
      seiner Freiheit und die Versorgung seiner materiellen Grundlagen. Beides
      kann es nicht aus sich selbst erzeugen — Dichter können sich kein
      Grundrecht schreiben, und Forscher können sich nicht selbst finanzieren.
      Im gesunden Fall übernehmen Recht und Wirtschaft diese Aufgaben — jedes
      aus seinem eigenen Wesen heraus. Das Recht schützt: Es garantiert
      Lehrfreiheit, Pressefreiheit, Religionsfreiheit, Kunstfreiheit — nicht als
      Gnade, sondern als Grundrecht. Die Wirtschaft versorgt: Sie stellt Mittel
      bereit, ohne inhaltliche Bedingungen zu stellen. Wenn beides
      zusammenkommt, entsteht ein Freiraum, in dem geistige Produktivität sich
      entfalten kann. Der Lehrer kann lehren, was er als wahr erkennt — nicht
      was der Staat vorschreibt (Feld 3k) und nicht was der Sponsor bestellt
      (Feld 6k). Der Forscher kann forschen, wohin die Frage führt — nicht wohin
      der Förderantrag zeigt. Dieser doppelte Schutzraum ist die höchste
      Leistung, die Recht und Wirtschaft für das Geistesleben erbringen können:
      die Abwesenheit von Einmischung bei gleichzeitiger Anwesenheit von
      Grundlagen.
    zitate:
      - text: "[Platzhalter — Steiner-Zitat zu Freiheit des Geisteslebens]"
        quelle: "GA 23 / GA 24"
    beispiele:
      - "Grundgesetzlich geschützte Wissenschaftsfreiheit + ausreichende
        Grundfinanzierung der Hochschulen"
      - "Freie Waldorfschulen: staatlich anerkannt (Schutz) und durch
        Elternbeiträge getragen (Versorgung)"
      - "Öffentlich-rechtlicher Rundfunk: gesetzlich unabhängig und
        gebührenfinanziert"
    gegenpol: dm-09k
    leitprinzip: "Gleichheit + Brüderlichkeit"
    eigene_mittel:
      - "Schutz"
      - "Grundrecht"
      - "Versorgung"
      - "Mittel"
    fremde_mittel: []
    aktualitaet: >
      Debatte um Grundfinanzierung vs. Wettbewerbsfinanzierung der Wissenschaft;
      Unabhängigkeit des öffentlich-rechtlichen Rundfunks.
    spannung: 4
    chunk_id: 52d543ad-4969-41ed-a7c4-bebf25889c7c

  - id: dm-09k
    feld: 9
    richtung: "Recht + Wirtschaft -> Geist"
    pol: krank
    titel: "Macht und Geld formen den Geist"
    einwort: "Formung"
    schlagsatz: >
      Wenn Staat und Kapital sich einig sind, hat die Wahrheit keine Chance.
    these: >
      Staatliche Macht und wirtschaftlicher Druck wirken gemeinsam auf das
      Geistesleben ein und formen es nach ihren Interessen. Das Geistesleben
      verliert seine Unabhängigkeit von zwei Seiten gleichzeitig — und damit
      jede Möglichkeit der Selbstkorrektur.
    kurz_text: >
      Wenn der Staat vorschreibt, was gedacht werden darf, und die Wirtschaft
      bestimmt, was sich denken lohnt, ist das Geistesleben in der Zange. Es
      kann weder gegen die Macht noch gegen das Geld aufbegehren, weil beide
      gleichzeitig auf es einwirken.
    text: >
      Dies ist die schärfste Krankheitsform — der Angriff auf das Geistesleben
      von zwei Seiten zugleich. Staatliche Macht bestimmt den Rahmen des
      Erlaubten, wirtschaftliche Macht bestimmt den Rahmen des Finanzierbaren —
      und dazwischen bleibt für freies Denken kein Raum. Das historische
      Beispiel ist die Verschmelzung von Partei und Kapital im Faschismus: Der
      Staat verbietet abweichendes Denken, die Wirtschaft finanziert nur
      linientreues Denken. Aber auch in Demokratien gibt es Formen dieser
      Doppelwirkung: wenn Forschungsförderung an politisch gewünschte Ergebnisse
      geknüpft wird und gleichzeitig die Privatwirtschaft nur noch
      „anwendungsorientierte" Forschung finanziert; wenn Medien gleichzeitig
      staatlicher Regulierung und wirtschaftlichem Konzentrationsdruck
      unterliegen; wenn Bildungsstandards vom Staat gesetzt und von der
      Wirtschaft diktiert werden — und beides in dieselbe Richtung zeigt. Die
      besondere Gefährlichkeit liegt darin, dass das Geistesleben seine
      Korrekturfunktion verliert: Es kann weder den Staat noch die Wirtschaft
      kritisieren, weil es von beiden abhängt. Damit fällt die einzige Instanz
      aus, die Übergriffe benennen könnte.
    zitate:
      - text: "[Platzhalter — Steiner-Zitat zu Unfreiheit des Geisteslebens]"
        quelle: "GA 23 / GA 24"
    beispiele:
      - "Faschismus: Partei und Kapital formen gemeinsam Kultur und Wissenschaft"
      - "Forschungslandschaft gleichzeitig unter politischem Ergebnisdruck und
        wirtschaftlichem Verwertungszwang"
      - "Medien unter staatlicher Regulierung und wirtschaftlichem
        Konzentrationsdruck"
      - "Bildungssystem gleichzeitig von Lehrplanvorgaben (Staat) und
        Employability-Druck (Wirtschaft) geformt"
    gegenpol: dm-09g
    leitprinzip: "Gleichheit + Brüderlichkeit (beide pervertiert)"
    eigene_mittel: []
    fremde_mittel:
      - "Macht"
      - "Geld"
      - "Zensur"
      - "Kaufdruck"
    aktualitaet: >
      Verschmelzung von Plattformökonomie und staatlicher Inhaltskontrolle
      (China, aber auch westliche Tendenzen); KI-Modelle unter Konzernkontrolle
      mit staatlichen Auflagen.
    spannung: 5
    chunk_id: 4f6c20e1-4b0e-4a73-aa14-3e92aaae29d
