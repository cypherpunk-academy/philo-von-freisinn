      - schlagwort: Transparenz
        schlagsatz: Jeder hat ein Recht, alles zu erfahren — wie die Ware entsteht und was danach mit ihr geschieht.
        kurztext: >
          Jeder hat das Recht zu erfahren, wie seine Waren hergestellt
          wurden und werden. Das Rechtsleben sichert, dass man jederzeit
          in die Prozesse hineinschauen kann — und erfahren, was danach
          mit der Ware geschieht, bis zur Entsorgung. Das ist volle
          Transparenz für den Verwender, nicht Gnade des Herstellers,
          sondern Anspruch. Sie ist das Gegenstück zum Zugang zum Wissen
          im Geistesleben: Dort kann jeder erfahren, hier muss die
          Wirtschaft zeigen.
        text: >
          Jeder Mensch hat das Recht zu erfahren, wie die Waren, die er
          verwendet, hergestellt wurden und werden. Das Rechtsleben
          sichert, dass man jederzeit in die Prozesse hineinschauen
          kann: aus welchen Stoffen, unter welchen Bedingungen, mit
          welchen Folgen für Mensch und Natur eine Ware entsteht. Und
          dass man erfahren kann, was danach mit ihr geschieht, wenn sie
          abgegeben ist — wie sie genutzt, weitergegeben, entsorgt wird.
          Das ist volle Transparenz für den Verwender, nicht als Gnade
          des Herstellers, sondern als Anspruch. Sie ist das Gegenstück
          zum Zugang zum Wissen, den das Recht dem Geistesleben öffnet:
          Dort kann jeder erfahren, wie die Dinge hergestellt werden,
          die er verwendet; hier ist die Wirtschaft verpflichtet, es zu
          zeigen. Was verschlossen bleibt, entzieht sich der Prüfung und
          damit der Verbesserung; was offenliegt, kann besser werden.
          Das Recht schreibt der Wirtschaft nicht vor, was sie erzeugt
          und wie — aber es sorgt dafür, dass nichts im Dunkeln bleibt,
          was die Menschen betrifft, die es verwenden. So kann die
          Wirtschaft frei wirtschaften, und wer ihre Erzeugnisse nutzt,
          weiß, was er nutzt.
