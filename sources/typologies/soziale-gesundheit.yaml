    text: |
      Im kranken Feld Geist -> Recht verlässt eine Überzeugung ihre freie Sphäre und wird zum Paragraphen, auch für die, die sie nie geteilt haben. Die Richtung kehrt sich um: Nicht Menschen tragen ihr Können ins Recht, sondern das Recht erhält fertige Inhalte, die es nur noch beschließen muss.

      Sieben Aspekte zeigen, wie das geschieht. **Vorschrift:** Gottesgesetz, Rassenlehre oder das Dogma vom grenzenlosen Wachstum werden für alle verbindlich, und der Lehrplan sorgt dafür, dass schon die Kinder es lernen. **Verhaltensnorm:** Gesetze entstehen aus Mehrheit, Kompromiss und Lobby; wechselt die Mehrheit, verbietet die nächste, was die vorige vorschrieb. **Dienstweg:** Die Hierarchie weist zu, wer prüft und wer mitredet. **Wortverstrickung:** Gesetze werden so verfasst, dass nur Juristen, Beamte und Lobbyisten sie auslegen können. **Vorverurteilung:** Nach der Offenlegung folgt Strafe ohne Verfahren. **Expertokratie:** Sachverstand wird zum Vorwand, demokratische Entscheidungen zu umgehen. **Desinformation:** Gefälligkeitsgutachten und ungeprüfte Berichte vergiften die Grundlage, auf der entschieden wird; ein Rechtssinn kann sich so nicht bilden.

      Der Gegenpol ist „Sachkenntnis prägt das Recht“: Dort gibt das Geistesleben Fähigkeiten und Einsicht, und das Recht bestimmt selbst, was unter Gleichen gilt.
