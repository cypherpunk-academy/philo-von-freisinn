  # FELD 3 — RECHT → GEIST
  # ══════════════════════════════════════════════════════════════════════

  - id: dm-03g
    feld: 3
    richtung: "Recht -> Geist"
    pol: gesund
    titel: "Der Staat bewahrt die Freiheit des Einzelnen"
    kurz: >
      Das Rechtsleben bestimmt keine Inhalte des Geisteslebens, es schafft den
      äußeren Rahmen, in dem es frei ist. Es garantiert die Freiheit des
      Denkens, den Zugang zum Wissen und gleiche Chancen zur Entfaltung. Es
      sichert den Zufluss geschenkter Mittel, ohne über ihre Verwendung zu
      entscheiden, schützt den inneren Raum der Arbeit und das persönliche
      Richten. Jeder darf Ergebnisse ohne Vorprüfung kommentieren.
    text: |
      Im gesunden Feld Recht -> Geist bewahrt der Staat die Freiheit des Geisteslebens, statt es zu lenken. Er stellt diese Freiheit nicht her, er gibt sie frei: als garantiertes Recht, nicht als Privileg.

      Sieben Aspekte zeigen, wie das geschieht. **Freiheit:** Das Rechtsleben schützt die innere Freiheit gegen staatliche Bevormundung und wirtschaftlichen Druck; der Lehrer findet die Inhalte in der Begegnung mit dem Kind. **Zugang:** Jeder hat Anspruch auf das Wissen, das er zum Urteilen braucht, und das Kind auf seine Bildung. **Chancen:** Das Recht gleicht die Startbedingungen aus, nicht die Ergebnisse. **Schenkung:** Geistige Arbeit wird aus Schenkung getragen; das Recht sichert den Zufluss, das Geistesleben entscheidet, wohin die Mittel fließen. **Schutzraum:** Entwurf und Austausch bleiben privat, solange nichts geteilt ist; gläsern ist der Staat, geschützt der Bürger. **Richten:** Der Angeklagte wählt seinen Richter auf Zeit, und das Recht schützt dieses Richten vor Weisung und Abhängigkeit. **Mitreden:** Jeder kann Ergebnisse kommentieren und Verbesserungen vorschlagen, ohne Vorprüfung und mit seinem Namen.

      Der Gegenpol ist „Die Politik lenkt das Denken“: Dort legt der Staat Inhalte fest, hält Wissen zurück und bindet seine Mittel an Bedingungen.
    aspekte:
      - schlagwort: Freiheit
        schlagsatz: Niemand greift dir ins Denken.
        kurztext: >
          Das Rechtsleben schützt die innere Freiheit gegen staatliche
          Bevormundung und wirtschaftlichen Druck. Es bestimmt keine Inhalte, es
          schafft nur den äußeren Rahmen. In der Schule heißt das: Der Lehrer
          findet die Inhalte in der Begegnung mit dem Kind. Mitbestimmen darf
          nur, wer selbst unterrichtet. Die Freiheit des Geisteslebens ist kein
          Privileg, sondern ein garantiertes Recht: Das Rechtsleben stellt sie
          nicht her — es gibt sie frei.
        text: >
          Das Rechtsleben schützt die innere Freiheit nach zwei Seiten: gegen
          staatliche Bevormundung und gegen wirtschaftlichen Druck. Es sorgt
          dafür, dass keiner dem anderen seine Gedanken aufzwingt. Dabei
          bestimmt es keine Inhalte — es schafft nur den äußeren Rahmen, in dem
          geistige Arbeit ungehindert geschehen kann. In der Schule heißt das:
          Die Lehrinhalte werden in der Begegnung mit den Schülern und Studenten
          gefunden. Der Lehrer schaut das Kind an und entscheidet, was es jetzt
          braucht; was trägt, wird weitergegeben, was nicht mehr trägt, fällt
          weg. Über Inhalte und Methoden bestimmen nur die, die selbst
          unterrichten und erziehen — kein Parlament, keine Behörde, niemand,
          der einmal unterrichtet hat, es aber nicht mehr tut. Was du denkst,
          erkennst und gestaltest, bleibt allein dir und dem freien Geistesleben
          überlassen. So ist die Freiheit, die das Geistesleben braucht, kein
          Privileg, das es sich selbst verleiht, sondern ein garantiertes Recht:
          Das Rechtsleben stellt sie nicht her — es gibt sie frei.
