      - schlagwort: Machtspiel
        schlagsatz: Zu groß, um belangt zu werden.
        kurztext: >
          Wenn der Staat auf Steuern oder Kredite großer Akteure angewiesen ist,
          fehlt ihm die Kraft, gegen sie vorzugehen. Die Bank, deren
          Zusammenbruch das Land erschüttern würde, wird gerettet statt
          bestraft. Die Werkzeuge sind da — Gerichte, Paragraphen —, aber die
          Hand gehorcht der Abhängigkeit. Der Ladendieb wird bestraft, der
          Bilanzfälscher bekommt eine Abfindung. Hinter der juristischen Person
          verschwindet die Verantwortung. Substanzlose Finanztitel machen den
          Akteur „systemrelevant“: nicht weil er etwas Wertvolles hält, sondern
          weil sein Zusammenbruch alles andere mitrisse. Nichts zersetzt den
          Rechtssinn gründlicher als Geltung, die vor der Größe haltmacht.
        text: >
          Wenn der Staat auf Steuern oder Kredite großer Akteure angewiesen ist,
          fehlt ihm die Kraft, rechtlich gegen sie vorzugehen. Die Bank, deren
          Zusammenbruch — oft durch Korruption — das Land erschütterte, wird
          gerettet statt bestraft; der Konzern, an dem eine Region hängt,
          geschont statt geprüft; der Gläubiger der Anleihen hofiert. Gerichte,
          Behörden, Paragraphen sind da — aber die Hand gehorcht der
          Abhängigkeit: Man vollstreckt nicht gegen den, von dem man lebt. Recht
          mit Größenvorbehalt greift nur noch nach unten: Ladendieb bestraft,
          Bilanzfälscher mit Abfindung; Schwarzfahrerin sitzt, Steuertrickser
          verhandelt — bei genügend Millionen nicht einmal das. Gleichheit
          endet, wo Abhängigkeit beginnt; das weiß jeder. Die juristische Person
          verschärft es: haftet keine Person, sondern eine Rechtsform —
          Verantwortung verschwindet. Wer nicht persönlich haftet, droht
          leichter; der Staat fragt, wen er belangen soll, wenn Vorstand,
          Aufsichtsrat und Markt sich gegenseitig abschirmen. Substanzlose
          Finanztitel — Derivate, Verbriefungen — machen den Akteur
          „systemrelevant": nicht weil er Wert hält, sondern weil sein Sturz
          alles mitreißt. Nichts zersetzt den Rechtssinn gründlicher als
          Geltung, die vor der Größe haltmacht.
