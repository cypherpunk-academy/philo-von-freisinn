name: "4 Epochen der Gedankenentwicklung"
aliases:
  - "Vier Epochen der Gedankenentwicklung"
  - "Epochen der Gedankenentwicklung"
  - "Epochen des philosophischen Menschheitsstrebens"
  - "Epochen der Philosophiegeschichte"
  - "Rätsel der Philosophie"
kurz: >
  Rudolf Steiner unterscheidet in „Die Rätsel der Philosophie“ vier Epochen des
  abendländischen Philosophierens von je sieben bis acht Jahrhunderten. Der
  Gedanke wird erst wie eine Wahrnehmung von außen erlebt, dann als Erzeugnis
  der Seele gefühlt, dann auf seine Wirklichkeit geprüft. Heute sucht die
  selbstbewusste Seele ein Weltbild, in dem sie und die Natur zugleich Platz
  haben.
text: |
  Die **4 Epochen der Gedankenentwicklung** (auch *Epochen des philosophischen Menschheitsstrebens* genannt) sind nach Rudolf Steiner die großen Abschnitte, in denen sich das abendländische Philosophieren entwickelt hat. In der Einleitung zu „Die Rätsel der Philosophie“ stellt er sie voran, als Ergebnis, nicht als Ausgangspunkt seiner Betrachtung.

  **Mitglieder:**
  1. **Das erwachende Gedankenleben** – vom griechischen Altertum (Pherekydes, Thales) bis zur Begründung des Christentums.
  2. **Das Erwachen des Selbstbewusstseins** – von der Begründung des Christentums bis etwa Scotus Erigena (gest. 877).
  3. **Die Prüfung des Gedankenlebens auf seine Wirklichkeit** – Scholastik, Nominalismus und Realismus, mittelalterliche Mystik.
  4. **Die selbstbewusste Seele vor dem Naturbild** – von Descartes, Giordano Bruno und Leibniz bis in die Gegenwart.

  **Beschreibung:** Jede Epoche dauert sieben bis acht Jahrhunderte. In jeder wirkt unter der äußeren Geschichte ein anderer geistiger Impuls, der in die Persönlichkeiten einstrahlt. Die deutlichen Unterschiede der Epochen sind Steiner ein Beweis für objektive geistige Impulse, die sich im Zeitenlauf fortentwickeln. Vor der ersten Epoche lebt die Seele in sinnbildlichen Vorstellungen; erst in Griechenland wird echter Gedanke geboren. Die Gegenwart steht etwa in der Mitte der vierten Epoche. Ihre Grundfrage: Wie gelangt die Seele zu einem Weltbild, in dem die Innenwelt und die Natur zugleich sicher verankert sind? Am Schluss des Buchs weist Steiner diese Frage auf eine Anthroposophie hin.
