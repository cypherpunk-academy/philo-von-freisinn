temperamente:
  - name: Sanguinisches Temperament (Ätherleib)
    kurz: >
      Das sanguinische Kind interessiert sich rasch für alles Mögliche und lässt
      das Interesse ebenso rasch wieder fallen. Beim Kind waltet der Ätherleib
      vor, beim Erwachsenen der Astralleib. Es hat viel Erregbarkeit und wenig
      Stärke. Man kommt ihm entgegen, indem man viel in seine Aufmerksamkeit
      bringt und es sinnlich beschäftigt.
    text: >
      Das sanguinische Temperament erkennt man nach Rudolf Steiner daran, dass
      ein Kind sich für alles Mögliche nur kurz interessiert und sein Interesse
      rasch wieder zurückzieht. Es nimmt äußere Eindrücke schnell auf und lässt
      sie ebenso schnell vorübergehen. Beim Kind beruht es auf einem Vorwalten
      des Ätherleibs, beim Erwachsenen auf dem des Astralleibs. In Steiners
      Schema hat der Sanguiniker viel Erregbarkeit und wenig Stärke; er steht
      dem Melancholiker polar gegenüber und geht leicht ins Phlegmatische über.
      Dem Körperbau nach nennt Steiner die sanguinischen Kinder „die
      normalsten“. Falsch wäre es, dem Kind seine Eigenschaften austreiben zu
      wollen. Man soll ihm entgegenkommen, möglichst viel in die Sphäre seiner
      Aufmerksamkeit bringen und es sinnlich beschäftigt sein lassen; dann
      schleift sich die Anlage allmählich ab und harmonisiert sich mit den
      anderen. Im Unterricht wendet man sich mit dem, was angeschaut werden
      soll, an die sanguinische Gruppe. Beim Zeichnen hilft die variierte
      Wiederholung, beim Rechnen ist das Multiplizieren verwandt. Steiner deutet
      das Temperament auch karmisch: Wer in einem Leben zur Einsamkeit gezwungen
      war, kann im nächsten Sanguiniker werden, der auf alles aufmerksam ist.
      Die krankhafte Ausartung des Sanguinischen ist die Narrheit.
    chunk_id: 8cc47b6f-6d42-465c-880f-0f82d4a0c9c7
  - name: Cholerisches Temperament (Astralleib)
    kurz: >
      Das cholerische Kind bringt seinen Willen durch eine Art Toben zum
      Ausdruck. Beim Kind waltet der Astralleib vor, beim Erwachsenen das Ich.
      Stärke und Erregbarkeit sind am größten. Der Lehrer bleibt dem Toben
      gegenüber äußerlich gelassen und bespricht den Vorfall am nächsten Tag mit
      voller Teilnahme.
    text: >
      Cholerische Kinder sind nach Rudolf Steiner die, die ihren Willen stark
      durch eine Art Toben zum Ausdruck bringen. Beim Kind beruht das
      Temperament auf einem Vorwalten des Astralleibs; beim Erwachsenen geht es
      über ins Vorwalten des Ich, es überspringt sogar die Vererbung vom
      Mütterlichen ins Väterliche. Im Schema sind Stärke und Erregbarkeit beim
      Choleriker am größten; sein Gegenpol ist das Phlegma, „verschieden wie
      Nord- und Südpol“. Dem Körperbau nach haben cholerische Kinder einen
      untersetzten Bau, so dass der Kopf beinahe im Körper versinkt. Das
      Temperament ist kein Fehler: Aus Leben und Leidenschaft der Choleriker
      geht viel hervor, und die Weltgeschichte wäre ohne sie anders verlaufen.
      Bei Michelangelo und Beethoven sieht Steiner eine Mischung von
      melancholischem und cholerischem Temperament. Der Lehrer soll das Toben
      nicht verhindern, sondern innerlich teilnahmslos, mit kaltem Blut
      zuschauen. Wirft das Kind das Tintenfass zu Boden, so sagt man mit
      möglichster Ruhe: Du hast nun das Tintenfass zerschmissen. Am nächsten
      Tag, wenn das Kind ruhig ist, bespricht man die Sache teilnahmsvoll und
      lässt es die Szene im Gedächtnis wiederholen. Beim Rechnen ist das
      Dividieren, vom Teil zum Dividenden zurück, die Rechnungsart der
      Choleriker. Die Ausartung ist die Tobsucht.
    chunk_id: a4c049f2-acfb-4191-b019-96679fe2ac8b
  - name: Phlegmatisches Temperament (physischer Leib)
    kurz: >
      Das phlegmatische Kind ist in sich versunken, innerlich unbeschäftigt und
      zeigt keine Teilnahme nach außen. Beim Kind waltet der physische Leib vor,
      beim Erwachsenen der Ätherleib. Stärke und Erregbarkeit sind am
      geringsten. Der Lehrer bringt innerlich viel Teilnahme auf, gibt sich
      äußerlich aber teilnahmslos wie ein Spiegel.
    text: >
      Phlegmatische Kinder erkennt man nach Rudolf Steiner daran, dass sie in
      sich versunken sind und doch keine Teilnahme nach außen zeigen; anders als
      die melancholischen sind sie innerlich unbeschäftigt. Beim Kind beruht das
      Temperament auf einem Vorwalten des physischen Leibs, beim Erwachsenen auf
      dem des Ätherleibs. Im Schema sind Stärke und Erregbarkeit am geringsten;
      das Phlegma geht leicht ins Sanguinische über, aber niemals leicht ins
      Cholerische, seinen Gegenpol. Dem Körperbau nach haben phlegmatische
      Kinder die Schultern mehr heraus. Der Lehrer soll recht viel Teilnahme für
      ein solches Kind in sich erwecken und sich für jede Lebensregung
      interessieren; findet man den Zugang zu seiner Teilnahmslosigkeit, kann es
      sehr interessant werden. Äußern soll er dieses Interesse aber nicht,
      sondern teilnahmslos scheinen, so dass das Kind in ihm das Spiegelbild
      seines eigenen Wesens sieht. Beim Rechnen ist das Addieren, ausgehend von
      der Summe, die Rechnungsart der Phlegmatiker. Beim Zeichnen empfiehlt
      Steiner gesprenkelte, karierte Motive. Beim Erzählen soll man an wichtigen
      Stellen innehalten und die Neugier wecken, damit die Fantasie
      weiterarbeitet: „Die Königstochter, – die war – sehr schön, – aber –
      weniger – gut!“ Die Ausartung des Phlegmatischen ist der Schwachsinn.
    chunk_id: 1d5dc1a1-0c79-4187-86e3-38800893b405
  - name: Melancholisches Temperament (Ich)
    kurz: >
      Das melancholische Kind neigt zum inneren Grübeln und Brüten; es ist für
      äußere Eindrücke schwer zu haben, aber innerlich beschäftigt. Beim Kind
      waltet das Ich vor, beim Erwachsenen der physische Leib. Es hat wenig
      Erregbarkeit und viel Stärke. Hilfreich sind Biographien großer
      Persönlichkeiten und die Einsicht, dass andere Ähnliches erleben.
    text: >
      Melancholische Kinder neigen nach Rudolf Steiner zum inneren Grübeln und
      Brüten. Sie sind für Eindrücke der Außenwelt nicht leicht zu haben, aber
      man hat nie den Eindruck, dass sie innerlich unbeschäftigt sind. Beim Kind
      beruht das Temperament auf einem Vorwalten des Ich in den allerersten
      Jahren; man verkennt das leicht, weil man melancholische Kinder manchmal
      als bevorzugte Wesen ansieht. Beim Erwachsenen geht es über ins Vorwalten
      des physischen Leibs. Im Schema hat der Melancholiker wenig Erregbarkeit
      und viel Stärke; sein Gegenpol ist der Sanguiniker. Melancholische Kinder
      sind in der Regel schlank und dünn. Sie bleiben leicht zurück, auch im
      Freiwerden des Ätherleibs mit dem Zahnwechsel, und sind darum länger der
      Nachahmung zugänglich: Was man ihnen vormacht, halten sie fest, wenn sie
      einen liebgewonnen haben. Fast immer ist der Melancholiker in einer
      Selbsttäuschung befangen; er glaubt, seine Erlebnisse beträfen nur ihn.
      Erfährt er, dass andere Ähnliches erleben, ist das eine Art Kur. Darum
      soll man ihn mit Biographien großer Persönlichkeiten behandeln. Im
      Unterricht wendet man sich mit dem Urteil über das Angeschaute an die
      melancholische Gruppe. Das Subtrahieren ist ihre Rechnungsart, beim
      Zeichnen das Ergänzen einer Form durch ihre Gegenform. Die Ausartung ist
      der Wahnsinn.
    chunk_id: 70ccef67-9894-4bad-a0b8-d51c7a3de4b8
