kurz: >
  Die vier Temperamente, sanguinisch, cholerisch, phlegmatisch und
  melancholisch, sind nach Rudolf Steiner die vier Grundtypen, auf die sich die
  Vielartigkeit der Kinder zurückführen lässt. Sie beruhen darauf, dass eines
  der vier Wesensglieder vorwaltet. Der Erzieher soll sie nicht bekämpfen,
  sondern ihnen entgegenkommen, damit sie sich harmonisieren.
text: |
  Die **4 Temperamente** sind nach Rudolf Steiner die vier Grundtypen des Menschenwesens: das sanguinische, das cholerische, das phlegmatische und das melancholische Temperament. Sie zu kennen, nennt er in den Seminarbesprechungen „die wichtigste Aufgabe des Erziehers und Lehrers“.

  **Mitglieder:**
  - Sanguinisches Temperament – beim Kind waltet der Ätherleib vor.
  - Cholerisches Temperament – beim Kind waltet der Astralleib vor.
  - Phlegmatisches Temperament – beim Kind waltet der physische Leib vor.
  - Melancholisches Temperament – beim Kind waltet das Ich vor.

  **Beschreibung:** Beim Idealmenschen herrschte Harmonie zwischen Ich, Astralleib, Ätherleib und physischem Leib; in Wirklichkeit waltet bei jedem eines vor, und Erziehung soll die Harmonie herstellen. Beim Erwachsenen verschiebt sich das: Beim melancholischen Temperament herrscht der physische Leib vor, beim sanguinischen der Astralleib, beim phlegmatischen der Ätherleib, beim cholerischen das Ich. Nach Stärke und Erregbarkeit: Der Sanguiniker hat viel Erregbarkeit und wenig Stärke, der Melancholiker umgekehrt; beim Choleriker ist beides am größten, beim Phlegmatiker am geringsten. Polar stehen sich Phlegmatiker und Choleriker gegenüber „wie Nord- und Südpol“, ebenso Melancholiker und Sanguiniker. Statt einem Temperament die Gegeneigenschaften anzuerziehen, soll man ihm entgegenkommen und die Klasse in Temperamentsgruppen setzen: Gleichartige schleifen sich aneinander ab. Entscheidend ist die Seelenstimmung des Lehrers: „Das Erziehen geschieht durch das, was Sie sind.“
