name: "7 Welträtsel des Materialismus"
aliases:
  - "7 Welträtsel"
  - "Sieben Welträtsel"
  - "Welträtsel des Materialismus"
  - "Du Bois-Reymond"
  - "Emil Du Bois-Reymond"
kurz: >
  Die 7 Welträtsel des Materialismus hat der Physiologe Emil Du Bois-Reymond
  1880 aufgestellt, vom Ursprung von Kraft und Materie bis zum freien Willen.
  Einige hielt er für immer unlösbar und schloss mit dem „Ignorabimus“. Rudolf
  Steiner bestreitet, dass die Grenzen der Naturerkenntnis Grenzen des Erkennens
  überhaupt sind: Die Rätsel entstehen, weil man hinter die Wahrnehmungen eine
  unwahrnehmbare Materie setzt.
text: |
  Die **7 Welträtsel des Materialismus** gehen auf den Physiologen **Emil Du Bois-Reymond** zurück. In der Rede „Über die Grenzen des Naturerkennens“ (1872) nannte er zwei unübersteigliche Grenzen, das Wesen von Materie und Kraft und das Entstehen des Bewusstseins, und schloss mit dem „Ignorabimus“. In „Die sieben Welträtsel“ (1880) erweiterte er dies zu sieben Rätseln.

  **Mitglieder:**
  1. Ursprung von Kraft und Materie
  2. Erste Bewegung in ruhender Materie
  3. Entstehung des Lebens in bewegter Materie
  4. Zweckmäßigkeit in der Natur
  5. Bewusstseinsinhalte und Gehirnvorgänge (Qualia)
  6. Entwicklung von Verstand, Vernunft, Denken und Sprache
  7. Freier Wille und atomistische Determination

  **Beschreibung:** Für Du Bois-Reymond besteht Naturerkennen in der „Auflösung der Naturvorgänge in Mechanik der Atome“; selbst bei Kenntnis aller Bewegungen bleibe unbegreiflich, wie daraus Bewusstsein entstehe. Das erste, zweite und fünfte Rätsel gelten ihm als „transzendent“, das dritte, vierte und sechste als lösbar; beim siebten lässt er die Entscheidung offen.

  **Rudolf Steiner** gibt ihm recht, dass sich aus Atombewegungen keine Empfindung ableiten lässt. Er bestreitet aber, dass die Grenzen der Naturerkenntnis Grenzen der Erkenntnis überhaupt sind: Die Rätsel entstehen, weil man hinter die Wahrnehmungen eine unwahrnehmbare Materie setzt, wo „überhaupt nichts gesucht werden kann“ (GA 7). In der „Philosophie der Freiheit“ zeigt er, dass das Denken selbst beobachtet werden kann und es keine Grenzen des Erkennens gibt.
