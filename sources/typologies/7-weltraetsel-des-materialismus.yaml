weltraetsel:
  - name: Ursprung von Kraft und Materie
    kurz: >
      Das erste Welträtsel fragt, was Materie und Kraft ihrem Wesen nach sind
      und woher sie stammen. Du Bois-Reymond hält es für transzendent: Wohin die
      Materie im Raume spukt, dringt kein Erkennen. Rudolf Steiner antwortet,
      dass dort nichts gesucht werden kann; die Materie hinter den Wahrnehmungen
      ist ein gedachter Grenzbegriff, kein verborgenes Ding.
    text: >
      Das erste der sieben Welträtsel betrifft das Wesen von Materie und Kraft.
      Für Emil Du Bois-Reymond besteht Naturerkennen darin, alle Vorgänge auf
      die Mechanik von Atomen zurückzuführen, die sich unter dem Einfluss von
      Kräften bewegen. Sein Ideal ist der „Laplacesche Geist“, der die Lage und
      Bewegung aller Atome kennt und daraus Vergangenheit und Zukunft der Welt
      berechnen könnte. Doch selbst dieser Geist wüsste nicht, was Materie und
      Kraft eigentlich sind. Schon in der Leipziger Rede von 1872 nennt Du
      Bois-Reymond dies die erste unübersteigliche Grenze: Dahin, wo Materie im
      Raume spukt, wird das menschliche Erkennen niemals dringen. In den „Sieben
      Welträtseln“ zählt er es zu den transzendenten Rätseln. Rudolf Steiner
      bestreitet nicht, dass hier eine Grenze der Naturwissenschaft liegt, wohl
      aber ihre Deutung. Das Atom, sagt er, hat nur einen Sinn, solange man
      nicht sagen kann, was es ist; man muss gewisse Begriffe festsetzen, an die
      man nicht herankommt. Der Irrtum liegt darin, hinter die Wahrnehmungen ein
      unbekanntes Ding an sich zu setzen. Du Bois-Reymond kann nicht dahin
      dringen, wo Materie spukt, weil dort überhaupt nichts gesucht werden kann
      (GA 7). Für Steiner sind Wahrnehmung und Begriff die beiden Seiten der
      Wirklichkeit; wer beide im Erkennen vereinigt, braucht kein unerkennbares
      Wesen dahinter. Was dem gewöhnlichen Bewusstsein als Grenze erscheint,
      wird für imaginatives und inspiriertes Erkennen zum Ausgangspunkt: Die
      Annahme von Atomen als Substanz des Materiellen verliert dort ihren Sinn.
    chunk_id: b4314cd3-10d4-4c41-8937-6e19733525f0
  - name: Erste Bewegung in ruhender Materie
    kurz: >
      Das zweite Welträtsel fragt, wie in eine ursprünglich ruhende Materie die
      erste Bewegung hineingekommen ist. Die Mechanik kann jede Bewegung aus
      einer früheren berechnen, aber nicht den Anfang. Du Bois-Reymond hält es
      für transzendent. Für Steiner zeigt sich hier, dass ein Weltbild aus
      bewegten Atomen den Ursprung des Werdens nicht enthält.
    text: >
      Das zweite Welträtsel fragt, wie in die ruhende Materie die erste Bewegung
      hineingekommen ist. Die mechanische Naturerklärung setzt Atome und Kräfte
      voraus und berechnet, wie aus einem Bewegungszustand der nächste folgt.
      Woher aber die erste Bewegung und die erste Verteilung der Materie
      stammen, kann sie nicht sagen; Rudolf Steiner hebt hervor, dass Du
      Bois-Reymond zugeben musste, die Materie müsse von Anfang an verteilt und
      ineinandergelagert gewesen sein, und auf die Frage nach dem Ursprung der
      Bewegung nur antworten konnte: Niemals kann man das wissen. Du
      Bois-Reymond zählt das Rätsel deshalb zu den transzendenten. Gerade die
      astronomisch-mathematische Methode, die der „Laplacesche Geist“ ins
      Kleinste der Körper hineintragen will, führt hier an ihr Ende: Sie kann
      einen Zustand nur aus einem früheren ableiten und muss einen Anfang
      voraussetzen, den sie nicht erklärt. Für Steiner ist das kein zufälliger
      Mangel, sondern eine Folge der Voraussetzung. Ein Weltbild, das nur aus
      Raum, Materie mit wirksamen Kräften und Bewegung besteht, hat das
      Schaffende, aus dem Bewegung entspringt, von vornherein ausgeschlossen. Wo
      der Mensch im eigenen Wollen und Denken den Ursprung einer Tätigkeit
      unmittelbar erlebt, erfährt er, was ein Anfang ist; die
      Geisteswissenschaft sucht den Ursprung der Bewegung im Geistigen, nicht in
      einem ersten Stoß der toten Materie.
    chunk_id: f8dc615e-370f-4667-9f25-05d887c6f1d3
  - name: Entstehung des Lebens in bewegter Materie
    kurz: >
      Das dritte Welträtsel fragt, wie innerhalb der bewegten Materie Leben
      entstanden ist. Du Bois-Reymond hält es für grundsätzlich lösbar, sobald
      Materie und Bewegung einmal gegeben sind; Haeckel glaubt, es durch
      Urzeugung aus Unbelebtem gelöst zu haben. Steiner sieht im Lebendigen eine
      eigene Gesetzmäßigkeit, die Goethe im Typus erfasste und die
      Geisteswissenschaft als Ätherleib beschreibt.
    text: >
      Das dritte Welträtsel fragt, wie innerhalb der bewegten Materie Leben
      entstanden ist. Du Bois-Reymond zählt es nicht zu den transzendenten
      Rätseln: Wenn Materie und Bewegung einmal da sind, könne das Leben im
      Prinzip mechanisch entstanden sein, auch wenn man den Vorgang noch nicht
      kenne. Ernst Haeckel versucht in „Die Welträtsel“ diese Antwort zu geben.
      Er schildert, wie die Erde aus einem feuerflüssigen Zustand sich abkühlte,
      wie Wasser sich sammelte und wie endlich aus dem Leblosen Lebendiges
      hervorgesprossen sei. Rudolf Steiner hält dem entgegen, dass die Fragen
      nach dem Ursprung des Lebens in der Naturwissenschaft keine Antwort
      finden. Das Lebendige folgt nicht bloß den Gesetzen, die zwischen äußeren
      Körpern wirken; in ihm wirkt ein Ganzes, das die Teile gestaltet. Goethe
      hat diese Gesetzmäßigkeit im Typus, in der Urpflanze und im Urtier
      gesucht, und Steiner nennt ihn darum den Begründer einer Wissenschaft des
      Organischen, die nicht durch Mechanik, sondern durch anschauende
      Urteilskraft erkennt. Geisteswissenschaftlich beschreibt Steiner den
      Träger des Lebens als Äther- oder Lebensleib. Er räumt ein, dass dies dem
      naturwissenschaftlich Gebildeten zunächst als Dilettantismus erscheinen
      muss; aber nur so lasse sich das Lebendige als eigene Stufe der
      Wirklichkeit fassen, statt es aus totem Stoff herzuleiten.
    chunk_id: f3bf8b94-c3c5-4ad2-9282-eed82b80c450
  - name: Zweckmäßigkeit in der Natur
    kurz: >
      Das vierte Welträtsel fragt, warum so vieles in der Natur den Stempel der
      Zweckmäßigkeit trägt, wie sie sonst nur bei Taten menschlicher Vernunft
      vorkommt. Du Bois-Reymond hält es seit Darwin für lösbar. Steiner zeigt in
      der Philosophie der Freiheit, dass Zwecke nur im menschlichen Handeln
      wirken; in der Natur wirkt die Idee als Gesetz, nicht als Absicht.
    text: >
      Das vierte Welträtsel fragt, wie es sich erklärt, dass in der Natur so
      vieles den Stempel der Zweckmäßigkeit an sich trägt, wie sie sonst nur bei
      den von menschlicher Vernunft ausgeführten Taten vorhanden ist. Auge, Hand
      und Organismus wirken, als seien sie für einen Zweck entworfen. Du
      Bois-Reymond rechnet dieses Rätsel nicht zu den transzendenten. Mit
      Darwins Lehre von der natürlichen Zuchtwahl glaubt er einen mechanischen
      Weg gefunden zu haben, wie Zweckmäßiges ohne Absicht entstehen kann.
      Rudolf Steiner lehnt beide Einseitigkeiten ab, sowohl die mechanische
      Erklärung als auch eine äußere Zwecklehre, die einen planenden
      Weltbaumeister annimmt. In der „Philosophie der Freiheit“ (Kapitel XI,
      „Weltzweck und Lebenszweck“) zeigt er: Von Zweck kann man nur sprechen, wo
      die Vorstellung einer Wirkung der Ursache vorausgeht und sie bestimmt. Das
      ist im menschlichen Handeln der Fall. In der Natur dagegen wirkt die Idee
      nicht als vorgefasster Zweck, sondern als Gesetz, das sich in der
      Erscheinung selbst offenbart. Wer Zwecke in die Natur hineinlegt,
      überträgt das menschliche Handeln auf sie. Das Rätsel löst sich, wenn man
      die Ideen in den Naturerscheinungen denkend erfasst, statt sie entweder zu
      leugnen oder einem äußeren Planer zuzuschreiben.
    chunk_id: 5d33f629-f820-4b64-a1f6-e2d16a05cc9e
  - name: Bewusstseinsinhalte und Gehirnvorgänge (Qualia)
    kurz: >
      Das fünfte Welträtsel fragt, wie aus wirbelnden Atomen im Gehirn die
      einfachste Empfindung entstehen soll: ich sehe rot, ich rieche Rosenduft.
      Du Bois-Reymond nennt es für immer unbegreiflich. Steiner gibt ihm darin
      recht, bestreitet aber, dass hier die Grenze aller Wissenschaft liegt: Das
      Seelische ist übersinnlich und kann mit anderen Erkenntnismitteln
      erforscht werden.
    text: >
      Das fünfte Welträtsel ist das berühmteste. Rudolf Steiner fasst es so:
      Wenn wir unser Gehirn untersuchen könnten, fänden wir nur
      durcheinanderwirbelnde kleine Kügelchen; wie bringen diese es zustande,
      dass ich rot sehe, einen Orgelton höre, Schmerz empfinde? Denkt man sich
      wirbelnde Atome, so wird sofort klar, dass daraus nie die Empfindung
      entstehen kann. Schon 1872 nennt Du Bois-Reymond dies die zweite
      unübersteigliche Grenze: Selbst wer ganz klar wüsste, wie sich
      Kohlenstoff-, Wasserstoff-, Stickstoff- und Sauerstoffatome im Gehirn
      bewegen, könnte daraus nicht ergründen, wie die einfachste Empfindung
      zustande kommt. Es sei für immer unbegreiflich, dass es diesen Atomen
      nicht gleichgültig sein sollte, wie sie liegen und sich bewegen. Steiner
      gibt Du Bois-Reymond mit diesem Ausspruch vollständig recht. Er nennt die
      Rede eine wichtige Tat, weil sie gegen den eigenen Materialismus den
      Unterschied zwischen Stoff und Seelenerlebnis ernst nimmt. Den Fehler
      sieht er in der Folgerung, die Grenzen der Naturerkenntnis seien die
      Grenzen jeglicher Wissenschaftlichkeit. Gedanken, Empfindungen, Gefühle
      und Willensimpulse gehören der übersinnlichen Welt an; ihr Träger ist nach
      Steiner der Astralleib. Sie lassen sich nicht aus dem Gehirn ableiten,
      aber mit geschulten Erkenntniskräften erforschen. Genau an dieser Grenze
      muss die anthroposophische Forschung durchbrechen.
    chunk_id: ed88b02c-09b4-41cc-87c0-56ac052f54bb
  - name: Entwicklung von Verstand, Vernunft, Denken und Sprache
    kurz: >
      Das sechste Welträtsel fragt, wie sich innerhalb der Lebewesen Verstand,
      Vernunft, Denken und Sprache entwickeln. Du Bois-Reymond hält es für
      lösbar, sobald das Rätsel der Empfindung gelöst wäre. Steiner zeigt in der
      Philosophie der Freiheit, dass das Denken nicht aus dem Gehirn erklärt,
      sondern in sich selbst beobachtet werden kann; es ist der Ausgangspunkt
      allen Erkennens.
    text: >
      Das sechste Welträtsel fragt, wie sich innerhalb der Lebewesen Verstand,
      Vernunft, das Denken und die Sprache entwickeln. Du Bois-Reymond rechnet
      es nicht zu den transzendenten Rätseln. Wenn man einmal begriffe, wie
      Empfindung entsteht, folge das höhere Seelenleben nach seiner Meinung aus
      der Entwicklung der Organismen; auch Haeckel leitet Vernunft und Sprache
      aus der tierischen Stammesgeschichte ab. Gegen den Schein, materielle
      Vorgänge könnten geistige Leistungen wie Gedächtnis,
      Vorstellungsassoziation und Talent verständlich machen, wendet aber Du
      Bois-Reymond selbst ein, dass das geringste Nachdenken diese Täuschung
      aufdecke. Rudolf Steiner geht den umgekehrten Weg. In der „Philosophie der
      Freiheit“ zeigt er, dass das Denken das einzige ist, was der Mensch ganz
      selbst hervorbringt und zugleich beobachten kann. Wer das Denken erklären
      will, muss schon denken; es ist darum nicht ein spätes Erzeugnis der
      Natur, das man von außen ableiten könnte, sondern der Ausgangspunkt, von
      dem aus alles andere erst begriffen wird. In der Beobachtung des Denkens
      erlebt der Mensch eine geistige Tätigkeit, die auf sich selbst ruht.
      Sprache und Vernunft sind für Steiner Ausdruck des Ich, das sich im Leib
      verkörpert, nicht bloß ein Fortsatz tierischer Fähigkeiten. Die Frage nach
      ihrer Entstehung führt deshalb nicht in die Mechanik des Gehirns, sondern
      in die Geisteswissenschaft vom Menschen.
    chunk_id: d4a80f02-6eeb-41ae-9e3c-b46fbc4a5494
  - name: Freier Wille und atomistische Determination
    kurz: >
      Das siebte Welträtsel fragt, wie ein freier Wille in einem Wesen entstehen
      kann, dessen jede Handlung durch das Wirbeln der Atome bestimmt sein
      müsste. Du Bois-Reymond lässt offen, ob es lösbar ist. Steiners
      Philosophie der Freiheit ist die Antwort: Frei ist die Handlung, die aus
      reinem Denken, aus moralischer Intuition entspringt, denn dieses Denken
      ist nicht Wirkung der Organisation.
    text: >
      Das siebte Welträtsel fragt nach Rudolf Steiners Wiedergabe: Wie kann ein
      freier Wille entstehen in einem Wesen, das so gebunden ist, dass jede
      Handlung durch das Wirbeln der Atome hervorgerufen werden muss? Für den
      Laplaceschen Geist wäre jede menschliche Tat aus der Lage der Atome
      berechenbar; Freiheit wäre eine Illusion. Du Bois-Reymond lässt die
      Entscheidung offen: Wer die Freiheit leugnet, für den fällt das Rätsel in
      das fünfte zurück; wer sie anerkennt, steht vor einem neuen
      Unbegreiflichen. Steiners „Philosophie der Freiheit“ kann als ausführliche
      Antwort gelesen werden. Die Frage nach der Willensfreiheit lässt sich nach
      Steiner erst beantworten, wenn man zwischen bewusstem Beweggrund und
      unbewusstem Antrieb unterscheidet und das Denken selbst beobachtet. Im
      reinen Denken erlebt der Mensch eine Tätigkeit, die nicht von seiner
      Organisation hervorgebracht wird; nach dem Zusatz von 1918 drängt das
      Wesenhafte des Denkens vielmehr die Tätigkeit der Organisation zurück und
      schafft sich in diesem Freiraum Platz. Handelt der Mensch aus einer so
      erfassten moralischen Intuition, so fallen Triebfeder und Motiv zusammen;
      er handelt aus Liebe zur Tat, nicht aus Zwang der Natur oder sittlicher
      Gebote. Eine solche Handlung ist frei, weil ihr Grund im Ich selbst liegt.
      Das Rätsel entsteht nur, wenn man das Denken als Erzeugnis des Gehirns
      voraussetzt; erkennt man es als geistige Tätigkeit, wird Freiheit zur
      erfahrbaren Wirklichkeit.
    chunk_id: 1d015be6-7671-4c25-955d-68ab8a13a394
