name: "12 Sinne"
aliases:
  - "Zwölf Sinne"
  - "Sinneslehre"
  - "Sinne des Menschen"
  - "Willenssinne, Gefühlssinne, Erkenntnissinne"
  - "Ich-Sinn"
  - "Gedankensinn"
kurz: >
  Nach Rudolf Steiner hat der Mensch nicht fünf, sondern zwölf Sinne: vom
  Ich-Sinn, Gedankensinn und Sprachsinn über Hör-, Wärme-, Seh-, Geschmacks- und
  Geruchssinn bis zu Tast-, Lebens-, Bewegungs- und Gleichgewichtssinn. Er
  gliedert sie in Willens-, Gefühls- und Erkenntnissinne. Durch die zwölf Sinne
  zerlegt sich die Welt, im Urteilen setzt der Mensch sie wieder zusammen.
text: |
  Die **12 Sinne** sind nach Rudolf Steiner das vollständige System der menschlichen Sinnesorganisation. Die gewöhnliche Wissenschaft kennt nur fünf bis sieben; die übrigen sind weniger auffällig, oder der Mensch „verschläft“ sie, weil sie im Willen wirken.

  **Mitglieder:** Ich-Sinn, Gedankensinn, Sprachsinn (Wortsinn), Hörsinn, Wärmesinn, Sehsinn, Geschmackssinn, Geruchssinn, Tastsinn, Lebenssinn, Bewegungssinn, Gleichgewichtssinn.

  **Beschreibung:** In der „Allgemeinen Menschenkunde“ (GA 293) gliedert Steiner die Sinne dreifach. *Willenssinne* sind Tast-, Lebens-, Bewegungs- und Gleichgewichtssinn; *Gefühlssinne* sind Geruchs-, Geschmacks-, Seh- und Wärmesinn; *Erkenntnissinne* sind Ich-, Gedanken-, Sprach- und Hörsinn. Auch diese beruhen aber auf einem schlafenden Willen. In GA 199 ordnet er die Sinne nach ihrer Richtung: sieben sind mehr nach außen gerichtet (Ich- bis Geschmackssinn), fünf öffnen sich nach innen und zeigen die Wirkungen der Welt im eigenen Leib. Die zwölf Sinne sind keine bloße Aufzählung: Weil die Welt sich durch sie in zwölf Glieder zerlegt, muss der Mensch das Getrennte im Urteilen wieder verbinden. Das Urteilen wird so zu einem lebendigen Vorgang des ganzen Menschen. Für die Erziehung folgt daraus, alle Sinne gleichmäßig zu pflegen. Beim Aufstieg zur höheren Erkenntnis werden die äußeren Sinne zu Toren: Durch Seh- und Wärmesinn führt der Weg in die Imagination, durch Hör- und Sprachsinn in die Inspiration, durch Gedanken- und Ich-Sinn in die Intuition.
