  - term: Glied
    chunk_id: 3ef7e27e-166e-5793-8696-ea7eaf3aa0f1
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Ein Glied ist im Sinne der Dreigliederung des sozialen Organismus kein starrer Bestandteil,
      sondern ein lebendiges, eigenständiges Wirkungsgefüge innerhalb eines größeren Ganzen. Es
      besitzt eine eigene innere Logik und Verwaltung, die aus seinen besonderen Kräften hervorgeht.
      Unterschieden werden drei solche Glieder: das Geistesleben, das Rechtsleben und das
      Wirtschaftsleben. Das geistige Glied umfasst Wissenschaft, Kunst, Religion und Erziehung; es
      braucht vollkommene Freiheit von staatlichen Eingriffen, um seine Aufgabe erfüllen zu können.
      Das rechtlich-politische Glied regelt auf demokratischer Grundlage die Beziehungen der
      Menschen untereinander, insbesondere durch Gesetzgebung und Verwaltung; hier gilt das Prinzip
      der Gleichheit vor dem Gesetz. Das wirtschaftliche Glied schließlich beruht auf der
      solidarischen Zusammenarbeit der Menschen in Assoziationen, die aus Sacherkenntnis heraus den
      Kreislauf der Güter regeln. Keines dieser Glieder darf die anderen beherrschen oder deren
      Eigenlogik unterdrücken. Nur wenn jedes seine eigene Aufgabe ungestört erfüllen kann, entsteht
      aus ihrem lebendigen Nebeneinander- und Zusammenwirken die gesunde Einheit des sozialen
      Gesamtorganismus."
    references:
      - chunk_id: c4b67d01-9074-536d-abdb-eebcd4cb9107
