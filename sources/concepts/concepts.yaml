  - term: Geistige Welt
    chunk_id: 27f780fa-363a-5cff-9ab2-5e9d62a8500a
    language: de
    tags:
      - concept
      - assistant-generated
    text: Die geistige Welt ist nach diesem Verständnis keine jenseitige Sphäre, die dem Menschen
      grundsätzlich verschlossen bleibt. Sie ist eine Wirklichkeitsebene, die dem Menschen durch
      eine gesteigerte, methodische Erkenntnistätigkeit zugänglich wird. Der Ausgangspunkt dafür ist
      das Denken selbst. Der Mensch erlebt im Gedanken etwas unmittelbar Tätiges, das er überschauen
      kann. Die volle Wirklichkeit ergibt sich nicht aus der bloßen Wahrnehmung oder dem abstrakten
      Begriff allein, sondern erst aus dem Zusammenhang beider, aus der denkenden Beobachtung. Die
      Wahrnehmung ist der objektiv gegebene Teil der Wirklichkeit, der Begriff der subjektiv durch
      Intuition gegebene. Unsere geistige Organisation reißt die Wirklichkeit in diese beiden
      Faktoren auseinander. Erst ihre gesetzmäßige Verbindung führt zur vollen Wirklichkeit. Das
      Denken ist dabei nicht bloßes Abbild einer äußeren Welt, sondern schöpferisch. Die Begriffe
      werden nicht von den Dingen abgelesen, sondern aus dem Inneren herausgeholt. Das Sinnesobjekt
      veranlasst nur, einen bestimmten Gedankeninhalt aus der Einheit aller möglichen Gedanken
      hervorzutreiben. Die Bausteine dafür liefert es nicht. In der Seele eröffnet sich so der
      Ausblick auf eine Wirklichkeit, die den Sinnen unzugänglich ist. Die geistige Welt ist demnach
      kein fertiges Reich, das unabhängig vom Menschen existiert, sondern sie wird im Akt des
      erkennenden Denkens verwirklicht.
    references:
      - chunk_id: a5568ad8-99e8-54c4-b8d3-daf47b74c343
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 1
