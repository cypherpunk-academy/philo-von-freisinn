      - chunk_id: 7eaea5c3-73a3-5a01-beca-6105ca9ecc92
        description: In einer geregelten sozialen Ordnung wird die freie Einzel-Initiative in den Dienst der
          sozialen Allgemeinheit gestellt.
        relevance: 0.6
      - chunk_id: beff1862-ef82-5dd2-a8d2-a9981a50f5e1
        description: In einem arbeitsteiligen sozialen Organismus erwirbt der Einzelne sein Einkommen nicht
          selbst, sondern durch die Arbeit aller Beteiligten.
        relevance: 0.3
  - term: Proletariat
    chunk_id: 636de5a4-e906-5092-aef9-e49e18cdfb2d
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Begriff des Proletariats bezeichnet eine spezifische Bewusstseinslage des modernen
      Menschen, die aus der Trennung von den Produktionsmitteln und der Behandlung der Arbeit als
      Ware entsteht. Der Proletarier ist aus allen alten Lebenszusammenhängen herausgerissen und
      sucht einen neuen Bewusstseinsinhalt. Er wendet sich der modernen Wissenschaftlichkeit zu,
      weil ihm die überlieferten geistigen Quellen nicht mehr zugänglich sind. In den unterbewussten
      Empfindungen lebt ein Abscheu davor, die eigene Arbeitskraft wie eine Ware auf dem Markt
      verkaufen zu müssen. Dieser Abscheu ist ein Grundimpuls der proletarischen Bewegung.


      Die soziale Frage ist im Kern eine Frage der inneren Entwicklung des Menschen. Der Proletarier
      sucht nach einem Geistesleben, das seine Seele tragen und ihm das Bewusstsein seiner
      Menschenwürde geben kann. Da das als Ideologie empfundene Geistesleben ihm dieses Bewusstsein
      nicht entwickeln kann, ersetzt er es durch das aus dem Wirtschaftsleben geborene
      Klassenbewusstsein. Die Gefahr besteht darin, dass das Denken im rein Materiellen stecken
      bleibt, wenn es nicht zur Einsicht in die geistige Natur geführt wird. Ein gesellschaftliches
      Zusammenleben, in dem das Geistesleben als bloße Ideologie wirkt, entbehrt eine der Kräfte,
      die den sozialen Organismus lebensfähig machen. Die soziale Bewegung kann ihre Ziele nur
      erreichen, wenn die Forderungen des Proletariats nicht allein aus wirtschaftlichen Impulsen,
      sondern aus einem erweiterten Bewusstsein heraus gestellt werden.
    references:
      - chunk_id: e216c0c6-782b-5da1-b785-bba580c7ccfd
        description: Ein Grundimpuls der proletarischen Bewegung ist der Abscheu davor, die Arbeitskraft wie
          eine Ware auf dem Markt verkaufen zu müssen.
        relevance: 1
      - chunk_id: 6f9afe09-8539-55e3-9bf8-fb71bc9e43a5
        description: Der moderne Proletarier wurde aus allen alten Lebenszusammenhängen herausgerissen und
          kann nicht mehr aus alten geistigen Quellen schöpfen.
        relevance: 0.9
      - chunk_id: 8098f83f-82a7-56a5-96be-f7fa28d6ec6f
        description: Ein gesellschaftliches Zusammenleben, in dem das Geistesleben als Ideologie wirkt,
          entbehrt eine Kraft, die den sozialen Organismus lebensfähig macht.
        relevance: 0.9
      - chunk_id: 4abd8aec-caf9-53d6-870d-72dbab9fa286
        description: Der moderne Proletarier glaubt, dass aus dem Wirtschaftsleben alles entwickelt werden
          müsse, was ihm sein volles Menschenrecht gibt, aber dies kann nicht allein aus der
          Wirtschaft folgen.
        relevance: 0.9
      - chunk_id: 92905715-5ba6-563d-8829-397ddab05709
        description: Die Kennzeichnung des Geisteslebens des modernen Proletariers muss an erster Stelle der
          Darstellung der proletarisch-sozialen Bewegung stehen.
        relevance: 0.8
      - chunk_id: bf19de15-1a95-5c33-b3c6-8e9947f25ec9
        description: Der Proletarier glaubt, dass nur durch die Entwicklung des ungeistigen
          Wirtschaftslebens der menschenwürdige Zustand herbeigeführt werden könne.
        relevance: 0.8
      - chunk_id: 01c12079-c068-5892-9e99-504adf5b374f
        description: Die bestimmenden Ideen der sozialen Bewegung stammen aus der neueren
          Wissenschaftsrichtung, nicht aus Maschine und Kapitalismus.
        relevance: 0.7
      - chunk_id: 3442daff-90fc-563f-85ae-17525e0166b9
        description: Die Tragik der sozialen Forderungen liegt darin, dass viele keine Empfindung für die
          Seelenstimmung der Massen haben und der Nichtproletarier die Forderungen des Proletariers
          missversteht.
        relevance: 0.6
      - chunk_id: 4a02057e-8865-50ed-a750-c29443248411
        description: Der Proletarier hat das Vertrauen verloren, weil er empfindet, dass viele weder mit
          seinem Leben noch mit seiner Seele rechnen.
        relevance: 0.5
      - chunk_id: 299b4f59-ab1a-520b-bca8-90c550d41d58
        description: Der Bekenner proletarischer Lebensauffassung durchschaut nicht, wie ihm das Schicksal
          sein Leben gebracht hat und wie er sich innerhalb einer Denkungsart bewegt, die ihm von
          den herrschenden Klassen aufgezwungen wurde.
        relevance: 0.4
      - chunk_id: b2f65352-a19c-5d8e-b7ad-16849b6ea760
        description: Die soziale Frage stellt die Frage, wie Forderungen erfüllt werden können, ohne
