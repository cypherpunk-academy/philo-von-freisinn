        relevance: 0.85
      - chunk_id: 4dbf84ba-d2a6-5b21-8abd-15d00cfba34e
        description: Das Wahrnehmungselement erhält seine Wirklichkeitsbestimmung erst durch das Denken.
        relevance: 0.8
  - term: Organ
    chunk_id: 36db6f05-ab96-5c33-9e9c-94df492b802a
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Begriff des Organs wird in zwei grundlegenden, aber unterschiedlichen Zusammenhängen
      verwendet. Zum einen bezeichnet er ein Wahrnehmungsorgan im geistigen Sinne. Der menschliche
      Geist ist nicht als ein Behälter zu verstehen, der Gedanken in sich aufbewahrt, sondern als
      ein Organ, das die Gedankenwelt wahrnimmt. Er verhält sich zu den Gedanken so, wie sich das
      Auge zum Licht oder das Ohr zum Ton verhält. Gedanken sind keine bleibenden Inhalte, die im
      Geist gespeichert werden, sondern werden von ihm jeweils neu aufgenommen. Diese Auffassung
      wendet sich gegen die Vorstellung, der Geist sei ein Speicher, aus dem Gedanken nach Bedarf
      hervorgeholt werden.


      Zum anderen wird der Begriff auf den sozialen Organismus übertragen. Dieser ist gegliedert wie
      ein natürlicher Organismus. Jedes seiner Glieder – das Wirtschaftsleben, das Rechtsleben und
      das geistige Leben – muss seine eigene Gesetzgebung und Verwaltung haben und in voller
      Selbstständigkeit bestehen. Kein Glied kann die Aufgabe eines anderen übernehmen. Ihr
      heilsames Zusammenwirken entsteht nicht durch eine zentrale Einheit, sondern dadurch, dass
      jedes Glied nach seinen eigenen Kräften und Gesetzen lebt und dennoch mit den anderen
      zusammenwirkt. Ein solcher Vergleich dient jedoch nicht dazu, einfach naturwissenschaftliche
      Begriffe auf das Soziale zu übertragen. Vielmehr soll die Betrachtung des natürlichen
      Organismus das Denken so schulen, dass es die sozialen Tatsachen nach ihrer eigenen
      Gesetzmäßigkeit beurteilen lernt.
    references:
      - chunk_id: c12bc8bc-a186-5ef6-ac83-43f2f346a307
        description: Der Geist ist kein Behälter für Gedanken, sondern ein Organ, das sie wahrnimmt, ähnlich
          wie Auge und Ohr.
        relevance: 0.95
      - chunk_id: 3266ed50-bdb6-58a9-adea-2d8a0d52e926
