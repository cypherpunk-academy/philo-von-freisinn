  - term: Gott
    chunk_id: 2d0e4e39-f282-57ca-a418-83742c2f3864
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Gott ist für diese Anschauung keine von Welt und Mensch getrennte Instanz, die von außen in
      das Geschehen eingreift. Ein solcher naiver Theismus wird abgelehnt. Gott hat die Welt
      geschaffen, aber sie hat ein eigenes, selbstständiges Wesen. Das Göttliche erscheint innerhalb
      eines Nichtgöttlichen, so wie das Licht aus der Dunkelheit geboren wird. Die Welt ist
      Schöpfung aus dem Ungöttlichen heraus. Das Ungöttliche ist das Erste, das Göttliche das
      Zweite. Gott hat die Gesamtheit der Wesen nicht in seiner Gewalt; er kann ihnen das Licht
      geben, aber sie selbst tauchen aus der dunklen Nacht empor und müssen sich durch diese Nacht
      zum Licht emporarbeiten. Darin liegt ihre Freiheit.


      Gott ist kein Gegenstand des Glaubens, der für die menschliche Seele unerreichbar wäre. Er ist
      vielmehr Ziel einer bewussten Erkenntnisentwicklung. Der Mensch wird nicht dazu aufgefordert,
      einer von ihm abgesonderten sittlichen Weltordnung zu gehorchen. Der Sinn des Daseins liegt
      nicht in Unterordnung, sondern in schöpferischer Verantwortung. Der Mensch handelt sittlich,
      weil er eine sittliche Idee hat. Er wird zum Mitschöpfer an den Weltenrätseln und der
      Weltentwicklung. In der sozialen Dreigliederung, mit einem freien Geistesleben, einem
      eigenständigen Rechtsleben und einer eigenen Wirtschaftsordnung, finden sich die irdischen
      Formen, in denen ein solches freies, schöpferisches Miteinander Gestalt annehmen kann. Gott
      ist die Wirklichkeit, die der Mensch in freier Erkenntnis und Tat zu verwirklichen hat.
    references:
      - chunk_id: d4060f9c-85df-5fec-b92e-85a0d327ef48
        description: Gott hat die Welt geschaffen, aber sie hat ein eigenes, selbstständiges Wesen; das
          Göttliche erscheint innerhalb eines Nichtgöttlichen, so wie das Licht aus der Dunkelheit
          geboren wird.
        relevance: 0.95
      - chunk_id: 833f85fc-5132-5501-9c36-15adccd8e504
        description: Der Mensch ist nicht dazu da, eine von ihm abgesonderte sittliche Weltordnung zu
          verwirklichen.
        relevance: 0.9
      - chunk_id: e0208833-c446-554b-9251-7ff177b1fe01
        description: Die höchste Anschauung befreit den Menschengeist von einseitigem Abhängigkeitsgefühl;
          die Triebkraft des Sittlichen wirkt im eigenen Willen, und die höchsten Entscheidungen
          fließen aus der Welt der sittlichen Ideen.
        relevance: 0.85
      - chunk_id: c3d2d814-0f6a-51b1-b1a6-43dd2f009aed
        description: An der Verbreitung der Dreigliederungsidee muss gearbeitet werden, damit im rechten
          Augenblick genug geistig aufgeklärte Menschen vorhanden sind.
        relevance: 0.8
      - chunk_id: 129c3d70-15b1-578e-a028-6945651f55c3
        description: Aus dem Erleben der vollen Wirklichkeit ringt man sich zur Dreigliederungsidee durch,
          und aus den Worten soll die Tat geboren werden.
        relevance: 0.75
  - term: Handeln
    chunk_id: e8b0ca98-1178-595b-b965-555d196af46f
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Handeln ist für Rudolf Steiner der bewusste, aus eigener Einsicht vollzogene Vollzug einer
      Willensentscheidung. Es unterscheidet sich grundlegend von bloßem Tun oder Reagieren, das
      durch unbewusste Antriebe, Triebe oder äußeren Zwang bestimmt wird. Die entscheidende Frage
      ist, ob ein Mensch einen bewussten Beweggrund für sein Handeln hat oder nur einem blinden
      Drang folgt. Erst wo der Beweggrund gedanklich durchdrungen ist, liegt wirkliches Handeln vor.


      Freiheit des Handelns bedeutet für Steiner, dass der Mensch die seinem Tun zugrunde liegenden
      Vorstellungen durch seine moralische Fantasie selbst bestimmen kann. Er ist nicht durch äußere
      Mächte oder vorgegebene Gesetze bestimmt, sondern sein eigenes Wollen ist souverän. Der
      Antrieb zum Handeln liegt in ihm selbst. Er wird nicht von einem Sollen getrieben, sondern
      setzt aus einer intuitiv erfassten Idee heraus die Tat. Dabei prüft er in jedem Augenblick
      neu, ob sein Wollen mit dem übereinstimmt, was er als richtig erkannt hat.


      Im sozialen Zusammenleben erweitert sich dieser Gedanke: Handeln im Gemeinwesen bedeutet, dass
      jeder seine Fähigkeiten und Einsichten aus freier Initiative entfalten kann. Die Grenze des
      eigenen Handelns liegt dort, wo das freie Handeln des anderen beginnt. Ein freies
      Vertragsverhältnis zwischen Menschen beruht auf gemeinsamer Festsetzung des Anteils an einer
      gemeinsamen Leistung.
    references:
      - chunk_id: c8f876e1-ab52-59f6-b379-79da2d789da7
        description: Ein bewusster Beweggrund des Handelns unterscheidet sich von einem unbewussten Antrieb
          und führt zu einer anders zu beurteilenden Handlung.
        relevance: 0.95
      - chunk_id: 6dc60a4a-3b9c-5e0e-b44d-cfcba962201c
        description: Der Antrieb zum Handeln liegt nicht außerhalb, sondern im Inhalt des Ideals selbst, das
          uns leitet.
        relevance: 0.9
      - chunk_id: 27c4e7a6-54b4-5312-a449-6c4f2cd216d0
        description: Handeln kann individuell auf den besonderen Fall geprägt und zugleich rein ideell aus
          der Intuition bestimmt sein; der wahrnehmbare Inhalt der Handlung kann Motiv sein.
        relevance: 0.85
      - chunk_id: 34281c83-c7df-58f6-8cb9-95e76962f1a7
        description: Beim freien Geist wird der Begriff in die konkrete Vorstellung des Handelns umgesetzt,
          ohne Vorbild oder Furcht.
        relevance: 0.85
      - chunk_id: df012d0e-6932-5c90-80d8-a058b0d02118
        description: Das Erträgnis einer Betätigung durch Kapital und individuelle Fähigkeiten ergibt sich
          aus freier Initiative und freiem Verständnis anderer Menschen.
        relevance: 0.8
      - chunk_id: fa8e6250-5cde-5a79-a4b1-a70a57cc42a5
        description: Ob ich tun kann, was ich will, hängt von äußeren Umständen und technischer
          Geschicklichkeit ab, nicht vom bloßen Wollen.
        relevance: 0.7
  - term: Himmel
    chunk_id: 1a82a4f8-cd22-5058-9913-33b28bc7e7ff
    language: de
    tags:
      - concept
      - assistant-generated
    text: Der Begriff „Himmel“ wird von Rudolf Steiner nicht als ein jenseitiger Ort oder ein
      vertröstendes Utopia verstanden. Er lehnt jede Form von Jenseitsvertröstung ab und betont die
      diesseitige Verwirklichung geistiger Inhalte. Der Himmel ist für ihn vielmehr eine Qualität
      des Bewusstseins und der Erkenntnis, die der Mensch hier und jetzt in sich entwickeln kann.
      Steiner beschreibt das Denken als einen unmittelbar tätigen, schöpferischen Vorgang.
      Erkenntnis ist für ihn kein theoretisch-abgeschlossenes Ergebnis, sondern ein lebendiges
      Seelenerlebnis, das in jedem Augenblick neu aus der inneren Tätigkeit hervorgeht. Wer dieses
      Seelengebiet betritt, erfährt die Gedankenwelt nicht als etwas Abstraktes, sondern als eine
      Sphäre, in der der Mensch sich als Teil eines kosmischen Gedankengefüges erlebt. Der Mensch
      wird von den Hierarchien des Kosmos gedacht; er ist selbst ein Gedanke dieser höheren
      Wesenheiten. In diesem Sinne ist der Himmel der Inbegriff jener geistigen Wirklichkeit, in der
      der Mensch durch freie, selbstbestimmte Erkenntnistätigkeit die Ideen der Dinge unmittelbar
      erlebt und zugleich erkennt, dass er in einem größeren, geistigen Zusammenhang steht. Es ist
      die Sphäre der vollendeten Freiheit des Erkennens und Handelns, die der Mensch nicht erst nach
      dem Tod, sondern bereits im irdischen Leben verwirklichen kann, indem er aus seiner eigenen
      Intuition heraus schöpferisch tätig wird und sich als Teil einer freien Geistesgemeinschaft
      begreift.
    references:
      - chunk_id: 771bf9a9-85b4-5506-aaf1-577112a7bc45
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 1
      - chunk_id: fa9c2477-a053-5641-9c3f-8e0fb6740239
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 0.998
      - chunk_id: 514f62cb-157a-56d4-a105-758480c95768
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 0.9963
  - term: Ich-Bewusstsein
    chunk_id: 908acb34-242d-5ef2-b726-dec51280ac63
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Das Ich-Bewusstsein entsteht nach dieser Auffassung nicht durch bloße Gedanken oder Gefühle,
      sondern durch einen bewussten Selbstbezug des Denkens. Der Mensch tritt den Dingen als
      Betrachtender gegenüber und reißt die Wirklichkeit in zwei Faktoren auseinander: die
      Wahrnehmung, die objektiv gegeben ist, und den Begriff, den er subjektiv durch seine Tätigkeit
      bildet. Volle Wirklichkeit entsteht erst im Zusammenhang beider, in der denkenden Beobachtung.
      Das Ich verwirklicht sich im Denken, weil das Denken die Tätigkeit ist, die der Mensch aus
      sich selbst hervorbringt. Er entnimmt die Bestimmungen des Gedankens aus der Gedankenwelt, die
      er aus seinem Inneren herausholen muss. Das Ich kann sich durch Freiheit in Tätigkeit
      versetzen und aus sich heraus durch Selbstbestimmung die Kategorie des Erkennens realisieren.
      Die Vereinigung der sonst getrennt im Bewusstsein verbleibenden zwei Elemente der Wirklichkeit
      kann nur durch einen Akt der Freiheit geschehen. Das Ich-Bewusstsein ist damit die Grundlage
      der Freiheit: Handeln aus selbstgeprüften Motiven, nicht aus äußerem Zwang oder blindem Trieb.
      Entscheidend ist nicht, ob man einen gefassten Entschluss ausführen kann, sondern wie der
      Entschluss in einem selbst entsteht. Frei sein heißt, die dem Handeln zugrunde liegenden
      Vorstellungen durch die moralische Fantasie von sich aus bestimmen zu können."
    references:
      - chunk_id: a4f087d2-6ccc-5bb8-9ba3-f136d7ab15a7
        description: Das Ich kann sich durch Freiheit in Tätigkeit versetzen und aus sich heraus durch
          Selbstbestimmung die Kategorie des Erkennens realisieren.
        relevance: 1
      - chunk_id: b4044e98-59b2-50c2-b9d8-49b63ba609b7
        description: Nicht darauf kommt es an, ob ich einen gefassten Entschluss zur Ausführung bringen
