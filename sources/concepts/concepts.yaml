          Strebens und die der Erfüllung sind getrennt.
        relevance: 0.9
      - chunk_id: 5623a976-b696-5718-b596-44f53507a2d8
        description: Erfüllung eines Begehrens ruft Lust, Nichterfüllung Unlust hervor; Unlust kann auch
