        relevance: 0.7
  - term: Impuls
    chunk_id: ba8ef566-4d0a-58c2-858e-46383cea7ab8
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Impuls bezeichnet in diesem Zusammenhang eine innere Bewegung, die aus dem Denken
      hervorgeht und als bewusster Beweggrund zum Handeln führt. Er unterscheidet sich grundlegend
      von einem unbewussten Antrieb oder blinden Drang, weil er auf Einsicht beruht und nicht aus
      der leiblichen Natur des Menschen stammt. Die entscheidende Frage ist, ob ein Mensch aus einem
      bewussten Beweggrund handelt oder aus einem unbewussten Antrieb – davon hängt ab, wie die
      Handlung beurteilt wird und ob sie als frei gelten kann.


      Ein solcher Impuls entsteht dann, wenn ein Begriff oder eine Vorstellung auf die
      charakterologische Anlage eines Menschen einwirkt und so zum Motiv des Wollens wird. Die
      höchste Form dieses Antriebs ist die reine Intuition: Hier handelt der Mensch unter dem
      Einfluss des reinen Denkens, ohne dass eine äußere Wahrnehmung oder ein fremdes Gebot ihn
      bestimmt. Der Antrieb liegt allein im Gedankeninhalt, nicht in einem äußeren Gesetz oder
      Zwang. Der Mensch wird auf dieser Stufe sein eigener Gesetzgeber, weil das Wollen souverän das
      vollführt, was als Gedankeninhalt in der Persönlichkeit lebt.


      Der Ursprung solcher sittlichen Impulse liegt in einer Welt, die die Seele unabhängig vom Leib
      anschaut. Aus dieser Welt ragen Antriebe in das Seelenleben herein, die das Handeln unabhängig
      von der leiblichen Natur bestimmen sollen. Damit wird der Impuls zum Bindeglied zwischen
      Erkenntnis und Tat: Der aus Erkenntnis Handelnde verwirklicht in seinem Tun, was er zuvor in
      reiner Einsicht erfasst hat.
    references:
      - chunk_id: 0eb4246d-2566-51f6-95a1-05bfc3c1a605
        description: Der Ursprung der sittlichen Impulse liegt in der Welt, welche die Seele leibfrei
          anschaut, und diese Antriebe stammen nicht aus der leiblichen Natur des Menschen.
        relevance: 0.95
      - chunk_id: c8f876e1-ab52-59f6-b379-79da2d789da7
        description: Es gibt einen Unterschied zwischen einem bewussten Beweggrund und einem unbewussten
          Antrieb, der zu unterschiedlichen Beurteilungen der Handlung führt.
        relevance: 0.9
      - chunk_id: 6e1071f1-430b-5a4f-b65c-352280d76088
        description: Ein Antrieb aus reiner Intuition ist nicht mehr individuell, sondern ideell und
          allgemein, und das Wollen tritt ein, sobald der Inhalt als Grundlage einer Handlung
          angesehen wird.
        relevance: 0.9
      - chunk_id: ee2de37d-8216-5413-8227-3eabf6d93f96
        description: Die höchste Stufe des individuellen Lebens ist das begriffliche Denken durch reine
          Intuition, ohne Bezug auf Wahrnehmungen.
        relevance: 0.85
      - chunk_id: 6dc60a4a-3b9c-5e0e-b44d-cfcba962201c
        description: Der Antrieb zum Handeln liegt nicht außerhalb, sondern im Gedankeninhalt des Ideals
          selbst, das in uns tätig ist.
        relevance: 0.85
      - chunk_id: 27c4e7a6-54b4-5312-a449-6c4f2cd216d0
        description: Der Einwand, dass Handeln zugleich individuell und rein ideell aus Intuition bestimmt
          sein kann, beruht auf einer Verwechselung von sittlichem Motiv und wahrnehmbarem Inhalt
          der Handlung.
        relevance: 0.8
  - term: Individualität
    chunk_id: bffb7d03-63bf-5afa-85b6-458edfc87a5e
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Der Mensch ist nicht von Geburt an eine Individualität, sondern er wird es erst durch einen
      Entwicklungsprozess. Er tritt als Glied eines natürlichen Ganzen auf – Rasse, Volk, Familie –
      und trägt die allgemeinen Charaktereigentümlichkeiten der Gemeinschaft, der er angehört. Von
      diesem Gattungsmäßigen macht er sich jedoch frei. Er entwickelt Eigenschaften und Funktionen,
      deren Bestimmungsgrund nur in ihm selbst zu suchen ist. Das Gattungsmäßige dient ihm dabei als
      Mittel, um seine besondere Wesenheit auszudrücken. Individualität entsteht durch Handeln aus
      eigenen, inneren Impulsen. Der Antrieb kann da nur ein ganz individueller sein; eigene
      Handlung ist, was man als solche aus sich entspringen lässt. Auf dem Weg zu diesem Ziel
      spielen Normen ihre berechtigte Rolle, doch das Ziel selbst besteht in der Verwirklichung rein
      intuitiv erfasster Sittlichkeitsziele. Zugleich ist der Mensch nicht nur sich selbst, sondern
      auch der Gesellschaft zugehörig. Was sich in ihm darlebt, ist nicht bloß seine Individualität,
      sondern auch jene des Volksverbandes. Das Individuum würde verkümmern, wenn es außerhalb der
      menschlichen Gemeinschaft ein abgesondertes Dasein führte. Gesellschaft und Staat wirken auf
      das Individualleben zurück. Individualität ist daher keine Besitztum, sondern eine Aufgabe:
      Sie verwirklicht sich in der Begegnung mit anderen und der Welt, indem der Mensch sich von
      kollektiven Zwängen löst, ohne in Willkür zu verfallen."
    references:
      - chunk_id: 3cbd4adb-048a-5c36-b51a-9b6568d5536f
        description: Der Mensch tritt als Glied eines natürlichen Ganzen auf und trägt die allgemeinen
