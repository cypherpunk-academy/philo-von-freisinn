        relevance: 0.3
  - term: Seele
    chunk_id: a6d15205-f420-5c65-aa4a-e15399ca1956
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Die Seele ist nach dieser Auffassung das innere Erlebniszentrum des Menschen. Sie ist der
      Ort, an dem Wahrnehmung und Denken in einer Weise zusammentreffen, die über ein bloß passives
      Aufnehmen hinausgeht. Die Seele ist kein Spiegel, der die Außenwelt lediglich abbildet; sie
      arbeitet aktiv an der Konstitution von Wirklichkeit mit. Sie macht mit dem Gehirn, was ein
      Mensch mit einem Spiegel macht: Sie bereitet es zu, damit Erkenntnis zustande kommen kann. In
      der Seele eröffnet sich so der Ausblick auf eine Wirklichkeit, die den Sinnen unzugänglich
      ist. Sie erfühlt sich in einem seelisch-geistigen Weben und ist mit dem Geistigen außerhalb
      des Leibes verbunden. Die Seele ist nicht mit dem Geist identisch, aber auch nicht von ihm
      getrennt; beide wirken in einem seelisch-geistigen Zusammenhang. Die Welträtsel wollen von der
      Menschenseele nicht bloß bedacht, sondern erlebt sein. Die Seele kann durch innere
      Seelentätigkeit zu einem Erleben gelangen, das über das gewöhnliche Bewusstsein hinausgeht.
      Dieses Erleben ist kein theoretisches Wissen, sondern ein Erlebnisgebiet, auf dem sich die
      Fragen des Lebens immer neu lebendig beantworten. Die Seele ist damit das Organ, durch das der
      Mensch an einer geistigen Welt teilhat, die ihm durch die Vermittlung des Leibes zur
      Wahrnehmung gebracht wird."
    references:
      - chunk_id: ec084a54-d65d-5a2c-a964-049003036209
        description: In der Seele eröffnet sich der Ausblick auf eine den Sinnen unzugängliche Wirklichkeit,
          und die Seele erfühlt sich in einem seelisch-geistigen Weben, verbunden mit dem Geistigen
          außerhalb des Leibes.
        relevance: 1
      - chunk_id: 578d6e3f-8f5a-57dd-901d-6259e915a580
        description: Der Mensch nimmt nur die letzte Phase seines denkerischen Erlebens wahr, vergleichbar
          mit einem Spiegel, der das Gesicht zeigt.
        relevance: 0.8
      - chunk_id: 12803869-1484-5223-b2a9-ab679549f755
        description: Das Ich lebt mit seiner seelisch-geistigen Welt außerhalb des Leibes und bringt die
          Erlebnisse der Außenwelt an den Leib heran.
        relevance: 0.7
      - chunk_id: a5568ad8-99e8-54c4-b8d3-daf47b74c343
        description: Die Seele erstarkt im Selbsterleben ihres Eigenwesens und der Gedanke verschmilzt mit
          der Selbsterkenntnis.
        relevance: 0.6
      - chunk_id: 5c11a628-0833-5d2f-a5f9-216952e3a83c
        description: Die einheitliche Seele ist erfahrungsgemäß gegeben, und Denken, Fühlen und Wollen gehen
          vom Ich aus.
        relevance: 0.6
      - chunk_id: ef261844-0543-5218-8a53-9a9ec67e49e4
        description: Die Anschauung wird ein Glied lebendigen Seelenlebens und gibt keine theoretische,
          sondern eine lebendige Antwort.
        relevance: 0.5
      - chunk_id: c996dcb8-9f9a-5d1f-8532-29d50c288ca3
        description: Durch Innenarbeit kann die Menschenseele erreichen, was die Philosophie anstrebt, wobei
          die Kräfte der Seele wesentlicher sind als die Ergebnisse.
        relevance: 0.4
      - chunk_id: 771bf9a9-85b4-5506-aaf1-577112a7bc45
        description: Die Menschenseele entwickelt sich aus dem dumpfen Kindeserleben durch Erinnerungskraft,
          ähnlich wie sie zu höherem Erleben erwachen kann.
        relevance: 0.3
      - chunk_id: fc83e737-fa5f-54a0-8b5e-b884eb1adbd1
        description: Bei der Selbstbetrachtung ist man an die Gesetze der eigenen Organisation gebunden,
          ähnlich wie bei der Betrachtung anderer Gegenstände.
        relevance: 0.3
      - chunk_id: 44d8299f-0d18-56db-9bd5-87e789416326
        description: Die Schrift legt den Weg von der sinnenfälligen Welt in eine geistige frei.
        relevance: 0.3
      - chunk_id: 9630cb46-e358-5dae-ac7b-933f916218dc
        description: Man muss auf das Innerste der Persönlichkeit eingehen, um die Einheit der Anschauungen
          zu überschauen.
        relevance: 0.2
      - chunk_id: 919225a7-3711-5a9c-b9ca-f00df0923ced
        description: Die erste Form der Wirklichkeitsbeobachtung wird als Erscheinung für die Sinne
          bezeichnet, wobei Sinn alle leiblichen und geistigen Organe umfasst.
        relevance: 0.2
      - chunk_id: f96748b0-4b22-5e5e-9854-32bd0ae88fa9
        description: Die Ideen der Schrift sind aus der Beobachtung des Lebens erkämpft.
        relevance: 0.2
  - term: Seelenleben
    chunk_id: 999f423a-4423-56b7-be9c-9c75b452b77f
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Das Seelenleben ist kein abgeschlossener Behälter, sondern ein dynamisches Erlebnisgebiet. In
      ihm treten Vorstellungen, Gefühle und Willensimpulse als unmittelbare innere Zustände auf – in
      derselben Form, wie die Dinge der Außenwelt ins Bewusstsein treten. Ein Gefühl drängt sich
      ebenso auf wie ein Lichteindruck. Das Seelenleben ist damit weder bloßes Abbild der Außenwelt
      noch ein reines Innenleben ohne Bezug zur Wirklichkeit.


      Der Mensch kann in diesem Seelenleben eigene Impulse setzen, sofern er sich durch das Denken
      bewusst zu seinen Vorstellungen verhält. Das Denken richtet den Blick nach außen auf ein
      Gegenüberstehendes; es ist Betrachtung. Indem die Seele denkend tätig ist, bearbeitet sie ihr
      Inneres ähnlich, wie ein Mensch einen Spiegel zubereitet, um sein Gesicht darin zu sehen. Auf
      diese Weise kann sie ein Erleben ergreifen, das von den Bedingungen der leiblichen Organe
      unabhängig ist.


      In dieses Seelenleben ragen aus einer leibfreien Welt die sittlichen Impulse herein, die das
      Handeln des Menschen bestimmen sollen. Sie stammen nicht aus der leiblichen Natur, sondern aus
      einer geistigen Wirklichkeit, die ihren Inhalt in sich selber trägt. Das Seelenleben ist daher
      der Ort, an dem sich die Frage nach dem eigenen Handeln in jedem Augenblick neu und lebendig
      beantwortet.
    references:
      - chunk_id: 0eb4246d-2566-51f6-95a1-05bfc3c1a605
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 1
