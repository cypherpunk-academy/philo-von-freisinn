        relevance: 0.75
      - chunk_id: 4cfeb924-e2db-5f73-bf12-6ade44ce12cf
        description: Eine Wissenschaftsgesinnung soll dem Blut Wärme geben und Licht auf den Sinn des
          Menschen- und Weltdaseins werfen, nicht lebensfremd sein.
        relevance: 0.7
      - chunk_id: cb70c9d2-c875-598d-9b1c-9b615e173198
        description: Ein Ideal, das sich in der Wesenheit als reales Element an die Oberfläche arbeitet, ist
          kein erdachtes, sondern ein lebendiges Ideal.
        relevance: 0.6
  - term: Intuition
    chunk_id: 076659ec-65c8-552c-9aec-18cb33d6b7f5
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Intuition ist die höchste Stufe des Erkennens. Sie ist das im rein Geistigen verlaufende
      bewusste Erleben eines rein geistigen Inhalts. In der Intuition bestimmt der Mensch den Inhalt
      eines Begriffs aus der ideellen Sphäre heraus, ohne Rücksicht auf einen bestimmten
      Wahrnehmungsgehalt. Während die Wahrnehmung den objektiven Teil der Wirklichkeit liefert, wird
      der subjektive, begriffliche Teil durch Intuition gegeben. Erst im Zusammenhang beider, in der
      denkenden Beobachtung, entsteht volle Wirklichkeit.


      Intuition ist kein passives Empfangen, sondern ein bewusst vollzogener Erkenntnisakt. Sie
      befreit das Denken von der Vermittlung durch sinnliche Wahrnehmungen. Wer die Wesenheit des
      Denkens durch Intuition erfasst, erkennt, dass das Denken eine auf sich selbst ruhende
      geistige Wesenhaftigkeit ist. Dieses Erleben des intuitiven Denkens kommt der Erkenntnis von
      der Freiheit des Denkens gleich.


      Im Handeln zeigt sich die Intuition als rein ideelle Triebfeder. Handelt der Mensch unter dem
      Einfluss von Intuitionen, so ist die Triebfeder seines Handelns das reine Denken, die
      praktische Vernunft. Eine solche Handlung ist weder durch eine vorher bestimmte
      charakterologische Anlage noch durch ein äußeres sittliches Prinzip bestimmt. Sie wird durch
      ihren idealen Gehalt getragen. In der ideellen Intuition wirkt nichts als deren eigene auf
      sich gebaute Wesenheit. Findet der Mensch, dass eine Handlung das Abbild einer solchen
      Intuition ist, so empfindet er sie als eine freie.
    references:
      - chunk_id: ee2de37d-8216-5413-8227-3eabf6d93f96
        description: Die höchste Stufe des individuellen Lebens ist das begriffliche Denken ohne Rücksicht
          auf einen bestimmten Wahrnehmungsgehalt, und der Inhalt eines Begriffs wird durch reine
          Intuition aus der ideellen Sphäre bestimmt.
        relevance: 0.95
      - chunk_id: fc5917e7-8774-5872-b6c3-6b28e387e76f
        description: Die höchste Stufe der charakterologischen Anlage ist das reine Denken als praktische
          Vernunft, und das höchste Motiv ist die begriffliche Intuition, bei der Triebfeder und
          Motiv zusammenfallen.
        relevance: 0.9
      - chunk_id: 647177f5-1d6c-5f64-a896-73c8d7e659e5
        description: Das intuitive Denken ist eine auf sich selbst ruhende geistige Wesenheit, und das
          Erleben dieser Wesenheit kommt der Erkenntnis der Freiheit gleich.
        relevance: 0.9
      - chunk_id: a52486a6-bc11-5594-b271-b28af95df34e
        description: In dem Wollen verwirklicht sich eine ideelle Intuition, und das Erlebnis dieser
          Verwirklichung führt zum Bewusstsein der Freiheit des Wollens.
        relevance: 0.85
      - chunk_id: dbafbb83-9ca1-5cbc-b610-883bbbeee36c
        description: Die Freiheit des menschlichen Wollens besteht darin, dass es rein ideelle Intuitionen
          verwirklicht, die auf sich selbst stehen und nicht von außen bestimmt sind.
        relevance: 0.85
      - chunk_id: 27c4e7a6-54b4-5312-a449-6c4f2cd216d0
        description: Das Handeln aus reiner Intuition ist individuell auf den besonderen Fall geprägt und
          dennoch rein ideell bestimmt, wobei der wahrnehmbare Inhalt der Handlung nicht mit dem
          sittlichen Motiv verwechselt werden darf.
        relevance: 0.8
      - chunk_id: 4fd46fd4-371f-5436-99c9-e3787ee12126
        description: "Die Unterscheidung von Idee und Wahrnehmung betrifft die Art, wie menschliche
          Erkenntnis zustande kommt: Die Dinge sagen einen Teil ihrer Wesenheit freiwillig, den
          anderen Teil muss der Mensch durch Denken entlocken."
        relevance: 0.7
      - chunk_id: 53f47093-07f6-5ed8-a5ea-db9a00683ca5
        description: Im Betrachten des Denkens fallen Begriff und Wahrnehmung zusammen, und wer dies nicht
          durchschaut, sieht in Begriffen nur schattenhafte Nachbildungen der Wahrnehmungen.
        relevance: 0.65
      - chunk_id: f891920c-bfc9-589c-96c7-0e00573db03a
        description: Die Intuition bedeutet innerhalb der wissenschaftlichen Richtung, die im Denken den
          Kern der Welt wesenhaft erfasst, etwas anderes als in einer Richtung, die das Wesen in ein
          unerforschbares Jenseits verlegt.
        relevance: 0.6
      - chunk_id: 1e7ec70e-04e7-5a99-8a3e-24b8665416b5
        description: Der Schnitt zwischen Wahrnehmen und Denken ist erst vorhanden, wenn der Betrachtende
          den Dingen gegenübertritt.
        relevance: 0.5
      - chunk_id: a5568ad8-99e8-54c4-b8d3-daf47b74c343
        description: Die Entwicklung des Gedankenlebens ist durch vier Epochen fortgeschritten, in denen der
          Gedanke zunächst wie eine Wahrnehmung von außen wirkt und später mit der Selbsterkenntnis
          verschmilzt.
        relevance: 0.4
      - chunk_id: c8f876e1-ab52-59f6-b379-79da2d789da7
        description: Die Frage nach der Freiheit des Willens darf nicht einseitig gestellt werden, sondern
          muss mit der Unterscheidung zwischen bewusstem Beweggrund und unbewusstem Antrieb
          verknüpft werden.
        relevance: 0.3
  - term: Kapital
    chunk_id: 9e9a5fe1-1ef1-5b3e-bc90-c0196392e81c
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Kapital ist kein bloßer Geldbetrag oder Sachwert, sondern eine soziale Funktion. Es ist das
      Mittel, individuelle Fähigkeiten für weite Gebiete des sozialen Lebens in Wirksamkeit zu
      bringen. Kapital entsteht und wird verbraucht durch das Zusammenwirken von individuellen
      Fähigkeiten, Rechtsbildung und den Kräften des Wirtschaftslebens. Die entscheidende Frage ist
      nicht, ob es Kapital gibt, sondern wie darüber verfügt wird.


      Solange Kapital allein dem persönlichen Gewinn oder der Machtausübung über andere dient, wirkt
      es lähmend und unfrei. Das Eigentumsrecht an der Kapitalgrundlage muss in dem Augenblick
      verändert werden können, in dem es in ein Mittel zur ungerechtfertigten Machtentfaltung
      umschlägt. Wird Kapital dagegen von Menschen eingesetzt, die aus eigener Initiative und
      Einsicht handeln, kann es produktiv werden. Die fruchtbare Betätigung individueller
      Fähigkeiten durch Kapital kann nicht ohne die freie Verfügung darüber in den Kreislauf des
      Wirtschaftslebens eintreten.


      Steiner fordert eine klare Trennung der gesellschaftlichen Bereiche. Der Rechtsstaat soll die
      Entstehung und Verwaltung des privaten Eigentums an Kapital nicht verhindern, solange es einen
      Dienst für das Ganze bedeutet. Er soll es aber niemals selbst in Besitz nehmen. Kapital gehört
      in den eigenständigen Wirtschaftsbereich, wo es durch freie Vereinbarungen zwischen
      gleichberechtigten Partnern seine soziale Bestimmung findet.
    references:
      - chunk_id: 73ee3342-63ab-5d65-8c20-823786aecb6b
        description: Die fruchtbare Betätigung individueller Fähigkeiten durch Kapital kann nicht ohne freie
          Verfügung über das Kapital in den Kreislauf des Wirtschaftslebens eintreten.
        relevance: 0.95
      - chunk_id: 59a8c940-951c-594a-abb7-63a86c54cc29
