        relevance: 0.3
  - term: Entwicklung
    chunk_id: 44066a82-c9ae-5cdd-9150-4038cd83cd32
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Entwicklung ist für Steiner kein mechanisches Fortschreiten, sondern ein innerer Vorgang der
      Verwirklichung von Anlagen und Möglichkeiten. Sie vollzieht sich im Menschen zunächst
      unbewusst, etwa wenn in der Kindheit die Kraft des Gedächtnisses erstarkt und der Mensch aus
      einem dumpfen Lebenstraum erwacht. Diese Entwicklung kann jedoch auf einer höheren Stufe
      bewusst ergriffen werden. Der Mensch ist in der Lage, durch eigenes Denken und Handeln über
      sich hinauszuwachsen, indem er die in ihm liegenden Kräfte in freier, individueller Weise zur
      Entfaltung bringt.


      Entwicklung betrifft nicht nur den Einzelnen, sondern auch die Geschichte und die sozialen
      Verhältnisse. Die Dreigliederung des sozialen Organismus ist der Versuch, gesellschaftliche
      Entwicklung bewusst zu gestalten, indem die drei Lebensbereiche – Geistesleben, Rechtsleben
      und Wirtschaftsleben – ihre je eigene, unabhängige Dynamik entfalten können. Entwicklung ist
      dabei kein Automatismus. Wer darauf wartet, dass sich die Verhältnisse „von selbst“ zum
      Besseren wenden, gleicht einem Menschen, der in einem stickigen Zimmer sitzt und nicht das
      Fenster öffnet. Entwicklung erfordert bewusstes, tätiges Eingreifen aus Einsicht in die
      Notwendigkeiten der Gegenwart. Sie ist kein passives Geschehen, sondern eine Aufgabe, die der
      Mensch aus freiem Entschluss ergreifen muss.
    references:
