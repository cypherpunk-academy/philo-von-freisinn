begriffe:
  - term: Anschauung
    chunk_id: d8300bf2-22f4-53bf-8498-f3b80d2a9247
    language: de
    tags:
      - concept
      - curated
    text: >-
      Anschauung bezeichnet bei Steiner zunächst die unmittelbare, sinnliche Auffassung der Wirklichkeit, die reine Erfahrung, bevor das Denken sie ordnet. Die Wahrnehmung für sich ist jedoch nur ein Teil der Wirklichkeit. Der andere Teil, der sie erst vollständig macht, wird im denkenden Durchdringen der Wahrnehmung erlebt. Ebenso wenig ist der abstrakte Begriff für sich wirklich. Wirklichkeit liegt in der Einheit von Wahrnehmung und Begriff.

      In der unorganischen Naturwissenschaft liefern die Sinne den Inhalt, und das Denken findet dazu die Form, das Gesetz. Beim Organischen, beim Typus, sind Inhalt und Form dagegen eng verbunden. Der Geist muss hier mit der Form den Inhalt miterzeugen und übernimmt die Tätigkeit, die sonst die Sinne besorgen. Er wird selbst anschauend: Die Urteilskraft muss „denkend anschauen und anschauend denken“. Goethe nennt dieses Vermögen „anschauende Urteilskraft“ und weist damit nach, was Kant dem Menschen seiner Anlage nach absprach. Der Geist verhält sich dabei als Organ, das Ideen wahrnimmt, so wie das Auge das Licht. Die Idee wird nicht erschlossen, sondern angeschaut. In besonders gesteigerten Erscheinungen der Natur wird die Idee sogar unmittelbar sichtbar, sodass Sinnliches und Geistiges ineinander übergehen. Im Beobachten des Denkens selbst fallen Begriff und Wahrnehmung in eins zusammen. Die Anschauung ist dann selbst Idee, und der Mensch erlebt darin seine Freiheit.
  - term: Assoziation
    chunk_id: 57714847-0f8a-5f7d-b4d4-bf6ab9f98aa0
    language: de
    tags:
      - concept
      - curated
    text: >-
      Assoziation bezeichnet in Steiners Dreigliederung die Form, in der sich das Wirtschaftsleben auf eigenem Boden verwaltet. Der Wirtschaftskörper soll als selbständiges Glied neben Geistesleben und Rechtsstaat stehen und dem Kreislauf der Waren dienen: Erzeugung, Austausch und Verbrauch. Weder Arbeitskraft noch Rechte sollen darin als Waren zirkulieren.

      Die Assoziationen bilden sich aus den Produktionserfordernissen und Konsumtionsinteressen der beteiligten Menschen und Betriebe. Sie ersetzen eine zentralistische Verwaltung und bewahren die freie Initiative der einzelnen Betriebe, deren soziale Ausrichtung aus den Abmachungen der selbständigen Betriebe hervorgeht. Weil jede Assoziation mit anderen im Wechselverkehr steht, werden die einseitigen Interessen eines Produktionszweiges durch die der anderen geregelt. Die Assoziationen entscheiden über Kreditgewährung und Kreditannahme, und der Gesichtspunkt dafür ist der Bedarf der Gemeinschaft, nicht der Erwerbsantrieb des Einzelnen. Die Verantwortung ist dabei geteilt: Der Einzelne ist seiner Assoziation für die bestmögliche Leistung verantwortlich, die Assoziation gegenüber anderen Assoziationen für die zielgemäße Verwendung der Leistungen. So kommt die individuelle Fähigkeit erst voll zur Geltung. Ein Netz solcher Assoziationen kann neben den bestehenden Einrichtungen entstehen und sich von einzelnen Gebilden aus ausbreiten, ohne dass das Alte zerstört werden müsste.
  - term: Begriff
    chunk_id: 218e5bc9-f8bb-5c5f-831b-b79f190bf730
    language: de
    tags:
      - concept
      - curated
    text: >-
      Begriffe entstehen durch das Denken. Was ein Begriff ist, lässt sich nicht mit Worten sagen; Worte machen nur darauf aufmerksam, dass man Begriffe hat. Sieht jemand einen Baum, so reagiert sein Denken auf die Beobachtung: Zum Gegenstand tritt ein ideelles Gegenstück hinzu. Verschwindet der Gegenstand, so bleibt dieses Gegenstück zurück, und das ist der Begriff. Er wird nicht aus der Beobachtung gewonnen, sondern zu ihr hinzugefügt. Die Begriffe schließen sich zu einem gesetzmäßigen Ganzen zusammen, und alle Begriffe, die man sich von Löwen bildet, fallen in den Gesamtbegriff „Löwe“ zusammen. Ideen sind von Begriffen nicht qualitativ verschieden, sondern nur inhaltsvollere, gesättigtere und umfangreichere Begriffe. Begriffe setzen das Denken schon voraus.

      Der Inhalt des Begriffs erscheint im Innern. Die Form, in der er zunächst auftritt, heißt Intuition; sie ist für das Denken, was die Beobachtung für die Wahrnehmung ist. Subjektiv ist nur die abstrakte Form, in der man den Begriff festhält, nicht sein Inhalt. Dieser ist der Teil der Wirklichkeit, den das Wahrnehmen nicht erreicht: Erfahrung, aber nicht durch das Wahrnehmen vermittelt. Ein abstrakter Begriff hat für sich so wenig Wirklichkeit wie eine Wahrnehmung für sich. Verbindet sich ein Begriff mit einer Wahrnehmung und behält er diesen Bezug, so wird er zur Vorstellung, einem individualisierten Begriff. Den Begriff des Löwen kann man auch jemandem beibringen, der nie einen Löwen gesehen hat, eine lebendige Vorstellung nicht.
  - term: Beobachtung
    chunk_id: 5069adb1-6867-5286-839c-624ab792e990
    language: de
    tags:
      - concept
      - curated
    text: >-
      Beobachtung und Denken sind die beiden Ausgangspunkte für alles geistige Streben des Menschen; vom Alltagsverstand bis zur verwickeltsten Forschung ruht alles auf diesen beiden Grundsäulen. Allen anderen Urgegensätzen der Philosophen, etwa Subjekt und Objekt oder Erscheinung und Ding an sich, geht dieser voraus. Dass wir der Beobachtung bedürfen, liegt in unserer Organisation: Ein Pferd ist uns nur durch Beobachtung zugänglich. Durch bloßes Anstarren gewinnen wir aber keinen Begriff von ihm, so wie wir durch bloßes Denken kein Pferd hervorbringen. Die bloße Beobachtung verfolgt die Teile eines Vorgangs, ihr Zusammenhang bleibt ihr dunkel. Zeitlich geht sie sogar dem Denken voraus, denn alles, was in den Kreis unserer Erlebnisse tritt, werden wir erst durch sie gewahr: Empfindungen, Gefühle, Willensakte, Traumgebilde, Vorstellungen, Begriffe und Ideen, auch Illusionen. Das Objekt der Beobachtung heißt Wahrnehmung, nicht der Vorgang selbst.

      Auch das Denken lernen wir erst durch Beobachtung kennen, aber es unterscheidet sich als Beobachtungsobjekt von allen anderen Dingen. Den Tisch beobachte ich, das Denken über ihn führe ich aus, ohne es im selben Augenblick zu beobachten. Die Beobachtung des Denkens ist daher ein Ausnahmezustand. Das gegenwärtige Denken lässt sich nie beobachten, nur hinterher in einem zweiten Akt. Dafür ist diese Beobachtung die allerwichtigste, die der Mensch machen kann, denn er beobachtet etwas, das er selbst hervorbringt, und kennt dessen Zusammenhang unmittelbar.
  - term: Bestimmung
    chunk_id: 9b3fd1b9-5a8d-5e92-ab9c-4815749e0b95
    language: de
    tags:
      - concept
      - curated
    text: >-
      Bestimmung heißt in Steiners Erkenntnistheorie die gedankliche Festlegung dessen, was etwas ist und wie es mit anderem zusammenhängt. Der Weltinhalt, wie er zunächst gegeben ist, ist ganz bestimmungslos. Deshalb enthält sich die Erkenntnistheorie am Anfang jeder Bestimmung über das unmittelbar Gegebene, solange nicht klar ist, welchen Bezug eine Bestimmung zum Bestimmten hat. Selbst das Wort „gegeben“ sagt nichts über die Natur des Gegebenen aus; es bezeichnet nur sein Verhältnis zum Erkennen. Kein Teil des Gegebenen kann von sich aus den Anfang zu einer Ordnung machen, darum muss die erkennende Tätigkeit selbst ansetzen.

      Das Denken hebt Einzelheiten aus dem Zusammenhang des Ganzen heraus und bringt sie nach seinen eigenen Formen in Beziehung. Dabei bestimmt es von sich aus nichts über sie, sondern wartet ab, was sich aus dem hergestellten Bezug ergibt. Was im Denken auftritt, sind keine leeren Formen, sondern eine Summe von Bestimmungen, die für den übrigen Weltinhalt Form sind. Eine Bestimmung aus dem bloßen Ich ist leer und wird erst möglich, weil das Ich in der Welt des Denkens etwas durch und durch Bestimmtes findet. Das Gegebene durch das Denken bestimmen heißt Erkennen. In der übrigen Welt sind die Kategorien durch objektive Notwendigkeit mit dem Gegebenen verknüpft. Im Erkennen vereinigt das Ich beides selbst, durch Selbstbestimmung, also durch einen Akt der Freiheit.
  - term: Beweis
    chunk_id: cba90573-3fbe-5ac6-a5c9-8f927a5a8f1e
    language: de
    tags:
      - concept
      - curated
    text: >-
      Ein Beweis stützt sich auf eine Regel: Es werden bestimmte, in der Erfahrung mögliche Bedingungen angegeben und dann wird bestimmt, was eintritt, wenn sie vorliegen. Man denkt: Unter diesen Bedingungen tritt eine Erscheinung ein; die Bedingungen sind da, also muss die Erscheinung eintreten. Das ist die beweisende Methode, die Methode der Mechanik und der unorganischen Naturwissenschaft. Sie ist wissenschaftlich, weil sie eine Erscheinung vollständig mit dem Begriff durchtränkt, sodass Wahrnehmung und Denken sich decken. Im Organischen versagt sie. Der Typus bestimmt nicht, dass unter gewissen Bedingungen eine bestimmte Erscheinung eintritt, er kann daher kein Mittel des Beweises liefern. An die Stelle der beweisenden Methode tritt hier die entwickelnde, und an die Stelle der beweisenden Urteilskraft die anschauende.
  
      Der Beweis hat auch eine Grenze nach innen. Die Logik war nie eine beweisende Wissenschaft, sondern eine Beschreibung der Denkformen. Ein Beweis tritt erst ein, wenn das Gedachte mit einem anderen Weltinhalt verbunden wird. Beim Denken selbst hört alles Beweisen auf, denn der Beweis setzt das Denken bereits voraus. Man kann wohl ein einzelnes Faktum beweisen, nicht aber das Beweisen selbst; man kann nur beschreiben, was ein Beweis ist. Was aus dem Denken allein fließt, bietet für das Erkennen keine Schwierigkeit: Hier genügt es zu beobachten, und das Wesen ist unmittelbar gegeben.
  - term: Bewusstsein
    chunk_id: 6019f983-d9fd-5f78-a13c-20b13ed72f5a
    language: de
    tags:
      - concept
      - curated
    text: >-
      Viele Philosophen wollen vom Bewusstsein ausgehen, weil es kein Denken ohne Bewusstsein gibt. Steiner hält dagegen: Wer das Verhältnis von Denken und Bewusstsein klären will, muss darüber nachdenken und setzt damit das Denken voraus. Ein Weltschöpfer braucht zuerst einen Träger für das Denken; der Philosoph sucht aber den Ausgangspunkt für das Begreifen der Welt. Auch Subjekt und Objekt sind schon Begriffe, die das Denken gebildet hat. Das menschliche Bewusstsein ist der Schauplatz, wo Begriff und Beobachtung einander begegnen und miteinander verknüpft werden, der Vermittler zwischen Denken und Beobachtung. Richtet der Mensch sein Denken auf die Beobachtung, hat er Bewusstsein von Objekten; richtet er es auf sich, hat er Selbstbewusstsein. Weil es denkendes Bewusstsein ist, ist das menschliche Bewusstsein notwendig zugleich Selbstbewusstsein. Das Subjekt denkt nicht, weil es Subjekt ist, sondern es erscheint sich als Subjekt, weil es denken kann.

      Dem Ich als Mittelpunkt des Bewusstseins sind die äußere und innere Wahrnehmung und sein eigenes Dasein unmittelbar gegeben. Bei jedem anderen Teil der Welt sind Begriff und Gegebenes ursprünglich verbunden; die Trennung besteht nur für das Erkennen. Im Bewusstsein dagegen treten beide getrennt auf, und ihre Verbindung ist nur da, wenn das Bewusstsein sie in wirklicher Tätigkeit vollzieht. Ein wirkliches Bewusstsein existiert nur, wenn es sich selbst verwirklicht.
  - term: Charakter
    chunk_id: 1880f716-7708-541e-b3ae-7a5f8d75909d
    language: de
    tags:
      - concept
      - curated
    text: >-
      Für den Charakter im Zusammenhang des Wollens gebraucht Steiner im Anschluss an Eduard von Hartmann den Ausdruck charakterologische Anlage. Beim Willensakt unterscheidet er das Motiv, den augenblicklichen begrifflichen Bestimmungsgrund, und die Triebfeder, den bleibenden Bestimmungsgrund des Individuums. Derselbe Begriff wirkt auf verschiedene Menschen verschieden; das Wollen hängt also auch von ihrer individuellen Beschaffenheit ab, eben der charakterologischen Anlage. Sie wird gebildet durch den mehr oder weniger bleibenden Vorstellungs- und Gefühlsinhalt. Dieser hängt davon ab, welche Begriffe im Lauf des Lebens zu Vorstellungen geworden sind, also von der Fähigkeit der Intuition und vom Umkreis der Beobachtungen, ganz besonders aber vom Gefühlsleben. Die Vorstellung eines Spaziergangs wird nur dann zum Motiv, wenn sie auf eine passende Anlage trifft.

      Die Anlage wächst mit der Erfahrung. Vorstellungen von Handlungen, die immer wieder an ähnliche Wahrnehmungen geknüpft werden, werden zu Mustern und zu Gliedern der charakterologischen Anlage; so kann auch der Takt zur Anlage werden. Auf der höchsten Stufe wirkt das reine Denken als praktische Vernunft. Was hier antreibt, ist nicht mehr bloß Individuelles, sondern der allgemeine Inhalt einer Intuition, und gehört daher im strengen Sinne nicht mehr zur charakterologischen Anlage. Triebfeder und Motiv fallen zusammen: Weder eine vorher bestimmte Anlage noch ein äußeres Prinzip bestimmt das Handeln, sondern allein sein idealer Gehalt.
  - term: Dreigliederung
    chunk_id: 87fc67a6-ffe9-5856-a184-3c10b4f6cbb3
    language: de
    tags:
      - concept
      - curated
    text: >-
      Mit Dreigliederung meint Steiner, dass der soziale Organismus, wenn er gesund wirken soll, drei Glieder gesetzmäßig ausbilden muss. Das Wirtschaftsleben hat es mit Warenproduktion, Warenzirkulation und Warenkonsum zu tun; es ruht auf der Naturgrundlage, und der Mensch steht darin durch seine Interessen. Das Rechtsleben, das eigentliche politische Staatsleben, hat es mit dem Verhältnis von Mensch zu Mensch zu tun und baut auf den demokratischen Impulsen auf. Das Geistesleben umfasst alles, was aus der geistigen und physischen Begabung des einzelnen Menschen hervorgeht: Erziehung, Kunst, Wissenschaft, Weltanschauung. Es kann nur gedeihen, wenn es sich aus seinen eigenen Impulsen frei entfaltet und verwaltet.

      Wie im natürlichen Organismus der Kopf und nicht die Lunge das Denken besorgt, kann kein Glied die Aufgabe eines anderen übernehmen; Steiner vergleicht das Wirtschaftsleben mit dem Kopfsystem, das Rechtsleben mit dem Atmungssystem. Ein Analogiespiel will er damit ausdrücklich nicht treiben. Jedes Glied hat eigene Gesetzgebung und Verwaltung und ist in sich zentralisiert, und erst durch ihr lebendiges Zusammenwirken entsteht die Einheit des Ganzen, nicht durch eine abstrakte zentrale Einheit. Erst so zeigen die drei Ideale ihren Wirklichkeitswert, die im Einheitsstaat einander widersprechen: Brüderlichkeit im Wirtschaftsleben, die aus den Assoziationen ersteht, Gleichheit im Rechtsleben und Freiheit im Geistesleben.
  - term: Empfindung
    chunk_id: c298a513-c5bc-5f2f-86a4-8bc4f40c4f41
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Empfindung ist bei Steiner die durch ein Sinnesorgan vermittelte Qualität, etwa die Empfindung des Rot, eines Tons oder eines Drucks. Für das, was dem Bewusstsein gegeben ist, wählt er bewusst nicht dieses Wort, sondern Wahrnehmung, weil Empfindung in der Physiologie eine engere Bedeutung hat: Ein Gefühl in mir kann ich als Wahrnehmung bezeichnen, nicht aber als Empfindung im physiologischen Sinn.

      Eine zentrale Rolle spielt die Empfindung in dem Gedankengang, den Steiner darstellt und zurückweist, dem kritischen Idealismus. Danach wird der äußere Reiz in Sinnesorgan, Nerv und Gehirn so verwandelt, dass im Bewusstsein nur noch Empfindungen auftreten, die keine Ähnlichkeit mit dem Hirnvorgang haben; die Seele setzt sie erst zu Dingen zusammen. Licht, Farbe und Wärme sind dann bloß Antworten der Sinnesnerven, zumal jeder Sinn auf jeden Reiz nur in seiner eigenen Weise antwortet. Steiner hält dagegen: Es gibt keine Wahrnehmung ohne Sinnesorgan, aber auch kein Sinnesorgan ohne Wahrnehmung. Was in Auge, Nerv und Gehirn vorgeht, kenne ich wieder nur durch Wahrnehmung; ich gehe nur von einer Wahrnehmung zur anderen über. Dass ein Druck auf das Auge Licht hervorruft, zeigt nur, dass sich zur Wahrnehmung des Drucks eine Lichtqualität gesellt. Der Weg der äußeren Beobachtung endet beim Hirnvorgang, der Weg der inneren beginnt mit der Empfindung; dazwischen ist der Beobachtungsweg unterbrochen.
  - term: Entscheidung
    chunk_id: 82810829-a552-5abd-acad-e26c91590a8e
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Eine Entscheidung ist der bewusste Abschluss eines inneren Vorgangs, in dem Denken und Wollen
      zusammenwirken. Sie entsteht nicht aus blindem Drang oder äußerem Zwang, sondern aus einem
      erkannten Beweggrund. Die entscheidende Frage ist nicht, ob ich einen gefassten Entschluss
      ausführen kann, sondern wie der Entschluss in mir entsteht. Erst wenn ich ein Wissen von den
      Gründen meines Handelns habe, unterscheidet sich meine Handlung von einer solchen aus
      unbewusstem Antrieb.


      Die höchste Stufe des Handelns ist erreicht, wenn die Triebfeder nicht aus einer bestimmten
      Wahrnehmung, sondern aus dem reinen Denken selbst kommt. In diesem Fall handelt der Mensch aus
      einer Intuition, deren Inhalt nicht bloß individuell, sondern ideell und damit allgemein ist.
      Ein solcher Antrieb ist nicht mehr an die persönliche charakterologische Anlage gebunden,
      sondern entspringt unmittelbar der ideellen Sphäre. Die Entscheidung wird hier zur
      Verwirklichung eines rein gedanklichen Gehalts im Wollen.


      Entscheidung ist in diesem Sinne individuell, aber nicht willkürlich, denn sie gründet in
      objektiver Erkenntnis. Der Handelnde lässt sich durch den Wahrnehmungsinhalt einer Situation
      nicht bestimmen, sondern bildet sich einen Erkenntnisbegriff, dem er den moralischen Begriff
      aus seiner Intuition hinzufügt. Eine wirkliche Entscheidung ist daher immer der Moment, in dem
      der Mensch aus Einsicht handelt und nicht aus bloßer Gewohnheit oder äußerem Anstoß.
  - term: Entwicklung
    chunk_id: 44066a82-c9ae-5cdd-9150-4038cd83cd32
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Entwicklung ist bei Steiner zuerst ein Erwachen. Der Mensch entwickelt sich in der ersten Lebenszeit so, dass die Kraft des Gedächtnisses erstarkt; was vor einem Zeitpunkt der Kindheit liegt, empfindet er als Lebenstraum, aus dem er erwacht ist. In ähnlicher Art erwacht die Seele auf einer weiteren Stufe im Erlebnis des „Erkenne dich selbst". Auch das Gedankenleben entwickelt sich in Epochen: Zuerst wirkt der Gedanke wie eine Wahrnehmung von außen; dann wird er als eigenes Erzeugnis gefühlt, und die Frage entsteht, was dieses Erzeugnis mit einer Außenwelt zu tun hat.

      Für das Organische gilt: Die Einschachtelungslehre sieht die Glieder im Keim schon im Kleinen vorgebildet, und die Entwicklung ist dann nur Auswicklung. Goethe lehnt das ab. Der Organismus ist im Keim vorgebildet, aber der Idee nach und nicht der äußeren Erscheinung nach, die eine Neubildung ist. Wer nur mit den Augen des Körpers sieht, übersieht, was der Idee nach doch vorhanden ist. Die neuere Entwicklungsidee kehrt die Richtung des Erklärens um: Sie sucht im Späteren das Frühere.

      Im Sozialen ist Entwicklung kein Automatismus. Wer alles der Entwicklung überlassen will, gleicht einem Menschen, der in einem Zimmer mit dumpfer Luft unpässlich wird und nicht das Fenster öffnet, sondern abwartet, bis sich die Luft „von selbst" zu einer frischen entwickelt. Ein gesunder sozialer Organismus schafft nur die Voraussetzungen für das, was die Menschen durch ihre individuellen Fähigkeiten und Bedürfnisse in ihm entwickeln wollen.
  - term: Erkenntnis
    chunk_id: 642b37b4-052e-52fa-b7ab-f7a7db23288e
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Erkenntnis entsteht, weil das Denken über das Sondersein des Menschen hinausgreift und sich auf das allgemeine Weltensein bezieht; dadurch entsteht in ihm der Trieb der Erkenntnis. Wesen ohne Denken haben diesen Trieb nicht. Die Wahrnehmung ist nichts Fertiges, Abgeschlossenes, sondern die eine Seite der totalen Wirklichkeit. Die andere Seite ist der Begriff, der im Innern zunächst als Intuition auftritt. Der Erkenntnisakt ist die Synthese von Wahrnehmung und Begriff, und beide machen erst das ganze Ding aus. Die Wahrnehmungswelt für sich ist ein Aggregat zusammenhangloser Einzelheiten; wer keine Intuition findet, sieht wie der Farbenblinde nur Helligkeitsunterschiede ohne Farbenqualitäten. Der Mensch muss die Dinge auf zweifache Art zu sich sprechen lassen: Einen Teil sagen sie ihm freiwillig, den anderen muss er ihnen entlocken, indem er sein Denken in Bewegung setzt.

      Die Zweiheit von Subjekt und Objekt ist durch die Organisation des Wahrnehmenden bedingt. Das Erkennen überwindet sie, und das Ich fügt sich damit dem Weltganzen wieder ein. Der Dualismus, der neben der Wahrnehmungswelt „Dinge an sich" annimmt, kann für sie keinen Inhalt gewinnen. Die Fragen des Erkennens stellt sich der Mensch selbst aus dem klaren Element des Denkens: Nicht die Welt stellt sie an uns, wir stellen sie. Von einer Grenze der Erkenntnis kann daher nicht gesprochen werden. Was heute nicht gefunden ist, kann es morgen werden.
  - term: Erscheinungswelt
    chunk_id: 3b54e1a7-b1b2-5663-87ad-fb0c3c5c4703
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Mit Erscheinung bezeichnet Steiner ein für uns wahrnehmbares Ding oder einen wahrnehmbaren Vorgang, insofern sie im Raum oder in der Zeit auftreten. Die Erscheinung für die Sinne ist die erste Form, in der wir die Wirklichkeit beobachten. Unter Sinn versteht er dabei alle leiblichen und geistigen Organe, die der Wahrnehmung unmittelbarer Tatsachen dienen, auch den inneren Sinn für die inneren Erlebnisse. Die Erscheinungswelt ist daher dasjenige, woran das Denken noch keinen Anteil hat: ein Nebeneinander im Raum und ein Nacheinander in der Zeit, ein Aggregat zusammenhangloser Einzelheiten, in dem auch die eigene Persönlichkeit nur eine isolierte Einzelheit unter anderen ist. Erst das Denken stellt den Zusammenhang her.
  
      Dass diese Welt nichts weiter sei als unsere subjektive Vorstellung, gilt seit Kant vielen als Axiom. Steiner hält dagegen, dass „subjektiv" schon eine gedankliche Bestimmung ist, die mit dem ersten Auftreten der Erfahrung nichts zu tun hat, und dass die Dinge selbst keinen zwingenden Grund dazu geben. Auch ist die Isoliertheit keine Eigenschaft der Wirklichkeit: Die Erscheinungswelt ist die Welt, wie sie uns entgegentritt, bevor sie durch das Erkennen ihre rechte Gestalt gewonnen hat. Ihr fehlt ihr Kern, und der ist Gedanke, Idee. Wahrnehmung und Begriff zusammen machen erst das ganze Ding aus, und das Erkennen gibt der unabgeschlossenen Erfahrung durch das Enthüllen ihres Kerns ihren Abschluss.
  - term: Ethik
    chunk_id: 635c2c79-f37a-5c3a-9614-36b093461b3a
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Ethik ist bei Steiner nicht die Wissenschaft von sittlichen Normen. Die Sittengesetze werden vom Menschen erst geschaffen und können nicht angewendet werden, bevor sie da sind. Erst wenn sie vorliegen, werden sie Gegenstand des Erkennens. Sucht man das Gesetzmäßige im Handeln der Individuen, Völker und Zeitalter auf, so erhält man eine Ethik als Naturlehre der Sittlichkeit. Deren Gesetze sind nicht identisch mit den Antrieben, die wir dem Handeln zugrunde legen.

      Die Quelle des Sittlichen liegt im Menschen. Der unfreie Geist richtet sich nach Autorität, Vorbild oder einer vermeintlichen inneren Stimme. Der freie Geist handelt nach Impulsen, das sind Intuitionen, die er durch das Denken aus dem Ganzen seiner Ideenwelt auswählt; seine sittlichen Ideale sind sein eigenes freies Erzeugnis. Um sie zu verwirklichen, braucht er die moralische Fantasie, die den Begriff zur konkreten Vorstellung verdichtet, und die moralische Technik, die Wahrnehmungswelt umzuformen, ohne ihren naturgesetzlichen Zusammenhang zu durchbrechen. Maßgebend ist nicht, wie alle Menschen handeln würden, sondern was im einzelnen Fall zu tun ist. Diesen Standpunkt nennt Steiner ethischen Individualismus. Sittlich ist danach, was aus dem Menschen entsteht, wenn er das sittliche Wollen als Glied seines vollen Wesens entfaltet, sodass ihm das Unsittliche als Verstümmelung seines Wesens erscheint.
  - term: Ewigkeit
    chunk_id: 05309641-a9a6-554c-8a69-038df2c3db34
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Ewig nennt Steiner mit Goethe zuerst die Idee: „Die Idee ist ewig und einzig.“ Der Gedankeninhalt der Welt ist aus sich selbst bestimmt und nur einer, und es ist gleichgültig, wie viele geistbegabte Wesen ihm gegenüberstehen. Der menschliche Geist ist kein Behälter, der Gedanken erzeugt und aufbewahrt, sondern ein Organ, das sie wahrnimmt, wie das Auge das Licht. Was an den Dingen als Gesetz und Wesen erscheint, ist dieser Ideengehalt, und das Denken ist der Kern der Welt.

      Eine ewige Ideenwelt jenseits der Dinge, wie Platon sie fasst, übernimmt Steiner nicht. Die Unterscheidung von Idee und Wahrnehmung hat nur Berechtigung für die Art, wie menschliche Erkenntnis zustande kommt. Außerhalb des Menschen gibt es keine ideenlose Sinneswelt, und das Ewige liegt nicht in einem von der Natur abgesonderten Reich. Im Erkennen schaut der Mensch die Idee als Wirklichkeit, wie das sinnliche Auge den physischen Teil des Pflanzenwesens sieht.

      Für die Seele skizziert Steiner als Ausblick einer Geisteswissenschaft: Ihr wahres Wesen liegt hinter dem gewöhnlichen Erleben und erhält sich im Tod geistig, wie der Pflanzenkeim nach dem Hinsterben der Pflanze. Das gewöhnliche Bewusstsein dauert nur so lange wie sein Spiegelungsapparat, der physische Körper. Ein anderes, leibfreies Bewusstsein wird durch innere Seelenarbeit gefunden, und dabei erweist sich der Gedanke als Erzieher der Seele.
  - term: Fähigkeit
    chunk_id: 2f0eb2b7-162a-53de-9739-fd52a05815ea
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Fähigkeit bezeichnet in Steiners Texten, was der einzelne Mensch an Können in das Leben hineinträgt. Die Kernpunkte der sozialen Frage sehen darin eine dritte Quelle neben Wirtschaftsleben und Rechtsbewusstsein: Alles, was diese hervorbringen, wird von den individuellen Fähigkeiten durchwirkt. Das Gebiet reicht von den höchsten geistigen Leistungen bis zu dem, was durch bessere oder weniger gute körperliche Eignung in ein Menschenwerk einfließt. Fähigkeiten sind von Mensch zu Mensch verschieden. Die Philosophie der Freiheit hält das auch für das Ideenleben fest: Die Menschen sind dem Intuitionsvermögen nach verschieden, dem einen sprudeln die Ideen zu, der andere erwirbt sie sich mühselig.

      Fähigkeiten entwickeln sich nur, wenn ihre Träger sie aus eigener freier Initiative zur Wirkung bringen können. Sie müssen deshalb von der freien Empfänglichkeit der Menschen und von den Impulsen abhängen, die aus den Fähigkeiten selbst kommen. Steuern Wirtschaftsleben oder Staat sie, ist diese Empfänglichkeit gelähmt. Das Kapital ist das Mittel, solche Fähigkeiten für weite Gebiete des sozialen Lebens in Wirksamkeit zu bringen. Wer fähig ist, muss darüber frei verfügen können. Der Mensch ist mit dem, was er erzeugt, verbunden wie mit der Geschicklichkeit seiner Leibesglieder, und die Unterbindung der freien Verfügung gleicht einer Lähmung dieser Geschicklichkeit. Den Ertrag seiner Leistung kann der Tätige nur im Einklang mit dem freien Verständnis anderer Menschen bemessen.
  - term: Freies Geistesleben
    chunk_id: b5dca6a9-aa45-51c2-989e-e9fca85a63a1
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Freies Geistesleben bezeichnet in Steiners Dreigliederungsschriften das selbstständige Glied des sozialen Organismus, in dem Erziehung und Unterricht, aus denen alles geistige Leben herauswächst, ihre Impulse aus sich selbst nehmen. Das Geistesleben ist innerhalb des Staatsgefüges zur Freiheit herangewachsen und kann in dieser Freiheit nur leben, wenn ihm die volle Selbstverwaltung gegeben wird. Sie liegt bei denen, die erziehen und unterrichten: Niemand gibt Vorschriften, der nicht selbst im lebendigen Unterrichten und Erziehen steht, und in diese Verwaltung soll nichts hineinreden, was im Staat oder in der Wirtschaft tätig ist. Was im Unterricht unmittelbar erfahren wird, fließt so in die Verwaltung ein.

      Der Staat hat das Schulwesen den Religionsgemeinschaften entrissen und bildet die Menschen so aus, wie er sie für seine Leistungen braucht. Die Schule soll dagegen fragen, was im Menschen veranlagt ist und entwickelt werden kann, nicht was die bestehende soziale Ordnung braucht. Staat und Wirtschaft empfangen die vom freien Geistesleben herangebildeten Menschen und richten sich nach den Ergebnissen seiner Arbeit. Steiner erwartet daher keine lebensfremden Menschen, sondern Menschen mit Eifer und Lust zum Wirken im sozialen Organismus, weil der Lehrer die individuellen Fähigkeiten frei entwickeln kann, solange seine eigenen in Freiheit walten dürfen.
  - term: Freiheit
    chunk_id: 4ebd8d51-27b6-5a94-ab6d-8624aaf0dbae
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Freiheit ist in der Philosophie der Freiheit eine Eigenschaft des Handelns, kein Naturzustand. Frei sein heißt, die dem Handeln zugrunde liegenden Vorstellungen durch die moralische Fantasie von sich aus bestimmen zu können. Freiheit ist unmöglich, wenn etwas außer dem Menschen, ein mechanischer Prozess oder ein erschlossener außerweltlicher Gott, seine moralischen Vorstellungen bestimmt. Ob jemand umsetzen kann, was er will, hängt dagegen von äußeren Umständen und seiner technischen Geschicklichkeit ab. Die wahre Freiheit liegt darin, sich die Gründe seines Wollens selbst zu bestimmen.

      Die Triebfedern des Handelns steigen vom Trieb über Gefühl, Takt und praktische Erfahrung bis zur Intuition, bei der reines Denken handelt. Eine Handlung wird als frei empfunden, soweit ihr Grund aus dem ideellen Teil des individuellen Wesens hervorgeht. Was aus dem Zwang der Natur oder aus der Nötigung einer sittlichen Norm geschieht, empfindet der Mensch als unfrei. Wer nur Normen vollstreckt, ist ein höherer Automat. Der Freie handelt aus Liebe zur Tat. Das Individuelle in ihm ist nicht der Organismus mit seinen Trieben, sondern die einige Ideenwelt, die in diesem Organismus aufleuchtet. Weil alle aus derselben Ideenwelt schöpfen, ist bei sittlich freien Menschen ein Aufeinanderprallen ausgeschlossen.
  - term: Frieden
    chunk_id: 6c821db3-7087-5c74-8c4f-4eff1695222e
    language: de
    tags: [concept, curated]
    text: >-
      Nach der Dreigliederungsidee ergibt sich Frieden nicht aus Verabredungen, sondern aus der Gliederung der sozialen Organismen. Was getan werden soll, setzt sich durch die Kraft eines in wirklichen Menschheitsimpulsen wurzelnden Ziels durch, nicht durch Feststellungen auf Kongressen. Die geschichtlich gewordenen Staatengebilde fassen Geistes-, Rechts- und Wirtschaftsleben zusammen und geraten in internationale Beziehungen, die zu einer Katastrophe drängen. Der russisch-ukrainische Konflikt zeigt, dass die politischen Grenzen des Einheitsstaats von einem Zeitpunkt an keine Kulturgrenzen sein dürfen.

      In einem gegliederten Organismus hat jedes der drei Gebiete sein selbstständiges Verhältnis zu den entsprechenden Gebieten anderer Organismen. Wirtschaftliche Beziehungen entstehen, ohne dass die Beziehungen der Rechtsstaaten unmittelbar Einfluss haben, und umgekehrt. Durch diese Unabhängigkeit wirken sie in Konfliktfällen ausgleichend aufeinander. Das auf sich gestellte Geistesleben bildet Verhältnisse über Staatsgrenzen hinweg: Eine Volkskultur breitet sich friedlich aus, wenn sie nur durch Einrichtungen geschieht, die von den geistigen Organismen abhängen. Ein Völkerbund entsteht aus wirklichkeitsgemäßen Grundimpulsen und muss nicht aus einseitigen Rechtsanschauungen eingesetzt werden. Jeder einzelne soziale Organismus kann die Gliederung verwirklichen, gleichgültig, wie sich andere Länder verhalten.
  - term: Gedanke
    chunk_id: e7b8e47a-29fa-5bc0-a152-507c68d542d0
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Der Gedanke ist das, was der Mensch im Denken selbst hervorbringt, und zugleich der Inhalt, der dabei erscheint. Der Gedankengehalt der Welt zeigt zwei Seiten: Das eine Mal erscheint er als Tätigkeit des Bewusstseins, das andere Mal als unmittelbare Erscheinung einer in sich vollendeten Gesetzmäßigkeit, eines in sich bestimmten ideellen Inhalts. Wesentlich ist die objektive Seite des Inhalts, nicht die subjektive des Auftretens. Der Mensch gibt nur die Gelegenheitsursache her, damit sich der Inhalt seiner eigenen Natur gemäß entfaltet: Wie sich ein Gedanke zu einem anderen verhält, bestimmt der Inhalt beider und nicht die Organisation des Denkenden. Der Gedanke ist daher weder ein Bild einer äußeren Sache noch ein inhaltsleeres Gefäß.

      Ein Sinnesobjekt wendet dem Menschen zunächst nur seine Außenseite zu. Der Gedanke tritt als in sich vollendete Ganzheit ins Bewusstsein, und der Mensch muss ihn durchleben und seinen Inhalt nachschaffen, wenn er Bedeutung für ihn haben soll. Weil er innerhalb dieses Inhalts steht und ihn durchdringt, kennt er dessen eigenste Natur. Das gegenwärtige Denken lässt sich nie beobachten, sondern nur nachträglich in einem zweiten Akt. Weil der Mensch es selbst hervorbringt, kennt er den Zusammenhang der Gedanken unmittelbar. Da der Mensch nur im Denken eine ideelle Bestimmtheit erfährt, muss die Gesetzmäßigkeit der übrigen Welt schon im Denken eingeschlossen liegen. Das Sinnesobjekt liefert keine Bausteine des Gedankens, es veranlasst nur, ihn aus der Gedankenwelt hervorzuholen. Dann redet die zuvor stumme Wirklichkeit eine deutliche Sprache.
  - term: Geistesleben
    chunk_id: 30521989-4b37-5703-8b1c-d67397aa03e8
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Das Geistesleben ist das geistige Glied des dreigliedrigen sozialen Organismus. Es umfasst Wissenschaft, Kunst, Religion, das Erziehungswesen und die richterliche Rechtsprechung. Sein Inhalt ist eng mit dem innersten Wesen des Menschen verbunden, in dem er sich entfaltet; im geistigen Gebiet waltet eine über das materielle Außenleben hinausgehende Wirklichkeit, die ihren Inhalt in sich selber trägt. Deshalb kann die Entfaltung nur frei sein, wenn sie durch keine anderen Impulse in den sozialen Organismus hineingestellt wird als durch solche, die aus dem Geistesleben selbst kommen. Es gestaltet sich aus dem freien Zusammenwirken aller geistig-schöpferischen Einzelpersönlichkeiten und gibt sich eigene Verwaltungskörper. Seine Selbstverwaltung richtet sich nur nach menschheitspädagogischen Gesichtspunkten; nur in ihr lassen sich die individuellen Fähigkeiten einer Menschengemeinschaft zum Dienst des sozialen Lebens wahrhaft pflegen.

      Das Geistesleben ist mit dem politischen Staat und dem Wirtschaftsleben verschmolzen. Wo der Staat die Erziehungs- und Unterrichtsnormen festsetzt, wird es ohnmächtig gegenüber der Gestaltung des sozialen Lebens. Man hält es deshalb für einen Ausfluss des Wirtschaftens und der staatlichen Bedürfnisse. Die Gesundung liegt dagegen darin, die Abhängigkeit von Staat und Wirtschaft aufzuheben und Geistes-, Rechts- und Wirtschaftsleben als selbständige Glieder nebeneinanderzustellen. Staat und Wirtschaft erhalten den Zufluss, den sie brauchen, aus dem sich selbst verwaltenden Geistesorganismus.
  - term: Geisteswissenschaft
    chunk_id: 7c5eb4ef-8fa4-50b0-bbe4-90ccf6afa29d
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Geisteswissenschaft ist die Wissenschaft, die über die Naturerkenntnis hinausgeht. Hier hat es das Bewusstsein mit geistigem Inhalt selbst zu tun: mit dem einzelnen Menschengeist, den Schöpfungen der Kultur, der Literatur und der Kunst, den aufeinanderfolgenden wissenschaftlichen Überzeugungen. Geistiges wird durch den Geist erfasst. In der Naturwissenschaft tritt das Ideelle erst im Nachdenken über die Gegenstände hervor; hier trägt die Wirklichkeit das Ideelle schon in sich, das Wesen ist im Objekt auch ohne die Arbeit der Wissenschaft da. Es ist eine Auseinandersetzung des Menschen mit sich selbst. Ihre Hauptformen sind Psychologie, die Erkenntnis des Völkerlebens und Geschichte. Das Besondere ist hier nicht Durchgangspunkt, sondern der Gegenstand selbst; die Hingabe an das Objekt ist die einzig richtige Methode. Weil der Mensch sich seine Ziele selbst setzt, sind die Geisteswissenschaften Freiheitswissenschaften.

      Die anthroposophisch orientierte Geisteswissenschaft erkennt die Naturwissenschaft an, sieht aber, dass diese nur den äußeren Menschen erfasst. Sie entwickelt Erkenntnismethoden, die in die Schächte des Menschen-Innern hinuntersteigen, in denen sich das außermenschliche Geschehen ins Innere fortsetzt. Ihre Erkenntnisse sind im Innern erlebte Wirklichkeit. Sie drängen sich zu Ideen zusammen, die nicht erdacht, sondern von den Kräften der Wirklichkeit gesättigt sind. Solche Ideen können deshalb auch dem sozialen Wollen die Richtung geben; aus ihr hat sich der Impuls der Dreigliederung entwickelt.
  - term: Geistige Welt
    chunk_id: 27f780fa-363a-5cff-9ab2-5e9d62a8500a
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Die geistige Welt ist eine Wirklichkeit, die den Sinnen unzugänglich ist. Für das gewöhnliche Bewusstsein bleibt sie verschleiert, weil dieses Bewusstsein das selbstbewusste Ich erkraftet und dafür den Zusammenhang des Ich mit der objektiven Welt verhüllt. Durch bloßes Nachdenken kommt man nicht hinter die Sinneswelt. Der Zugang entsteht durch innere Seelenarbeit: Man fasst die Tätigkeit des Denkens als solche ins Geistesauge und steigert Aufmerksamkeit und liebevolle Hingabe, bis sie wie neue Seelenkräfte wirken. So gewinnt die Seele ein Erleben, das von den Bedingungen der leiblichen Organe unabhängig ist, die leibfreie Beobachtung. Die geistige Welt ist nicht die Summe der Kulturerlebnisse der Menschheit, denn diese erlebt der Mensch nur in Verbindung mit seinen Leibesorganen.

      Die so erkannte Welt hat einen Gesetzeszusammenhang, ähnlich dem der Naturwissenschaft für die physische Welt, und steht mit dieser nirgends im Widerspruch. Sie ist kristallklar wie ein mathematisches Ideengebäude, keine nebelhafte Mystik. Theoretische Beweise für ihre Wirklichkeit gibt es nicht, aber ebenso wenig für die Wirklichkeit der Wahrnehmungswelt; es entscheidet das Erleben selbst. Wer ernsthaft übt, unterscheidet Illusion von geistiger Wirklichkeit so sicher wie im gewöhnlichen Leben ein Phantasiegebilde von einer Wahrnehmung. In dieser Welt hat die Seele ihr Grundwesen, und aus ihr ragen die sittlichen Impulse ins Seelenleben herein. Der Körper ist ein Spiegelungsapparat dessen, was sich außerhalb von ihm seelisch-geistig abspielt.
  - term: Gemüt
    chunk_id: ecd71c0e-aa3b-53c7-af4b-aece168cdda3
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Das Gemüt ist die Seite der Seele, in der Gefühle und Empfindungen leben. Liebe und Mitleid sind Triebfedern des Handelns, die sich nicht in kalte Verstandesbegriffe auflösen lassen; hier treten Herz und Gemüt in ihre Rechte. Sie schaffen aber die Beweggründe des Handelns nicht, sondern setzen sie voraus und nehmen sie in ihren Bereich auf. Das Mitleid stellt sich im Herzen ein, wenn im Bewusstsein die Vorstellung einer mitleiderregenden Person aufgetreten ist. Der Weg zum Herzen geht durch den Kopf, der Gedanke ist der Vater des Gefühls. Auch die Liebe beruht, wo sie nicht bloße Äußerung des Geschlechtstriebes ist, auf den Vorstellungen, die wir uns vom geliebten Wesen machen.
  
      Das Gemüt hat Bedürfnisse. Der vernunftgemäßen Naturerklärung hat man die Fähigkeit abgesprochen, sie zu befriedigen. Wird ein Mensch in seiner Gemütswelt durch Naturerkenntnis beeinträchtigt, liegt das nicht an ihr, sondern an dem Menschen, dessen Empfindungen sich in eine falsche Richtung bewegen. Wer unbefangen forscht, fühlt sein Herz höher schlagen; die Zergliederung zerstört keine Naturschönheit, sondern enthüllt unzählige neue. In der Erziehung verkümmert die Willens- und Gemütsnatur, wenn einseitig der Intellekt in Anspruch genommen wird. Eine starke Gemüt bildende Kraft liegt in der künstlerischen Gestaltung des Unterrichts. Vor dem neunten Lebensjahr lässt man in märchenhafter Darstellung die Pflanzen-, Tier-, Luft- und Sternenwelt im Gemüt des Kindes leben.
  - term: Ich-Bewusstsein
    chunk_id: 908acb34-242d-5ef2-b726-dec51280ac63
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Das Ich-Bewusstsein entsteht, indem der Mensch nicht nur andere Dinge wahrnimmt, sondern sich selbst. Die Wahrnehmung meiner selbst hat den Inhalt, dass ich das Bleibende gegenüber den kommenden und gehenden Wahrnehmungsbildern bin. Ich sehe nicht bloß einen Baum, sondern weiß auch, dass ich es bin, der ihn sieht; mein Selbst bereichert sich um die Vorstellung des Baumes. Ich käme nie dazu, von Vorstellungen zu sprechen, wenn ich sie nicht in der Wahrnehmung meines Selbst erlebte. Das kraftvolle, in sich ruhende Selbstbewusstsein entsteht dadurch, dass die Kräfte, welche die Seele mit der Welt verbinden, aus dem Bewusstsein herausgedrängt werden. Seine Selbsterkenntnis verdankt das Ich einer Tatsache, die über die Welterkenntnis einen Schleier breitet. Das Losgelöstsein des Ich von der Welt ist nur eine Erscheinung des Bewusstseins und kann überwunden werden.

      Als bloß setzende Tätigkeit bleibt das Ich leer: Es kann nichts bestimmen, wenn es nichts Inhaltsvolles findet, das ihm die Bestimmung des Gegebenen ermöglicht. Dieses Inhaltsvolle ist die Welt des Denkens, und das Gegebene durch das Denken bestimmen heißt Erkennen. Das Ich kann sich durch Freiheit in Tätigkeit versetzen und aus sich heraus durch Selbstbestimmung das Erkennen verwirklichen, denn die Vereinigung der im Bewusstsein sonst getrennt bleibenden Elemente der Wirklichkeit geschieht nur durch einen Akt der Freiheit. Im Denken allein ist das Element gegeben, das alle Dinge in ihren Verhältnissen zueinander bestimmt, auch das Verhältnis des Ich zur Außenwelt.
  - term: Ideal
    chunk_id: 7dbb6cc7-2959-5f64-9215-1b67fdaf0119
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Ein Ideal ist eine Idee, die augenblicklich unwirksam ist, deren Verwirklichung aber gefordert wird. Es ist kein erdachtes oder erträumtes Gebilde, sondern etwas, das Leben hat, sich als reales Element in der menschlichen Wesenheit an die Oberfläche arbeitet und sich auch in der unvollkommensten Form seines Daseins deutlich ankündigt. Bei einem Ding der Außenwelt ist die Idee durch die Wahrnehmung bestimmt; wir haben das Unsrige getan, wenn wir den Zusammenhang erkannt haben. Beim Menschen ist das anders: Sein wahrer Begriff als sittlicher Mensch, als freier Geist, ist mit dem Wahrnehmungsbild „Mensch“ nicht im Voraus objektiv vereinigt. Der Mensch muss selbsttätig seinen Begriff mit der Wahrnehmung vereinigen, und er kann es nur, wenn er den Begriff des freien Geistes, das ist seinen eigenen Begriff, gefunden hat.

      Die sittlichen Ideale entspringen der moralischen Fantasie des Menschen. Sie sind seine Intuitionen, die Triebfedern, die sein Geist spannt. Er will sie, weil sie der Inhalt seines Wesens sind und ihre Verwirklichung seine höchste Lust ist. Ihre Verwirklichung hängt davon ab, dass sie stark genug begehrt werden, um Schmerzen und Qualen zu überwinden. Was man das Gute nennt, ist nicht das, was der Mensch soll, sondern das, was er will, wenn er die volle wahre Menschennatur zur Entfaltung bringt. Die Ethik beruht nicht darauf, das Streben nach Lust auszurotten, sondern auf dem starken, von ideeller Intuition getragenen Wollen, das sein Ziel erreicht, auch wenn der Weg dornenvoll ist.
  - term: Individuum
    chunk_id: 17da407c-806f-53d9-8086-51d5329cd1ac
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Ein Individuum ist der Mensch, soweit er sich vom Gattungsmäßigen löst. Als Glied eines natürlichen Ganzen (Rasse, Stamm, Volk, Geschlecht) trägt er dessen Eigentümlichkeiten, und wer fragt, warum etwas an ihm so oder so ist, wird auf die Gattung verwiesen. Von diesem Gattungsmäßigen macht sich der Mensch aber frei: Er gebraucht die von der Natur mitgegebenen Eigenschaften als Grundlage und gibt ihnen die seinem eigenen Wesen gemäße Form. Den Grund einer solchen Äußerung suchen wir vergebens in den Gesetzen der Gattung; ein Individuum kann nur durch sich selbst erklärt werden. Kein Mensch ist vollständig Gattung, keiner ganz Individualität, aber jeder löst eine größere oder geringere Sphäre seines Wesens allmählich ab, ebenso vom Gattungsmäßigen des tierischen Lebens wie von den Geboten menschlicher Autoritäten.

      Zum Individuum macht uns das Fühlen: Das Denken verbindet uns mit der Welt, das Fühlen führt uns in uns selbst zurück. Erst durch Selbstgefühl, Lust und Schmerz leben wir als Wesen, deren Dasein nicht im Begriffsverhältnis zur übrigen Welt erschöpft ist, sondern die einen besonderen Wert für sich haben. Eine wahrhafte Individualität ist, wer mit seinen Gefühlen am weitesten in die Region des Ideellen hinaufreicht. Das Individuum gewinnt seine Begriffe durch eigene Intuition; wie der Einzelne zu denken hat und welche Ziele er sich setzt, lässt sich aus keinem Gattungsbegriff ableiten. Leben in der Liebe zum Handeln und Lebenlassen im Verständnis des fremden Wollens ist die Grundmaxime der freien Menschen.
  - term: Intuition
    chunk_id: 076659ec-65c8-552c-9aec-18cb33d6b7f5
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Intuition ist das im rein Geistigen verlaufende bewusste Erleben eines rein geistigen Inhalts. Im Betrachten des Denkens selbst fallen Begriff und Wahrnehmung in eins zusammen, was sonst immer getrennt auftritt. Wer das durchschaut, sieht im Denken kein schattenhaftes Nachbild einer Wirklichkeit, sondern eine auf sich ruhende geistige Wesenhaftigkeit, und diese wird ihm durch Intuition im Bewusstsein gegenwärtig. Das intuitiv erlebte Denken ist ein im Menschengeist sich vollziehender tätiger Vorgang und zugleich eine ohne sinnliches Organ erfasste Wahrnehmung: eine Wahrnehmung, in der der Wahrnehmende selbst tätig ist, und eine Selbstbetätigung, die zugleich wahrgenommen wird. Diese Wesenheit des Denkens erlebend zu verstehen, kommt der Erkenntnis von der Freiheit des intuitiven Denkens gleich.

      Die höchste Stufe des individuellen Lebens ist das begriffliche Denken ohne Rücksicht auf einen bestimmten Wahrnehmungsgehalt: Wir bestimmen den Inhalt eines Begriffs durch reine Intuition aus der ideellen Sphäre heraus. Handeln wir unter dem Einfluss von Intuitionen, so ist die Triebfeder unseres Handelns das reine Denken, die praktische Vernunft. Ein solcher Antrieb gehört nicht mehr im strengen Wortsinn zu den charakterologischen Anlagen, denn was hier als Triebfeder wirkt, ist nicht mehr ein bloß Individuelles in mir, sondern der ideelle und folglich allgemeine Inhalt meiner Intuition. Handlungen, die sich als Verwirklichungen ideeller Intuitionen darstellen, nennt eine unbefangene Selbstbeobachtung frei.
  - term: Materialismus
    chunk_id: 724b9cba-6dd1-5fc5-b122-d30712b85c61
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Der Materialismus ist ein Monismus, der den Gegensatz von Geist und Materie auflöst, indem er den Geist leugnet. Er kann nie eine befriedigende Welterklärung liefern, denn jeder Erklärungsversuch beginnt damit, dass man sich Gedanken über die Welterscheinungen bildet. Der Materialismus macht deshalb den Anfang mit dem Gedanken der Materie oder der materiellen Vorgänge und hat damit bereits zwei Tatsachengebiete vor sich: die materielle Welt und die Gedanken über sie. Er sucht die Gedanken zu begreifen, indem er sie als rein materiellen Prozess auffasst; er glaubt, das Denken komme im Gehirn etwa so zustande wie die Verdauung in den tierischen Organen. Er vergisst, dass er das Problem nur an einen anderen Ort verlegt hat: Wie kommt die Materie dazu, über ihr eigenes Wesen nachzudenken? Vom bestimmten Subjekt, vom eigenen Ich, hat er den Blick abgewandt und ein unbestimmtes, nebelhaftes Gebilde an dessen Stelle gesetzt, und hier tritt ihm dasselbe Rätsel entgegen.

      Sein Feld sind die materiellen Vorgänge: Man ist tief in ihre Zusammenhänge eingedrungen, soweit sie sich der Sinnesbeobachtung und dem Denken ergeben, das sich nur auf diese Sinnesbeobachtung stützen will. Wer dabei ableugnet, dass in der Materie Geist wirkt, enthüllt ihn doch unbewusst. Seele, Geist und Gedanke gelten dem Materialismus nur als Eigenschaften und Verrichtungen der lebenden Substanz, nicht als Wesenheiten. Der Materialismus lässt sich nicht widerlegen, weil er für die materiellen Vorgänge stimmt; eingeschränkt ist er, weil er Lage und Bewegung, Materie und Bewegung, als die letzten Begriffe nimmt.
  - term: Materie
    chunk_id: a61eccc3-6f1a-5590-b627-d18bd60f30b9
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Der Begriff der Materie stammt aus dem Denken, nicht aus der Wahrnehmung. Wahrnehmbar sind Zustände und ihre Übergänge ineinander: Wasser nimmt einen Raum ein, hat eine bestimmte Wärme und ist flüssig; beim Erhitzen wird es zu Dampf, unter dem elektrischen Strom zerfällt es in zwei Körper. Wer sagt, Sauerstoff und Wasserstoff seien schon im Wasser enthalten gewesen, oder wer beide Stoffe nennt, fügt der Wahrnehmung einen Begriff hinzu, denn tatsächlich ist in dem Raum, den der Sauerstoff einnimmt, nur eine Summe von Zuständen wahrzunehmen. Zu diesen Zuständen denkt man den Stoff hinzu, an dem sie haften sollen. Die Vorstellung „Stoff“ erhält ihren Inhalt nicht aus der  Wahrnehmung, sondern aus dem Denken, und Ähnliches gilt von der „Kraft“: Sie kann nicht wahrgenommen werden, sie ist ideell.

      Wird die Materie als Stoff gedacht, der von Ewigkeit her da ist und jenseits der Beobachtung liegt, schaut man sie nicht an. Innerhalb der Erfahrung ist sie nirgends aufzufinden; man muss sie zur Erfahrung hinzudenken. Einen eigenen Inhalt hat der Begriff nicht. Härte, Undurchdringlichkeit, Anziehung und Abstoßung entlehnt man der Erfahrung und überträgt sie auf Teile, die man nicht wahrnimmt. So führt man nur ein Erfahrbares auf ein anderes Erfahrbares zurück und versetzt es willkürlich ins Unerfahrbare. Vor dieser Überlegung löst sich der Begriff in nichts auf. Dass die kleinsten Bewegungen sich der unmittelbaren Beobachtung entziehen, liegt an der Feinheit der Sinnesorgane und nicht daran, dass sie einem Gebiet jenseits der Erfahrung angehören. Ein genügend fein organisiertes Auge würde sie wie grobsinnliche Vorgänge sehen.
  - term: Menschengeist
    chunk_id: ed615da9-4ae9-5131-8893-6b463c5c2b80
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Im Menschengeist kommt die Natur in ihrer wahren Gestalt zur Erscheinung. Wäre der Mensch ein bloßes Sinnenwesen ohne geistige Auffassung, gäbe es Wesen, die das Bewirkte (die Sinnenwelt) wahrnehmen, nicht aber das Wirkende (die innere Gesetzlichkeit); für sie wäre nur die Außenseite der Natur da. Das Denken ist das letzte Glied in der Reihenfolge der Prozesse, die die Natur bilden. Die Ideen sind der Inhalt dessen, was in den Dingen wirkt, doch zum erscheinenden Dasein kommen sie durch die menschliche Tätigkeit. Die eigene Natur der Ideenwelt erkennt der Mensch nur, wenn er seine Tätigkeit anschaut. Bei jeder anderen Anschauung durchdringt er nur die wirkende Idee, das Ding bleibt als Wahrnehmung außerhalb seines Geistes; in der Anschauung der Idee ist Wirkendes und Bewirktes in seinem Inneren enthalten. Diese Anschauung des sich selbst Hervorbringenden ist die Anschauung der Freiheit.

      Die höchste Anschauung befreit den Menschengeist von allem einseitigen Abhängigkeitsgefühl. Er fühlt sich durch ihren Besitz souverän im Reich der sittlichen Weltordnung: Er weiß, dass die Triebkraft, die alles hervorbringt, in seinem Inneren als in seinem eigenen Willen wirkt, und dass die höchsten Entscheidungen über Sittliches in ihm selbst liegen. Mag der Mensch im Einzelnen von tausend Dingen abhängig sein, im Ganzen gibt er sich sein sittliches Ziel und seine sittliche Richtung. In jeder menschlichen Individualität vollzieht sich der Prozess, der im Ganzen der Natur sich abspielt: die Schöpfung eines Tatsächlichen aus der Idee heraus.
  - term: Menschenseele
    chunk_id: 0ecdc792-b67b-57b0-b78b-f7c57a6db346
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Die Menschenseele ist nicht vom Körper hervorgebracht. Wenn ich eine Farbe sehe oder einen Ton höre, erlebe ich sie nicht als Ergebnis des Körpers, sondern bin als selbstbewusstes Ich mit ihnen außerhalb des Körpers verbunden. Wie ich mein Gesicht nicht sehen kann, wenn ich vor mich hinblicke, wohl aber im Spiegel, so kann die Seele im gewöhnlichen Bewusstsein nichts wahrnehmen, solange der Körper es ihr nicht spiegelt; durch die Tätigkeit von Auge und Nervensystem wird ihr das Erlebte zur bewussten Wahrnehmung gemacht. Der Menschenkörper ist nicht Hervorbringer des Seelischen, sondern Spiegelungsapparat dessen, was außerhalb des Körpers seelisch-geistig sich abspielt. Im Schlaf ist diese Wechselwirkung unterbrochen, deshalb verläuft er unbewusst.

      Ihr Wesen zeigt sich nicht, solange man die Seelenerlebnisse nimmt, wie sie sich dem gewöhnlichen Bewusstsein darbieten. Selbsterkenntnis kann nicht angetreten werden, indem man nach dem Innern schaut, das stets vorhanden ist, sondern nach dem, was durch innere Seelenarbeit erst aufgedeckt werden muss. Diese besteht in der Steigerung von Fähigkeiten, die auch das gewöhnliche Bewusstsein kennt: Aufmerksamkeit und liebevolle Hingabe an das Erlebte. Wer die Tätigkeit des Denkens, Fühlens und Wollens selbst erlebt, löst sich von dem, was an die leiblichen Organe gebunden ist. Die vom Körper frei sich erlebende Seele erfühlt sich in einem seelisch-geistigen Weben, als Wesen, das einer geistigen Welt angehört wie der Körper der physischen.
  - term: Menschheit
    chunk_id: dc0cc3a9-4e9d-53d0-b9ce-6c8211fbf96e
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Die Menschheit besteht aus Einzelnen, die sich, soweit sie frei sind, nicht aus Gattungsgesetzen erklären lassen. Wo das Gebiet der Freiheit des Denkens und Handelns beginnt, hört das Bestimmen des Individuums nach Gesetzen der Gattung auf. Den begrifflichen Inhalt, mit dem der Mensch die volle Wirklichkeit ergreift, kann niemand ein für alle Mal festsetzen und der Menschheit fertig hinterlassen; jedes Individuum gewinnt seine Begriffe durch eigene Intuition. Alle sittliche Betätigung der Menschheit entspringt aus individuellen ethischen Intuitionen und deren   Aufnahme in Menschengemeinschaften. Man kann auch sagen: Das sittliche Leben der Menschheit ist die Gesamtsumme der moralischen Fantasieerzeugnisse der freien menschlichen Individuen.

      Dass die Freien sich nebeneinander ausleben können, liegt in der menschlichen Wesenheit selbst: Die Individuen sind eines Geistes. Der Freie lebt im Vertrauen darauf, dass der andere Freie mit ihm einer geistigen Welt angehört und sich in seinen Intentionen mit ihm begegnen wird. Er verlangt keine Übereinstimmung, aber er erwartet sie, weil sie in der menschlichen Natur liegt. In älteren Zeiten der Menschheitsentwicklung sorgten soziale Instinkte dafür, dass sich Wirtschafts-, Rechts- und Geistesleben in einer der Menschennatur entsprechenden Art gliederten. Später muss diese Gliederung durch zielbewusstes soziales Wollen erstrebt werden.
  - term: Metamorphose
    chunk_id: 8feddced-6269-5088-bfe7-bd1290c863f7
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Metamorphose bedeutet bei Goethe nicht bloß die Feststellung, dass Blatt, Kelch und Krone miteinander identische Organe der Pflanze sind. Es kommt darauf an, welche Vorstellung man von der Pflanzennatur als einem Lebendigen hat und wie man sich das Einzelne aus diesem Ganzen hervorgehend denkt. Das Grundorgan der Pflanze ist das Blatt mit dem Knoten, an dem es sich entwickelt. Es nimmt in der äußeren Erscheinung verschiedene Gestalten an: Keimblatt, Laubblatt, Kelchblatt, Kronenblatt. Die Mannigfaltigkeit entsteht dadurch, dass das der Idee nach Gleiche in der Wahrnehmungswelt in verschiedenen Gestalten existieren kann.

      Im Kelch zieht sich die Pflanzengestalt zusammen, in der Blumenkrone breitet sie sich wieder aus; in Staubgefäßen und Stempel folgt die nächste Zusammenziehung, in der Befruchtung findet das Getrennte wieder zusammen. Die Vorstellung des sich stufenweise wie auf einer „geistigen Leiter" umbildenden Grundorgans ist die Idee der Urpflanze. Wer sie beweglich in sich ausbildet, kann sie in allen Formen denken, die ihr Inhalt zulässt, und sich damit alle Gestaltungen im Pflanzenreich erklären. Was das leibliche Auge am Organismus beobachtet, ist die Folge durcheinander wirkender Bildungsgesetze, die dem geistigen Auge allein zugänglich sind. Was an einer Stelle sinnlich nicht mehr wahrnehmbar ist, ist der Idee nach vorhanden und tritt wieder in die Erscheinung, sobald die Bedingungen dazu da sind.
  - term: Metaphysischer Realismus
    chunk_id: c6dca7b2-4d58-5f11-8515-0e6425d4b2a5
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Der metaphysische Realismus entsteht, wo der naive Realismus mit seinem Grundsatz, nur das Wahrgenommene sei wirklich, an Beziehungen zwischen den Wahrnehmungen stößt. Ohne sie zerfiele ihm die Welt in ein unzusammenhängendes Aggregat von Wahrnehmungen. Also nimmt er unsichtbare Kräfte an, durch die die Dinge aufeinander wirken, etwa ein Lebensprinzip oder die Wärme als Bewegung kleinster Teile. Er konstruiert neben der wahrnehmbaren Realität eine unwahrnehmbare, die er der ersten analog denkt, und ist deshalb notwendig Dualismus. Wo er eine Beziehung bemerkt, setzt er eine Realität hin, obwohl er sie nur durch das Denken ausdrücken, nicht wahrnehmen kann; die ideelle Beziehung wird willkürlich zu einem dem Wahrnehmbaren Ähnlichen gemacht.

      Seine hypothetischen Kräfte sind unwahrnehmbare Wesenheiten mit Wahrnehmungsqualitäten, eine widerspruchsvolle Mischung aus naivem Realismus und Idealismus. Er wendet eine Seinsform, das Wahrnehmungsdasein, auf ein Gebiet an, wo ihm das Mittel fehlt, das allein darüber etwas aussagen kann: das sinnliche Wahrnehmen. Er kann sich nicht entschließen, den Begriff als gleichberechtigten Faktor neben der Wahrnehmung anzuerkennen, und lässt ein drittes Weltgebiet gelten, in dem ein nicht wahrnehmbares Sein nach Art der Sinnenwelt wirken soll. Wirft man diesen unberechtigten Bestandteil hinaus, so stellt sich die Welt als Summe von Wahrnehmungen und ihrer begrifflichen Bezüge dar. Für die Wahrnehmung gilt dann die Wahrnehmbarkeit, für die Beziehungen unter den Wahrnehmungen die Denkbarkeit. Neben Wahrnehmungs- und Begriffswelt lässt diese Weltanschauung kein weiteres Gebiet zu, in dem beide zugleich gelten, wie das beim metaphysischen Realismus der Fall ist.
  - term: Monade
    chunk_id: bbc027e0-8fa2-529f-847e-870c564a4371
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Monade heißt ein einfaches, in sich geschlossenes, sich selbst vorstellendes Wesen. Bei Leibniz ist die Seele eine solche Monade: Sie weiß von sich als der einen, also besteht sie nicht aus Teilen, und in ihr kann nichts anderes tätig sein als sie selbst. Ihr ganzes Erleben ist das Ergebnis ihrer eigenen Tätigkeit. Nichts Äußeres kann in sie hineinkommen; die Monade hat, wie Leibniz sagt, keine Fenster. Alle wirklichen Wesen sind Monaden, sie unterscheiden sich nur in der Stärke ihres Innenlebens, vom dumpfen, schlafenden bis zur göttlichen Urmonade. Dass ihre Innenleben zusammenstimmen, obwohl sie nicht aufeinander wirken, erklärt die vorherbestimmte Harmonie: Sie gleichen Uhren, die anfänglich aufeinander gestimmt wurden. Was die Sinne sehen, ist ein Nebelbild der beieinander seienden Monaden.

      Diese Auffassung lässt der Seele Selbständigkeit und Freiheit, führt aber, wenn sie sich treu bleibt, zu der Behauptung, dass alles von der Seele Erkannte nur sie selbst ist. Die Selbständigkeit der Monade wird nur so lange geglaubt, wie man den Menschen für ein wirklich selbständig existierendes Wesen hält, das die Kunde von der übrigen Welt von außen erhält. Der Mensch ist aber von der Welt nicht tatsächlich abgesondert; sein Zusammenhang mit dem Ganzen ist nur für die Wahrnehmung unterbrochen. Spannt das Denken das Wahrgenommene in das Netz der Begriffswelt ein, so erweist sich die Teilexistenz als bloßer Schein des Wahrnehmens. Seine in sich geschlossene Totalexistenz findet der Mensch durch das intuitive Denkerlebnis.
  - term: Monismus
    chunk_id: e365226f-5161-5bfa-be4f-b6461ab0440b
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Monismus heißt die Weltanschauung, die den einseitigen Realismus mit dem Idealismus zu einer höheren Einheit vereinigt. Sie sieht in der Wahrnehmungswelt, wie sie unmittelbar vorliegt, ein halbes Wirkliches; in ihrer Vereinigung mit der Begriffswelt findet sie die volle Wirklichkeit. Nach anderen Erklärungsprinzipien fragt sie nicht, weil sich im ganzen Bereich der Wirklichkeit kein Anlass dazu findet. Die Trennung in Subjekt und Objekt entsteht durch die Organisation des wahrnehmenden Wesens. Das Denken stellt den unterbrochenen Zusammenhang wieder her und fügt das Ich dem Weltganzen wieder ein; damit hört das Fragen auf, das nur eine Folge der Trennung war. Ein Naturgesetz ist für den Monismus der begriffliche Ausdruck für den Zusammenhang gewisser Wahrnehmungen.

      Der Dualismus sucht das Wirkliche erst hinter der Beobachtungswelt, der Monismus findet es in ihr. Was an Prinzipien in ein Jenseits versetzt wird, ist der Erfahrung entlehnt: Der durch Schlussfolgerung angenommene Gott ist nur der in ein Jenseits versetzte Mensch. Der Monismus zeigt dagegen, dass wir mit dem Erkennen die Wirklichkeit in ihrer wahren Gestalt ergreifen und nicht ein subjektives Bild, das sich zwischen den Menschen und die Wirklichkeit einschiebt. Auch die Ziele des Handelns stammen aus keinem Jenseits, sondern aus der menschlichen Intuition. Wer über sein Triebleben und die Befehle anderer hinauskommt, wird durch nichts als durch sich selbst bestimmt. Er ist das letzte Bestimmende seiner Handlung und ist frei.
  - term: Mystik
    chunk_id: e9af7235-3f57-52ee-9c00-67f37f01f6f5
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Mystik geht darauf aus, in der menschlichen Seele den Urgrund der Dinge, die Gottheit, zu finden. Der Mystiker ist überzeugt, dass ihm in inneren Erlebnissen das Wesen der Welt offenbar wird. Die mittelalterlichen Mystiker wollen etwas in das Ich-Bewusstsein hineinempfangen und es mit etwas erfüllen; sie streben ein ganz gelassenes inneres Leben an, das sich in Ruhe hingibt und erwartet, dass sich die Seele mit dem göttlichen Ich erfüllt. Die einseitige Mystik hält die klaren Ideen der Vernunft für etwas, das nur dem menschlichen Verstand angehört, und sucht durch  ungewöhnliche Zustände wie Ekstase zu einem höheren Schauen zu gelangen. Sie tötet die sinnliche Beobachtung und das vernunftgemäße Denken in sich ab und steigert das Gefühlsleben, bis sie die wirkende Geistigkeit als Gottheit unmittelbar zu fühlen meint.

      Der Irrtum einer bloß auf das Gefühl gebauten Mystik besteht darin, dass sie erleben will, was sie wissen soll, und das Gefühl, etwas rein Individuelles, zu einem Universellen erziehen will. Was sie in sich findet, besteht in subjektiven Erregungen und verworrenen Vorstellungen und klärt nicht über die Welt auf. Sie hält die Klarheit der Ideen für oberflächlich. Wer aber das Leben in der Ideenwelt wahrhaft lebt, fühlt in sich das Wesen der Welt in einer Wärme wirken, die mit nichts zu vergleichen ist, und das Feuer des Weltgeheimnisses auflodern. Diese Empfindung ähnelt der des Mystikers, schöpft ihre Erkenntnisse aber aus Beobachtung und Denken und nicht aus abnormen Zuständen.
  - term: Naiver Realismus
    chunk_id: 2cc8e96d-7a5b-5217-95fe-fd9e88758e4b
    language: de
    tags: [concept, assistant-generated]
    text: >-
      Der naive Mensch betrachtet seine Wahrnehmungen so, wie sie ihm unmittelbar erscheinen, als Dinge, die ein von ihm ganz unabhängiges Dasein haben. Wer einen Baum sieht, glaubt zunächst, dass dieser in der Gestalt und mit den Farben, die er sieht, dort steht, wohin der Blick gerichtet ist. Er hält an diesem Glauben fest, bis er Wahrnehmungen begegnet, die jenen widersprechen; jede Erweiterung des Kreises der Wahrnehmungen nötigt ihn, sein Bild der Welt zu berichtigen. Das erste Axiom des naiven Menschen lautet: Nichts existiert, was man nicht wahrnehmen kann, und umgekehrt: Alles, was wahrgenommen werden kann, existiert. Wovon er keine Wahrnehmung hat, etwa Gott, Seele oder das Erkennen, das stellt er sich analog dem Wahrgenommenen vor. Das Ideelle gilt ihm als unwirklich, als bloßer Gedanke über die Dinge.

      Will der naive Realismus eine Wissenschaft begründen, so sieht er sie nur in der genauen Beschreibung des Wahrnehmungsinhaltes. Die Begriffe sind ihm Mittel zum Zweck, ideelle Gegenbilder der Wahrnehmungen, die für die Dinge selbst nichts bedeuten. Die Erfahrung widerlegt seinen Grundsatz: Der Inhalt der Wahrnehmungen ist vergänglich. Die einzelne Tulpe verschwindet, es behauptet sich die Gattung, die dem naiven Realismus doch nur eine Idee ist. Er muss deshalb neben den Wahrnehmungen etwas Ideelles gelten lassen, etwa unsichtbare Kräfte, die Vererbung oder ein Lebensprinzip, und denkt dessen Dasein ebenfalls nach dem Muster der Sinnesobjekte.
  - term: Organismus
    chunk_id: bfba484e-74ff-54ed-a15f-7d6b9fa75ac2
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Der soziale Organismus ist nach dieser Auffassung wie ein natürlicher Organismus gegliedert.
      Er besteht aus drei selbstständigen Gliedern: dem Geistesleben, dem Rechtsleben und dem
      Wirtschaftsleben. Jedes dieser Glieder hat seine eigene Gesetzmäßigkeit und Verwaltung und
      kann die Aufgaben der anderen nicht übernehmen. Das wirtschaftliche Leben muss nach seinen
      eigenen Kräften und Gesetzen wirken, das politisch-rechtliche Glied in voller
      Selbstständigkeit daneben bestehen. Ihre Einheit entsteht nicht durch eine zentrale
      Verwaltung, sondern durch das lebendige Zusammenwirken der drei selbstverwalteten Glieder. Der
      Mensch gehört mit seinen Interessen allen drei Teilorganismen an, und die Zentralverwaltungen
      können trotz ihrer Unabhängigkeit ihre Maßnahmen harmonisieren. Die Gliederung betrifft nur
      die Verwaltung, nicht das Leben des Menschen; dieses kann sich in der Einheit erst recht
      entfalten. Die drei sozialen Ideale – Brüderlichkeit, Gleichheit, Freiheit – erhalten ihre
      wahre Bedeutung erst durch das Durchschauen dieser Dreigliederung. Das Wirtschaftsleben ruht
      auf Brüderlichkeit, das Rechtsleben auf Gleichheit, das Geistesleben auf Freiheit. Nur durch
      diese gesunde Gliederung kann der soziale Organismus wirklich gesunden."
  - term: Persönlichkeit
    chunk_id: 28866b38-5afa-5614-8156-323162c06a52
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Persönlichkeit ist kein angeborenes Merkmal, sondern das Ergebnis eines bewussten
      Entwicklungsweges. Der Mensch ist nicht von Natur aus eine Persönlichkeit; er muss sich
      vielmehr selbsttätig zu einer solchen hinaufentwickeln. Die reine Persönlichkeit stellt das
      Höchste dar, was der Mensch erreichen kann, indem er seinen eigenen Begriff mit der
      Wahrnehmung „Mensch“ vereinigt. Dies geschieht nicht von selbst, sondern durch aktive,
      selbstbestimmte Arbeit an sich selbst.


      Eine Persönlichkeit handelt aus eigenen, innerlich geprüften Einsichten, nicht aus äußeren
      Zwängen oder Vorschriften. Der entscheidende Unterschied liegt zwischen einem bewussten
      Beweggrund des Handelns und einem unbewussten Antrieb. Wer aus Erkenntnis handelt, tut dies
      nicht aus blindem Drang, sondern aus einem Wissen um die Gründe seines Tuns. Der freie Mensch
      bestimmt sich seine Zwecke selbst; er besitzt seine Ideale, statt von ihnen besessen zu
      werden.


      Persönlichkeit verwirklicht sich jedoch nicht in Isolation, sondern in sozialer Verantwortung.
      Immer ist es der ganze, volle Mensch, der mit seiner Umgebung in Wechselwirkung tritt. In der
      Erziehung etwa kommt man nur zurecht, wenn man dem Gegenüber in freier, individueller Weise
      begegnet und sich dabei allein von Erkenntnissen über die Menschennatur leiten lässt, nicht
      von äußeren Gesetzen. Persönlichkeit ist so das Ergebnis eines Lebens, das aus innerer
      Freiheit und bewusster Einsicht gestaltet wird.
  - term: Pessimismus
    chunk_id: 5d81d631-be80-568f-8655-b04f34af4c95
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Pessimismus ist eine philosophische Position, die davon ausgeht, dass die Einrichtung der
      Welt den Menschen ewig unbefriedigt lasse und er nie glücklich sein könne. Diese Auffassung
      entsteht an einer Grenze des Denkens, an der der Mensch die äußere Welt als voller Mängel und
      Leid erlebt. Entscheidend ist jedoch, dass die äußere Welt an sich weder gut noch schlecht
      ist; sie wird es erst durch den Menschen. Der Pessimismus erweist sich als irrig, weil er
      voraussetzt, der Mensch müsse sich selbst unglücklich machen. Er müsste folgerichtig Verlangen
      nach dem Unglück tragen, doch die Befriedigung seines Verlangens begründet gerade sein Glück.
      Damit zerfließt die pessimistische Ansicht in sich selbst.


      Die Überwindung des Pessimismus liegt nicht in einem bloßen Optimismus, sondern in einer
      tieferen Erkenntnis. Der Pessimismus kann als Durchgangsstufe verstanden werden, an der der
      Mensch schöpferisch werden muss. In der Weiterentwicklung dieser Position, etwa bei Hartmann,
      führt der Pessimismus zu einer hingebenden Tätigkeit für eine erhabene Aufgabe, zur
      selbstlosen Hingabe an den Weltprozess. Der Mensch erkennt, dass das Jagen nach individueller
      Befriedigung eine Torheit ist. So wird der Pessimismus nicht verneint, sondern in eine
      produktive, über sich selbst hinausweisende Haltung verwandelt, die den Menschen zu bewusstem,
      tätigem Leben in der Welt befähigt.
  - term: Phänomen
    chunk_id: 0c976a8f-ce9f-565d-a24d-241d1bc8d03c
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Das Phänomen ist die unmittelbar gegebene, sinnlich oder seelisch wahrnehmbare Erscheinung. Es
      ist der Ausgangspunkt aller Erkenntnis. Was dem Menschen als Wahrnehmung entgegentritt, ist
      jedoch nicht die volle Wirklichkeit, sondern ein Teil derselben. Die Trennung von einem
      vermeintlichen „bloßen Schein“ und einem „Wesen an sich“ wird abgelehnt: Was im Phänomen
      erscheint, ist wirklich, aber unvollständig. Es gleicht einem zusammenhanglosen Chaos, solange
      es nur als bloße Sinneswahrnehmung hingenommen wird.


      Die vollständige Wirklichkeit entsteht erst, wenn das Denken die im Phänomen wirkenden
      Gesetzmäßigkeiten erfasst. Das Denken ist das Element, das über die Zusammenhanglosigkeit der
      bloßen Erfahrung hinausführt. Es verbindet sich mit der Wahrnehmung und erschließt dadurch die
      Wirklichkeit. Die denkende Beobachtung, die weder einseitig den Begriff noch die Wahrnehmung
      für sich betrachtet, sondern den Zusammenhang beider, ist der Weg zur vollen Wirklichkeit.


      Das Urphänomen ergibt sich rein im Gedanken, wenn die in Betracht kommenden Faktoren ihrem
      Wesen gemäß im Denken in Zusammenhang gebracht werden. Es ist die Grundtatsache, die sich als
      Konstantes durch alle Modifikationen eines Vorgangs hindurchzieht. Das Phänomen wird erst dann
      verstanden, wenn der Mensch es denkend erfasst und die treibenden Gewalten erkennt, die es aus
      dem Weltganzen heraus an die Peripherie bringen. So wird das Phänomen zum Ausgangspunkt einer
      Erkenntnis, die in der denkenden Durchdringung ihre Vollendung findet.
  - term: Philosophie
    chunk_id: fa03e05e-931d-5f22-8d8c-c10faf525bce
    language: de
    tags:
      - concept
      - assistant-generated
    text: Philosophie ist für diese Betrachtungsweise keine bloße Gedankenkonstruktion oder abstrakte
      Lehre, sondern eine methodische Selbstbesinnung des Menschen auf sein Erkennen und Handeln.
      Ihr Ausgangspunkt liegt in der unmittelbaren Erfahrung, dass der Mensch sich zur Welt
      verhalten kann – und dass ein Unterschied besteht zwischen einem bewussten Beweggrund des
      Handelns und einem unbewussten Antrieb. Philosophie fragt daher nach Wahrheit, die der Mensch
      selbst verantworten kann, und nach Impulsen für eigenes Handeln. Sie ist Arbeit des Menschen
      an sich selbst, um das Denken zu einem selbstständigen, schöpferischen Organ zu schulen. Es
      geht nicht darum, die Welt zu erschaffen, sondern sie zu begreifen. Der Philosoph sucht nicht
      die Ausgangspunkte für das Schaffen, sondern für das Begreifen des Vorhandenen. Philosophie
      ist eine besondere Form, dem menschlichen Seelenbedürfnis Befriedigung zu geben, das in der
      Forderung „Erkenne dich selbst“ seinen Ausdruck findet. Ihr Ziel ist keine festgefügte Lehre,
      sondern eine Haltung, die man sich erarbeitet. Sie dient der allseitigen Entfaltung der ganzen
      Menschennatur und der Erhöhung des Daseinswertes der menschlichen Persönlichkeit. Die
      entscheidende Frage ist, wie sich Philosophie als Kunst zur Freiheit des Menschen verhält.
      Freiheit wird dabei nicht als Willkür verstanden, sondern als die Fähigkeit, aus eigener
      Einsicht zu handeln, indem man die Beweggründe seines Tuns aus sich selbst heraus bestimmt.
  - term: Produktionsmittel
    chunk_id: 0e66208d-07fc-5906-927f-ab3f2af66b1c
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Produktionsmittel sind vergegenständlichte Arbeit vergangener Generationen. Ein Rock, den ein
      Schneider für sich selbst anfertigt, ist nicht einfach ein Kleidungsstück, sondern ein
      Produktionsmittel: Er dient nicht dem unmittelbaren Verbrauch, sondern ermöglicht dem
      Schneider, für andere zu arbeiten. Damit ist der Wert eines Produktionsmittels nicht direkt
      aus den Bedürfnissen des Einzelnen ableitbar, sondern ergibt sich erst aus dem gesamten
      sozialen Zusammenhang. Die freie Verfügung über Produktionsmittel ist notwendig, damit der
      Einzelne seine individuellen Fähigkeiten fruchtbar für die Allgemeinheit einsetzen kann. Wer
      diese Verfügung unterbindet, lähmt die freie Anwendung menschlicher Geschicklichkeit. Zugleich
      dürfen Produktionsmittel nicht dazu dienen, über andere Menschen zu herrschen. Der Rechtsstaat
      wird privates Eigentum an Kapital nicht grundsätzlich verhindern, solange die Verwaltung
      dieses Eigentums einen Dienst für das Ganze bedeutet. Entscheidend ist, dass das
      Eigentumsrecht in dem Augenblick verändert werden kann, in dem es in ein Mittel zur
      ungerechtfertigten Machtentfaltung umschlägt. Die Verwaltung der Produktionsmittel soll daher
      nicht vom politischen Staat oder von privaten Kapitalinteressen allein ausgehen, sondern von
      einem freien Geistesleben, das die wirtschaftlichen Prozesse aus sachlichem Interesse an der
      Hervorbringung von Leistungen heraus gestaltet."
  - term: Psychologie
    chunk_id: 8bb35809-cb2f-5f86-b77f-b4f5020a140a
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Psychologie ist für diese Betrachtungsweise die Wissenschaft von der Seele, aber nicht als
      bloße Beschreibung innerer Zustände. Eine wahrhafte Psychologie kann nur gewonnen werden, wenn
      man auf die Beschaffenheit des Geistes als eines Tätigen eingeht. Die Seele zeigt sich nicht
      als ein ruhender Gegenstand, den man wie einen Stein von außen betrachten und in einen
      äußerlichen Zusammenhang bringen könnte. Sie offenbart sich vielmehr im tätigen Denken, in dem
      der Mensch sich als unmittelbar Tätiges erfühlen kann. Das Denken ist dabei Betrachtung, es
      richtet den Blick nach außen auf ein Gegenüberstehendes. Eine Psychologie, die die Seele nur
      nach den Methoden der Mechanik oder Physik erfassen will, verliert gerade das aus dem Auge,
      worauf es ankommt: den Geist selbst als den Produzenten seiner Äußerungen. Sie begründet eine
      „Seelenlehre ohne Seele“. Die eigentliche Aufgabe der Psychologie mündet in die Forderung der
      Selbsterkenntnis. Die Menschenseele kann von dem Erlebnis mit dem „Erkenne dich selbst“ denken
      und empfinden, dass alles Seelenleben nicht seinen Anlagen entspricht, das nicht durch dieses
      Erlebnis aus dem Lebenstraum erwacht. So wird die Psychologie zu einer Erkenntnis, die nicht
      in festen Gesetzen aufgeht, sondern durch ihr Eigenleben und durch die Verwandtschaft dieses
      Eigenlebens mit dem ganzen menschlichen Seelenleben ihre Berechtigung erweist."
  - term: Realität
    chunk_id: 5d30e67b-be94-5f1f-8031-003407e05146
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Die Wahrnehmung allein, so wie sie den Sinnen erscheint, ist noch nicht die volle
      Wirklichkeit. Sie ist ein bloßes, zusammenhangloses Chaos von Eindrücken. Erst das Denken
      bringt Ordnung und Zusammenhang in diese Eindrücke, indem es die Wahrnehmungen mit Begriffen
      verbindet. Die Begriffe selbst werden nicht aus der Wahrnehmung geschöpft, sondern durch
      Intuition, durch eine innere Tätigkeit des Menschen, erfasst. Unsere geistige Organisation
      reißt die eine, einheitliche Wirklichkeit in diese beiden Faktoren auseinander: in die
      objektive Wahrnehmung und den subjektiven Begriff. Volle Wirklichkeit entsteht erst dort, wo
      diese beiden Faktoren wieder zusammengeführt werden. Nicht der abstrakte Begriff für sich
      enthält die Wirklichkeit, sondern die denkende Beobachtung, die den lebendigen Zusammenhang
      zwischen Begriff und Wahrnehmung herstellt. Realität ist daher kein statischer Zustand, der
      dem Menschen einfach gegenübersteht. Sie ist ein Prozess, der sich im Erkennen vollzieht. Der
      Mensch lebt mit seinem Denken, wenn er es genügend vertieft, in der geistigen
      Weltwirklichkeit. Er ist nicht von ihr getrennt, sondern bringt durch seine denkende Tätigkeit
      die Wahrnehmungen erst zu einer gesetzmäßig geordneten, vollen Wirklichkeit."
  - term: Rechtsleben
    chunk_id: 06f5544d-f2c5-5058-bc6e-90e4215d2111
    language: de
    tags:
      - concept
      - assistant-generated
    text: Das Rechtsleben ist nach der Idee der Dreigliederung des sozialen Organismus der zweite der
      drei selbstständigen Glieder. Es umfasst alle Beziehungen zwischen Menschen, die auf
      gegenseitiger Anerkennung und Vereinbarung beruhen. Seine zentrale Aufgabe ist es, das
      Miteinander so zu ordnen, dass jeder Einzelne seine Freiheit entfalten kann, ohne die Freiheit
      des anderen zu verletzen. Dies geschieht auf der Grundlage der Gleichheit aller mündigen
      Menschen vor dem Recht. Der Staat als Rechtsstaat hat die Funktion, diese Rechtsbeziehungen zu
      sichern und durchzusetzen. Die Gestaltung des Rechtslebens erfolgt aus den Urteilen und
      Empfindungen aller einander gleichstehenden mündig gewordenen Menschen heraus. Es ist ein
      demokratisch orientiertes Rechtsstaatsleben, das dem Arbeitswillen die notwendigen Impulse
      gibt. Das Rechtsleben ist die notwendige Bedingung für ein freies Geistesleben und ein
      solidarisches Wirtschaftsleben. Es wirkt als ausgleichendes Element zwischen den beiden
      anderen Gliedern des sozialen Organismus. In ihm kommt der Mensch zu seiner rein menschlichen
      Geltung, unabhängig von seinen besonderen Fähigkeiten oder seinem wirtschaftlichen Wert. Die
      Einheit des gesamten sozialen Organismus wird dadurch nicht gefährdet, dass jeder Mensch mit
      seinen Interessen allen drei Gliedern angehört.
  - term: Reine Vernunft
    chunk_id: c8d86683-3a18-5b0f-a580-f1ae85a25c5f
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Das begriffliche Denken, das sich seiner eigenen Tätigkeit bewusst wird und ohne Rücksicht auf
      einen bestimmten Wahrnehmungsgehalt seinen Inhalt aus sich selbst schöpft, wird als reine
      Vernunft bezeichnet. Ihr Inhalt wird nicht von außen durch Sinneswahrnehmung geliefert,
      sondern durch reine Intuition aus der ideellen Sphäre bestimmt. In diesem Sinne ist reine
      Vernunft gleichbedeutend mit reinem Denken.


      Dieses reine Denken ist nicht als abstraktes, weltabgewandtes Vermögen zu verstehen. Es ist
      vielmehr diejenige Tätigkeit, durch die der Mensch an der Wirklichkeit mitwirkt. Denn volle
      Wirklichkeit entsteht erst im Zusammenhang von Wahrnehmung und Begriff. Die Wahrnehmung
      liefert den objektiven, der Begriff den subjektiv durch Intuition gegebenen Teil. Die denkende
      Beobachtung, die beide Seiten verbindet, erschließt erst die Wirklichkeit.


      Wird dieses reine Denken zur Triebfeder des Handelns, spricht man von praktischer Vernunft.
      Handeln aus reiner Intuition ist selbstbestimmt, weil es nicht von äußeren Wahrnehmungen oder
      vorgegebenen moralischen Prinzipien, sondern aus dem eigenen, ideell erfassten Begriff heraus
      erfolgt. Auf dieser Stufe fallen Triebfeder und Motiv zusammen: Die Handlung ist weder
      schablonenhaft noch fremdbestimmt, sondern Ausdruck eines aus dem Denken selbst fließenden
      Antriebs. So erweist sich die reine Vernunft als das Vermögen, aus eigener Einsicht heraus
      frei zu handeln.
  - term: Religion
    chunk_id: 148459bc-ea3e-5c61-947f-58bec39c8f2f
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Religion ist eine bestimmte Stufe im Verhältnis des Menschen zur übersinnlichen Welt. Der
      Religiös-Gläubige sucht in der Offenbarung, die ihm Gott zuteil werden lässt, die Lösung der
      Welträtsel, die ihm sein mit der bloßen Erscheinungswelt unzufriedenes Ich aufgibt. Religion,
      Kunst und Wissenschaft verfolgen gleichermaßen das Ziel, die Einheit zwischen Mensch und Welt
      zu suchen. Sie alle entspringen dem Streben, den Gegensatz zu überbrücken, der zwischen dem
      Ich und der Außenwelt besteht. Die Geschichte des geistigen Lebens ist ein fortwährendes
      Suchen dieser Einheit.


      Die Entwicklung des Bewusstseins durchläuft dabei verschiedene Epochen. In einer früheren
      Stufe wirkt der Gedanke wie eine Wahrnehmung von außen. Der Mensch erlebt die geistige Welt
      noch unmittelbarer. Mit der Zeit erstarkt die Seele im Selbsterleben ihres Eigenwesens, und
      der Gedanke wird als eigenes Erzeugnis empfunden. Auf dieser Stufe stellt sich die Frage, was
      dieses innere Seelenerzeugnis mit einer Außenwelt zu tun hat.


      Das Verhältnis von Religion und Denken ist dabei kein äußerliches. Die Religion kann wohl ohne
      Philosophie sein, aber die Philosophie nicht ohne Religion. Die Religion schließt die
      Philosophie vielmehr in sich. Die wahrhafte Religion, die Religion des Geistes, muss einen
      Inhalt haben, denn der Geist ist wesentlich Bewusstsein. Als Gefühl ist er der
      ungegenständliche Inhalt selbst. Die niedrigste Stufe des Bewusstseins teilt der Mensch mit
      dem Tier.
  - term: Schicksal
    chunk_id: c47b2d6d-baee-5264-9504-9dd222bd0257
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Mensch lebt in einer Einheit mit seinem Schicksal. Es ist nicht etwas, das ihn von außen
      trifft, sondern er ist in seinem seelischen Erleben durchaus verbunden mit dem, was er als
      Schicksal erlebt. Die Erlebnisse der Vergangenheit, auch die leidvollen Schicksalsschläge,
      gehören zu den Kräften, die in seinem Ich wirksam sind. Der wirkliche Inhalt seines inneren
      Seins wäre ein ganz anderer, wenn er in den vorhergehenden Jahren anderes erlebt hätte. Er ist
      durch diese Erlebnisse geworden, was er ist. Das Ich ist nicht denkbar ohne diese Erlebnisse.


      Schicksal ist kein fertiges, abgeschlossenes Ergebnis, das man als bloße Überzeugung mit sich
      trägt. Es erschließt sich auf einem Erlebnisgebiet der Seele, auf dem sich durch die innere
      Seelentätigkeit selbst in jedem Augenblick die Frage nach dem Schicksal erneut lebendig
      beantwortet. Der Mensch ist in seinem Denken und Handeln an diesem fortlaufenden Prozess
      beteiligt. Mit dem Errungenen wandelt er das rätselvolle Leben weiter in die Breiten und
      Tiefen, in die ihn Bedürfnis und Schicksal veranlassen. So wirken Notwendigkeit und Freiheit
      im Schicksalsgeschehen zusammen.
  - term: Schönheit
    chunk_id: 89ed9f1f-b306-533a-b5b2-b144255d741b
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Schönheit ist kein bloßer Sinneseindruck, sondern hat eine geistige Dimension. Ein schönes
      Kunstwerk wirkt auf das Wohlgefallen, ohne Begierde zu erwecken, und versetzt den Betrachter
      in eine geistige Welt, in der er aus Neigung verweilt. In diesem Zustand sind Sinnlichkeit und
      Geist versöhnt: Der sinnliche Mensch wird zum Denken geleitet, der geistige Mensch zur Materie
      zurückgeführt. Die hohe Gleichmütigkeit und Freiheit des Geistes, mit Kraft und Rüstigkeit
      verbunden, ist die Stimmung, in der uns ein echtes Kunstwerk entlassen soll.


      Der wahre Künstler schöpft unmittelbar aus dem Urquell alles Seins und prägt dem Stoff die
      Idee ein. Alles kommt beim Kunstwerk darauf an, inwiefern der Künstler dem Stoff die Idee
      eingepflanzt hat. Nicht was er behandelt, sondern wie er es behandelt, ist entscheidend. Die
      Kunst ist eine Manifestation geheimer Naturgesetze. Ein Kunstprodukt ist nicht minder Natur
      als ein Naturprodukt, nur dass ihm die Naturgesetzlichkeit schon so eingegossen wurde, wie sie
      dem Menschengeist erschienen ist. Die Kunst steigert die Natur, indem sie das Zufällige
      überwindet und das Notwendige sichtbar macht.


      Schönheit betrifft das Verhältnis von Freiheit und Notwendigkeit. Im Kunstwerk fallen Gesetz
      und Tätigkeit zusammen, das Wirkende lebt sich in der Wirkung unmittelbar dar. So wird in der
      Schönheit die Freiheit erfahrbar, ohne dass der Mensch seinen Bezug zur Sinnenwelt verliert.
  - term: Schöpfer
    chunk_id: 64ac6ea5-f94a-516b-8fca-ee840c788e00
    language: de
    tags:
      - concept
      - assistant-generated
    text: Der Begriff des Schöpfers wird hier nicht als Bezeichnung für ein überweltliches Wesen
      verstanden, sondern als eine Wirklichkeit, die im menschlichen Erkennen und in der Natur
      selbst aufscheint. Der Geist erweist sich als der Schöpfer des Gehirns, durch das er in der
      physischen Welt in Gedankenbildung offenbart. Wer die materiellen Zusammenhänge der Welt
      verfolgt, gelangt zuletzt zur Anschauung des Geistes. Die Behauptung, das Gehirn sei nicht
      Bedingung des auf Sinnenfälliges sich beziehenden Denkens, ist eine Verirrung; eine weitere
      Verirrung ist, dass der Geist nicht der Schöpfer des Gehirns sei. Der Mensch kann sich im
      Gedanken als etwas unmittelbar Tätiges, als etwas, das seine Tätigkeit überschauen kann,
      erfühlen. Er muss selbsttätig seinen Begriff mit der Wahrnehmung Mensch vereinigen; sein
      Dasein ist nicht ohne ihn selbst bestimmt. In diesem Sinne ist der Mensch aufgerufen, aus sich
      heraus schöpferisch zu werden, indem er den Geist in sich wirken lässt. Der schöpferische
      Geist durchdringt die Natur und das menschliche Innere, sodass der Mensch zur Teilnahme an den
      Produktionen der Natur erhoben werden kann. Alles im Weltall gilt als Wirkung, als
      Manifestation eines schöpferischen Geistes. So ist der Schöpfer keine ferne Instanz, sondern
      die dem Menschen zugängliche geistige Wirklichkeit, die im Erkennen und Handeln lebendig wird.
  - term: Seele
    chunk_id: a6d15205-f420-5c65-aa4a-e15399ca1956
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Die Seele ist nach dieser Auffassung das innere Erlebniszentrum des Menschen. Sie ist der
      Ort, an dem Wahrnehmung und Denken in einer Weise zusammentreffen, die über ein bloß passives
      Aufnehmen hinausgeht. Die Seele ist kein Spiegel, der die Außenwelt lediglich abbildet; sie
      arbeitet aktiv an der Konstitution von Wirklichkeit mit. Sie macht mit dem Gehirn, was ein
      Mensch mit einem Spiegel macht: Sie bereitet es zu, damit Erkenntnis zustande kommen kann. In
      der Seele eröffnet sich so der Ausblick auf eine Wirklichkeit, die den Sinnen unzugänglich
      ist. Sie erfühlt sich in einem seelisch-geistigen Weben und ist mit dem Geistigen außerhalb
      des Körpers verbunden. Die Seele ist nicht mit dem Geist identisch, aber auch nicht von ihm
      getrennt; beide wirken in einem seelisch-geistigen Zusammenhang. Die Welträtsel wollen von der
      Menschenseele nicht bloß bedacht, sondern erlebt sein. Die Seele kann durch innere
      Seelentätigkeit zu einem Erleben gelangen, das über das gewöhnliche Bewusstsein hinausgeht.
      Dieses Erleben ist kein theoretisches Wissen, sondern ein Erlebnisgebiet, auf dem sich die
      Fragen des Lebens immer neu lebendig beantworten. Die Seele ist damit das Organ, durch das der
      Mensch an einer geistigen Welt teilhat, die ihm durch die Vermittlung des Körpers zur
      Wahrnehmung gebracht wird."
  - term: Seelenstimmung
    chunk_id: d4456531-9302-5a45-8bb0-115abb8cf10f
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die Seelenstimmung ist eine innere Verfassung, die durch bewusste, selbst geleistete
      Innenarbeit errungen wird. Sie ist keine traumhafte oder herabgestimmte Trance, sondern eine
      Steigerung des gewohnten Seelenlebens. In dieser Stimmung wird das Denken nicht als abstrakte
      Tätigkeit erlebt, sondern als ein lebendiges Einleben in das Gedankenelement. Die Seele
      gewinnt die Kraft, den Gedanken in seinem eigenen Wesen durchzuarbeiten, und erlebt ihn als
      ihr eigenes Erzeugnis.


      Diese Seelenstimmung ist eine wache, nüchterne Empfänglichkeit. Sie darf nicht mit Zuständen
      wie traumhaftem Hellsehen oder Hypnose verwechselt werden, die aus einer Herabstimmung des
      Geisteslebens entstehen. Vielmehr führt sie zu einem leibfreien Seelenbewusstsein, mit dem der
      Mensch in der geistigen Welt klar erlebend steht. Sie befähigt dazu, fühlend und empfindend in
      das geistige Gefüge der Welt hineinzuschauen.


      Die Seelenstimmung ist die Grundlage für eine wirkliche Geisteswissenschaft. Sie entspricht
      einem innerlichen Suchen, bei dem die Seele ruhig geworden ist und die Welt ihre Geheimnisse
      enthüllt. Es ist eine Haltung, die sich nicht mit dem begnügt, was die äußere Erfahrung oder
      das bloße Erleben gibt, sondern die eine innere Notwendigkeit durchfühlt, über die Welt etwas
      zu erkennen, was äußerlich nicht erfahrbar ist. In dieser Stimmung wird die Erkenntnis zu
      einem stetigen Hineinleben in den Weltengrund.
  - term: Selbstbewusstsein
    chunk_id: 302f6281-c847-5678-a9e0-1c8868d70afa
    language: de
    tags:
      - concept
      - assistant-generated
    text: Selbstbewusstsein ist in dieser Perspektive nicht das Wissen um die eigene Existenz oder ein
      Gefühl der eigenen Wichtigkeit, sondern die Fähigkeit, sich selbst als denkendes Wesen zu
      erfassen. Der Mensch findet im Denken den Grund seiner Freiheit. Freiheit entsteht, wenn er
      denkend die Motive seines Handelns durchdringt und sie zu eigenen Beweggründen macht. Das Ich
      findet im Denken seinen eigenen Grund als lebendige, tätige Wesenheit. Das intuitive Denken
      wird als erlebte innere Geistbetätigung und als in sich ruhende Wesenheit beschrieben. Wer
      dieses Denken als eine solche in sich ruhende Wesenheit erfährt, kann dem handelnden Menschen
      Freiheit zusprechen. Die Entwicklung des Gedankenlebens durchläuft dabei mehrere Epochen. In
      einer frühen wirkt der Gedanke wie eine Wahrnehmung von außen. Später erstarkt die Seele im
      Selbsterleben ihres Eigenwesens, der Gedanke verschmilzt mit der Selbsterkenntnis und wird als
      eigenes Erzeugnis gefühlt. In einer weiteren Epoche erwacht das Selbstbewusstsein in einer dem
      eigentlichen Wesen entsprechenden Art. Der Mensch wird im wahren Sinne den ganzen Umfang
      seines Seelenlebens als Ich gewahr. Die selbstbewusste Seele wird zur Quelle, aus der die
      Erkenntnis schöpft, um Aufschluss auch über die außerseelische Welt zu gewinnen. Das
      selbstbewusste Ich isoliert sich jedoch im Laufe der Entwicklung mit seinen Innenerlebnissen
      immer mehr in sich selbst.
  - term: Sinnesorgan
    chunk_id: 6a9c80f7-29fb-57f3-a878-ea0b13308693
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Ein Sinnesorgan ist kein bloßer Empfänger von Reizen aus der Außenwelt, sondern ein aktiver
      Vermittler. Es antwortet auf äußere Einwirkungen, indem es Wahrnehmungen wie Farbe, Ton oder
      Wärme hervorbringt. Diese Wahrnehmungen sind nicht mit den Vorgängen im Organ selbst
      identisch: Was sich im Auge oder in den Nerven abspielt, hat keine Ähnlichkeit mit dem, was
      als Farbe oder Ton im Bewusstsein erscheint. Das Sinnesorgan ist eine Grenzfläche, an der die
      Außenwelt auf das Bewusstsein trifft, ohne dass die Prozesse im Organ mit der Wahrnehmung
      zusammenfallen.


      Jedes Sinnesorgan übt eine spezifische Tätigkeit aus. Es formt die Eindrücke, die von außen
      kommen, zu bestimmten Qualitäten um. So entstehen Farben, Töne, Wärme- oder Tastempfindungen
      durch die Einrichtung der Sinne und des Gehirns. Die Erscheinungswelt ist in diesem
      physiologischen Sinne subjektiv. Das Denken muss auf diese Erfahrung angewendet werden, um zu
      erkennen, dass die Sinnesorgane nicht getrennt vom erkennenden Menschen wirken, sondern Teil
      des Erkenntnisprozesses sind.


      Der Begriff des Sinnes umfasst dabei nicht nur die äußeren Sinne, sondern alle leiblichen und
      geistigen Organe, die der Wahrnehmung unmittelbarer Tatsachen dienen – auch den inneren Sinn
      für die Wahrnehmung innerer Erlebnisse. Indem der Mensch sich bewusst wird, dass seine Sinne
      die Wahrnehmungen mitgestalten, kann er über die bloße subjektive Erscheinung hinaus zu
      höheren Erkenntnisaufgaben gelangen.
  - term: Sinneswahrnehmung
    chunk_id: f0f9fe16-804f-5adb-aae3-36bd9cef344c
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die Sinneswahrnehmung ist der erste Schritt des Menschen in die Begegnung mit der Welt. Sie
      ist die unmittelbare, sinnliche Auffassung der Wirklichkeit, die uns als „Erscheinung für die
      Sinne“ entgegentritt. Dabei umfasst der Begriff des Sinnes nicht nur die äußeren Sinne,
      sondern alle leiblichen und geistigen Organe, die der Wahrnehmung unmittelbarer Tatsachen
      dienen, einschließlich des „inneren Sinnes“ für seelische Erlebnisse.


      Die Sinneswahrnehmung liefert jedoch nur eine Hälfte der Wirklichkeit. Sie zeigt die
      Erscheinung, nicht das Wesen der Dinge. Ohne das Denken bleibt sie stumm und zusammenhangslos.
      Erst die Verbindung von Wahrnehmung und Begriff ergibt wirkliche Erkenntnis. Unsere geistige
      Organisation reißt die Wirklichkeit in diese beiden Faktoren auseinander: Die Wahrnehmung wird
      objektiv gegeben, der Begriff subjektiv durch Intuition. Betrachtet man die bloße Wahrnehmung
      für sich, hat man keine Wirklichkeit, sondern ein zusammenhangloses Chaos. Die volle
      Wirklichkeit entsteht erst durch die denkende Beobachtung, die den Zusammenhang beider
      herstellt.


      Die sinnliche Auffassung ist die erste Tätigkeit; das Denken durchdringt und ordnet die
      unendliche Mannigfaltigkeit der Wahrnehmungen. So ist die Sinneswahrnehmung der Ausgangspunkt,
      der den Menschen dazu drängt, die Welt denkend zu erfassen und damit über die bloße
      Erscheinung hinaus zur Wirklichkeit vorzudringen.
  - term: Sinneswelt
    chunk_id: a5fcef82-835b-56e4-94db-c0357b4a7420
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die Sinneswelt umfasst alle Eindrücke, die dem Menschen durch seine Sinne zugänglich sind:
      Farbe, Ton, Wärme, Druck, Geruch, Geschmack sowie räumliche und zeitliche Verhältnisse. Sie
      ist das, was als unmittelbare Wahrnehmung im Bewusstsein erscheint – etwa ein roter Farbfleck,
      der mit bestimmten Temperatur- und Tastwahrnehmungen in Zusammenhang steht und so als
      Gegenstand der Sinnenwelt bezeichnet wird.


      Die Sinneswelt ist jedoch nicht die ganze Wirklichkeit, sondern nur eine Seite von ihr.
      Betrachtet man die bloße Wahrnehmung für sich, hat man kein geordnetes Ganzes, sondern ein
      zusammenhangloses Chaos. Erst durch das Denken, das die Wahrnehmungen mit Begriffen verbindet,
      entsteht volle Wirklichkeit. Die Sinneswelt ist daher eine notwendige Grundlage für
      Erkenntnis: Ohne sie gäbe es keinen Anlass, den ordnenden Verstand zu gebrauchen. Zugleich ist
      sie kein bloßer Schein, sondern der objektiv gegebene Teil der Wirklichkeit.


      Die Sinneswelt erschöpft sich nicht in dem, was die äußeren Sinne liefern. Auch innere
      Erlebnisse, die durch den sogenannten inneren Sinn wahrgenommen werden, gehören zu ihr.
      Entscheidend ist, dass die Sinneswelt als unvollendet, als eine halbe Wirklichkeit verstanden
      wird. Sie fordert den Menschen auf, sie durch denkende Beobachtung zu durchdringen und ihren
      gesetzmäßigen Zusammenhang zu erkennen. In diesem Zusammenspiel von Wahrnehmung und Begriff
      liegt der Weg zu einer vollständigen Erkenntnis der Wirklichkeit.
  - term: Sittliche Idee
    chunk_id: df095acd-3e33-5b51-ba5e-0f57e11be49a
    language: de
    tags:
      - concept
      - assistant-generated
    text: Eine sittliche Idee ist kein von außen auferlegtes Gebot, keine gesellschaftliche Konvention
      und kein abstraktes Moralprinzip, dem man sich unterwerfen müsste. Sie entspringt vielmehr aus
      der inneren Einsicht und Anschauung des einzelnen Menschen. Der Antrieb zum Handeln liegt
      nicht außerhalb, sondern im Menschen selbst. Er ist sein eigener Gesetzgeber. Die sittlichen
      Ideale entstehen aus der moralischen Fantasie, die für den konkreten Einzelfall die
      entsprechende Handlungsvorstellung hervorbringt. Diese individuelle Intuition ist die
      Triebfeder des freien Handelns. Der Mensch will seine sittliche Idee verwirklichen, weil ihr
      Inhalt sein eigenes Wesen ausmacht und ihre Umsetzung seine höchste Lust ist. Er handelt
      nicht, weil ein Sollen über ihm schwebt, sondern weil die sittliche Idee vermöge ihres Inhalts
      in ihm tätig ist und ihn leitet. Freiheit besteht darin, aus solchen selbst erkannten
      sittlichen Ideen zu handeln. Da diese Ideen aus der gemeinsamen Ideenwelt geschöpft werden,
      können sich freie Menschen in ihren Intentionen begegnen, ohne sich gegenseitig zu behindern.
      Die Grundmaxime des freien Menschen ist das Leben in der Liebe zum eigenen Handeln und das
      Lebenlassen im Verständnis des fremden Wollens. Die sittliche Idee ist somit der individuell
      geschaute, gedankliche Impuls, der das souveräne Wollen des Menschen bestimmt.
  - term: Sittlichkeit
    chunk_id: e7310863-da2d-5ff6-9b91-22e757a36a70
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Sittlichkeit ist nach dieser Auffassung kein von außen auferlegtes Gesetz, sondern entspringt
      einer inneren Quelle: der individuellen Intuition des handelnden Menschen. Wer sittlich
      handelt, tut dies nicht, weil ein Gebot es vorschreibt oder weil er gesellschaftliche
      Sanktionen fürchtet. Die Grundlage dafür ist die Freiheit des Denkens; nur wer sein Denken von
      Vorurteilen und fremden Einflüssen befreit hat, kann zu sittlicher Intuition gelangen.
      Sittlichkeit ist die Frucht der Freiheit, nicht deren Gegensatz. Ein sittlicher Mensch handelt
      aus einer Idee, die er selbst als richtig erkannt hat, nicht aus blinden Trieben. Er
      verwirklicht in seiner Tat das, was er als wahr und notwendig erkannt hat. Die sittlichen
      Ideale entspringen der moralischen Fantasie des Menschen. Sie sind seine eigenen Intuitionen,
      die Triebfedern, die sein Geist spannt. Er will sie, weil ihre Verwirklichung seine höchste
      Lust ist. Der Mensch ist nicht wegen der Sittlichkeit da, sondern die Sittlichkeit durch den
      Menschen. Der freie Mensch handelt sittlich, weil er eine sittliche Idee hat; er handelt
      nicht, damit Sittlichkeit entstehe. Leben in der Liebe zum Handeln und Lebenlassen im
      Verständnis des fremden Wollens ist die Grundmaxime des freien Menschen. Ein sittliches
      Missverstehen ist bei sittlich freien Menschen ausgeschlossen, da sie beide aus der gleichen
      Ideenwelt schöpfen, wenn auch mit unterschiedlichen Intuitionen. Sittlichkeit liegt in dem
      Streben nach einem als berechtigt erkannten Ziel, getragen von einem starken, ideell
      bestimmten Wollen."
  - term: Soziale Bewegung
    chunk_id: 31cabc5c-028c-572d-9e21-ef54764adf95
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Eine soziale Bewegung entsteht nicht aus äußeren Zwängen oder der Unterordnung unter ein
      Programm, sondern aus der freien Einsicht und dem individuellen Wollen einzelner Menschen. Sie
      unterscheidet sich grundlegend von bloßen Massenbewegungen oder Interessenverbänden, die nur
      durch persönliche Verwandtschaft oder das Streben nach Herrschaft zusammengehalten werden. Ihr
      Wesen liegt in der freien Initiative des Einzelnen, der aus eigener Erkenntnis heraus handelt
      und sich mit anderen auf der Grundlage gegenseitigen Verständnisses verbindet.


      Die Forderungen, die in einer sozialen Bewegung zum Ausdruck kommen, sind Ausdruck tieferer
      Lebenszusammenhänge. Sie drängen an die Oberfläche des gesellschaftlichen Daseins, weil die
      Grundlagen des sozialen Organismus gestört sind. Eine gesunde soziale Bewegung zielt nicht auf
      Macht, sondern auf die Verwirklichung von Einsichten aus Freiheit. Sie will Zustände
      herbeiführen, in denen die individuelle Begabung des Menschen nicht unterdrückt wird, sondern
      sich frei entfalten kann.


      Der Rahmen, in dem eine solche Bewegung fruchtbar wirken kann, ist die Dreigliederung des
      sozialen Organismus in ein selbständiges Rechtsleben, ein freies Geistesleben und ein
      assoziativ gegliedertes Wirtschaftsleben. Nur wenn diese drei Bereiche in ihrer
      Eigenständigkeit anerkannt werden, kann eine soziale Bewegung zu gesunden Lebensformen führen,
      die dem Menschen eine bewusste und freie Stellung im Gesellschaftsorganismus ermöglichen.
  - term: Soziale Frage
    chunk_id: 458c6be0-f222-5f24-8dad-a431e732250b
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die soziale Frage wird als eine Wirtschafts-, Rechts- und Geistesfrage verstanden. Sie
      entsteht aus der Wahrnehmung konkreter Nöte, in denen sich Menschen befinden. Um diese Nöte
      sachgemäß zu erfassen, muss man den Weg von der bloßen Wahrnehmung der Not zu den Gedanken
      verfolgen, in denen diese Nöte ihre eigentliche Quelle haben. Denn die gegenwärtigen sozialen
      Verhältnisse beruhen auf lebensunmöglichen Gedanken, die das Zusammenarbeiten der Menschen
      bestimmen. Eine gesunde Einsicht in die soziale Frage erfordert daher, zu den Gedanken
      fortzuschreiten, aus denen das Zusammenarbeiten einer Gemeinschaft hervorgeht.


      Aus dieser Einsicht ergibt sich die Notwendigkeit, den sozialen Organismus in drei
      eigenständige Bereiche zu gliedern: ein selbständiges Geistesleben, ein eigenständiges
      Rechtsleben und ein ebenso eigenständiges Wirtschaftsleben. Diese drei Gebiete dürfen nicht
      von einem Mittelpunkt aus verwaltet werden, sondern müssen nach ihren eigenen
      Gesetzmäßigkeiten wirken können. Die Einheit des Ganzen ist dadurch gesichert, dass jeder
      Mensch mit seinen Interessen allen drei Bereichen angehört.


      Zentral ist dabei die Frage, wie die Forderungen der sozialen Bewegung erfüllt werden können,
      ohne die individuelle Entfaltung des Einzelnen zu unterdrücken. Der Einzelne muss die
      Möglichkeit haben, seine Fähigkeiten ungehemmt durch Kapitalverwertung in den Dienst der
      Gemeinschaft zu stellen.
  - term: Sozialer Organismus
    chunk_id: 6fa0fa58-0e01-5a94-8f1f-bc271c33f3d5
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Der soziale Organismus ist ein Begriff, der die menschliche Gesellschaft als ein lebendiges
      Ganzes beschreibt, das aus drei eigenständigen, aber zusammenwirkenden Gliedern besteht: dem
      Geistesleben, dem Rechtsleben und dem Wirtschaftsleben. Diese drei Bereiche sollen nicht in
      einem zentralisierten Staat vermischt werden, sondern jeweils aus sich selbst heraus wirken.
      Das Wirtschaftsleben beruht auf Brüderlichkeit, das Rechtsleben auf Gleichheit und das
      Geistesleben auf Freiheit. Nur wenn jedes Glied seine eigene Gesetzmäßigkeit entfalten kann,
      entsteht ein gesunder Gesamtorganismus. Eine Vermischung, etwa wenn wirtschaftliche Macht das
      Recht bestimmt, führt zu sozialen Krankheiten. Die Dreigliederung ist keine abstrakte Utopie,
      sondern eine praktische Gestaltungsaufgabe, die aus der Wirklichkeit des Lebens gewonnen ist.
      Sie wendet sich an Menschen, die den Mut haben, von den Äußerlichkeiten zur inneren Wesenheit
      des Sozialen vorzudringen. Ein gefesseltes Geistesleben kann nur auf den Geist hinweisen,
      nicht in ihm leben; ein selbstständiges Rechtsleben wurzelt im rein menschlichen Verhältnis
      von Person zu Person. Die Einheit des sozialen Organismus entsteht nicht durch eine abstrakte
      Zentrale, sondern durch das lebendige Nebeneinander- und Zusammenwirken der drei Glieder, an
      denen jeder Mensch mit seinen gesamten Interessen teilhat."
  - term: Stoff
    chunk_id: fd23b9fd-b094-5352-bd0d-19449f6c8fcb
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Begriff „Stoff“ bezeichnet in dieser Sichtweise nicht eine tote, materielle Substanz, die
      unabhängig vom Menschen existiert. Vielmehr ist er eine Vorstellung, die ihren Inhalt nicht
      aus der Wahrnehmung, sondern aus dem Denken erhält. Was der Mensch mit seinen Sinnen
      tatsächlich aufnimmt, sind nicht Stoffe oder Kräfte, sondern Zustände und deren Übergänge
      ineinander – etwa die Veränderung von Wasser zu Dampf oder das Fallen eines Steins. Erst indem
      der denkende Geist Begriffe zu diesen Sinneseindrücken hinzufügt, entsteht die Vorstellung
      eines Stoffes, der sich mit einem anderen verbindet oder von einer Kraft bewegt wird.


      Der Stoff für sich ist stumm und ungeordnet. Er ist das, was der Mensch in der ersten,
      unmittelbaren Begegnung mit der Wirklichkeit als bloße Gegebenheit erfährt. Diese reine
      Erfahrung liefert eine unendliche Mannigfaltigkeit von Eindrücken, die erst durch das ordnende
      Denken in gesetzmäßige Zusammenhänge gebracht werden. Indem der Mensch denkend in die
      Wahrnehmungen eingreift, verwandelt er den rohen, ungeformten Stoff in eine durchschaute
      Wirklichkeit. Die Vorstellung des Stoffes ist also kein Abbild einer äußeren Sache, sondern
      ein Werkzeug des Geistes, um die Erscheinungen zu erklären und zu ordnen. Ohne diese denkende
      Durchdringung bliebe die Welt ein bloßes Nebeneinander sinnlicher Eindrücke ohne Bedeutung.
  - term: Substanz
    chunk_id: 3d26a98e-9e13-5355-b037-9b63455a4390
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Der Begriff der Substanz gehört für eine am Denken orientierte Erkenntnishaltung zu jenen
      vorgefassten Meinungen, die den Zugang zur Wirklichkeit eher versperren als eröffnen. Wer von
      Substanzen ausgeht – also von beharrenden Kernen, die hinter den Erscheinungen liegen sollen
      –, setzt bereits ein fertiges Prinzip voraus, bevor das Denken selbst in seiner Tätigkeit
      erfasst ist. Damit verfehlt man den einzig sicheren Ausgangspunkt: das Denken als das uns
      Nächste und Intimste. Denn das Denken ist keine Eigenschaft eines Subjekts und kein Abbild
      eines Objekts; es ist eine unmittelbar erlebte Tätigkeit, bei der wir wissen, wie sie zustande
      kommt. Wer stattdessen mit Substanzen, Atomen oder Materie als ersten Elementen beginnt,
      schwebt in der Luft – ähnlich wie eine Geologie, die von erdichteten Revolutionen spricht,
      statt von gegenwärtigen Vorgängen auf die Vergangenheit zu schließen. Der Substanzbegriff
      erweist sich damit als ein überwundener Standpunkt. Er gehört zu jenen Begriffen, die man
      nicht als Grundlage nehmen darf, sondern die selbst erst durch das Denken gebildet werden. Die
      Welt ist nicht aus starren Bestandteilen zusammengesetzt, die man nur noch abzubilden hätte.
      Vielmehr erschließt sie sich erst demjenigen, der das Denken als das absolut Letzte der
      Weltentwicklung zum Ausgangspunkt nimmt und von dort aus zu den Dingen vordringt."
  - term: Trieb
    chunk_id: a521572d-328c-57e4-8f95-e7acfc027a60
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Trieb ist eine innere Antriebskraft, die aus der leiblich-seelischen Organisation des
      Menschen stammt. Er drängt auf ein Ziel hin, ohne dass eine bewusste Entscheidung vorausgeht.
      Das Charakteristische des Trieblebens liegt in der Unmittelbarkeit, mit der eine Wahrnehmung
      das Wollen auslöst – vergleichbar mit einem Naturgesetz, das wirkt, bevor der Mensch es
      reflektiert. Der Mensch kann sein Begehren spüren, kennt aber nicht die Ursachen, die ihn
      bestimmen. In diesem Sinne gleicht er einem Automaten oder einem Tier, das blind seinen
      Instinkten folgt.


      Der Trieb ist an sich weder gut noch böse. Entscheidend ist, ob der Mensch ihn beherrscht oder
      ob er von ihm beherrscht wird. Wer nur seinen sinnlichen Trieben folgt, handelt selbstsüchtig.
      Freiheit beginnt dort, wo der Mensch den Trieb in bewusstes Wollen aufnimmt. Dies geschieht,
      indem ein Begriff oder eine Vorstellung auf die charakterologische Anlage einwirkt und so zum
      Motiv des Handelns wird. Der Mensch ist nur insoweit frei, als er sich gedankliche Triebfedern
      seines Handelns innerhalb des Bewusstseins schaffen kann.


      In der sozialen Frage führt ein Zusammenleben, das nur auf Trieben beruht, zur Unfreiheit und
      erfordert äußere Zwangsgesetze. Eine freie Gesellschaft dagegen entsteht, wenn souveräne
      Individuen aus eigenem Antrieb handeln und moralische Triebfedern aus sich selbst heraus
      entwickeln. Der Trieb ist damit der Ausgangspunkt, aber nicht das Ziel menschlichen Handelns.
  - term: Triebfeder
    chunk_id: 5dfa491a-57eb-5827-aea5-ff3ed1cb1467
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die Triebfeder ist der in der menschlichen Organisation unmittelbar bedingte Faktor des
      Wollens. Sie stellt die subjektive Anlage dar, die geeignet ist, bestimmte Vorstellungen und
      Begriffe zu Motiven zu machen. Während das Motiv der augenblickliche Bestimmungsgrund des
      Wollens ist, wirkt die Triebfeder als der bleibende Bestimmungsgrund des Individuums. Die
      Triebfedern der Sittlichkeit lassen sich finden, indem man nachsieht, aus welchen Elementen
      sich das individuelle Leben zusammensetzt. Dazu gehören etwa Gefühle wie Mitgefühl, Stolz,
      Ehrgefühl, Liebe oder Pflichtgefühl, die zu Triebfedern des Handelns werden können.


      Die höchste Stufe der Triebfeder ist das reine Denken, auch praktische Vernunft genannt. Sie
      entspringt einer reinen Intuition aus der ideellen Sphäre heraus. Auf dieser Stufe fallen
      Triebfeder und Motiv zusammen: Weder eine vorher bestimmte charakterologische Anlage noch ein
      äußeres sittliches Prinzip wirken auf das Handeln. Die Handlung ist allein durch ihren idealen
      Gehalt bestimmt. Freiheit beginnt dort, wo der Mensch sich gedankliche Triebfedern seines
      Handelns innerhalb des Bewusstseins schaffen kann. Der freie Geist ist imstande, moralische
      Triebfedern, sein eigenes Gutes und Böses, selbst zu schaffen.
  - term: Urbild
    chunk_id: 7781433e-cef3-5772-a9f2-289c0a3a4291
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Das Urbild ist ein zentraler Begriff, der in der Auseinandersetzung mit Goethes
      Naturanschauung entwickelt wird. Es bezeichnet eine geistige, anschauliche Größe, die nicht
      mit den Sinnen wahrgenommen werden kann. Das Urbild liegt einer Vielzahl von
      Einzelerscheinungen zugrunde und zeigt eine innere Gesetzmäßigkeit, die sich durch alle
      Modifikationen hindurchzieht. Es ist das, was in allen besonderen Formen als ein Konstantes,
      als eine Grundtatsache, wiederkehrt.


      Das Urbild wird nicht willkürlich konstruiert, sondern im Denken gefunden. Es ergibt sich,
      wenn man die in Betracht kommenden Faktoren ihrem Wesen gemäß im Denken in Zusammenhang
      bringt. Es ist weder ein bloßer Gedanke noch ein sinnliches Ding, sondern eine geistige
      Realität, eine höhere Erfahrung in der Erfahrung. Um es zu erfassen, muss der Geist selbst
      anschauend werden. Die Urteilskraft muss denkend anschauen und anschauend denken. Das Urbild
      ist also das Ergebnis einer solchen anschauenden Urteilskraft, die das Wesentliche aus den
      Erscheinungen herausliest und als gestaltendes Prinzip erkennt. Es ist die Grundtatsache, aus
      der sich die besonderen Formen entwickeln lassen.
  - term: Urpflanze
    chunk_id: 9f0310ad-e19c-5f46-95af-69e1939594ea
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Die Urpflanze ist ein Begriff, der auf Johann Wolfgang von Goethe zurückgeht und von ihm als
      ein gedankliches Bild entwickelt wurde, das die innere Gesetzmäßigkeit aller Pflanzenformen
      zusammenfasst. Sie ist kein reales, sinnlich auffindbares Exemplar, sondern ein schöpferisches
      Erkenntnisbild, das durch eine aktive Tätigkeit des Denkens gewonnen wird. Wer die Urpflanze
      in sich ausgebildet hat, findet sie in jeder einzelnen Pflanze wieder, denn sie ist das
      schaffende Element in der Pflanzenwelt. Die Mannigfaltigkeit der äußeren Erscheinungen
      entsteht dadurch, dass das der Idee nach Gleiche in verschiedenen Gestalten existieren kann.
      Das Grundorgan der Pflanze ist das Blatt mit dem Knoten; es nimmt in der Erscheinung
      verschiedene Gestalten an, etwa als Keimblatt, Laubblatt oder Kronenblatt. Die Urpflanze
      entspricht einer objektiven, ideellen Wirklichkeit: Dieselbe Gesetzmäßigkeit, die der Mensch
      in der Idee erfasst, wirkt auch in der Natur. Sie ist ein anschaulicher Begriff für die
      Einheit von Denken und Wahrnehmung, in dem die Idee lebendig in den Dingen wirkt. Goethe
      brachte mit diesem Begriff die starren Formen der Naturbetrachtung in Bewegung; die Urpflanze
      ist beweglich zu denken, nicht als abgeschlossener Begriff, sondern als das, was in seinen
      Formen lebt und sich durch die ganze Entwicklung des Pflanzenreichs hindurchzieht. Sie ist der
      wahre Urorganismus, dem alle einzelnen Pflanzenformen als Erscheinungen folgen."
  - term: Urphänomen
    chunk_id: 3c192e66-0275-5a06-905f-b5570c737fcf
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Das Urphänomen ist eine Grundtatsache, die sich in der Erfahrung als ein konstanter
      Bestandteil durch alle möglichen Modifikationen eines Vorgangs hindurchzieht. Es ergibt sich
      rein im Gedanken, wenn man die beteiligten Faktoren ihrem Wesen nach im Denken in Zusammenhang
      bringt. Man kann die notwendigen Bedingungen aber auch künstlich herstellen, etwa im
      wissenschaftlichen Versuch. Indem man ein Phänomen in verschiedenen Abwandlungen herstellt und
      dabei einmal diese, einmal jene Nebenumstände wirken lässt, findet man ein Konstantes, das in
      allen Kombinationen erhalten bleibt. Dieses Wesentliche ist die höhere Erfahrung in der
      Erfahrung, das Urphänomen. Es ist ein Vorgang, bei dem der Charakter des Geschehens
      unmittelbar und durchsichtig klar aus der Natur der in Betracht kommenden Faktoren folgt.
      Jeder zusammengesetzte Vorgang der Sinnenwelt erscheint als ein Gewebe solcher einfachen, vom
      Geist durchdrungenen Tatsachen und ist in sie auflösbar. Die Betrachtung dringt bis zum
      Urphänomen vor, steigt aber nicht zu höheren Erklärungsprinzipien auf. Es markiert eine
      Grenze: Man bleibt auf der empirischen Höhe stehen, von der aus man rückwärts die Erfahrung in
      allen Stufen überschauen und vorwärts in das Reich der Theorie einblicken, aber nicht
      eintreten kann. Das Urphänomen erklärt sich durch sich selbst."
  - term: Urteil
    chunk_id: bc0b62f2-e57f-5e1b-bf76-302a788680ad
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Das Urteil ist ein innerer, lebendiger Vorgang, der sich im Denken vollzieht. Es entsteht,
      wenn ein Begriff auf eine Wahrnehmung bezogen wird. Das Urteil hat dann zum Subjekt eine
      Wahrnehmung und zum Prädikat einen Begriff. Wenn du etwa ein bestimmtes Tier vor dir hast und
      sagst: „Dies ist ein Hund“, dann fügst du diese Wahrnehmung an einem bestimmten Ort in dein
      Gedankensystem ein. Ein solches Urteil nennst du ein Wahrnehmungsurteil. Es ist zu
      unterscheiden von jener Form des Urteils, die zwei Begriffe miteinander verbindet, ohne auf
      eine Wahrnehmung Rücksicht zu nehmen. Auf solchen Urteilen beruht die innere Einheitlichkeit
      deines Denkens.


      Das Urteil ist kein passives Abbilden der Welt. Es ist ein aktiver, schöpferischer Akt. Wenn
      das Denken eine Verbindung vollzieht, also ein Urteil fällt, dann ist es der Inhalt des
      Weltgrundes selbst, der verbunden wird. Du hast damit eine unmittelbare Einsicht in die
      sachlichen Gründe, warum sich ein Urteil vollzieht. Das Urteil bestimmt nicht über etwas
      Fremdes, sondern über seinen eigenen Inhalt. Es beansprucht Gültigkeit über das bloß
      Subjektive hinaus. Wenn du einem beobachteten Gegenstand gegenüber sagst: „Dies ist eine
      Rose“, dann sagst du über dich selbst nicht das geringste aus. Anders ist es, wenn du ein
      Gefühl über die Rose äußerst. Dann charakterisierst du dein eigenes Verhältnis zu ihr. Das
      Urteil hingegen richtet sich auf die Sache selbst.
  - term: Urteilskraft
    chunk_id: 74f190c9-b715-5274-b46a-c25c675d8fbc
    language: de
    tags:
      - concept
      - assistant-generated
    text: Die Urteilskraft ist die Fähigkeit, die unendliche Mannigfaltigkeit von Gestalten, Kräften,
      Farben und Tönen, die uns in der Wahrnehmung entgegentritt, mit dem ordnenden Verstand zu
      durchdringen. Sie ist kein mechanisches Abrufen von allgemeingültigen Gesetzen, die man in
      festen Begriffen ausspricht und dann auf den Einzelfall anwendet. Ein solches Vorgehen mag für
      die Naturerkenntnis taugen, nicht aber für das Wesen der menschlichen Seele. Die Urteilskraft
      ist vielmehr ein schöpferischer Akt. Sie verlangt, das Gesetzmäßige mit künstlerischer
      Gestaltungskraft in der Erkenntnis zu durchdringen. Ohne sie bleibt die bloße Wahrnehmung
      stumm und das Denken leer. Denn was sich der reinen Erfahrung darbietet, muss erst durch das
      Denken in seinen gegenseitigen Abhängigkeiten aufgeklärt werden. Die Urteilskraft wächst nicht
      durch das Erlernen fester Regeln, sondern durch lebendige Begegnung mit der Wirklichkeit. Sie
      erfordert, dass man sich mit seinem Denken den Anforderungen der Wirklichkeit fügt, anstatt
      die Wirklichkeit nach den bequemen Forderungen des eigenen Denkens zu gestalten. In diesem
      Sinne ist sie eine Fähigkeit, die durch Übung und Hingabe an die Sache selbst erstarkt und den
      Menschen befähigt, die Welt nicht nur zu erkennen, sondern in ihr schöpferisch tätig zu sein.
  - term: Vernunft
    chunk_id: 1cd2603c-1000-54fc-b875-e33248c5ed88
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die Vernunft ist kein bloßes Vermögen, das Gegebenes ordnet oder Schlüsse zieht. Sie
      unterscheidet sich grundlegend vom Verstand. Während der Verstand die Wirklichkeit in
      einzelne, fest umrissene Begriffe zerlegt und diese getrennt nebeneinanderstellt, ist es die
      Vernunft, die diese Trennung wieder aufhebt. Sie lässt die vom Verstand geschaffenen Begriffe
      ineinander übergehen und zeigt, dass sie in Wahrheit eine innerliche Einheit bilden. Die
      Trennung durch den Verstand ist ein notwendiger Durchgangspunkt des Erkennens, aber nicht
      dessen Abschluss. Wer bei ihr stehenbleibt, entfernt sich von der Wirklichkeit, die ihrem
      Wesen nach eine Einheit ist.


      Die Vernunft ist das Vermögen, diese verborgene Harmonie ans Tageslicht zu ziehen. Sie setzt
      dabei keine bestimmte Einheit voraus, sondern bringt die höhere Einheit der Verstandesbegriffe
      zum Vorschein, die der Verstand in seinen Gebilden zwar trägt, aber selbst nicht sehen kann.
      Aus dem lebendigen Fluss der Begriffe entstehen so Ideen, die nur für die Vernunft da sind. In
      diesem Sinne ist die Vernunft auch die Grundlage des sittlichen Handelns. Handelt der Mensch
      aus reinem Denken, aus einer Intuition, die keinen äußeren Wahrnehmungsbezug mehr hat, so ist
      die Triebfeder seines Handelns die praktische Vernunft. Sie ist der unmittelbar aus der
      eigenen Einsicht fließende Antrieb zum Handeln und damit der Ort, an dem sich Freiheit im
      Erkennen und Wollen verwirklicht.
  - term: Verstand
    chunk_id: 8b4464dc-47b3-5ab6-a0b0-0a3f9649f731
    language: de
    tags:
      - concept
      - assistant-generated
    text: Der Verstand ist jene Fähigkeit des Menschen, die zunächst die unendliche Mannigfaltigkeit der
      sinnlichen Wahrnehmungen ordnend durchdringt. Er sucht die gegenseitigen Abhängigkeiten der
      Einzelheiten aufzuklären und bringt so festbestimmte, klar umrissene Begriffe hervor. Seine
      eigentliche Leistung besteht darin, zu trennen und die Begriffe in dieser Trennung
      festzuhalten. So unterscheidet er Ursache und Wirkung, Mechanismus und Organismus, Freiheit
      und Notwendigkeit, Idee und Wirklichkeit, Geist und Natur. Diese Unterscheidungen sind
      notwendig, denn ohne sie bliebe die Welt ein verschwommenes, dunkles Chaos. Der Verstand ist
      daher eine notwendige Vorstufe jeder höheren Wissenschaftlichkeit. Doch er selbst ist nicht in
      der Lage, über diese Trennung hinauszukommen. Er hält die getrennten Glieder fest. Die
      Trennung ist etwas künstlich Herbeigeführtes, ein notwendiger Durchgangspunkt für das
      Erkennen, nicht dessen Abschluss. Wer die Wirklichkeit bloß verstandesmäßig erfasst, entfernt
      sich von ihr, weil er an ihre Stelle, die in Wahrheit eine Einheit ist, eine künstliche
      Vielheit setzt. Aus diesem Grund gerät eine verstandesmäßig betriebene Wissenschaft in
      Zwiespalt mit dem menschlichen Herzen, das die innere Harmonie des Weltganzen mit dem Gefühl
      zu durchdringen vermag. Das Hinauskommen über die Trennung ist Sache der Vernunft, die die vom
      Verstand geschaffenen Begriffe ineinander übergehen lässt und ihre innerliche Einheit zeigt.
  - term: Vertrauen
    chunk_id: b5b6829e-364b-5664-85db-7e5df99d3919
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Vertrauen ist im sozialen Leben eine Form der Kreditgewährung. Es entsteht, wenn einer seine
      Kräfte für die Leistungen eines anderen zur Verfügung stellt, und zwar auf der Grundlage der
      Aussicht, dass dieser andere in Bedingungen lebt, die Vertrauen einflößen können. In einer
      bloß kapitalistisch und lohnmäßig organisierten Gemeinschaft kann der einzelne seine
      Fähigkeiten nur in dem Maße geltend machen, als sie im Kapitalerwerb ihren Gegenwert finden.
      Die Kompliziertheit des modernen Lebens hat dazu geführt, dass ein Übergang stattfindet von
      der Geldwirtschaft zu einem Arbeiten auf der Grundlage von Kreditgewährung – und damit von
      Vertrauen.


      Vertrauen ist zugleich die Grundlage für ein wirklich freies Vertragsverhältnis zwischen
      Arbeitleiter und Arbeitleister. Ein solches Verhältnis bezieht sich nicht auf den Tausch von
      Ware oder Geld für Arbeitskraft, sondern auf die Festsetzung des Anteils, den jede Person an
      der gemeinsam zustande gebrachten Ware hat. Dies setzt voraus, dass das Erträgnis einer
      Betätigung aus der freien Initiative des Tätigen einerseits und aus dem freien Verständnis
      anderer Menschen andererseits hervorgeht, die nach der Leistung verlangen.


      Im tiefsten Sinne lebt der freie Mensch in dem Vertrauen darauf, dass der andere Freie mit ihm
      einer geistigen Welt angehört und sich in seinen Intentionen mit ihm begegnen wird.
  - term: Vollkommenheit
    chunk_id: 355fc458-5212-5ce0-bc55-23832d7e44da
    language: de
    tags:
      - concept
      - assistant-generated
    text: Vollkommenheit ist in dieser Anschauung kein feststehender Zustand, sondern ein Prozess, der
      sich im Werden und in der Entwicklung zeigt. Sie ist keine ideale Form, die es zu erreichen
      gilt, sondern eine Bewegung, die im freien, bewussten Handeln aus innerer Wahrhaftigkeit ihren
      Ausdruck findet. Der Mensch trägt die Möglichkeit in sich, sich durch eigene Kraft umzubilden,
      so wie im Pflanzenkeim die Anlage zur ganzen Pflanze liegt. Während die Natur den Menschen als
      Naturwesen hervorbringt und die Gesellschaft ihn zu einem gesetzmäßig handelnden Wesen formt,
      kann der Mensch den letzten Schliff nur selbst aus sich machen. Vollkommenheit offenbart sich
      dort, wo der Mensch auf den Grund seiner Seele sieht und aus diesem innersten Erlebnis heraus
      handelt. Sie zeigt sich im Wirken zu Ende gedachter Ideen, die nicht aus persönlichen Wünschen
      oder Interessen entspringen, sondern aus einer sachlichen Erkenntnis der Wirklichkeit. Ein
      Beispiel dafür ist die Dreigliederung des sozialen Organismus, die als ein solcher zu Ende
      gedachter Gedanke verstanden wird. In diesem Sinne ist Vollkommenheit keine Eigenschaft, die
      man besitzt, sondern eine Richtung, die man einschlägt, indem der Mensch sich selbst aus den
      Fesseln der Natur und der gesellschaftlichen Konvention befreit und zum freien Geist wird. Sie
      vollendet sich nicht in einem Abschluss, sondern in der fortwährenden Selbstbestimmung des
      Menschen.
  - term: Vorstellung
    chunk_id: 4f4f34d8-2c10-57f6-8475-5a2051d5b5eb
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die Vorstellung ist das innere Bild, das nach dem Abklingen einer Sinneswahrnehmung im
      Bewusstsein zurückbleibt. Wenn du ein äußeres Ding, etwa eine Rose oder einen Stein,
      betrachtest und es dir später innerlich vergegenwärtigst, hast du eine Vorstellung. Sie ist
      nicht mit der Wahrnehmung selbst identisch, sondern deren subjektive Repräsentation. Die
      Wahrnehmung ist der objektiv gegebene Teil der Wirklichkeit, der Begriff der subjektiv durch
      Intuition gegebene. Die Vorstellung entsteht, wenn ein Begriff, der einmal mit einer
      bestimmten Wahrnehmung verknüpft war, den Bezug auf diese Wahrnehmung behält. Sie ist also
      eine auf eine bestimmte Wahrnehmung bezogene Intuition.


      Die Vorstellung wird am eigenen Selbst wahrgenommen, so wie Farbe oder Ton an anderen
      Gegenständen wahrgenommen werden. Ohne die Verbindung von Wahrnehmung und Begriff durch das
      Denken bliebe die Welt ein zusammenhangloses Chaos. Erst die denkende Beobachtung, die den
      Zusammenhang beider herstellt, ergibt volle Wirklichkeit. Der naive Standpunkt, der die Dinge
      für unmittelbar wirklich hält, wird durch die Selbstbesinnung verlassen. Die Vorstellung ist
      kein bloßes Abbild einer Außenwelt, sondern das Ergebnis der inneren Tätigkeit, die
      Wahrnehmung und Begriff miteinander verbindet.
  - term: Vorstellungsart
    chunk_id: 1abea71e-045f-5e8d-b8f7-9f29d831a233
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Die Art und Weise, wie der Mensch die Wirklichkeit erfasst, ist keine einheitliche Tätigkeit.
      Sie zerfällt in zwei grundlegend verschiedene Weisen des Vorstellens. Die eine ist an die
      sinnliche Wahrnehmung gebunden. Wenn du eine Rose oder einen Stein betrachtest, nimmst du
      Farbe, Form und Härte wahr. Dieses Vorstellungsbild bleibt aber abhängig von deinem Standpunkt
      und deinen Sinnen. Es ist das, was dir die Dinge freiwillig von sich preisgeben. Die andere
      Art des Vorstellens ist das Denken selbst. Hier musst du tätig werden. Du hältst nicht einfach
      ein fertiges Bild fest, sondern setzt deine Gedanken in Bewegung. Ein Dreieck etwa lässt sich
      nicht nur als ruhende Figur vorstellen, sondern als ein Gebilde, dessen Seiten sich
      fortwährend verändern. Diese bewegliche, versatil gehaltene Vorstellung erschließt den
      allgemeinen Gedanken, der hinter der einzelnen Erscheinung liegt. Die sinnliche
      Vorstellungsart bleibt beim gegebenen Bild stehen. Die gedankliche Vorstellungsart dagegen
      erfordert, dass du dich von den festen Sinnesbildern löst und innere Zusammenhänge selbsttätig
      herstellst. Erst im Zusammenklang beider Arten entsteht volle Wirklichkeit: Die Wahrnehmung
      liefert den objektiven Teil, der Begriff den subjektiv durch Intuition gegebenen Teil. Die
      denkende Beobachtung, die beide verbindet, ist die Grundlage jeder Erkenntnis, die nicht im
      bloßen Chaos der Eindrücke oder in abstrakten Begriffen stecken bleibt."
  - term: Vorstellungswelt
    chunk_id: c55b98e0-003b-5d43-9c23-ffbb56e9593d
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Die Vorstellungswelt entsteht aus der aktiven Verbindung von Wahrnehmung und Denken. Die
      bloße Wahrnehmung für sich genommen ist ein zusammenhangloses Chaos; erst durch das Denken
      wird sie geordnet und mit Begriffen verknüpft. Die denkende Beobachtung betrachtet nicht
      einseitig den Begriff oder die Wahrnehmung, sondern den Zusammenhang beider – und erst dieser
      Zusammenhang ergibt volle Wirklichkeit. Die Vorstellungswelt ist daher nicht willkürlich,
      sondern das Ergebnis einer geistigen Tätigkeit, die das Wahrgenommene mit dem Begriff
      durchdringt. Sie ist an die Beobachtung gebunden und durch das Denken kontrollierbar: Der
      Mensch ist bestrebt, die unendliche Mannigfaltigkeit von Gestalten, Kräften, Farben und Tönen
      mit dem ordnenden Verstand zu durchdringen. Die Vorstellung selbst ist die subjektive
      Repräsentation der Wirklichkeit, die dem individuellen Ich zugehört. Jeder Mensch hat einen
      eigenen Standort, von dem aus er die Welt betrachtet, und an seine Wahrnehmungen schließen
      sich seine Begriffe auf seine besondere Art an. Diese besondere Bestimmtheit ist ein Ergebnis
      seines Lebensplatzes und seiner individuellen Organisation. Die Vorstellungswelt ist damit
      weder ein bloßes Abbild einer äußeren Welt noch eine reine Erfindung des Subjekts, sondern die
      konkrete, durch Denken geordnete Begegnung des Menschen mit der Wirklichkeit. In dieser
      Begegnung liegt die Grundlage für ein bewusstes, tätiges Leben in der Welt."
  - term: Wahrheit
    chunk_id: 2f4e9816-ab38-5d4e-859d-3cbaf23ce507
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Wahrheit entsteht in der lebendigen Begegnung zwischen dem denkenden Menschen und der Welt.
      Sie ist kein fertiges Ergebnis, das man wie einen Gegenstand besitzen kann, sondern ein
      Prozess, der sich in der inneren Seelentätigkeit vollzieht. Die Wahrnehmung liefert die
      Tatsachen, das Denken liefert die begriffliche Ordnung. Erst der Zusammenhang beider ergibt
      volle Wirklichkeit. Betrachtet man die bloße Wahrnehmung für sich, hat man ein
      zusammenhangloses Chaos; betrachtet man die Gesetzmäßigkeit der Wahrnehmungen für sich, hat
      man nur abstrakte Begriffe. Nicht der abstrakte Begriff enthält die Wirklichkeit, wohl aber
      die denkende Beobachtung, die den Zusammenhang beider erfasst.


      Wahrheit ist die Übereinstimmung des Denkens mit sich selbst, erfüllt vom Inhalt der
      Erfahrung. Im Denken allein ist das Element gegeben, welches alle Dinge in ihren Verhältnissen
      zueinander bestimmt. Die Wahrnehmung ist der Teil der Wirklichkeit, der objektiv, der Begriff
      derjenige, der subjektiv durch Intuition gegeben wird. Unsere geistige Organisation reißt die
      Wirklichkeit in diese beiden Faktoren auseinander. Nicht die erste Gestalt, in der die
      Wirklichkeit an das Ich herantritt, ist deren wahre, sondern die letzte, die das Ich aus
      derselben macht.


      Wer die Wahrheit sucht, muss sich auf den Weg begeben, um zu ihren Quellen zu gelangen. Denn
      Wahrheit erschließt sich nicht durch das bloße Aufnehmen von außen, sondern durch die
      lebendige, denkende Durchdringung dessen, was uns in der Wahrnehmung entgegentritt.
  - term: Wahrnehmung
    chunk_id: 9cfb0610-3397-5f65-b8a6-82fbb71678ae
    language: de
    tags:
      - concept
      - assistant-generated
    text: Wahrnehmung ist derjenige Vorgang, durch den uns ein Gegenstand oder Geschehen als
      unmittelbare Gegebenheit entgegentritt. Sie liefert noch keine Ordnung, keinen Zusammenhang
      und keine Erklärung, sondern zunächst ein bloßes, zusammenhangloses Nebeneinander von
      Eindrücken – eine unendliche Mannigfaltigkeit von Gestalten, Kräften, Farben, Tönen und
      anderem. Die Wahrnehmung ist damit nicht das Ganze der Wirklichkeit, sondern nur eine Seite
      von ihr. Die andere Seite ist der Begriff, der durch das Denken gewonnen wird. Wahrnehmung und
      Denken sind zwei gleich ursprüngliche Tätigkeiten; keine ist der anderen übergeordnet. Die
      Wahrnehmung liefert den Stoff, das Denken die Form und den Sinn. Erst ihr Zusammenwirken
      ergibt Erfahrung und Erkenntnis. Der Erkenntnisakt ist die Synthese von Wahrnehmung und
      Begriff. Betrachtet man die bloße Wahrnehmung für sich, hat man keine Wirklichkeit, sondern
      ein zusammenhangloses Chaos. Betrachtet man die Gesetzmäßigkeit der Wahrnehmungen für sich,
      hat man es nur mit abstrakten Begriffen zu tun. Volle Wirklichkeit entsteht erst durch die
      denkende Beobachtung, die den Zusammenhang beider herstellt. Dabei ist die Wahrnehmung nichts
      Fertiges, Abgeschlossenes, sondern die eine Seite der totalen Wirklichkeit. Der Mensch kann
      außer dem Sinnlichen auch Geistiges wahrnehmen, wenn er die entsprechenden Fähigkeiten
      entwickelt. Die stumme Wahrnehmung spricht erst dann eine verständliche Sprache, wenn der
      zugehörige Begriff aus dem Dunkel des Bewusstseins emporsteigt und sich mit ihr verbindet.
  - term: Wahrnehmungssubjekt
    chunk_id: c935723e-9c5d-5517-9cc7-4d7bfa189ed1
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Das Wahrnehmungssubjekt ist der Mensch, sofern er einer Wahrnehmung gegenübersteht, ohne sie
      bereits gedanklich durchdrungen zu haben. Es ist jene Seite des Erkennens, die rein aufnimmt,
      was sich den Sinnen darbietet. Dieses Aufnehmen ist eine Tätigkeit der Beobachtung, ein
      Kenntnisnehmen von unmittelbaren Empfindungsobjekten. Dabei ist das Wahrnehmungssubjekt nicht
      mit dem empirischen Ich zu verwechseln, das sich selbst wiederum als ein Bleibendes gegenüber
      wechselnden Wahrnehmungsbildern erfahren kann. Die bloße Wahrnehmung für sich genommen ergibt
      noch keine Wirklichkeit, sondern ein zusammenhangloses Chaos. Erst wenn das Denken tätig wird
      und einen Begriff an die Wahrnehmung heranträgt, entsteht eine volle Vorstellung. Das
      Wahrnehmungssubjekt allein erfasst also noch keine Wirklichkeit; diese entsteht erst im
      Zusammenhang von Wahrnehmung und Begriff. Der Schnitt zwischen Wahrnehmen und Denken ist kein
      objektiver, sondern ein solcher, der erst im betrachtenden Menschen auftritt. Unsere geistige
      Organisation reißt die Wirklichkeit in diese beiden Faktoren auseinander. Die Wahrnehmung ist
      der objektiv gegebene Teil, der Begriff der subjektiv durch Intuition hinzugefügte. Freiheit
      beginnt dort, wo das denkende Ich die Wahrnehmung aus eigenem Antrieb begrifflich formt und so
      die volle Wirklichkeit erst hervorbringt. Das Wahrnehmungssubjekt ist daher nicht der ganze
      Mensch, sondern nur die eine Seite seines Erkennens: die des Aufnehmens, die der Ergänzung
      durch das Denken bedarf."
  - term: Wahrnehmungswelt
    chunk_id: f4e7dc4f-d44b-5096-b536-6227c832b540
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Die Wahrnehmungswelt ist derjenige Teil der Wirklichkeit, der dem Menschen durch seine Sinne
      objektiv gegeben wird. Sie tritt dem Menschen als eine Vielheit von Einzelheiten gegenüber,
      als eine Summe von Wahrnehmungen, die er vorfindet, ohne sie durch bewusste Tätigkeit
      hervorgebracht zu haben. Betrachtet man die bloße Wahrnehmung für sich, so hat man keine volle
      Wirklichkeit, sondern ein zusammenhangloses Chaos. Die Wahrnehmungswelt ist also eine
      unvollständige Gegebenheit, die erst durch das Denken zu einem geordneten Ganzen verbunden
      wird. Die geistige Organisation des Menschen reißt die einheitliche Wirklichkeit in zwei
      Faktoren auseinander: in die Wahrnehmung, die objektiv gegeben wird, und den Begriff, der
      subjektiv durch Intuition hervorgebracht wird. Erst der Zusammenhang beider – die denkende
      Beobachtung, die weder einseitig den Begriff noch die Wahrnehmung für sich betrachtet – ergibt
      volle Wirklichkeit. In der Wahrnehmungswelt begegnet der Mensch dem Fremden, noch
      Unbegriffenen, das er durch sein Denken mit Begriffen verbinden muss, um es in das Ganze der
      Wirklichkeit einzugliedern. Die Wahrnehmungswelt ist daher nicht die Wirklichkeit selbst,
      sondern eine Seite derselben, die der Ergänzung durch das Denken bedarf."
  - term: Weisheit
    chunk_id: 52beec22-6628-5066-9f25-53cbf8818814
    language: de
    tags:
      - concept
      - assistant-generated
    text: Weisheit ist kein bloßes Wissen, das man ansammelt und als Besitz mit sich trägt. Sie zeigt
      sich erst dort, wo Erkenntnis so lebendig wird, dass sie unmittelbar in das Handeln übergeht.
      Ein gutgemeinter Gedanke, der nicht zur Tat wird, schafft noch kein Brot – das ist der Kern
      einer verbreiteten Weisheit, die auf die Notwendigkeit praktischer Arbeit verweist. Ihr steht
      eine andere Weisheit gegenüber, die aus der lebendigen Durchdringung der Wirklichkeit mit
      Ideen erwächst. Diese Weisheit kann nicht in allgemeingültigen Gesetzen eingefangen werden,
      wie man sie aus der Naturerkenntnis gewohnt ist. Denn das Wesen der menschlichen Seele
      erschließt sich nur, wenn man das Gesetzmäßige mit künstlerischer Gestaltungskraft in der
      Erkenntnis durchdringt. Es geht darum, die Ideen so beweglich und lebendig zu machen, dass sie
      in der konkreten Begegnung mit dem einzelnen Menschen oder der einzelnen Situation zur
      Anschauung kommen. Eine solche Weisheit ist nicht abstrakt, sondern wird zur Grundlage einer
      wahren Erziehungs- und Lebenskunst. Sie befähigt den Menschen, nicht nur zu erkennen, sondern
      aus dieser Erkenntnis heraus schöpferisch an der Weltentwicklung mitzuwirken. Wahre Weisheit
      ist daher immer auch ein Akt der Selbstbesinnung, der das eigene Innere so erstarken lässt,
      dass es den Sinn des menschlichen Daseins in der Welt zu erfassen vermag.
  - term: Weltanschauung
    chunk_id: 8b17ed39-6de1-5ea7-ac23-777a13c8ce39
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Eine Weltanschauung ist für den hier dargestellten Denker kein starres Gedankengebäude, das
      man einmal fertig aufstellt und dann unverändert beibehält. Sie ist vielmehr eine lebendige
      Anschauung, die aus eigener Erkenntnistätigkeit gewonnen wird. Sie entsteht durch ein aktives,
      denkendes Erfassen der Wirklichkeit, bei dem die Seele den Gedanken als ihr eigenes Erzeugnis
      zu fühlen lernt. Eine befriedigende Weltanschauung kann nur diejenige sein, die auf eine Welt
      hinweist, aus der Antwort auf die wesentlichen Fragen des Daseins kommt.


      Der Mensch gelangt zu einer freien Weltanschauung, wenn er seine Gedanken aus eigenem inneren
      Impuls bildet. Die Erkenntnis, dass der Mensch in seinem Tun auf sich selbst gestellt ist,
      geht aus dem innersten Erlebnis, aus der Anschauung der eigenen Wesenheit hervor. Eine solche
      Weltanschauung umfasst die Einheit von Erkennen und Handeln; sie ist eine Haltung, die das
      ganze Leben durchdringt. Was jemand sagt, mag sich oft widersprechen; was er lebt, gehört
      immer einem sich selber tragenden Ganzen an. Die Weltanschauung wird so zur Grundlage für
      bewusstes, freies Handeln in der Gemeinschaft. Kunst, Wissenschaft und Weltanschauung bedürfen
      einer selbständigen Stellung in der menschlichen Gesellschaft, denn im geistigen Leben hängt
      alles zusammen, und die Freiheit des einen kann nicht ohne die Freiheit des anderen gedeihen.
  - term: Weltgeist
    chunk_id: 76d67ffe-3d89-528f-adb8-7a4d5bd028e9
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Der Mensch erlebt in sich das, was wir den Gedanken nennen können. In diesem Gedanken kann er
      sich als unmittelbar Tätiges erfühlen, als etwas, das seine eigene Tätigkeit überschauen kann.
      Dieses Denken ist kein bloßes Abbild einer äußeren Welt, sondern eine selbsttätige Aktivität,
      die der Mensch aus seinem Inneren hervorbringt. Er entnimmt alle Bestimmungen des Gedankens
      aus der Gedankenwelt; das Sinnesobjekt veranlasst ihn nur, einen bestimmten Gedankeninhalt aus
      der Einheit aller möglichen Gedanken herauszutreiben, liefert ihm aber nicht die Bausteine
      dazu. Die Tätigkeit des menschlichen Geistes und die Erscheinung einer in sich vollendeten
      Gesetzmäßigkeit sind dabei ein und dieselbe Sache, von zwei Seiten betrachtet: der
      Gedankengehalt der Welt. Indem der Mensch denkend die Wirklichkeit erfasst, holt er diesen
      Gedankengehalt aus sich selbst hervor und erkennt ihn im Wahrgenommenen wieder. In diesem
      Prozess wirkt in ihm nicht bloß ein individuelles Vermögen, sondern etwas, das über das
      Einzelwesen hinausreicht: die schöpferische Kraft, die alles hervorbringt und die im Menschen
      als Idee zur Erscheinung kommt. Der Mensch selbst wird zum Schöpfer, indem er aus der Idee
      heraus ein Tatsächliches hervorbringt und sich so sein sittliches Ziel selbst gibt."
  - term: Welträtsel
    chunk_id: d382771b-781b-5680-aca3-c14de4c0ead8
    language: de
    tags:
      - concept
      - assistant-generated
    text: Der Begriff „Welträtsel“ bezeichnet bei Steiner nicht unauflösbare Mysterien, sondern jene
      Fragen, die der Mensch aus seiner Erfahrung und seinem Denken heraus an die Welt richtet. Es
      geht nicht um die Weltschöpfung, sondern um das Begreifen der Welt. Steiner wendet sich
      entschieden gegen die Auffassung, der Mensch stoße mit seinem Erkennen an unüberwindliche
      Grenzen. Er stellt dem die innerlich erlebte Tatsache entgegen, dass der Mensch mit seinem
      Denken, wenn er es genügend vertieft, in der Weltwirklichkeit als einer geistigen lebt. Die
      Wahrnehmung ist für ihn nichts Fertiges, sondern nur die eine Seite der Wirklichkeit. Die
      andere Seite ist der Begriff. Der Erkenntnisakt selbst ist die Synthese von Wahrnehmung und
      Begriff. Erst diese Verbindung macht das ganze Ding aus. Das Denken ist der Akt, durch den
      Erkenntnis vermittelt wird; es bringt im Moment des Erkennens einen eigenen Inhalt hervor. Der
      Mensch ist an der Entstehung des Denkens unmittelbar beteiligt, während er die Dinge der
      Außenwelt einfach vorfindet. Darin liegt der Ursprung des Rätselhaften. Die Lösung der
      Welträtsel besteht nicht in einem passiven Hinnehmen, sondern in der aktiven, denkenden
      Durchdringung der gegebenen Welt. Der Streit der Weltanschauungen entsteht nach Steiner gerade
      daraus, dass man ein Wissen über ein Objektives erwerben will, ohne zuvor die Natur des
      Wissens selbst zu klären.
  - term: Wesenheit
    chunk_id: ab40c527-bd38-523a-8fe4-d8a67cb4ebc5
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Begriff „Wesenheit“ bezeichnet eine konkrete, in sich geschlossene, wirkende Einheit, die
      aus eigenem inneren Impuls handelt. Eine solche Wesenheit ist nicht statisch, sondern befindet
      sich in einem beständigen Werden und Wirken. Sie kann nicht allein aus äußeren Umständen oder
      aus den Gesetzen einer Gattung erklärt werden, sondern nur aus sich selbst heraus. Der Mensch
      etwa entwickelt Eigenschaften und Funktionen, deren Bestimmungsgrund nur in ihm selbst gesucht
      werden kann. Das Gattungsmäßige dient ihm dabei lediglich als Mittel, um seine besondere
      Wesenheit in ihm auszudrücken und ihr die seinem eigenen Wesen gemäße Form zu geben.


      Eine Wesenheit ist kein bloß erdachtes oder erträumtes Ideal, sondern ein reales Element, das
      sich in der eigenen inneren Tätigkeit an die Oberfläche arbeitet. Sie zeigt sich in der
      Fähigkeit, aus sich selbst heraus tätig zu sein und die eigene Persönlichkeit als ein Zentrum
      zu erleben, von dem Denken, Fühlen und Wollen ausgehen. Frei handelt, wer aus dieser eigenen
      Wesenheit heraus handelt, losgelöst von bloß gattungsmäßigen Bestimmungen. Die Erforschung des
      eigenen Wesens führt an einen Punkt, wo man sich sagen kann: Hier bin ich nicht mehr bloß
      „Ich“, hier liegt etwas, was mehr als „Ich“ ist. In diesem Sinne ist die Wesenheit der innere,
      selbsttätige Kern, der das Individuum in seiner Besonderheit trägt und der nur durch sich
      selbst erklärt werden kann.
  - term: Wirtschaftsleben
    chunk_id: 9a1c592b-dc51-57c3-890b-85d6262df16e
    language: de
    tags:
      - concept
      - assistant-generated
    text: Das Wirtschaftsleben ist in der Dreigliederung des sozialen Organismus ein eigenständiger
      Funktionsbereich, der auf seinem eigenen Boden steht und vom Staat getrennt ist. Es umfasst
      die Befriedigung menschlicher Bedürfnisse durch Produktion und Konsumtion. Anders als im
      marxistischen Sozialismus, der den Staat zur wirtschaftlichen Organisation macht, wird das
      Wirtschaftsleben vom Staat losgelöst. Es soll nicht durch eine zentralistische Verwaltung oder
      staatliche Bevormundung gesteuert werden, sondern aus den Anforderungen des Wirtschaftslebens
      selbst heraus gestaltet sein. Die Grundlage dafür ist die freie Initiative wirtschaftender
      Menschen, die sich in Assoziationen zusammenschließen. Diese Assoziationen entstehen aus den
      Produktionserfordernissen und Konsumtionsinteressen und organisieren den Wirtschaftskreislauf
      durch lebendigen Verkehr zwischen Produktion und Konsumtion. In diesen Assoziationen werden
      Entscheidungen über Kreditgewährung und Preisbildung getroffen, wobei nicht einseitige
      Gewinninteressen, sondern sachgemäße Bedürfnisse der Gemeinschaft leitend sind. Das
      Wirtschaftsleben kann sich so unabhängig von politischen Grenzen entfalten und strebt einem
      freien Wirtschaftsverkehr zu. Die Trennung der drei Glieder verhindert, dass wirtschaftliche
      Interessen in das Rechts- oder Geistesleben übergreifen. So wird das Wirtschaftsleben zu einem
      selbständigen, aus seinen eigenen Kräften heraus gestalteten Bereich des sozialen Organismus.
  - term: Wissenschaft
    chunk_id: 682b7161-5df4-5ac7-8f9d-8c8d48985512
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Wissenschaft ist für Rudolf Steiner kein bloßes Sammeln von Tatsachen, sondern eine lebendige
      Tätigkeit, die Denken und Wahrnehmen verbindet. Die Wirklichkeit erschließt sich nicht durch
      das bloße Registrieren von Sinneseindrücken, sondern durch das denkende Erfassen der
      Zusammenhänge. Steiner spricht von „denkender Beobachtung“ als der Einheit von Wahrnehmung und
      Begriff. Die Wahrnehmung allein ist ein zusammenhangloses Chaos; der abstrakte Begriff für
      sich genommen bleibt leer. Erst im Zusammenhang beider, in der denkenden Beobachtung, entsteht
      volle Wirklichkeit.


      Wissenschaft ist daher ein Weg, die Welt in ihrem inneren Zusammenhang zu begreifen. Sie
      bleibt an die Erfahrung gebunden, aber sie erschöpft sich nicht in ihr. Das Denken ist nicht
      nur ein Werkzeug, um äußere Tatsachen zu ordnen; es ist selbst der Ort, an dem sich die
      Gesetzmäßigkeit der Dinge zeigt. Denn nur im Denken erfahren wir eine wirkliche, ideelle
      Bestimmtheit. Von hier aus können wir das Wesen auch der sinnlichen Erscheinungen verstehen.


      Das Ziel der Wissenschaft ist Einsicht in das Wesen der Dinge, nicht Herrschaft über die
      Natur. Sie ist ein Erkenntnisweg, der den Menschen befähigt, die Welt in ihrer inneren Einheit
      zu erfassen und sich selbst als denkendes Wesen in dieser Welt zu verorten.
  - term: Zeitalter
    chunk_id: da57c2c7-8802-5bb1-9073-d622bda739d9
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Ein Zeitalter ist für diese Betrachtungsweise nicht einfach ein chronologischer Abschnitt,
      sondern ein geistig bestimmter Entwicklungsraum, in dem sich das menschliche Bewusstsein
      entfaltet. Die entscheidende Unterscheidung der Zeitalter erfolgt nach der vorherrschenden
      Denk- und Erkenntnisweise. Die Entwicklung des Gedankenlebens durchläuft dabei mehrere
      Epochen: vom Erleben des Gedankens als einer Wahrnehmung von außen über das Selbsterleben des
      eigenen Wesens bis hin zur Fähigkeit, den Gedanken als eigenes Erzeugnis zu fühlen und in
      seinem inneren Wesen durchzuarbeiten.


      Die Gegenwart steht an einem Punkt, an dem ein Wirken aus bloßen Wünschen und Interessen nicht
      mehr möglich ist. Gesund wirken im öffentlichen Leben kann nur, was von Gedanken ausgeht, die
      zu Ende gedacht sind. Ein solcher zu Ende gedachter Gedanke ist die Dreigliederung des
      sozialen Organismus: Wirtschaftsleben, Rechtsleben und Geistesleben sollen von verschiedenen
      Mittelpunkten aus nach eigenen Gesichtspunkten geregelt werden. Nur so kann der Geist sich
      frei entfalten, ohne zum Rad im Wirtschaftsmechanismus zu werden.


      Die entscheidende Aufgabe für den Einzelnen in seinem Zeitalter ist es, diejenigen Ideen zu
      ergreifen, die den Anforderungen der Gegenwart entsprechen. Wer dies nicht vermag, dem bleibt
      auch der Sinn des vergangenen Geisteslebens verborgen. Denn der Gedanke muss Lebenspraxis
      werden – und dieses Leben kann nur das der Gegenwart sein.
  - term: Zweck
    chunk_id: f8ceb6b2-41ae-5cd8-be8e-52d947a7de2d
    language: de
    tags:
      - concept
      - assistant-generated
    text: Der Zweck ist für diese Denkrichtung kein der Natur innewohnendes Prinzip, sondern
      ausschließlich eine menschliche Setzung. Die Natur handelt nicht nach Zwecken, sondern nach
      Gesetzmäßigkeiten; wer von Naturzwecken spricht, überträgt eine menschliche Denkform
      fälschlich auf die Außenwelt. Zweckvoll ist nur das, was der Mensch erst dazu gemacht hat,
      indem er eine Vorstellung von einem künftigen Zustand fasst und diesen durch seine Tätigkeit
      verwirklicht. Ein Hammer oder eine Maschine haben keinen Zweck in sich, sondern erhalten ihn
      erst durch die Idee, die der Mensch ihnen zugrunde legt. Der Mensch selbst setzt seine Zwecke
      eigenständig; er ist nicht an eine vorherbestimmte Aufgabe oder eine von außen vorgegebene
      Bestimmung gebunden. Seine Sendung in der Welt ist jeweilig die, die er sich selbst erwählt.
      Die entscheidende Frage ist dabei, ob der gesetzte Zweck aus einer klaren Erkenntnis der
      Wirklichkeit erwächst oder aus bloßem Drang. Ein freies Handeln liegt vor, wenn der Mensch aus
      Einsicht, aus einem intuitiv erfassten sittlichen Ziel heraus handelt. Er handelt dann nicht,
      damit eine sittliche Weltordnung entstehe, sondern weil er eine sittliche Idee hat. Die
      menschlichen Individuen mit ihren zu ihrem Wesen gehörigen Ideen sind die Voraussetzung jeder
      sittlichen Ordnung, nicht deren nachträgliches Werkzeug. Der Zweck ist also kein von außen an
      die Welt herangetragener Plan, sondern das Ergebnis einer bewussten, aus der eigenen Einsicht
      gewonnenen Zielsetzung des Menschen.
  - term: Zweckmäßigkeit
    chunk_id: c106e885-51f0-55e3-9a5a-6e947c970f8e
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Zweckmäßigkeit bezeichnet für Rudolf Steiner eine bestimmte Art des Zusammenhangs von
      Erscheinungen, die sich grundlegend vom bloßen Verhältnis von Ursache und Wirkung
      unterscheidet. Wahrhaft zweckmäßig ist ein Vorgang nur dann, wenn das spätere Ereignis
      bestimmend auf das frühere einwirkt. Dies geschieht ausschließlich beim bewussten menschlichen
      Handeln: Der Mensch stellt sich eine Handlung vorher vor und lässt sich von dieser Vorstellung
      zur Tat bestimmen. Die Vorstellung der Wirkung wird zur Ursache des Tuns. Eine Maschine ist in
      diesem Sinne zweckmäßig, weil der Mensch ihre Teile so zusammenfügt, dass die Idee ihrer
      Wirkungsweise der Gestaltung zugrunde liegt.


      Anders verhält es sich in der belebten Natur. Ein Naturwesen wie ein Tier oder eine Pflanze
      ist nicht durch eine von außen gesetzte Zweckvorstellung bestimmt. Seine Gestalt entspricht
      vielmehr einer ihm eingeborenen Idee, die als sein inneres Wesen gesetzmäßig wirkt. Weil diese
      Idee nicht außerhalb des Wesens steht, sondern in ihm als dessen Bildungsgesetz lebt, kann
      hier nicht im eigentlichen Sinne von Zweckmäßigkeit gesprochen werden. Die Übereinstimmung der
      Glieder eines Organismus zu einem Ganzen ist das ideelle Zusammenstimmen der in diesem
      Wahrnehmungsganzen enthaltenen Glieder eines Ideenganzen. Zweckmäßigkeit im strengen Sinne
      bleibt daher dem menschlichen Handeln vorbehalten, bei dem ein bewusst gefasster Begriff die
      wirkende Ursache ist.
  - term: Zweifel
    chunk_id: 4abaccbe-f2ce-5ea9-9d07-b5583a92480e
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Zweifel entsteht dort, wo das Denken auf eine Grenze stößt. Die Sinneseindrücke geben uns
      die Welt, aber nicht die Wahrheit. Betrachten wir die bloße Wahrnehmung für sich, so haben wir
      keine Wirklichkeit, sondern ein zusammenhangloses Chaos. Erst der Zusammenhang von Wahrnehmung
      und Begriff ergibt volle Wirklichkeit. An diesem Punkt setzt der Zweifel an: Kann das Denken
      diesen Zusammenhang überhaupt leisten? Ist das Denken selbst verlässlich?


      Die Antwort liegt in der besonderen Natur des Denkens. Es nimmt innerhalb der Erfahrung eine
      Ausnahmestellung ein. Bei allen anderen Dingen findest du keinen Zusammenhang, wenn du bei dem
      stehen bleibst, was dir die Sinne liefern. Beim Denken ist das anders: Wenn du den Gedanken
      der Ursache fasst, führt dich dieser durch seinen eigenen Inhalt zu dem der Wirkung. Das
      Denken zeigt dir also aus sich selbst heraus seine Gesetzmäßigkeit. Es ist eine Tatsache,
      deren Richtigkeit oder Falschheit anzuzweifeln sinnlos ist – so sinnlos wie zu fragen, ob ein
      Baum an sich richtig sei. Du kannst höchstens zweifeln, ob das Denken richtig angewendet wird.


      Die Überwindung des Zweifels gelingt daher nicht durch Glauben oder bloßes Meinen, sondern
      durch bewusste Denktätigkeit. Im Denken hältst du das Weltgeschehen an einem Zipfel, wo du
      dabei sein musst, wenn etwas zustande kommen soll. Es gibt keinen ursprünglicheren
      Ausgangspunkt für das Betrachten alles Weltgeschehens als das Denken.
