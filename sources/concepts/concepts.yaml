        relevance: 0.85
  - term: Individuum
    chunk_id: 17da407c-806f-53d9-8086-51d5329cd1ac
    language: de
    tags:
      - concept
      - assistant-generated
    text: Das menschliche Individuum ist der Quell aller Sittlichkeit und der Mittelpunkt des
      Erdenlebens. Es handelt aus eigenem inneren Antrieb und setzt sich selbst die Maßstäbe für
      sein Handeln. Der Mensch muss selbsttätig seinen Begriff mit der Wahrnehmung Mensch
      vereinigen. Das Individuum unterscheidet sich vom bloßen Einzelmenschen, der noch in Trieben,
      Instinkten oder Gattungsmäßigem lebt. Meine Triebe, Instinkte, Leidenschaften begründen nichts
      weiter in mir, als dass ich zur allgemeinen Gattung Mensch gehöre; durch mein Denken
      unterscheide ich mich selbst von anderen. Das Individuelle in mir ist nicht mein Organismus
      mit seinen Trieben und Gefühlen, sondern die Ideenwelt, die in diesem Organismus aufleuchtet.
      Eine aus der Intuition entspringende Willenshandlung ist eine individuelle. Der Antrieb kann
      da nur ein ganz individueller sein. Das Individuum ist die lebendige Verwirklichung der
      Freiheit. Es handelt nicht aus äußeren Autoritäten oder bloßen Trieben, sondern aus rein
      sittlicher Intuition. Der Mensch erreicht solche Ziele in dem Maß, in dem er die Fähigkeit
      besitzt, sich zum intuitiven Ideengehalt der Welt zu erheben. Das menschliche Individuum ist
      Quell aller Sittlichkeit und Mittelpunkt des Erdenlebens.
    references:
      - chunk_id: 5d64027f-6bf2-5dc4-8d7f-f0f42ebf5fda
