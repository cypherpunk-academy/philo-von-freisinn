  - term: Geistesleben
    chunk_id: 30521989-4b37-5703-8b1c-d67397aa03e8
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Das Geistesleben umfasst nach dieser Auffassung alle Bereiche, die aus den individuellen
      Fähigkeiten und schöpferischen Impulsen des Menschen hervorgehen: Wissenschaft, Kunst,
      Religion, Erziehung und jede freie Betätigung. Es ist nicht durch Tausch oder äußeren Zwang
      bestimmt, sondern durch die freie Hingabe an eine Sache oder Idee. Damit es seine volle Kraft
      entfalten kann, muss es von staatlicher Bevormundung und wirtschaftlichen Abhängigkeiten
      befreit sein. Es bedarf einer eigenen Selbstverwaltung durch diejenigen, die selbst auf diesem
      Gebiet tätig sind – also vor allem durch die Erziehenden und Unterrichtenden. Niemand, der
      nicht selbst im lebendigen Unterricht steht, soll in diese Verwaltung hineinreden. Ein solches
      freies Geistesleben schafft aus den Tiefen der menschlichen Wesenheit heraus Interessen, die
      der Arbeit in der Gemeinschaft Ziel und Inhalt geben. Es erzeugt das Bewusstsein, mit den
      eigenen Fähigkeiten sinnvoll im Dasein zu stehen, weil es diese Fähigkeiten um ihrer selbst
      willen pflegt. Die Gemeinschaft und auch das Rechts- und Wirtschaftsleben werden dann das
      Gepräge annehmen, das diesen entwickelten Fähigkeiten entspricht. Die Forderung ist daher die
      vollständige Autonomie des Geisteslebens als eines eigenständigen, gleichberechtigten Gliedes
      des sozialen Organismus, neben einem demokratischen Rechtsleben und einem selbständigen
      Wirtschaftsleben. Nur so können die individuellen Fähigkeiten zum Dienst des sozialen Lebens
      wahrhaft gepflegt werden."
    references:
