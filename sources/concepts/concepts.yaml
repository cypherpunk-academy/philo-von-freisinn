        relevance: 0.9
      - chunk_id: 2568f9b5-69d5-5d81-b4eb-103fb5edaecf
        description: Das Geistesleben fordert volle Selbstverwaltung als selbstständiges Glied des sozialen
          Organismus, und das Erziehungs- und Unterrichtswesen muss in die Verwaltung derer gestellt
          werden, die selbst erziehen.
        relevance: 0.9
      - chunk_id: 8768ec12-935d-5f3a-af54-ad9b87a5c0de
        description: Eine Seelen-Erkenntnis der geschilderten Art ist notwendig, um die Individualität der
          kindlichen Natur zu beobachten, und eine praktische Pädagogik muss auf eine wahre
          Geisteswissenschaft gebaut sein.
        relevance: 0.9
      - chunk_id: 5964a73f-6b0a-54a3-9fef-d9c8e30638f3
        description: Wer das Kind nach naturwissenschaftlicher Vorstellungsart beobachtet, entzieht sich dem
          Bedeutsamen; wer sachgemäß beobachtet, schärft das Seelenauge für das Individuelle und
          sieht das Kind als ganz individuelles Rätsel.
        relevance: 0.9
      - chunk_id: 86a70f5d-ee8f-563f-9493-371024de373f
        description: Die Übernahme des Erziehungswesens durch den Staat wird als heilsam angesehen, aber
