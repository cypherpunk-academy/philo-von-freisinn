        relevance: 0.8
  - term: Ethik
    chunk_id: 635c2c79-f37a-5c3a-9614-36b093461b3a
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Ethik ist nicht die Lehre von moralischen Geboten oder äußeren Pflichten, sondern die
      Wissenschaft von der sittlichen Intuition des freien Menschen. Der Mensch handelt ethisch aus
      eigener Einsicht und innerer Anschauung, nicht weil ein Gesetz oder eine Autorität es
      befiehlt. Die Quelle des Sittlichen liegt im denkend erfassbaren Ideal, das der Einzelne in
      sich selbst erzeugt; dieses Ideal wird sittliche Intuition genannt. Ethik ist keine Frage des
      Gehorsams, sondern der Freiheit: Der Mensch ist sein eigener Gesetzgeber. Sein Wollen ist
      souverän und vollführt nur, was als Gedankeninhalt in seiner Persönlichkeit liegt. Die
      sittlichen Ideale entspringen aus der moralischen Fantasie des Menschen. Ihre Verwirklichung
      hängt davon ab, dass sie stark genug begehrt werden, um Widerstände zu überwinden. Der Mensch
      handelt sittlich, weil er eine sittliche Idee hat, nicht damit Sittlichkeit entstehe. Die
      menschlichen Individuen mit ihren zu ihrem Wesen gehörigen sittlichen Ideen sind die
      Voraussetzung der sittlichen Weltordnung. Einen im wahren Sinne ethischen Wert hat nur der
      Teil des Handelns, der aus den eigenen Intuitionen entspringt. Aus individuellen ethischen
      Intuitionen und deren Aufnahme in Menschengemeinschaften entspringt alle sittliche Betätigung
      der Menschheit. Das sittliche Leben der Menschheit ist die Gesamtsumme der moralischen
      Fantasieerzeugnisse der freien menschlichen Individuen."
    references:
      - chunk_id: 6dc60a4a-3b9c-5e0e-b44d-cfcba962201c
        description: Ein sittliches Ideal lenkt das Handeln durch seine innere Kraft und seinen
          Gedankeninhalt, nicht weil es als Gesetz gegeben ist.
        relevance: 0.95
      - chunk_id: 80a859c8-240e-5aff-b29c-4805c0fc4200
        description: Die sittlichen Ideale entspringen aus der moralischen Fantasie des Menschen und ihre
          Verwirklichung hängt vom starken Begehren ab.
        relevance: 0.95
      - chunk_id: 833f85fc-5132-5501-9c36-15adccd8e504
        description: Es gibt keine von den Menschen abgesonderte sittliche Weltordnung, die verwirklicht
          werden müsste.
        relevance: 0.9
      - chunk_id: 85cba29d-7761-5c34-b327-1efa42cc1cf2
        description: Sittliche Ideale sind nur in uns vorhanden und nicht das Abbild von etwas außer uns; es
          gibt keinen kategorischen Imperativ.
        relevance: 0.9
      - chunk_id: 27c4e7a6-54b4-5312-a449-6c4f2cd216d0
        description: Das Handeln aus Intuition ist individuell auf den besonderen Fall geprägt und wird
          nicht durch allgemeine Normen bestimmt.
        relevance: 0.85
      - chunk_id: a68d3a06-c56f-5dd9-8f4a-4c73bdf81d98
        description: Bei intuitiv bestimmten Handlungen ergeben sich allgemeine Sittlichkeitsbegriffe erst
          aus der Verallgemeinerung individueller Antriebe.
        relevance: 0.85
      - chunk_id: fc5917e7-8774-5872-b6c3-6b28e387e76f
        description: Auf der höchsten Stufe der Sittlichkeit fallen Triebfeder und Motiv zusammen, und die
          begriffliche Intuition ist das höchste Motiv.
        relevance: 0.8
      - chunk_id: ec9110e2-37f1-5b51-a28d-3de917f8cfcb
        description: Die Menschen sind im Intuitionsvermögen verschieden, und das Handeln hängt von der
          Wirkung der Intuition auf die jeweilige Situation ab.
        relevance: 0.8
  - term: Ewigkeit
    chunk_id: 05309641-a9a6-554c-8a69-038df2c3db34
    language: de
    tags:
      - concept
      - assistant-generated
    text: Ewigkeit ist kein unendlich langer Zeitablauf, sondern eine Qualität, die außerhalb der Zeit
      steht. Sie ist nicht als „sehr lange“ zu verstehen, sondern als das, was von der Zeit nicht
      berührt wird. Der Mensch kann im vertieften Denken einen Bereich betreten, der nicht an die
      Bedingungen der Zeit gebunden ist. Ein Gedanke – etwa ein mathematischer Satz – hat eine
      zeitlose Gültigkeit, unabhängig davon, wann und wo er erfasst wird. In diesem Sinne lebt der
      Mensch mit seinem Denken, wenn er es genügend vertieft, in der geistigen Weltwirklichkeit. Das
      Ewige des Menschen besteht darin, dass das Denken der Hierarchien des Kosmos ein Ewiges ist.
      Der einzelne Mensch ist ein Gedanke, der von diesen Hierarchien gedacht wird. Sein wahres
      Wesen wird von einer Kategorie der Hierarchien an die nächste übergeben, so wie ein Gedanke
      vom Lehrer an den Schüler weitergegeben wird. So fühlt sich der Mensch hineingestellt in die
      Gedankenwelt des Kosmos. Ewigkeit ist demnach keine Dauer, sondern eine Seinsweise, die im
      Erleben des reinen, von Sinneseindrücken unabhängigen Denkens erfahren werden kann. In diesem
      Erleben wird der Mensch seiner Zugehörigkeit zu einer zeitlosen, geistigen Wirklichkeit inne.
    references:
      - chunk_id: de8cd4f1-7aab-52ff-a67f-add81c3332dc
        description: Der Mensch ist ein Gedanke, der von den Hierarchien des Kosmos gedacht wird, und sein
          ewiges Wesen wird von einer Kategorie an die nächste übergeben.
        relevance: 0.95
      - chunk_id: f111f561-a4fe-5212-afb0-5eba342c83fd
        description: Ein Gedanke hat zeitlose Gültigkeit, unabhängig davon, wo und wann er erfasst wird, und
          seine Bestimmungen werden aus der Gedankenwelt entnommen.
        relevance: 0.9
      - chunk_id: 4dbf84ba-d2a6-5b21-8abd-15d00cfba34e
        description: Durch das Denken lebt der Mensch sich geistig in die Wirklichkeit hinein, und das
          Wahrnehmungselement erhält Wirklichkeitsbestimmung erst im Denken.
        relevance: 0.85
      - chunk_id: fa9c2477-a053-5641-9c3f-8e0fb6740239
        description: Der Mensch erlebt in sich den Gedanken und kann sich darin als unmittelbar Tätiges
          erfühlen.
        relevance: 0.7
      - chunk_id: a5568ad8-99e8-54c4-b8d3-daf47b74c343
        description: Die Entwicklung des Gedankenlebens schreitet durch Epochen fort, in denen der Gedanke
          zunächst wie eine Wahrnehmung von außen wirkt.
        relevance: 0.5
  - term: Fähigkeit
    chunk_id: 2f0eb2b7-162a-53de-9739-fd52a05815ea
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Fähigkeit bezeichnet eine Kraft der menschlichen Seele, die nicht von Natur aus gegeben ist,
      sondern durch eigene Tätigkeit entwickelt wird. Sie erwächst aus dem inneren Vollzug des
      Denkens und Handelns und ist an die Initiative des Einzelnen gebunden. Der Mensch eignet sich
      Fähigkeiten an, indem er sich bewusst in die Gedankenwelt hineinlebt und aus ihr schöpft. So
      wie das Gedächtnis aus dem dumpfen Kindeserleben erwächst, so kann die Seele auf einer höheren
      Stufe die Fähigkeit erlangen, aus sich selbst heraus Begriffe hervorzubringen, die nicht bloß
      äußere Eindrücke abbilden, sondern eigenständige geistige Erzeugnisse sind.


      Fähigkeit ist die Grundlage für Freiheit und selbstbestimmtes Handeln. Sie befähigt den
      Menschen, aus eigenem Impuls tätig zu sein und nicht nur fremden Antrieben zu folgen. Im
      sozialen Leben zeigt sich dies darin, dass der Einzelne frei über seine individuellen
      Fähigkeiten verfügen können muss, um sie fruchtbar in den Kreislauf der Wirtschaft
      einzubringen. Die freie Verfügung über die Produktionsmittel ist dabei so notwendig wie die
      freie Anwendung der Geschicklichkeit der eigenen Leibesglieder.


      Eine gesunde soziale Ordnung erkennt an, dass die individuellen Fähigkeiten aus einer eigenen
      Quelle stammen – aus der freien Empfänglichkeit des Menschen und den Impulsen, die aus diesen
      Fähigkeiten selbst kommen. Sie dürfen nicht durch äußere Zwänge oder starre Regeln bestimmt
      werden, sondern müssen aus dem Inneren des Einzelnen in das Gemeinwesen einfließen.
    references:
      - chunk_id: a5568ad8-99e8-54c4-b8d3-daf47b74c343
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 1
      - chunk_id: e0208833-c446-554b-9251-7ff177b1fe01
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 0.9994
      - chunk_id: 771bf9a9-85b4-5506-aaf1-577112a7bc45
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 0.9979
  - term: Freier Geist
    chunk_id: f8119e47-82df-576f-bab4-7141880cb0ce
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der freie Geist handelt nach seinen eigenen Impulsen, die er als Intuitionen aus dem Ganzen
      seiner Ideenwelt durch das Denken auswählt. Diese Impulse sind nicht durch äußere Vorbilder,
      Furcht vor Strafe oder fremde Gebote bestimmt. Der freie Geist fasst einen schlechthin ersten
      Entschluss, der aus rein ideellen Gründen erfolgt. Seine Handlung gehört dennoch der
      wahrnehmbaren Wirklichkeit an.


      Freiheit bedeutet, die dem Handeln zugrunde liegenden Vorstellungen, also die Beweggründe,
      durch die moralische Fantasie von sich aus bestimmen zu können. Diese moralische Fantasie ist
      das Vermögen, konkrete Vorstellungen aus der Summe der eigenen Ideen zu produzieren und sie in
      die Tat umzusetzen. Sie ist die Quelle des Handelns des freien Geistes. Freiheit ist
      unmöglich, wenn etwas außerhalb des Menschen – sei es ein mechanischer Prozess oder ein
      außerweltlicher Gott – die moralischen Vorstellungen bestimmt.


      Der freie Geist handelt nicht aus blindem Drang oder triebhafter Neigung, sondern aus
      bewusster Einsicht. Er unterscheidet sich darin von dem Menschen, der seinen sinnlichen
      Trieben folgt und selbstsüchtig handelt. In einem Zusammensein von freien Menschen bedarf es
      keiner Zwangsgesetze, denn der freie Mensch vollbringt aus eigenem Antrieb, was der Staat von
      dem selbstsüchtigen Menschen fordern müsste. Der freie Geist ist sittlich produktiv, weil er
      seine Ideen durch die moralische Fantasie in konkrete Handlungen umsetzt, anstatt nur
      allgemeine Regeln zu wiederholen.
    references:
      - chunk_id: ca36c0b3-9c67-56b1-b721-7470aff92eec
        description: Der freie Geist handelt nach seinen Impulsen, die Intuitionen aus dem Ganzen seiner
          Ideenwelt sind, während der unfreie Geist seine Intuitionen aus der Wahrnehmungswelt und
          früheren Erlebnissen schöpft.
        relevance: 0.95
      - chunk_id: 34281c83-c7df-58f6-8cb9-95e76962f1a7
        description: Beim freien Geist, den kein Vorbild oder Furcht vor Strafe treibt, erfolgt die
          Umsetzung des Begriffs in die konkrete Vorstellung des Handelns ohne äußere Zwänge.
        relevance: 0.9
      - chunk_id: b1e94c9e-3b36-520c-b1e7-147227934833
        description: Der freie Mensch vollbringt aus eigenem Antrieb, was der Staat vom selbstsüchtigen
