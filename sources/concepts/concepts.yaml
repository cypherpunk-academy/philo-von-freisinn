        relevance: 0.9
      - chunk_id: d027edfd-ec64-52d6-ba1a-d9831401f2d3
        description: Die Grundlage der besonderen Organismen ist ein allgemeines Bild des Organismus, der
          Typus, der alle besonderen Formen in sich begreift.
