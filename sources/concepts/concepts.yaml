  - term: Denkgewohnheit
    chunk_id: 653acba0-12ad-53e4-8299-030677d729cf
    language: de
    tags:
      - concept
      - assistant-generated
    text: Eine Denkgewohnheit ist eine erworbene, automatisch ablaufende Vorstellungs- und Urteilsweise,
      die nicht aus eigenem, gegenwärtigem Erkenntnisakt stammt, sondern aus Übernahme und
      Wiederholung entsteht. Sie bildet sich unter dem Einfluss bestimmter Lebensverhältnisse oder
      übernommener Meinungen aus und wird von dem, der sie hegt, meist unbewusst ausgeübt. Wer einer
      Denkgewohnheit folgt, glaubt etwa aus ethischen oder religiösen Antrieben zu handeln, während
      er in Wirklichkeit einem Urteil folgt, das aus einer bestimmten, ihm nicht bewussten Prägung
      stammt – zum Beispiel der ökonomischen Denkart seiner Umgebung. Die Menschen halten an solchen
      Denkgewohnheiten oft zäher fest als an den äußeren Einrichtungen, die sie kritisieren. Sie
      bemerken nicht, dass sie mit ihren gewohnten Denkweisen gerade das fortsetzen, was sie
      eigentlich überwinden möchten. Freiheit des Erkennens beginnt dort, wo der Mensch sich der
      Ursachen bewusst wird, die sein Denken bestimmen. Solange er diese Ursachen nicht kennt,
      gleicht er einem, der zwar sein Begehren spürt, aber nicht weiß, wodurch er bestimmt wird. Die
      Überwindung von Denkgewohnheiten ist daher kein bloßer Austausch einer Meinung gegen eine
      andere, sondern ein Schritt zu einem Denken, das aus der bewussten, tätigen Selbstbeobachtung
      des Ich schöpft. Nur ein solches Denken kann der Wirklichkeit gerecht werden, statt sie nach
      bequemen, vorgeprägten Mustern zu beurteilen.
    references:
      - chunk_id: 26ee1b46-148b-5470-b972-42ab54bb9592
        description: In den führenden Kreisen der Menschheit hat sich die Denkgewohnheit ausgebildet, alle
          Lebensverhältnisse aus ökonomischen Unterlagen heraus zu beurteilen, und sie sind sich
          dieser Beurteilungsart meist nicht bewusst,...
        relevance: 0.95
      - chunk_id: e27da02a-b545-54be-bbb3-30ca34777f27
        description: Ein Stein, der während seiner Bewegung denkt und weiß, er bestrebe sich, in der
          Bewegung fortzufahren, würde glauben, er sei ganz frei und wolle die Bewegung aus eigenem
          Antrieb, was der menschlichen Freiheit gleicht,...
        relevance: 0.85
      - chunk_id: c8f876e1-ab52-59f6-b379-79da2d789da7
        description: Die Frage nach der Freiheit des Willens darf nicht einseitig für sich gestellt werden,
          sondern muss mit der Frage nach dem Unterschied zwischen bewusstem Beweggrund und
          unbewusstem Antrieb verknüpft werden.
        relevance: 0.8
      - chunk_id: b81406fe-ca62-55d4-b79d-f7cd7701cd3c
        description: Es wird eingewendet, dass das tätige Denken nur ein Schein sei und man in Wirklichkeit
          nur die Ergebnisse einer nicht bewussten Tätigkeit beobachte, die dem Denken zugrunde
          liegt.
        relevance: 0.75
      - chunk_id: 3c4688e9-2572-5b49-89e8-044ffb56ea4b
        description: Es besteht ein Unvermögen, einen Übergang zu ermöglichen von dem, was die Leute gut und
          sittlich nennen, zu dem, was in der äußeren Wirklichkeit als Kapitalwirkung,
          Arbeitsentlohnung, Konsum usw. den Menschen umgibt,...
        relevance: 0.7
  - term: Denkweise
    chunk_id: f543694c-37e4-5e5e-94d3-a6ef972e6009
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Das Denken ist nach dieser Auffassung nicht ein bloßes Werkzeug, um gegebene Tatsachen
      nachträglich zu verbinden. Es ist vielmehr derjenige Bereich des Weltgeschehens, an dem der
      Mensch aktiv teilnimmt. Während wir Wahrnehmungen einfach vorfinden, sind wir beim Denken
      selbst tätig. Wir müssen bei seinem Zustandekommen „dabei sein“. Darin liegt der entscheidende
      Unterschied zu allen anderen Erfahrungsinhalten: Das Denken ist uns nicht als fertiges Objekt
      gegeben, sondern wir erzeugen es im Vollzug. Diese Tätigkeit ist aber nicht willkürlich oder
      bloß subjektiv. Sie ist die Form, in der der Mensch den Zusammenhang der Dinge selbst
      herstellt. Die Wirklichkeit besteht nach dieser Auffassung aus zwei Faktoren: der Wahrnehmung,
      die uns von außen entgegentritt, und dem Begriff, den wir durch das Denken aus uns selbst
      hervorbringen. Erst in der denkenden Beobachtung, die beide Seiten verbindet, entsteht volle
      Wirklichkeit. Wer nur die Wahrnehmung für sich betrachtet, hat ein zusammenhangloses Chaos;
      wer nur den abstrakten Begriff verfolgt, verliert den Bezug zur Welt. Die Denkweise ist daher
      keine feste Schablone, sondern eine lebendige Bewegung. Sie ist die Art und Weise, wie der
      Mensch die Welt nicht nur hinnimmt, sondern durch eigene geistige Tätigkeit an ihrer Ordnung
      mitwirkt. In diesem aktiven Vollzug liegt der Ursprung jeder Freiheit: Der Mensch ist nicht
      nur Betrachter, sondern Mitschöpfer des Weltzusammenhangs."
    references:
      - chunk_id: 989f9bfd-cf47-5af3-8406-77e5cd5f734f
        description: Im Denken hält man das Weltgeschehen an einem Zipfel, wo man dabei sein muss, wenn
          etwas zustande kommt; dies unterscheidet das Denken von anderen Dingen, die man einfach
          vorfindet.
        relevance: 0.9
      - chunk_id: 1e7ec70e-04e7-5a99-8a3e-24b8665416b5
        description: Der Schnitt zwischen Wahrnehmen und Denken entsteht erst, wenn der Betrachtende den
          Dingen gegenübertritt.
        relevance: 0.8
      - chunk_id: 0ae1ef84-d26f-5de0-9491-3e19f8734e60
        description: Die Tätigkeit des Denkens ist nicht subjektiv, und die durch das Denken hergestellten
          Beziehungen haben nicht bloß subjektive Geltung.
        relevance: 0.8
      - chunk_id: aa924c54-5676-574b-972a-5e4db2a6aa1f
        description: Es wird gefragt, wo im Weltbild etwas zu finden ist, das nicht bloß gegeben, sondern im
          Erkenntnisakt hervorgebracht ist.
        relevance: 0.7
      - chunk_id: 2cb4f608-6f5d-5504-8351-37a111f23c4e
        description: Das Denken unterscheidet sich als Beobachtungsobjekt von anderen Dingen, da man es
          nicht gleichzeitig mit dem Gegenstand beobachtet, sondern sich erst auf einen Standpunkt
          außerhalb der eigenen Tätigkeit stellen muss.
        relevance: 0.7
      - chunk_id: a5568ad8-99e8-54c4-b8d3-daf47b74c343
        description: Das Denken wird in seiner Entwicklung zunächst wie eine Wahrnehmung von außen erlebt,
          später verschmilzt es mit der Selbsterkenntnis und wird nicht mehr als äußere Wahrnehmung
          angesehen.
        relevance: 0.6
