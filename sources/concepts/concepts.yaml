        relevance: 0.9
      - chunk_id: e7e052f2-cca8-52d3-b521-587470924279
        description: Goethes Begriffe Urpflanze und Urtier sind beweglich zu denken.
        relevance: 0.9
      - chunk_id: e849bb82-8062-5e9f-8408-d8a47f3ef4c4
        description: Der Typus ist der wahre Urorganismus, der sich ideell zur Urpflanze oder zum Urtier
          spezialisiert; keine einzelne sinnliche Gestalt kann ihn darstellen.
        relevance: 0.9
      - chunk_id: c2446dc2-159c-5cf4-b1f5-8b76ff7e8fbd
        description: Die Urpflanze ist ein Modell, mit dem man konsequente Pflanzen erfinden kann, die
          existieren könnten.
        relevance: 0.85
      - chunk_id: 7c5a9e8f-02ce-5ee0-be2f-018d4acd6233
        description: Goethe gelangte zu seiner sinnlich-übersinnlichen Urpflanze und stieg von ihr nicht zu
          höheren Erklärungsprinzipien auf.
        relevance: 0.85
      - chunk_id: ad5cd3cd-5370-54d6-a9a2-3a95c21801a1
        description: Goethe fragte nicht nach dem Zweck, sondern nach dem Gesetz, wie etwas entsteht, und
