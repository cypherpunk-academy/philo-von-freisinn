  - term: Erziehung
    chunk_id: d569b6b2-f0ce-5cb0-9da8-a3d1d6ff618a
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Erziehung ist kein Vorgang der Formung oder Belehrung von außen, sondern eine Hilfe zur
      Selbstentfaltung des Heranwachsenden. Der Erzieher soll die äußeren Umstände so gestalten,
      dass das Kind aus eigenem Impuls seine Entwicklung gehen kann. Die entscheidende Frage ist
      nicht, was man dem Kind beibringen soll, sondern wie man ihm helfen kann, das in ihm Angelegte
      selbst zu finden. Dies erfordert eine lebendige Menschenerkenntnis, die das Wesen des
      Seelischen aufschließt und nicht in allgemeingültigen Gesetzen denkt. Denn die menschliche
      Seelenwesenheit widerstrebt der Erkenntnis, wenn man sie durch feste Begriffe fassen will. Nur
      die Natur ergibt sich solchen Gesetzen; das Seelische erfordert eine künstlerische
      Gestaltungskraft in der Erkenntnis.


      Daraus folgt, dass Erziehung nicht von außen durch Vorschriften oder Gesetze geregelt werden
      darf, sondern aus freier, individueller Erkenntnis der Menschennatur erfolgen muss. Der
      Erzieher muss sich für die Richtlinien seines Wirkens nur abhängig wissen von Erkenntnissen,
      nicht von staatlichen oder wirtschaftlichen Vorgaben. Das Erziehungs- und Unterrichtswesen
      muss in die Selbstverwaltung derer gestellt werden, die selbst erziehen und unterrichten. Nur
      so können sozial empfindende Menschen heranwachsen, die aus eigener Einsicht und eigenem
      Wollen handeln. Ziel ist ein freier Mensch, der nicht nach fremden Maßstäben geformt, sondern
      in seiner Individualität erkannt und zur Entfaltung gebracht wird.
    references:
      - chunk_id: f831a12c-742d-531e-838d-8f6fd8b304cd
        description: Ein freies Geistesleben bildet keine wirklichkeitsfremden Menschen aus, sondern
          lebensfremde Menschen entstehen, wenn Staat und Wirtschaft das Erziehungs- und Schulwesen
          regeln.
        relevance: 0.9
      - chunk_id: e343077c-3182-597f-adf1-b057abe217ca
        description: Es gibt Hindernisse, eine Seelen-Erkenntnis zu gewinnen, die das Wesen des Menschen
          aufschließt, weil die herrschende Weltanschauung nur allgemeingültige Gesetze in festen
          Begriffen gelten lässt.
        relevance: 0.9
      - chunk_id: c90b27ee-8c0c-5900-8f11-3ff89d55851d
        description: Eine wahre Geisterkenntnis schließt das Wesen des Seelischen auf und trägt eine
          Erziehungs- und Unterrichtskunst, die zu einer lebendigen Menschen-Erkenntnis führt.
        relevance: 0.9
      - chunk_id: eff4617c-fb56-5f6c-9c30-1bb8004a54fd
        description: In einer Selbstverwaltung des Geisteslebens wird das Bestmögliche angestrebt, und die
          Fähigkeiten der Kinder werden der Gemeinschaft übermittelt, wenn nur geistig Urteilsfähige
          über ihre Ausbildung bestimmen.
        relevance: 0.9
      - chunk_id: af0fc817-a8e3-5df9-8751-b33dd93bd358
        description: Erziehende, die sich nicht selbst die Richtlinien geben können, werden lebensfremd und
          unpraktisch, und antisoziale Zustände entstehen, weil nicht Menschen mit freiem Wollen in
