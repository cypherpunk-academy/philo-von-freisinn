  - term: Geisteswissenschaft
    chunk_id: 7c5eb4ef-8fa4-50b0-bbe4-90ccf6afa29d
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die Geisteswissenschaft ist eine methodisch betriebene Erkenntnisarbeit, die sich auf das
      Übersinnliche, den geistigen Weltgehalt, richtet. Sie geht von der Beobachtung aus, dass der
      Mensch mit seinem Denken den Kern der Wirklichkeit wesenhaft erfassen kann. Der Erkennende
      schult sein Denken durch innere Arbeit, um zu einer „leibfreien Beobachtung“ zu gelangen.
      Diesen Vorgang, in dem das Wesen der Dinge im Denken selbst erfasst wird, nennt man intuitive
      Anschauung.


      Die Geisteswissenschaft unterscheidet sich von der Naturwissenschaft grundlegend durch ihren
      Gegenstand. Während die Naturwissenschaft das Ideelle, die Gesetzmäßigkeit, erst durch das
      Nachdenken über die Gegenstände hervorbringt, ist dieses Ideelle im Geistigen bereits
      eingeboren. Geistiges wird durch den Geist erfasst; das Wesen ist im Objekt auch ohne die
      wissenschaftliche Arbeit schon da. Die Wissenschaft hat hier die Aufgabe, den Menschen mit
      sich selbst und seinen kulturellen Schöpfungen auseinanderzusetzen.


      Ihre Ergebnisse sind nicht einfach nachzulesen, sondern für denjenigen nachprüfbar, der die
      Erkenntnisschritte der leibfreien Beobachtung durch eigene innere Arbeit selbst vollzieht. Die
      Geisteswissenschaft schöpft dabei nicht allein aus dem Verstand, sondern aus allen
      Seelenkräften des Menschen, um eine Lebensansicht zu gestalten, die aus dem neueren
      Wissenschaftsgeist selbst erwächst und befruchtend auf die soziale Gestaltung des Lebens
      wirken kann.
    references:
      - chunk_id: 1fe5f1a2-ad70-5694-9c0c-07ba3152ea6d
        description: In der Geisteswissenschaft hat das Bewusstsein es mit geistigem Inhalt zu tun, und
          Geistiges wird durch den Geist erfasst, wobei die Wirklichkeit das Ideelle bereits in sich
          trägt.
        relevance: 0.95
      - chunk_id: 05c7930b-eb38-51a8-b2b3-d1c3dfce2585
