  - term: Ideal
    chunk_id: 7dbb6cc7-2959-5f64-9215-1b67fdaf0119
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Das Ideal ist für diese Anschauung kein bloßes Wunschbild oder eine abstrakte Forderung, die
      von außen an den Menschen herantritt. Es ist vielmehr eine im Denken erfasste, lebendige
      Wesenheit der Wirklichkeit. Der Mensch findet in seinem Innern die Ideen der Dinge, wenn er
      sein Denken in Bewegung setzt. Dieses ideelle Innere der Wirklichkeit enthüllt sich ihm im
      Denken. Das Ideal ist eine solche Idee, die nicht bereits durch eine Wahrnehmung bestimmt und
      verwirklicht ist, sondern deren Verwirklichung erst durch den Menschen gefordert wird. Es ist
      eine Intuition, die aus der moralischen Fantasie entspringt.


      Anders als bei einem Naturgegenstand, dessen Begriff mit seiner Wahrnehmung objektiv vereinigt
      ist, muss der Mensch als sittliches Wesen seinen eigenen Begriff selbsttätig mit der
      Wahrnehmung „Mensch“ vereinigen. Das Ideal ist der Inhalt seines Wesens, den er verwirklichen
      will, weil diese Verwirklichung seine höchste Lust ist. Er handelt nicht aus einem äußeren
      Sollen, sondern aus der Einsicht in das, was er als berechtigt erkennt. Der Antrieb ist ein
      ganz individueller. Wer ein Ideal verwirklicht, gibt den Schauplatz ab, auf dem das Sollen zum
      Tun wird. Das Ideal ist somit keine ferne Utopie, sondern eine im menschlichen Geist lebendige
      Kraft, die zur Tat drängt und in der unvollkommensten Form ihres Daseins sich bereits
      ankündigt.
    references:
      - chunk_id: cb70c9d2-c875-598d-9b1c-9b615e173198
        description: Das Ideal ist kein erdachtes oder erträumtes, sondern ein reales Element der
          menschlichen Wesenheit, das sich in der unvollkommensten Form seines Daseins ankündigt.
        relevance: 0.95
      - chunk_id: 80a859c8-240e-5aff-b29c-4805c0fc4200
        description: Sittliche Ideale entspringen aus der moralischen Fantasie des Menschen; ihre
          Verwirklichung ist seine höchste Lust, und er will sie aus eigenem Antrieb.
        relevance: 0.95
      - chunk_id: 4fd46fd4-371f-5436-99c9-e3787ee12126
        description: Der Mensch muss sein Denken in Bewegung setzen, um die Ideen der Dinge in seinem
