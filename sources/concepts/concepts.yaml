  - term: Zweifel
    chunk_id: 4abaccbe-f2ce-5ea9-9d07-b5583a92480e
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Zweifel entsteht dort, wo das Denken auf eine Grenze stößt. Die Sinneseindrücke geben uns
      die Welt, aber nicht die Wahrheit. Betrachten wir die bloße Wahrnehmung für sich, so haben wir
      keine Wirklichkeit, sondern ein zusammenhangloses Chaos. Erst der Zusammenhang von Wahrnehmung
      und Begriff ergibt volle Wirklichkeit. An diesem Punkt setzt der Zweifel an: Kann das Denken
      diesen Zusammenhang überhaupt leisten? Ist das Denken selbst verlässlich?


      Die Antwort liegt in der besonderen Natur des Denkens. Es nimmt innerhalb der Erfahrung eine
      Ausnahmestellung ein. Bei allen anderen Dingen findest du keinen Zusammenhang, wenn du bei dem
      stehen bleibst, was dir die Sinne liefern. Beim Denken ist das anders: Wenn du den Gedanken
      der Ursache fasst, führt dich dieser durch seinen eigenen Inhalt zu dem der Wirkung. Das
      Denken zeigt dir also aus sich selbst heraus seine Gesetzmäßigkeit. Es ist eine Tatsache,
      deren Richtigkeit oder Falschheit anzuzweifeln sinnlos ist – so sinnlos wie zu fragen, ob ein
      Baum an sich richtig sei. Du kannst höchstens zweifeln, ob das Denken richtig angewendet wird.


      Die Überwindung des Zweifels gelingt daher nicht durch Glauben oder bloßes Meinen, sondern
      durch bewusste Denktätigkeit. Im Denken hältst du das Weltgeschehen an einem Zipfel, wo du
      dabei sein musst, wenn etwas zustande kommen soll. Es gibt keinen ursprünglicheren
      Ausgangspunkt für das Betrachten alles Weltgeschehens als das Denken.
    references:
      - chunk_id: 7fbb99a8-14b7-5d13-8f36-641abaccc530
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 1
