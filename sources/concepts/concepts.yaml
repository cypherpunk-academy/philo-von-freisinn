        relevance: 0.9
      - chunk_id: 754edb5b-e615-5b10-bccc-456e4206e538
        description: Zur Gesundung des sozialen Organismus ist dessen Dreigliederung in einen selbständigen
          Geist-, Rechts- und Wirtschaftsunterorganismus notwendig.
        relevance: 0.9
      - chunk_id: b1251b92-4a43-5408-91f6-946eb4ab7328
