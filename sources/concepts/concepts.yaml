        relevance: 0.85
      - chunk_id: 969cb363-3bb8-5898-b47e-507fda578c18
        description: Die Geisteswissenschaft stellt Anforderungen an den Menschen, die aus der Gewöhnung an
          die Trennung von Lebenspraxis und innerem Seelenleben zunächst auf Unglauben stoßen.
