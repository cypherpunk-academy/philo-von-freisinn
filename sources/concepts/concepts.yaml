  - term: Instinkt
    chunk_id: a5564c1d-adc5-5680-a558-7b581c1458f8
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Instinkt ist eine unbewusste Handlungsorientierung, die im Tierreich die Grundlage des
      Verhaltens bildet. Er umfasst Triebe zur Ernährung und Selbsterhaltung, aber auch höhere
      Antriebe der menschlichen Natur wie den Erkenntnistrieb oder den Trieb, nach sittlichen
      Maßstäben zu handeln. Alle diese Triebe sind Äußerungsformen einer gemeinsamen Grundkraft, die
      sich auf verschiedenen Entwicklungsstufen zeigt. Die moralischen Antriebe zum Beispiel sind
      eine besondere Stufe der Instinkte.


      Alles Streben des Menschen besteht darin, die von der Natur eingepflanzten Triebe und
      Instinkte in der besten Weise zu befriedigen. Wenn Menschen nach Tugend, Gerechtigkeit,
      Erkenntnis und Kunst streben, so geschieht dies, weil diese Mittel den Instinkten eine ihrer
      Natur entsprechende Entwicklung ermöglichen. Ohne solche Mittel würden die Instinkte
      verkümmern. Der Mensch vergisst jedoch diesen Zusammenhang und betrachtet jene Mittel oft als
      etwas, das an sich einen unbedingten Wert habe.


      Der entscheidende Unterschied liegt zwischen einem bewussten Beweggrund des Handelns und einem
      unbewussten Antrieb. Der Mensch kann sich aus instinktiver Gebundenheit lösen und zu bewusstem
      Handeln gelangen. Der aus Erkenntnis Handelnde unterscheidet sich grundlegend von dem, der aus
      blindem Drang handelt. Instinkte sind nicht minderwertig, sondern die notwendige Grundlage für
      höhere Entwicklung. Sie sind die Basis, auf der sich bewusstes, freies Handeln erst entfalten
      kann.
    references:
      - chunk_id: 2a969130-d8b2-5f88-bdba-126edec7f749
        description: Alles Streben des Menschen besteht darin, von der Natur eingepflanzte Triebe und
          Instinkte in der besten Weise zu befriedigen; Tugend, Gerechtigkeit, Erkenntnis und Kunst
          sind Mittel, durch die die Instinkte sich natu...
