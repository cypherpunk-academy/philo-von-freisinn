  - term: Licht
    chunk_id: 21f9e15f-2887-5179-8cbf-cc676d30af14
    language: de
    tags:
      - concept
      - assistant-generated
    text: Licht ist für diese Betrachtungsweise kein bloß physikalisches Phänomen, das unabhängig vom
      wahrnehmenden Menschen existiert. Es entsteht vielmehr in der Wechselwirkung des Auges mit den
      Vorgängen der Außenwelt. Ohne Auge keine Farbe, ohne entsprechend organisierte Sinne keine
      Lichtwahrnehmung. Zugleich wäre es jedoch ein Kurzschluss, das Licht deshalb für eine bloß
      subjektive Empfindung zu halten. Die Schwingungen im Raum, die der Physiker einer Farbe
      zuordnet, und die Farbe selbst sind in der Wirklichkeit eine Einheit, die der abstrahierende
      Verstand nur künstlich voneinander trennt. Wer das Licht auf mechanische Bewegungsvorgänge
      reduziert, übersieht, dass er damit nur von einer Wahrnehmung auf eine andere übergeht und
      nicht zu etwas gelangt, was jenseits der Wahrnehmung läge. Das Licht und die ihm zugrunde
      liegenden physikalischen Vorgänge gehören als untrennbare Einheit zusammen. Die entscheidende
      Frage ist daher nicht, ob das Licht subjektiv oder objektiv ist, sondern wie der Mensch durch
      sein Erkennen an dieser Einheit teilhat. Im Denken, das sich selbst als tätig erlebt, liegt
      die Möglichkeit, das Wesen der Erscheinungen zu erfassen. So führt die Beschäftigung mit dem
      Licht zu der Einsicht, dass die sinnliche Wahrnehmung und die gedankliche Durchdringung erst
      gemeinsam den Zugang zur Wirklichkeit eröffnen.
    references:
      - chunk_id: f612090d-9627-5cef-971d-155b6a3bda13
        description: Der Schluss von elektrischem Vorgang auf mechanische Bewegung außerhalb der Wahrnehmung
          ist ein Übergang von einer Wahrnehmung zur anderen.
        relevance: 0.95
      - chunk_id: a1691200-502b-5662-b446-100675493898
        description: Ohne Auge keine Farbe, Wahrnehmung ist an Sinne gebunden.
        relevance: 0.9
      - chunk_id: 8f53e86e-382e-596c-b2c3-fbc05088c8bc
        description: Mathematisches und Mechanisches ist an Qualitäten wie Farbe gebunden; Schwingungen
          entsprechen Farbwahrnehmungen.
        relevance: 0.9
      - chunk_id: fc83e737-fa5f-54a0-8b5e-b884eb1adbd1
        description: Ohne Auge keine Farbe; das Auge erzeugt den Gegenstand.
        relevance: 0.85
      - chunk_id: 62558c21-b9a7-5231-b534-68826705b40b
        description: Die äußere Wahrnehmung hat keinen objektiven Bestand unabhängig vom Vorstellen.
        relevance: 0.8
      - chunk_id: b6869d2b-d469-5a69-a14b-43b81b552ee8
        description: Derselbe Reiz kann durch verschiedene Sinne als unterschiedliche Wahrnehmung
          erscheinen, was für Subjektivität spricht.
        relevance: 0.7
      - chunk_id: 6630bc65-5a23-5819-aac3-7428dcf5455f
        description: Sinneswahrnehmung löst sich in ideellen Inhalt auf.
        relevance: 0.6
      - chunk_id: 0adcaaed-88f7-5f73-b727-1af780750d78
        description: Innerhalb des Gedankeninhalts können wir dessen eigene Natur erkennen.
        relevance: 0.5
      - chunk_id: 1bb90559-3b39-5571-8ed5-6cdc66ce7f02
        description: Im Spektrum gibt es über das Violett hinaus Kräfte, die nicht als Farbe wahrgenommen
          werden.
        relevance: 0.3
  - term: Materialismus
    chunk_id: 724b9cba-6dd1-5fc5-b122-d30712b85c61
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Materialismus ist eine Denkform, die das Bewusstsein auf das beschränkt, was mit den
      Sinnen wahrnehmbar ist. Er beginnt mit dem Gedanken der Materie und versucht, alle
      Erscheinungen, auch das Denken, als rein materielle Prozesse zu erklären. So wird das Denken
      etwa als eine Tätigkeit des Gehirns aufgefasst, vergleichbar der Verdauung. Dies führt jedoch
      zu einem grundlegenden Widerspruch: Der Materialismus verlegt das Problem des Erkennens nur an
      einen anderen Ort, statt es zu lösen. Er schreibt der Materie die Fähigkeit zu, über sich
      selbst nachzudenken, und übersieht, dass der Denkakt selbst nicht aus stofflichen Vorgängen
      ableitbar ist. Damit verschiebt er die Frage, statt sie zu beantworten.


      Gleichwohl hat der Materialismus eine eingeschränkte Berechtigung. Er hat die
      Naturwissenschaften ermöglicht und lehrt eine genaue, sachliche Beobachtung der materiellen
      Vorgänge. Man ist nicht auf falscher Fährte, wenn man die stofflich bedingten Abläufe der Welt
      materialistisch darstellt. Der Irrtum beginnt erst dort, wo man diese Betrachtungsweise für
      die einzig mögliche hält und nicht erkennt, dass die Verfolgung der materiellen Zusammenhänge
      zuletzt zur Anschauung des Geistes führt. Der Materialismus ist daher eine notwendige, aber
      nicht endgültige Stufe der Welterkenntnis. Er bleibt einseitig, solange er nicht durch die
      Einsicht ergänzt wird, dass der Geist der Schöpfer des Gehirns ist, durch das er sich in der
      physischen Welt offenbart.
    references:
      - chunk_id: 613ec917-bd6c-569b-9c09-88f0c76e0a88
        description: Der Materialismus beginnt mit dem Gedanken der Materie und kann keine befriedigende
          Welterklärung liefern, weil er die Gedanken über die materielle Welt nicht aus dieser
          selbst ableiten kann.
        relevance: 0.95
      - chunk_id: 134bb849-a47f-5894-836c-2c260198b10b
        description: Der Materialismus hat eine eingeschränkte Berechtigung, und man ist nicht auf falscher
          Fährte, wenn man die materiell bedingten Vorgänge der Welt materialistisch darstellt.
        relevance: 0.95
      - chunk_id: 56c9f699-4aa2-54b2-bcb9-329f640ced07
        description: Andere Menschen sehen im Materiellen nur die Offenbarung des Geistigen und
