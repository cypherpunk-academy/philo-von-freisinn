  - term: Soziale Frage
    chunk_id: 458c6be0-f222-5f24-8dad-a431e732250b
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die soziale Frage wird als eine Wirtschafts-, Rechts- und Geistesfrage verstanden. Sie
      entsteht aus der Wahrnehmung konkreter Nöte, in denen sich Menschen befinden. Um diese Nöte
      sachgemäß zu erfassen, muss man den Weg von der bloßen Wahrnehmung der Not zu den Gedanken
      verfolgen, in denen diese Nöte ihre eigentliche Quelle haben. Denn die gegenwärtigen sozialen
      Verhältnisse beruhen auf lebensunmöglichen Gedanken, die das Zusammenarbeiten der Menschen
      bestimmen. Eine gesunde Einsicht in die soziale Frage erfordert daher, zu den Gedanken
      fortzuschreiten, aus denen das Zusammenarbeiten einer Gemeinschaft hervorgeht.


      Aus dieser Einsicht ergibt sich die Notwendigkeit, den sozialen Organismus in drei
      eigenständige Bereiche zu gliedern: ein selbständiges Geistesleben, ein eigenständiges
      Rechtsleben und ein ebenso eigenständiges Wirtschaftsleben. Diese drei Gebiete dürfen nicht
      von einem Mittelpunkt aus verwaltet werden, sondern müssen nach ihren eigenen
      Gesetzmäßigkeiten wirken können. Die Einheit des Ganzen ist dadurch gesichert, dass jeder
      Mensch mit seinen Interessen allen drei Bereichen angehört.


      Zentral ist dabei die Frage, wie die Forderungen der sozialen Bewegung erfüllt werden können,
      ohne die individuelle Entfaltung des Einzelnen zu unterdrücken. Der Einzelne muss die
      Möglichkeit haben, seine Fähigkeiten ungehemmt durch Kapitalverwertung in den Dienst der
      Gemeinschaft zu stellen.
    references:
