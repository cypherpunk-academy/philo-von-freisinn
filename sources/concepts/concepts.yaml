  - term: Glaube
    chunk_id: 07886263-b336-539e-9249-fe424ff90c62
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Glaube ist für die gegenwärtige menschliche Entwicklung eine unzureichende Form der
      Wahrheitsaneignung. Er fordert die Anerkennung von Wahrheiten, die man nicht ganz durchschaut.
      Damit widerstrebt er dem individuellen Wesen des Menschen, das alles mit seinem tiefsten
      Innern durchleben will. Der Mensch will nicht mehr bloß glauben; er will wissen. Nur das
      Wissen befriedigt, das keiner äußeren Norm unterworfen ist, sondern aus dem Innenleben der
      Persönlichkeit entspringt. Wer von Zweifeln gequält ist, dessen Kräfte sind gelähmt; nur die
      Wahrheit kann Sicherheit bringen im Entwickeln der individuellen Kräfte.


      Der Glaube an Vorstellungen, die man ohne Beobachtung für richtig hält, zeigt sich als
      Aberglaube. Man hat nicht das Recht, Ergebnisse einer Beobachtung zurückzuweisen, nur weil sie
      solchen Gedankenneigungen widersprechen. Die Entwicklung des Gedankenlebens ist durch Epochen
      fortgeschritten, in denen die Seele erstarkt und den Gedanken als ihr eigenes Erzeugnis fühlen
      lernt. In dieser Entwicklung kann der Glaube nicht mehr genügen. Die Menschheit steht an einem
      Punkt, an dem nur Bestrebungen gesund wirken, die von zu Ende gedachten Gedanken ausgehen. Der
