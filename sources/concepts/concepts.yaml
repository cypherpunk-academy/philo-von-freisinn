        relevance: 0.85
      - chunk_id: 7195087e-6201-5b4d-8f94-c0062f502010
        description: Kapital wird für einen sozialen Aufbau benötigt.
        relevance: 0.7
      - chunk_id: beff1862-ef82-5dd2-a8d2-a9981a50f5e1
        description: In einem auf Arbeitsteilung eingestellten sozialen Organismus erwirbt der einzelne sein
          Einkommen durch die Arbeit aller Beteiligten.
        relevance: 0.6
      - chunk_id: d4f39cf7-c704-55b7-91d3-3b27f96d0e76
        description: Die Dreigliederung des sozialen Organismus wird in den Kernpunkten der sozialen Frage
          näher erläutert.
        relevance: 0.5
      - chunk_id: 8e7d1d02-20f0-54bf-895e-bcf592cb3558
        description: Altgewordenen, Invaliden, Witwen und Kranken steht ein Recht auf Lebensunterhalt zu, zu
          dem die Kapitalgrundlage beitragen muss.
        relevance: 0.4
      - chunk_id: 4104bfd8-a50f-585e-9c3f-c39e45e68229
        description: In einem gesunden sozialen Organismus werden Produktionsmittel von ihrem Hersteller nur
          so lange verwaltet, wie er mit seinen individuellen Fähigkeiten dazu berechtigt ist.
        relevance: 0.4
      - chunk_id: 48682bc2-d709-5a53-a25d-3681d9656e3c
        description: Kredit aufgrund von Boden soll im gesunden sozialen Leben nur gewährt werden, um einem
          fähigen Menschen die Entfaltung eines Produktionsbetriebs zu ermöglichen.
        relevance: 0.3
      - chunk_id: 47e30d2a-a427-51bb-baaa-9a5924505265
        description: Eine Verwaltung des Wirtschaftskreislaufs kann zu Ausgleichen führen, die sich aus
          diesem Kreislauf als notwendig ergeben.
        relevance: 0.2
  - term: Körper
    chunk_id: a4140379-6496-5b43-830e-5c5ff124a8cd
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Körper ist die organische Grundlage, auf der alles bewusste Erleben und Erkennen aufbaut.
      Er folgt eigenen Naturgesetzen: er wächst, altert, verdaut, atmet. Diese Vorgänge laufen nach
      einer Notwendigkeit ab, die der Mensch nicht willkürlich ändern kann. Auch das Denken selbst
      ist an diese organische Tätigkeit gebunden. Gedanken reifen und zeitigen wie Früchte auf dem
      Feld; sie sind einer organischen Entwicklung unterworfen und lassen sich nicht jederzeit nach
      Belieben abrufen. Der Körper ist damit die Bedingung dafür, dass überhaupt ein Komplex von
      Empfindungen und Anschauungen entstehen kann, den wir Erfahrung nennen.


      Dennoch ist der Körper nicht das Ich. Du denkst dich zwar von ihm unterschieden, aber du bist
      deswegen noch lange nicht wirklich von ihm getrennt. Der Mensch ist ein untrennbares Ganzes:
      den Handelnden und den Erkennenden kann man nicht in zwei Teile zerreißen. Der Körper ist
      nicht bloßes Werkzeug eines davon unabhängigen Geistes, sondern die leibliche Voraussetzung
      dafür, dass bewusste Beweggründe des Handelns überhaupt wirksam werden können. Die Frage nach
      der Freiheit des Willens lässt sich daher nicht einseitig stellen, ohne zugleich die
      organische Bedingtheit des Menschen zu bedenken. Der Körper ist die notwendige, aber nicht
      hinreichende Bedingung dafür, dass der Mensch aus eigener Einsicht handeln kann.
    references:
      - chunk_id: 028221d8-8b5e-5e8b-8174-36731abfd3af
        description: Der Mensch denkt sich unterschieden von seinem Leib, ist aber im Wesen aufs innigste
          mit ihm verbunden.
        relevance: 0.95
      - chunk_id: c8f876e1-ab52-59f6-b379-79da2d789da7
        description: Die Frage nach der Freiheit des Willens kann nicht einseitig gestellt werden, sondern
          muss mit einer anderen Frage verknüpft werden.
        relevance: 0.9
      - chunk_id: 7ac38e16-a85b-5af9-893c-d33d379a1000
        description: Erst durch die Mitwirkung unseres Organismus entsteht der Komplex von Empfindungen und
          Anschauungen, den wir Erfahrung nennen.
        relevance: 0.85
  - term: Kraft
    chunk_id: 0f57727c-623f-5264-a06b-f40d8ea49172
    language: de
    tags:
      - concept
      - assistant-generated
    text: Kraft ist aus dieser Sicht kein stoffliches Etwas, das man messen oder isoliert betrachten
      könnte. Sie ist die innere, geistige Wirksamkeit, die in der äußeren Erscheinung sichtbar
      wird. Alles im Weltall gilt als Wirkung, als Manifestation eines schöpferischen Geistes. Wer
      von Kräften spricht, als wären sie tote, mechanische Größen, entfernt sich von der reinen
      Erfahrung. Die Erfahrung zeigt uns Vorgänge, nicht isolierte Kräfte. In der Naturbetrachtung
      Goethes ist Kraft das schöpferische Prinzip, das in der Pflanze oder im Tier die Gestalt
      hervorbringt. Der Mensch kann diese Kraft nicht von außen beobachten, sondern nur durch
      denkende Anschauung nachvollziehen. Sein Geist muss denkend anschauen und anschauend denken.
      Auf diese Weise wird die Kraft als das eigene Erzeugnis der Seele erlebt. Sie ist die
      sichtbare Seite eines unsichtbaren, geistigen Wirkens. Wer diesen Zusammenhang erfasst,
      erkennt, dass Kraft kein abstrakter Begriff ist, sondern die lebendige Tätigkeit eines
      Geistes, der in der Natur und im menschlichen Innern wirkt.
    references:
      - chunk_id: 37e4ea92-3e2f-50de-9a3c-35b68493a7af
        description: Ein Geist wirkt in der Natur und im menschlichen Innern, und alles im Weltall gilt als
          Wirkung eines schöpferischen Geistes.
        relevance: 0.95
      - chunk_id: db9c184b-2d67-5406-812c-d50699c40888
        description: Mechanisten sprechen in einer Weise von Stoffen und Kräften, die durch keine Erfahrung
          gerechtfertigt ist, und man sollte die reinen Aussprüche der Erfahrung geltend machen.
        relevance: 0.9
      - chunk_id: 6e88421f-dc27-5a41-b1e0-06d000d15d10
        description: Die Weltanschauung Goethes ist die treibende Kraft hinter seinen Einsichten in das
          Leben der Natur.
        relevance: 0.85
      - chunk_id: 03b22491-69fe-5e00-9cf5-a9c6a857fefc
        description: Unser Geist muss beim Erfassen des Typus intensiver wirken als beim Erfassen des
          Naturgesetzes und eine Tätigkeit auf sich nehmen, die in der unorganischen
          Naturwissenschaft die Sinne besorgen.
        relevance: 0.8
  - term: Lebensanschauung
    chunk_id: 1f131253-cde0-5d04-a3e6-2b325ec308fe
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Eine Lebensanschauung ist mehr als ein bloßes Weltbild oder eine theoretische Überzeugung. Sie
      entsteht nicht durch die Übernahme von Autoritäten oder Traditionen, sondern durch das eigene,
      freie Denken. Die Seele lernt den Gedanken als ihr eigenes Erzeugnis fühlen. Eine solche
      Anschauung ist nicht starr und abgeschlossen, sondern lebendig. Sie wächst mit jeder neuen
      Erfahrung und beantwortet die Fragen des Lebens in jedem Augenblick neu aus der inneren
      Seelentätigkeit heraus. Man kann sie nicht wie eine fertige Antwort mit sich tragen, sondern
      muss das Seelengebiet finden, auf dem sich die Antwort selbst immer wieder bildet.


      Diese Lebensanschauung verbindet Erkennen mit sittlichem Handeln. Aus der Erkenntnis des
      Lebens selbst gebiert sie die Impulse für Seelengesundheit und Tatbegeisterung. Sie dient
      nicht einer lebensfremden Wissenschaft oder einer sozial zerstörenden Lebensauffassung,
      sondern einer Wissenschaftsgesinnung, die dem Blut Wärme gibt, und einer sittlichen
      Lebensgrundlage, die kraftvollen Willen zeitigt. Die Einheit einer solchen Anschauung zeigt
      sich nicht in widerspruchsfreien Worten, sondern in der geschlossenen Persönlichkeit, die sie
      darlebt. Was der Mensch lebt, gehört immer einem sich selber tragenden Ganzen an. Eine echte
      Lebensanschauung ist daher das lebendige, sich stets erneuernde Ergebnis eines freien, tätigen
      Seelenlebens, das im Erkennen und Handeln seine eigene Berechtigung erweist.
    references:
      - chunk_id: 9630cb46-e358-5dae-ac7b-933f916218dc
        description: Die Einheit einer Anschauung zeigt sich weniger in Worten als in der Lebensführung, und
          was der Mensch lebt, gehört einem sich selbst tragenden Ganzen an.
        relevance: 0.95
      - chunk_id: ef261844-0543-5218-8a53-9a9ec67e49e4
        description: Die Anschauung wird ein Glied lebendigen Seelenlebens, keine fertige Antwort, sondern
          das Seelengebiet, auf dem sich die Antwort immer wieder bildet.
        relevance: 0.95
      - chunk_id: 4cfeb924-e2db-5f73-bf12-6ade44ce12cf
        description: Eine Wissenschaftsgesinnung, die dem Blut Wärme gibt, und eine künstlerische
          Weltempfindung, die den Menschen fördert, werden einer lebensfremden Wissenschaftlichkeit
          und Kunstgesinnung entgegengesetzt.
        relevance: 0.9
      - chunk_id: 40be9096-e8ef-599f-b04a-349b40f31ffc
        description: Eine befriedigende Weltanschauung weist auf eine Welt hin, aus der Antwort auf die
          Fragen kommt, und weist ihr Recht nach, solche Antworten geben zu dürfen.
        relevance: 0.4
      - chunk_id: 5a9978d0-781a-5f95-9653-9ec152e573d2
        description: Ein Mensch kann sich so in der Welt darleben, dass er in seinen Anlagen die besonderen
          Kräfte enthält, die ihn bestimmen.
        relevance: 0.3
      - chunk_id: c8f876e1-ab52-59f6-b379-79da2d789da7
        description: Die Frage nach der Freiheit des Willens muss mit anderen Fragen verknüpft werden, und
          bewusste Beweggründe führen zu anders beurteilten Handlungen als unbewusste Antriebe.
        relevance: 0.2
      - chunk_id: 03b59fe4-9b78-5605-a2f7-c78a4d238fa4
        description: Weltanschauungen, die die Welt als Illusion bezeichnen, suchen ein befriedigendes
          Verhältnis der Vorstellung vom selbstbewussten Ich zu einem Gesamtweltbilde.
        relevance: 0.2
      - chunk_id: 29824033-cc02-5beb-a9c9-74125aaa5c06
        description: Die Darstellung der philosophischen Ansichten in früheren Auflagen wurde erweitert und
          ergänzt, aber der Inhalt blieb im Wesentlichen wörtlich erhalten.
        relevance: 0.1
      - chunk_id: db8ae1f5-b967-567b-a7fd-99480378e991
        description: Eduard von Hartmanns Philosophie stand in erkenntnistheoretischen Fragen auf dem
          Standpunkt, dass der Mensch an gewisse Grenzen des Erkennens stößt, während der Autor eine
          innerlich erlebte Wirklichkeit vertritt.
        relevance: 0.1
  - term: Leib
    chunk_id: a70cd63d-aad2-53e1-9051-c33c32241150
    language: de
    tags:
      - concept
      - assistant-generated
    text: Der Leib ist diejenige Seite des Menschen, durch die er in die sinnlich wahrnehmbare Welt
      hineingestellt ist. Er unterliegt Geburt und Tod, ist vergänglich und den äußeren Eindrücken
      ausgesetzt. Der Leib ermöglicht die Wahrnehmung der Außenwelt; er liefert die Eindrücke, die
      das Denken ergreift und in Gedanken verwandelt. Der Leib ist nicht der ganze Mensch. Er wird
      von Seele und Geist unterschieden. Die Denktätigkeit selbst ist eine organische Tätigkeit, die
      an den Leib gebunden ist. Gedanken reifen und zeitigen müssen wie Früchte auf dem Feld; sie
      sind einer organischen Entwicklung unterworfen. Der Mensch ist aufs innigste mit seinem Leib
      verbunden. Auch wenn er sich in Gedanken von ihm unterscheidet, ist er deswegen noch lange
      nicht von ihm wirklich unterschieden. Der Leib ist die Bedingung, unter der sich der Mensch in
      der Welt zurechtfindet. Freiheit beginnt dort, wo der Mensch nicht mehr bloß seinen leiblichen
      Trieben folgt, sondern aus eigenen, geistigen Impulsen handelt. Der Leib ist die Grundlage,
      auf der der Mensch sich als freie Persönlichkeit begreifen kann, indem er sich der Ideenwelt
      bemächtigt, um sie zu seinen menschlichen Zielen zu gebrauchen.
    references:
      - chunk_id: 028221d8-8b5e-5e8b-8174-36731abfd3af
        description: Der Mensch ist im Wesen aufs innigste mit seinem Leib verbunden, auch wenn er sich in
          Gedanken von ihm unterscheidet.
        relevance: 0.95
      - chunk_id: 6cb5a82b-3646-503c-b46c-9d60a0db74f0
        description: Jede Abtrennung des Geistigen vom Leiblichen ist zuwider, weil es als
          Entwicklungsergebnis des Leiblichen verstanden werden muss.
        relevance: 0.85
      - chunk_id: 5a66f2bf-3c49-59e4-af28-ab027810f32d
        description: Der Mensch bemächtigt sich der Ideenwelt, um sie zu seinen menschlichen Zielen zu
          gebrauchen.
        relevance: 0.8
      - chunk_id: e31976d4-1f2b-56f0-a0ce-5687fee5ab33
        description: Unser Leben setzt sich aus Handlungen der Freiheit und der Unfreiheit zusammen; der
          freie Geist ist die reinste Ausprägung der menschlichen Natur.
        relevance: 0.7
      - chunk_id: 3ab88c24-98b2-5209-929c-7f28caf69f01
        description: Der Mensch findet sich denkend in der Welt zurecht; sein Erkenntnisorgan entsteht durch
          Anpassung an die Bedingungen der Außenwelt.
        relevance: 0.65
  - term: Leidenschaft
    chunk_id: 6f72c002-4e8f-56e7-9e77-552ae66087cc
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die Leidenschaft wird als ein seelischer Impuls verstanden, der aus dem Triebleben aufsteigt
      und sich mit einem Vorstellungsinhalt verbindet. Sie unterscheidet sich vom bloßen blinden
      Drang dadurch, dass sie auf einen bestimmten, vorgestellten Gegenstand oder ein Ziel gerichtet
      ist. Solange der Mensch einer Leidenschaft folgt, ohne sich der Gründe seines Handelns bewusst
      zu sein, handelt er unfrei. Er wird von einem unbewussten Antrieb getrieben, ähnlich dem Kind,
      das glaubt, die Milch frei zu begehren, oder dem Zornigen, der meint, die Rache frei zu
      wollen. In Wahrheit kennt er die Ursachen nicht, die ihn bestimmen. Die Leidenschaft gehört
      damit in den Bereich desjenigen Wollens, das noch nicht zur vollen Bewusstheit durchgedrungen
      ist.


      Dennoch ist die Leidenschaft nicht einfach zu verwerfen. Sie stellt eine notwendige Stufe der
      Entwicklung dar. Die sittlichen Ideale, die aus der moralischen Fantasie entspringen, müssen
      vom Menschen stark genug begehrt werden, um Schmerzen und Qualen zu überwinden. Dieses
      Begehren ist seiner inneren Natur nach eine geläuterte Leidenschaft, die nicht mehr blind
      treibt, sondern bewusst gewollt wird. Der Idealist schwelgt geistig bei der Verwirklichung
      seiner Ideale. Die Leidenschaft wird hier zum Träger eines freien, aus Erkenntnis handelnden
      Willens. Sie ist dann nicht mehr Zwang, sondern Ausdruck der eigenen, bewusst ergriffenen
      Intuition.
    references:
      - chunk_id: 80a859c8-240e-5aff-b29c-4805c0fc4200
        description: Sittliche Ideale entspringen der moralischen Fantasie und müssen stark genug begehrt
