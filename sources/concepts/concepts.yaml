        relevance: 0.65
  - term: Interesse
    chunk_id: 3785632f-774a-5d92-8f30-951da1b36f16
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Interesse ist ein aktiver, willentlicher Vorgang des Erkennens, der das Denken erst lebendig
      und persönlich macht. Es unterscheidet sich grundlegend von der Begierde: Während die Begierde
      den Gegenstand für sich nehmen und besitzen will, lässt das Interesse ihn in seinem eigenen
      Wesen bestehen. Interesse bedeutet, sich in den Gegenstand einzuleben, sein Verhältnis zu den
      Dingen zu belauschen und sich von ihnen bestimmen zu lassen, ohne sie zu vereinnahmen. Es ist
      die treibende Kraft im Erkenntnisprozess, ohne die das Denken leer bliebe und nur als ein
      Haben und Besitz beschweren würde. Ein Wissen, das nicht zum Wollen fortreißt und nicht ganz
      und gar mit der eigenen Person zusammengeht, bleibt eine ärmliche Vorbereitung auf das Leben.
      In der sozialen Sphäre zeigt sich Interesse als Achtung des anderen ohne Vereinnahmung. Es
      verbindet Erkennen und Handeln zu einem Ganzen und macht den Menschen zum freien,
      verantwortungsvollen Wesen, das aus Erkenntnis handelt und in Ideen kraftvollen Willen
      zeitigt. So wird Interesse zur Grundlage einer sittlichen Lebenshaltung, die den Menschen
      befähigt, frischen Sinnes die Welt zu durchziehen und an der Entdeckung derjenigen
      Lebensgrundlagen mitzuarbeiten, die Seelengesundheit und Tatbegeisterung gebären."
    references:
      - chunk_id: 5d2586b2-2e7b-5d38-834b-3a0835586f47
        description: Ein Wissen, das nicht zum Wollen fortreißt und nicht persönlich geworden ist, bleibt
          eine ärmliche Vorbereitung aufs Leben und beschwert als bloßer Besitz.
        relevance: 0.95
      - chunk_id: 9630cb46-e358-5dae-ac7b-933f916218dc
        description: Man muss das Verhältnis zu den Dingen belauschen, wenn man ihrem Wesen nachforscht, und
