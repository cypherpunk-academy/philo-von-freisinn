        relevance: 0.8
      - chunk_id: 8c502fb1-3f0f-5682-bb2a-b7439277dba5
        description: Der Begriff ist nicht als Bild innerhalb des Bewusstseins aufzufassen, sondern die
          Gedanken werden so genommen, wie sie vorgefunden werden.
        relevance: 0.75
      - chunk_id: 71bb4a4d-406f-54e5-84a8-3264f71b42f5
        description: Das Denken ist kein inhaltsleeres Gefäß, sondern für sich genommen inhaltsvoll.
        relevance: 0.7
  - term: Gedankenleben
    chunk_id: decf2cd5-c41a-5458-9a72-3a93dc87ca7f
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Das Gedankenleben ist die innere Tätigkeit, durch die der Mensch die Welt nicht nur als
      stumme Ansammlung sinnlicher Eindrücke erfährt, sondern als eine geordnete, durch geistige
      Formen gegliederte Wirklichkeit. Es ist nicht bloß ein passives Widerspiegeln äußerer
      Gegenstände. Der Gedanke wirkt zunächst wie eine Wahrnehmung von außen, stellt die Seele auf
      sich selbst und wird von ihr zunehmend als eigenes Erzeugnis empfunden. Die Seele lernt, den
      Gedanken in seinem eigenen Wesen durchzuarbeiten und sich seiner als Werkzeug zu bedienen. Die
      entscheidende Einsicht ist: Der Mensch entnimmt die Bestimmungen des Gedankens nicht dem
      Sinnesobjekt, sondern einer ihm zugänglichen Gedankenwelt. Das äußere Objekt veranlasst ihn
      lediglich, einen bestimmten Gedankeninhalt aus dieser Einheit aller möglichen Gedanken
      hervorzuholen. Die Bausteine dazu muss er aus sich selbst schöpfen. Im Sinnesobjekt erkennt er
      den Gedanken, den er aus seinem Inneren geholt hat, nur wieder. Ohne diese innere Tätigkeit
      bliebe die Welt ein chaotisches Nichts. Das Gedankenleben durchdringt die Wahrnehmung und
      verleiht ihr Bedeutung. In der Freiheit dieses inneren Erlebens, das sich unabhängig von
      leiblichen Bedingungen entfalten kann, liegt die Grundlage für eine selbstbestimmte
      menschliche Existenz, die nicht in der bloßen Abbildung einer äußeren Welt aufgeht."
    references:
      - chunk_id: f111f561-a4fe-5212-afb0-5eba342c83fd
        description: Der Mensch entnimmt alle Bestimmungen des Gedankens aus der Gedankenwelt, nicht aus dem
