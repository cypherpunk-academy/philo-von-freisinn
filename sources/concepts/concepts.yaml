        relevance: 0.3
  - term: Charakter
    chunk_id: 1880f716-7708-541e-b3ae-7a5f8d75909d
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Charakter ist nach dieser Auffassung kein starres, angeborenes Gefüge, sondern ein
      werdendes Gebilde. Er wird wesentlich durch die charakterologische Anlage bestimmt, die sich
      aus dem mehr oder weniger bleibenden Vorstellungs- und Gefühlsinhalt eines Menschen
      zusammensetzt. Diese Anlage ist das Ergebnis der bisherigen Lebenserfahrungen, der Fähigkeit
      zur Intuition und des Umkreises der Beobachtungen. Sie ist die Grundlage, auf die ein
      augenblicklicher Antrieb in Form eines Begriffs oder einer Vorstellung einwirken muss, damit
      ein wirklicher Willensakt zustande kommt.


      Entscheidend ist jedoch, dass der Mensch nicht an diese Anlage gebunden bleibt. Er kann seinen
      Charakter wandeln, indem er bewusst neue Motive aufnimmt. Sobald er die Berechtigung eines
      ideellen Inhalts als Grundlage einer Handlung ansieht, tritt er in das Wollen ein – unabhängig
      davon, ob dieser Begriff bereits als Anlage in ihm vorhanden war oder nicht. Ein solcher
      Antrieb gehört dann nicht mehr im strengen Sinne zur charakterologischen Anlage, denn er
      entspringt nicht einem bloß Individuellen, sondern dem allgemeinen Inhalt einer Intuition.


      Das Ziel der Entwicklung liegt in der Verwirklichung rein intuitiv erfasster
      Sittlichkeitsziele. Der Mensch erreicht solche Ziele, indem er die Fähigkeit besitzt, sich zum
      intuitiven Ideengehalt der Welt zu erheben.
    references:
      - chunk_id: 6e1071f1-430b-5a4f-b65c-352280d76088
        description: Ein Antrieb aus Intuition gehört nicht zur charakterologischen Anlage, da er nicht
          individuell, sondern ideell und allgemein ist; sobald ich seine Berechtigung als
          Handlungsgrundlage ansehe, trete ich ins Wollen ein,...
        relevance: 1
      - chunk_id: 71e9aaea-335e-58de-a0ca-d00a38d3ad2f
        description: Die charakterologische Anlage wird durch den bleibenden Vorstellungs- und Gefühlsinhalt
          des Subjekts gebildet; ob eine Vorstellung zum Wollen anregt, hängt von ihrem Verhältnis
          zu diesem Inhalt ab, der wiederum durch...
        relevance: 1
      - chunk_id: 78a6d735-7199-5fc8-ac7e-7777912dbe40
        description: Das Ziel der Entwicklung besteht in der Verwirklichung rein intuitiv erfasster
          Sittlichkeitsziele; auf dem Weg zu diesem Ziel spielen Normen eine berechtigte Rolle.
        relevance: 1
      - chunk_id: 27c4e7a6-54b4-5312-a449-6c4f2cd216d0
        description: Ein Einwand gegen die Verbindung von individuellem Handeln und rein ideeller Intuition
          beruht auf einer Verwechselung von sittlichem Motiv und wahrnehmbarem Inhalt der Handlung.
        relevance: 0.8
      - chunk_id: c8f876e1-ab52-59f6-b379-79da2d789da7
        description: Die Frage nach der Willensfreiheit darf nicht einseitig gestellt werden, sondern muss
          mit einer anderen verknüpft werden; ein bewusster Beweggrund führt zu einer anderen
          Handlungsbeurteilung als ein unbewusster Antrieb.
        relevance: 0.6
  - term: Denker
    chunk_id: 9dd4cd15-25af-56e2-9cb3-f7d49a4f9708
    language: de
    tags:
      - concept
      - assistant-generated
    text: Der Denker ist für eine bestimmte Betrachtungsweise nicht derjenige, der fertige Gedanken
      passiv aufnimmt oder lediglich viel weiß. Er ist vielmehr der Mensch, der das Denken als eine
      lebendige, schöpferische Tätigkeit erlebt. Beim Denken weiß er, wie es gemacht wird; er ist
      nicht bloßer Zuschauer eines Geschehens, sondern er selbst ist es, der im Denken drinstehend
      seine eigene Tätigkeit beobachtet. Das Denken wird dabei nicht als eine subjektive, private
      Angelegenheit aufgefasst, sondern als eine Tätigkeit, die Zusammenhänge in der Welt herstellt
      und damit objektive Bedeutung hat. Der Denker hält das Weltgeschehen an einem Zipfel, wo er
      selbst dabei sein muss, wenn etwas zustande kommen soll. Er ist daher kein passiver Empfänger
      von Eindrücken, sondern ein Mitgestalter, der durch seine denkende Betrachtung die Welt
      begreift und sich zu ihr in Beziehung setzt. Diese Tätigkeit entspringt der eigenen Initiative
      des Ich und ist der ursprünglichste Ausgangspunkt für das Betrachten alles Weltgeschehens. Der
      Denker handelt aus dieser inneren Selbsttätigkeit heraus und wird so zum Mitschöpfer an den
      Weltenrätseln und der Weltentwicklung. In diesem Sinne ist der Denker derjenige, der das
      Denken als eine freie, selbstbestimmte und welterzeugende Kraft in sich erfährt.
    references:
      - chunk_id: a5568ad8-99e8-54c4-b8d3-daf47b74c343
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 1
      - chunk_id: 4cfeb924-e2db-5f73-bf12-6ade44ce12cf
        description: Hohe semantische Aehnlichkeit zum finalen Text.
