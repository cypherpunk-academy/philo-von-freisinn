        relevance: 0.999
  - term: Gestalt
    chunk_id: 173c0661-eb34-5ab7-8ea4-179b0d7a2b3f
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Der Begriff „Gestalt“ bezeichnet bei diesem Denker nicht eine bloß äußere, mechanisch
      zusammengesetzte Form, sondern etwas, das aus einem inneren, lebendigen Bildungsprozess
      hervorgeht. In der unorganischen Natur lassen sich Tatsachen als notwendige Folgen anderer
      Tatsachen erklären. In der organischen Welt hingegen kommt ein entscheidender Faktor hinzu:
      Die spezialisierte Gestalt eines Lebewesens lässt sich nicht passiv von äußeren Einwirkungen
      bestimmen, sondern sie bestimmt sich aktiv aus sich selbst heraus, unter dem Einfluss der
      Umgebung. Die äußere Erscheinung tritt hier einem in sich gestalteten Inhalt gegenüber, aus
      dem sich die Eigenschaften des Wesens ableiten lassen. Zugleich ist der Mensch an der
      Hervorbringung dieser Gestalt im Erkennen aktiv beteiligt. Er schafft die Erscheinungsform
      nicht nach, indem er einen fertigen Kern sucht, sondern er wirkt an ihrer Hervorbringung mit,
      und zwar aus dem Wesen der Sache heraus. Gestalt ist daher kein starres Abbild, sondern das
      Ergebnis eines inneren, bildenden Prinzips, das der Mensch im Erkennen mitvollzieht. Sie ist
      das, was sich im Zusammenspiel von innerer Gesetzmäßigkeit und äußerer Einwirkung als
      individuelle, lebendige Form zeigt."
    references:
      - chunk_id: fa9c2477-a053-5641-9c3f-8e0fb6740239
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 1
