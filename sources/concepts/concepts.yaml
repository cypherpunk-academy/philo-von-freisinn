  - term: Proletarier
    chunk_id: d54c8f4c-5464-523e-9fdc-385247e32b1e
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Proletarier ist für diese Betrachtung kein rein wirtschaftliches oder soziologisches
      Phänomen, sondern ein Mensch in einer bestimmten Bewusstseinslage. Er erlebt seine Arbeit als
      fremdbestimmt und kann in ihr keine innere Befriedigung finden, weil ihm ein tragender
      Seeleninhalt fehlt. Die herrschende Klasse hat ihn zwar zur Arbeit an den Produktionsmitteln
      aufgerufen, aber versäumt, ihm zu dieser Arbeit einen geistigen Halt zu geben. Aus dieser
      Leere heraus entsteht ein tief sitzender Abscheu davor, die eigene Arbeitskraft wie eine Ware
      auf dem Markt verkaufen zu müssen. Dieser Abscheu ist ein Grundimpuls der proletarischen
      Bewegung.


      Der Proletarier sucht nach einem Geistesleben, das ihm das Bewusstsein seiner Menschenwürde
      geben kann. Da er das überlieferte Gedankenleben aber nur als unwirkliche Ideologie empfindet,
      findet er diesen Halt nicht. Er ersetzt das fehlende geistige Fundament durch das aus dem
      Wirtschaftsleben geborene Klassenbewusstsein. Die Lösung liegt nicht im Klassenkampf, sondern
      in einer Neuordnung des sozialen Organismus, die dem Arbeiter das Gefühl gibt, ein freier
      Mensch zu sein. Eine solche Neuordnung muss die drei Bereiche Wirtschaft, Recht und
      Geistesleben voneinander unabhängig machen, damit das Geistesleben seine tragende Kraft
      entfalten kann.
    references:
      - chunk_id: 3442daff-90fc-563f-85ae-17525e0166b9
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 1
      - chunk_id: 3442daff-90fc-563f-85ae-17525e0166b9
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 0.9994
