  - term: Geistiges Leben
    chunk_id: ea7b8967-0fa8-5afd-93b0-7197979b2c69
    language: de
    tags:
      - concept
      - assistant-generated
    text: Das geistige Leben ist im Verständnis der Dreigliederung des sozialen Organismus ein
      eigenständiger, von Staat und Wirtschaft unabhängiger Bereich. Es umfasst Wissenschaft, Kunst,
      Religion, Weltanschauung, das gesamte Erziehungs- und Schulwesen sowie die richterliche
      Rechtsprechung. Seine Besonderheit liegt darin, dass es aus den eigenen Impulsen und aus der
      Initiative des einzelnen Menschen heraus entsteht, nicht aus Vorschriften oder Gesetzen, die
      von außen gegeben werden. Ein freies Geistesleben schafft aus den Tiefen der menschlichen
      Wesenheit heraus Interessen, die das Wirken in der Gemeinschaft sinnvoll und inhaltreich
      machen. Es pflegt die Fähigkeiten um ihrer selbst willen und erzeugt so das Bewusstsein, mit
      diesen Fähigkeiten sinnvoll im Dasein zu stehen. Damit dieses geistige Leben gedeihen kann,
      muss es in völliger Freiheit und Selbstverwaltung gestaltet werden. Weder der Staat noch die
      Wirtschaft dürfen in seine Belange hineinreden oder hineinregieren. Die Verwaltung des
      Geisteslebens muss von denen besorgt werden, die selbst im Unterrichten und Erziehen stehen,
      denn nur aus unmittelbarer Erfahrung können sachliche und fachliche Urteile über die
      Ausbildung der heranwachsenden Fähigkeiten gefällt werden. Ein so verstandenes geistiges Leben
      befruchtet dann das Rechts- und Wirtschaftsleben, indem es die Kräfte bereitstellt, die diese
      aus sich selbst nicht hervorbringen können.
    references:
      - chunk_id: 87853dc0-b0aa-5508-bed9-6d0437eeac5b
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 1
      - chunk_id: 7918111a-47aa-5a1b-bbdb-20e388438195
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 0.994
