        relevance: 0.6
  - term: Freies Geistesleben
    chunk_id: b5dca6a9-aa45-51c2-989e-e9fca85a63a1
    language: de
    tags:
      - concept
      - assistant-generated
    text: Der Begriff bezeichnet ein eigenständiges, von Staat und Wirtschaft unabhängiges Gebiet des
      gesellschaftlichen Lebens. Es umfasst Bereiche wie Erziehung, Wissenschaft, Kunst, Religion
      und Rechtspflege, die aus individueller Einsicht und schöpferischer Kraft entstehen. Das freie
      Geistesleben darf weder von staatlicher Bevormundung noch von wirtschaftlichem Gewinnstreben
      gelenkt werden. Es lebt aus der Freiheit des einzelnen Menschen, unabhängig von äußeren
      Zwängen. Gefordert wird die völlige Verselbständigung des Geisteslebens, einschließlich des
      Erziehungs- und Schulwesens. Ein Geistesleben, das seine Direktiven von der politischen
      Verwaltung oder von den Mächten des Wirtschaftslebens erhält, kann keine Schule pflegen, deren
      Impulse von der Lehrerschaft selbst restlos ausgehen. Eine freie Schule stellt Menschen in das
      Leben, die im Staat und in der Wirtschaft ihre volle Kraft entfalten können. Das freie
      Geistesleben schafft aus den Tiefen der Menschenwesenheit Interessen, welche die Arbeit und
      alles Wirken in die Gemeinschaft ziel- und inhaltbegabt hineinstellen. Es erzeugt in den
      Menschen das Bewusstsein, dass sie mit ihren Fähigkeiten sinnvoll im Dasein stehen, weil es
      diese Fähigkeiten um ihrer selbst willen pflegt. Die Gemeinschaft nimmt unter dem Einfluss so
      gepflegter Fähigkeiten stets den Charakter an, in dem sich diese auch auswirken können. Das
      Rechts- und Wirtschaftsleben erhalten ein Gepräge, das den entwickelten Fähigkeiten
      entspricht.
    references:
      - chunk_id: 4be517bc-8132-52bd-8671-ce78a0a12318
        description: Ein Geistesleben, das seine Direktiven von der politischen Verwaltung oder von den
          Mächten des Wirtschaftslebens erhält, kann nicht eine Schule in seinem Schoß pflegen.
        relevance: 0.95
      - chunk_id: 87853dc0-b0aa-5508-bed9-6d0437eeac5b
