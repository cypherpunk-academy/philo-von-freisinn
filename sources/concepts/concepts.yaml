  - term: Beobachtung
    chunk_id: 5069adb1-6867-5286-839c-624ab792e990
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Beobachtung ist der methodische Ausgangspunkt allen Erkennens. Sie ist kein passives
      Aufnehmen, sondern ein aktives, bewusstes Hinwenden zu einer Erscheinung. Alles, was in den
      Kreis unserer Erlebnisse eintritt – Empfindungen, Wahrnehmungen, Gefühle, Willensakte,
      Vorstellungen, Begriffe, aber auch Illusionen – wird uns zunächst durch die Beobachtung
      gegeben. Die Beobachtung liefert das „Gegebene“, das für sich genommen unverbunden und
      zusammenhanglos dasteht. Erst durch das Denken, das die Begriffe zu den beobachteten Inhalten
      hinzufügt, wird ein verständlicher Zusammenhang hergestellt. Ohne Beobachtung bleibt das
      Denken leer; ohne Denken bleibt die Beobachtung stumm.


      Die Beobachtung ist nicht auf die äußere Sinneswelt beschränkt. Auch Gedanken, Gefühle und
      innere Regungen können beobachtet werden. Eine besondere Stellung nimmt dabei die Beobachtung
      des Denkens selbst ein. Während wir einen äußeren Gegenstand und das Denken darüber nicht
      gleichzeitig beobachten können, ist die Beobachtung des Denkens ein Ausnahmezustand: Wir
      müssen uns auf einen Standpunkt außerhalb unserer eigenen Tätigkeit versetzen. Diese
      Beobachtung ist jedoch die wichtigste, die der Mensch machen kann, denn er beobachtet etwas,
      dessen Hervorbringer er selbst ist, und durchschaut dessen Verhältnisse und Beziehungen. Das
      menschliche Bewusstsein ist der Schauplatz, auf dem Beobachtung und Begriff einander begegnen
      und verknüpft werden.
    references:
      - chunk_id: 2cb4f608-6f5d-5504-8351-37a111f23c4e
        description: Das Denken als Beobachtungsobjekt unterscheidet sich von anderen Dingen, da man es
          nicht gleichzeitig mit dem beobachteten Gegenstand beobachten kann, sondern sich auf einen
          Standpunkt außerhalb der eigenen Tätigkeit...
        relevance: 0.95
      - chunk_id: d06a0db8-93de-573a-955e-2b9b772acf51
        description: Die Beobachtung des Denkens ist die allerwichtigste, weil der Mensch dabei seine eigene
          Tätigkeit hervorbringt und deren Verhältnisse und Beziehungen durchschaut.
        relevance: 0.95
      - chunk_id: 08babfbd-28d1-5248-b809-31f3ec31afa8
        description: Beobachtung ist notwendig, weil Denken und Gegenstand getrennt auftreten und der
          Gegenstand nur durch Beobachtung zugänglich ist.
        relevance: 0.9
      - chunk_id: 5e28d9a3-df76-5eac-ba75-5e0dac854abf
        description: Das menschliche Bewusstsein ist der Schauplatz, wo Begriff und Beobachtung einander
