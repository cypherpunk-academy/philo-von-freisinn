  - term: Erkennen
    chunk_id: de52cb6d-9109-50cb-a209-1046a6b9e970
    language: de
    tags:
      - concept
      - assistant-generated
    text: Erkennen ist kein passives Aufnehmen von Gegebenem, sondern ein lebendiger Vorgang, an dem der
      Mensch aktiv teilnimmt. Die Welt tritt dem Menschen zunächst als Wahrnehmung entgegen – als
      eine Vielheit von Einzelheiten, die er vorfindet, ohne sie durch bewusste Tätigkeit
      hervorgebracht zu haben. Zugleich bringt der Mensch im Denken Begriffe hervor. Diese Begriffe
      sind nicht willkürlich, sondern entsprechen der Sache selbst. Erkennen bedeutet, den Begriff
      in der Wahrnehmung wiederzufinden, den der denkende Mensch selbst hervorbringt. Wahrnehmung
      und Begriff sind ursprünglich getrennt; erst in ihrer Verbindung entsteht Wirklichkeit im
      menschlichen Bewusstsein. Der Erkenntnisakt ist die Synthese beider. Die Wahrnehmung ist die
      eine Seite der totalen Wirklichkeit, der Begriff die andere. Beide machen erst das ganze Ding
      aus. Der Mensch reißt durch seine geistige Organisation die Wirklichkeit in diese beiden
      Faktoren auseinander. Erst der Zusammenhang beider, die gesetzmäßig sich in das Universum
      eingliedernde Wahrnehmung, ist volle Wirklichkeit. Erkennen ist ein schöpferischer, aber kein
      beliebiger Akt. Es beruht darauf, dass uns der Weltinhalt ursprünglich in einer
      unvollständigen Form gegeben ist, die eine zweite wesentliche Seite hat. Diese zweite Seite
      wird durch die Erkenntnis enthüllt. So ist Erkennen die Vereinigung von innerem und äußerem
      Element, durch die der Mensch die Wirklichkeit in ihrem vollen Umfang erfasst.
    references:
      - chunk_id: 4e3036c5-1bff-5286-9ad1-9dadb67ac23f
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 1
