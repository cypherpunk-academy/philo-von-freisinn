  - term: Überzeugung
    chunk_id: e403c4ca-ddc5-5635-901e-70f4a94e8597
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Eine Überzeugung entsteht nicht durch äußere Autorität, durch Überlieferung oder durch
      Denkgewohnheiten, in die man durch Erziehung und Lebensumstände hineingewachsen ist. Sie ist
      vielmehr das Ergebnis eines selbsttätigen, inneren Erkenntnisprozesses. Der Mensch gelangt zu
      einer echten Überzeugung, indem er seine Beobachtungen der Wirklichkeit mit dem ordnenden
      Verstand durchdringt und die Gedankengänge konsequent bis zu Ende verfolgt. Dabei darf er sich
      nicht von ungeprüften Vorstellungen leiten lassen, die er für richtig hält, nur weil sie ihm
      vertraut sind. Eine solche Haltung wäre Aberglaube.


      Die Überzeugung muss im freien Austausch mit anderen reifen können. Die Freiheit des einen
      kann nicht ohne die Freiheit des anderen gedeihen. Deshalb darf das Geistesleben – Kunst,
      Wissenschaft, Weltanschauung – nicht von äußeren Mächten gelenkt werden, sondern muss sich aus
      seinen eigenen Impulsen heraus entfalten. Nur in dieser selbständigen Stellung kann die Kraft
      entstehen, die das geistige Leben im sozialen Organismus trägt.


      Eine Überzeugung ist kein passiver Besitz, sondern ein aktiver Vorgang. Sie erfordert, dass
      der Mensch die Gedanken nicht nur aufnimmt, sondern sie innerlich nachvollzieht und als sein
      eigenes Erzeugnis erlebt. Wer sich auf diese Weise eine Überzeugung erarbeitet, handelt nicht
      aus einem äußeren Gebot, sondern aus der inneren Kraft des erkannten Gedankeninhalts. So wird
      die Überzeugung zur Grundlage eines freien, selbstbestimmten Handelns.
    references:
      - chunk_id: a8a720cf-7f41-5b8a-9f30-6b10fe1c770e
        description: Man hat nicht das Recht, Ergebnisse einer Beobachtung zurückzuweisen, weil sie
