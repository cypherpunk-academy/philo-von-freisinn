  - term: Geisteswelt
    chunk_id: dba10dc4-54d8-5934-b4e2-b933359a49a5
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die Geisteswelt ist bei Steiner keine jenseitige Sphäre, sondern unmittelbar mit dem Denken
      und Erkennen verbunden. Der Mensch lebt in einer wahrhaftigen Geistwelt, die ihm durch das
      Denken zugänglich wird. Im Gedanken erlebt sich der Mensch als unmittelbar Tätiges; er
      vollzieht das Denken selbst und entnimmt alle Bestimmungen des Gedankens aus der Gedankenwelt.
      Diese ist die Welt der Begriffe, die der Mensch aus seinem Inneren schöpft. Das Denken
      erschließt dabei eine objektive Wirklichkeit: Der Gedanke ist nicht bloß subjektives Abbild
      einer Außenwelt, sondern wird in seinem eigenen Wesen durchgearbeitet. Die Geisteswelt ist
      also keine bloße Vorstellung, sondern ein Gebiet, in dem der Mensch tätig lebt.


      Mit dieser Geisteswelt ist auch die Freiheit verbunden. Der Mensch als sittlicher, freier
      Geist muss selbsttätig seinen Begriff mit der Wahrnehmung vereinigen. Er ist nicht von außen
      bestimmt, sondern muss aus eigenem Inneren heraus handeln. Die Geisteswelt ist daher kein
      fertiger Ort, den man betritt, sondern eine Wirklichkeit, die der Mensch durch sein Denken und
      Erkennen selbst hervorbringt und in der er sich als tätiges Wesen erfährt. Sie ist die
      Grundlage dafür, dass der Mensch bewusst aus eigenen Impulsen leben und zugleich die Grenzen
      der eigenen Freiheit erkennen kann.
    references:
      - chunk_id: f111f561-a4fe-5212-afb0-5eba342c83fd
        description: Der Mensch entnimmt alle Bestimmungen des Gedankens aus der Gedankenwelt.
        relevance: 0.9
      - chunk_id: fa9c2477-a053-5641-9c3f-8e0fb6740239
