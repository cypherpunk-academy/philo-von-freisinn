  - term: Unlust
    chunk_id: 40457ef7-6475-5eba-9e47-b3fb7762277d
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Unlust ist ein Gefühl, das im menschlichen Leben als unmittelbare Wahrnehmung auftritt und
      nicht allein aus Begriffen abgeleitet werden kann. Sie entsteht auf verschiedene Weise: durch
      Nichterfüllung eines Begehrens, durch aufgedrängte Arbeit, durch Langeweile oder durch
      Ereignisse, die ohne vorheriges Streben an den Menschen herantreten, wie etwa Krankheit.
      Unlust kann das Streben nach einem als berechtigt erkannten Ziel lähmen. Sie ist jedoch nicht
      einfach das Gegenteil von Lust, denn das Streben selbst ist lustvoll, unabhängig von der
      späteren Erfüllung. Die Unlust an der Nichterfüllung kann durch die Erinnerung an die Lust des
      Strebens gemildert werden. Entscheidend ist, dass Unlust nicht aus der Lebensbilanz
      ausgeschlossen werden darf, nur weil sie an Gegenstände geknüpft ist, die sich später als
      Illusion erweisen. Der Mensch muss die tatsächliche Größe von Lust und Unlust in Rechnung
      bringen, wie sie im Leben erfahren wird. Die Vernunft kann den Überschuss an Unlust nicht von
      sich aus bestimmen, sondern muss ihn im Leben als Wahrnehmung zeigen. Wenn das Unlustquantum
      so groß wird, dass keine Hoffnung auf künftige Lust mehr besteht, kann dies zum Bankrott des
      Lebensgeschäfts führen. Unlust ist damit ein notwendiger Bestandteil der Lebenserfahrung, der
      nicht theoretisch wegdiskutiert werden kann."
    references:
      - chunk_id: 25d7ea61-7568-580f-b0a7-0eec7dbd5154
        description: Die Vernunft kann den Überschuss an Lust oder Unlust nicht allein von sich aus
          bestimmen, sondern muss ihn im Leben als Wahrnehmung zeigen.
        relevance: 0.95
      - chunk_id: 152da65e-2b58-58ff-8d40-03fe87cada60
