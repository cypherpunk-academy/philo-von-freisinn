        relevance: 0.85
      - chunk_id: ec9110e2-37f1-5b51-a28d-3de917f8cfcb
        description: Die Summe der in uns wirksamen Ideen, der reale Inhalt unserer Intuitionen, macht das
          aus, was bei aller Allgemeinheit des Ideals individuell ist.
        relevance: 0.8
  - term: Motiv
    chunk_id: b9c790e8-dfd2-54d3-874d-e81521b2417f
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Ein Motiv ist ein bewusster Beweggrund des Handelns, der in Form eines Begriffs oder einer
      Vorstellung auf die charakterologische Anlage eines Menschen einwirkt. Es unterscheidet sich
      grundlegend von einem unbewussten Antrieb oder blinden Trieb, weil es als gedanklicher Inhalt
      im Bewusstsein präsent ist. Ein Motiv entsteht nicht aus der menschlichen Organisation selbst,
      sondern tritt von außen oder aus dem eigenen Denken an den Menschen heran und wird von ihm als
      handlungsleitend erfasst.


      Die entscheidende Frage für die Freiheit des Willens ist, ob ein Mensch gezwungen ist, einem
      Motiv zu folgen, oder ob er es aus eigener Einsicht ergreift. Wenn ein Motiv mit zwingender
      Notwendigkeit wirkt, hat der Gedanke an Freiheit keinen Sinn. Freiheit beginnt dort, wo der
      Mensch die Berechtigung eines Motivs selbst erkennt und es nicht aufgrund äußerer Autorität,
      Gewohnheit oder Furcht übernimmt. Ein Motiv kann aus einem allgemeinen sittlichen Prinzip
      stammen, das als Gebot auftritt, oder aus einer rein intuitiv erfassten Idee. Die höchste Form
      des Wollens liegt vor, wenn das Motiv aus einer moralischen Intuition entspringt, die der
      Mensch selbstständig für den einzelnen Fall entwickelt. Dann fallen Triebfeder und Motiv
      zusammen, und die Handlung wird durch ihren eigenen idealen Gehalt bestimmt.
    references:
      - chunk_id: 1f2c4889-4dd3-561e-ba91-019293b8d311
        description: Wenn ein Motiv als das stärkste wirkt und der Mensch gezwungen ist, ihm zu folgen,
          verliert der Gedanke an Freiheit seinen Sinn.
        relevance: 0.9
      - chunk_id: c8f876e1-ab52-59f6-b379-79da2d789da7
        description: Es gibt einen Unterschied zwischen einem bewussten Beweggrund des Handelns und einem
          unbewussten Antrieb, der zu unterschiedlichen Beurteilungen der Handlung führt.
        relevance: 0.9
      - chunk_id: 6e1071f1-430b-5a4f-b65c-352280d76088
        description: Ein Antrieb aus ideellem Inhalt der Intuition gehört nicht mehr zu den
          charakterologischen Anlagen, sondern führt zum Wollen, sobald seine Berechtigung erkannt
          wird.
        relevance: 0.9
      - chunk_id: cee64ed8-3468-5f14-b71d-78cbfb807abb
        description: Für den einzelnen Willensakt sind Motiv und Triebfeder zu unterscheiden, wobei das
          Motiv ein begrifflicher oder vorstellungsmäßiger Inhalt ist.
        relevance: 0.9
      - chunk_id: fc5917e7-8774-5872-b6c3-6b28e387e76f
        description: Auf der höchsten Stufe der Sittlichkeit fallen Triebfeder und Motiv zusammen, da weder
          eine charakterologische Anlage noch ein äußeres normatives Motiv wirkt.
        relevance: 0.9
      - chunk_id: 27c4e7a6-54b4-5312-a449-6c4f2cd216d0
        description: Der Einwand, dass Handeln zugleich individuell und rein ideell aus Intuition bestimmt
          sein könne, beruht auf einer Verwechselung von sittlichem Motiv und wahrnehmbarem Inhalt
          der Handlung.
        relevance: 0.8
      - chunk_id: 34281c83-c7df-58f6-8cb9-95e76962f1a7
        description: Beim freien Geist wird der allgemeinbegriffliche Antrieb in die konkrete Vorstellung
          des Handelns umgesetzt, ohne dass Vorbild oder Furcht treiben.
        relevance: 0.8
      - chunk_id: ef143008-cd33-5e66-ab5e-89883f1cb809
        description: Es ist zu unterscheiden zwischen subjektiven Anlagen als Triebfedern und Vorstellungen
          oder Begriffen als Zielen der Sittlichkeit.
        relevance: 0.8
      - chunk_id: e50ef60d-2cba-53e7-9cd1-081508a6fd67
        description: Der rein begriffliche Inhalt einer Handlung ist ein weiteres Motiv, das sich auf ein
          System sittlicher Prinzipien bezieht und Unterwerfung unter den sittlichen Begriff
          erfordert.
        relevance: 0.8
  - term: Mystik
    chunk_id: e9af7235-3f57-52ee-9c00-67f37f01f6f5
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Mystik ist für diese Betrachtung kein Gegensatz zur Erkenntnis, sondern ein Erkenntnisweg, der
      über die Grenzen des gewöhnlichen Denkens hinausführt. Sie geht darauf aus, in der
      menschlichen Seele den Urgrund der Dinge zu finden. Dabei wird jedoch eine einseitige Mystik
      abgelehnt, die durch Ekstase und bloße Gefühlssteigerung zu höheren Erkenntnissen gelangen
      will und dabei das vernunftgemäße Denken abtötet. Eine solche, nur auf das Gefühl gebaute
      mystische Anschauungsweise beruht auf einem Irrtum: Sie will erleben, was sie wissen sollte,
      und versucht, ein rein individuelles Gefühl zu einem Allgemeingültigen zu erheben.


      Echte Mystik ist dagegen ein bewusster, denkender Vorgang. Sie begreift das Denken als ein
      aktives Organ der Wahrnehmung. Die Seele lernt den Gedanken als ihr eigenes Erzeugnis fühlen
      und erstarkt im Selbsterleben ihres Eigenwesens. Es ist die höchste Form der Selbstbesinnung
      des denkenden Menschen. Der Mystiker sucht nicht in dumpfer Innerlichkeit, sondern in der
      klaren, durchgearbeiteten Gedankenwelt das Wesen der Dinge. Die gedankliche Klarheit wird
      dabei nicht als nüchterne Verstandesweisheit verachtet, sondern als der Weg angesehen, in die
      Tiefen des Inhalts der Ideenwelt hinabzusteigen und die Wärme zu empfinden, die von ihr
      ausströmt. So wird Mystik zu einer Steigerung des Denkens, nicht zu seiner Aufgabe.
    references:
      - chunk_id: a0b111a6-6ac6-5276-9b66-2a9d43c95c81
        description: Der Irrtum einer bloß auf das Gefühl gebauten mystischen Anschauungsweise besteht
          darin, dass sie erleben will, was sie wissen soll.
        relevance: 0.95
      - chunk_id: f8b8fdff-0061-5a88-b941-7c18d3c159dd
        description: Mystik geht darauf aus, in der menschlichen Seele den Urgrund der Dinge zu finden.
