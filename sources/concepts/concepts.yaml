  - term: Sittliche Idee
    chunk_id: df095acd-3e33-5b51-ba5e-0f57e11be49a
    language: de
    tags:
      - concept
      - assistant-generated
    text: Eine sittliche Idee ist kein von außen auferlegtes Gebot, keine gesellschaftliche Konvention
      und kein abstraktes Moralprinzip, dem man sich unterwerfen müsste. Sie entspringt vielmehr aus
      der inneren Einsicht und Anschauung des einzelnen Menschen. Der Antrieb zum Handeln liegt
      nicht außerhalb, sondern im Menschen selbst. Er ist sein eigener Gesetzgeber. Die sittlichen
      Ideale entstehen aus der moralischen Fantasie, die für den konkreten Einzelfall die
      entsprechende Handlungsvorstellung hervorbringt. Diese individuelle Intuition ist die
      Triebfeder des freien Handelns. Der Mensch will seine sittliche Idee verwirklichen, weil ihr
      Inhalt sein eigenes Wesen ausmacht und ihre Umsetzung seine höchste Lust ist. Er handelt
      nicht, weil ein Sollen über ihm schwebt, sondern weil die sittliche Idee vermöge ihres Inhalts
      in ihm tätig ist und ihn leitet. Freiheit besteht darin, aus solchen selbst erkannten
      sittlichen Ideen zu handeln. Da diese Ideen aus der gemeinsamen Ideenwelt geschöpft werden,
      können sich freie Menschen in ihren Intentionen begegnen, ohne sich gegenseitig zu behindern.
      Die Grundmaxime des freien Menschen ist das Leben in der Liebe zum eigenen Handeln und das
      Lebenlassen im Verständnis des fremden Wollens. Die sittliche Idee ist somit der individuell
      geschaute, gedankliche Impuls, der das souveräne Wollen des Menschen bestimmt.
    references:
      - chunk_id: 80a859c8-240e-5aff-b29c-4805c0fc4200
        description: Sittliche Ideale entspringen aus der moralischen Fantasie des Menschen, ihre
          Verwirklichung ist seine höchste Lust.
        relevance: 0.95
      - chunk_id: 6dc60a4a-3b9c-5e0e-b44d-cfcba962201c
        description: Der Antrieb zum Handeln liegt im Inhalt des Ideals selbst, nicht in einem äußeren Gesetz.
