        relevance: 0.5
  - term: Weltgeist
    chunk_id: 76d67ffe-3d89-528f-adb8-7a4d5bd028e9
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Der Mensch erlebt in sich das, was wir den Gedanken nennen können. In diesem Gedanken kann er
      sich als unmittelbar Tätiges erfühlen, als etwas, das seine eigene Tätigkeit überschauen kann.
      Dieses Denken ist kein bloßes Abbild einer äußeren Welt, sondern eine selbsttätige Aktivität,
      die der Mensch aus seinem Inneren hervorbringt. Er entnimmt alle Bestimmungen des Gedankens
      aus der Gedankenwelt; das Sinnesobjekt veranlasst ihn nur, einen bestimmten Gedankeninhalt aus
      der Einheit aller möglichen Gedanken herauszutreiben, liefert ihm aber nicht die Bausteine
      dazu. Die Tätigkeit des menschlichen Geistes und die Erscheinung einer in sich vollendeten
      Gesetzmäßigkeit sind dabei ein und dieselbe Sache, von zwei Seiten betrachtet: der
      Gedankengehalt der Welt. Indem der Mensch denkend die Wirklichkeit erfasst, holt er diesen
      Gedankengehalt aus sich selbst hervor und erkennt ihn im Wahrgenommenen wieder. In diesem
      Prozess wirkt in ihm nicht bloß ein individuelles Vermögen, sondern etwas, das über das
      Einzelwesen hinausreicht: die schöpferische Kraft, die alles hervorbringt und die im Menschen
      als Idee zur Erscheinung kommt. Der Mensch selbst wird zum Schöpfer, indem er aus der Idee
      heraus ein Tatsächliches hervorbringt und sich so sein sittliches Ziel selbst gibt."
    references:
      - chunk_id: fa9c2477-a053-5641-9c3f-8e0fb6740239
        description: Der Mensch erlebt in sich den Gedanken und kann sich darin als unmittelbar Tätiges
          erfühlen.
        relevance: 0.95
      - chunk_id: f111f561-a4fe-5212-afb0-5eba342c83fd
        description: Alle Bestimmungen des Gedankens werden aus der Gedankenwelt entnommen; das Sinnesobjekt
          veranlasst nur, einen bestimmten Gedankeninhalt aus der Einheit aller möglichen Gedanken
          hervorzutreiben.
        relevance: 0.95
      - chunk_id: e0208833-c446-554b-9251-7ff177b1fe01
        description: Die höchste Anschauung befreit den Menschengeist von einseitigem Abhängigkeitsgefühl;
          die Triebkraft, die alles hervorbringt, wirkt im Innern als eigener Wille, und die
          höchsten Entscheidungen über Sittliches liegen i...
        relevance: 0.85
      - chunk_id: dcef9627-a9f8-54f5-8a3e-495abda5eb3e
        description: Wenn der Gedankengang richtig ist, ist kein Rest von äußerem Dasein im
          Bewusstseinsinhalt enthalten.
        relevance: 0.7
  - term: Welträtsel
    chunk_id: d382771b-781b-5680-aca3-c14de4c0ead8
    language: de
    tags:
      - concept
      - assistant-generated
    text: Der Begriff „Welträtsel“ bezeichnet bei Steiner nicht unauflösbare Mysterien, sondern jene
      Fragen, die der Mensch aus seiner Erfahrung und seinem Denken heraus an die Welt richtet. Es
      geht nicht um die Weltschöpfung, sondern um das Begreifen der Welt. Steiner wendet sich
      entschieden gegen die Auffassung, der Mensch stoße mit seinem Erkennen an unüberwindliche
      Grenzen. Er stellt dem die innerlich erlebte Tatsache entgegen, dass der Mensch mit seinem
      Denken, wenn er es genügend vertieft, in der Weltwirklichkeit als einer geistigen lebt. Die
      Wahrnehmung ist für ihn nichts Fertiges, sondern nur die eine Seite der Wirklichkeit. Die
      andere Seite ist der Begriff. Der Erkenntnisakt selbst ist die Synthese von Wahrnehmung und
      Begriff. Erst diese Verbindung macht das ganze Ding aus. Das Denken ist der Akt, durch den
      Erkenntnis vermittelt wird; es bringt im Moment des Erkennens einen eigenen Inhalt hervor. Der
      Mensch ist an der Entstehung des Denkens unmittelbar beteiligt, während er die Dinge der
      Außenwelt einfach vorfindet. Darin liegt der Ursprung des Rätselhaften. Die Lösung der
      Welträtsel besteht nicht in einem passiven Hinnehmen, sondern in der aktiven, denkenden
      Durchdringung der gegebenen Welt. Der Streit der Weltanschauungen entsteht nach Steiner gerade
      daraus, dass man ein Wissen über ein Objektives erwerben will, ohne zuvor die Natur des
      Wissens selbst zu klären.
    references:
      - chunk_id: db8ae1f5-b967-567b-a7fd-99480378e991
        description: Eduard von Hartmann und Volkelt vertreten die Auffassung, dass das Erkennen an Grenzen
          stoße, während Steiner die innerlich erlebte Tatsache des Denkens dagegenstellt.
        relevance: 0.9
      - chunk_id: fab83a13-1c8b-5705-b2a2-1a64ecd6a698
        description: Dem Philosophen geht es nicht um Weltschöpfung, sondern um das Begreifen der Welt.
        relevance: 0.9
      - chunk_id: 70ae0829-e15c-5bcc-9c52-8e45063d1b85
        description: Das Denken greift über das Sondersein hinaus und bezieht sich auf das allgemeine
          Weltensein, wodurch der Erkenntnistrieb entsteht; der Begriff wird von innen empfangen.
        relevance: 0.9
      - chunk_id: 4dbf84ba-d2a6-5b21-8abd-15d00cfba34e
        description: Das Denken ist das Element, durch das der Mensch sich geistig in die Wirklichkeit
          hineinlebt; die Wahrnehmung erhält Wirklichkeitsbestimmung erst durch das Denken.
        relevance: 0.9
      - chunk_id: 989f9bfd-cf47-5af3-8406-77e5cd5f734f
        description: Im Denken sind wir beim Weltgeschehen dabei, während wir Dinge nur vorfinden; daher ist
          das Denken der ursprünglichste Ausgangspunkt.
        relevance: 0.9
      - chunk_id: d9f58647-86a7-51c8-a679-dad6256b3a19
        description: Der Streit der Weltanschauungen kommt daher, dass man ein Wissen über Objektives
