        relevance: 0.85
      - chunk_id: dbafbb83-9ca1-5cbc-b610-883bbbeee36c
        description: Freiheit muss dem menschlichen Wollen zugesprochen werden, insofern es rein ideelle
          Intuitionen verwirklicht, die nicht von äußerer Notwendigkeit abhängen.
        relevance: 0.85
      - chunk_id: 85cba29d-7761-5c34-b327-1efa42cc1cf2
        description: Sittliche Ideale sind nicht als Abbild von etwas außer uns, sondern als nur in uns
          Vorhandenes anzusehen, und es gibt keinen kategorischen Imperativ von außen.
        relevance: 0.8
      - chunk_id: c8f876e1-ab52-59f6-b379-79da2d789da7
        description: Es gibt einen Unterschied zwischen einem bewussten Beweggrund des Handelns und einem
          unbewussten Antrieb, der zu unterschiedlich beurteilten Handlungen führt.
        relevance: 0.7
      - chunk_id: 3501183e-b288-53e8-9cec-663b73e5e6d7
        description: Der freie Geist will vollständig auf sich selbst gestellt sein und braucht kein Mitleid.
        relevance: 0.7
      - chunk_id: fa8e6250-5cde-5a79-a4b1-a70a57cc42a5
        description: Ob ich tun kann, was ich will, hängt von äußeren Umständen und technischer
