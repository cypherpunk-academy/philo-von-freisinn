  - term: Übermensch
    chunk_id: 4bf0117c-2757-5f5f-a8ec-fc613709ee95
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Der Begriff „Übermensch“ stammt von Friedrich Nietzsche und wird von ihm als Gegenbild zum
      modernen, schwachen Menschen entworfen. Der Übermensch ist ein Wesen, das aus eigener Kraft
      seine Werte schafft und jenseits von überlieferten Vorstellungen von Gut und Böse lebt. Er
      gehorcht keiner äußeren Autorität, weder einem Gott, einer Vernunftmoral noch einem
      kategorischen Imperativ, sondern folgt allein seiner eigenen Natur. Nietzsche bestimmt diesen
      Übermenschen jedoch nur negativ: als Zerstörer alter Bindungen, nicht aber als positiven
      Schöpfer einer neuen, bewussten Ethik. Die naturalistische Entwicklungsvorstellung des
      neunzehnten Jahrhunderts ließ ihn den Übermenschen nicht als das geistig Waltende innerhalb
      des Sinnlich-Physischen schauen, sondern als etwas, das sich durch bloß naturgemäße
      Entwicklung aus dem Menschen entfaltet – so wie der Mensch aus dem Tier. Damit wurde Nietzsche
      der Ausblick auf den Geistmenschen im Naturmenschen entrissen. Der Übermensch bleibt bei ihm
      ein notwendiger, aber unvollendeter Entwurf: ein Mittel, das Dasein zu ertragen, nicht aber
      die Gestalt eines wirklich freien, geistig durchdrungenen Menschen. Die Hymnen auf den
      Übermenschen sind die dichterische Antwort auf die Fragen der Naturwissenschaft, nicht die
      Grundlage einer neuen Ethik aus freier, geistiger Intuition."
    references:
      - chunk_id: c4fcd4bd-7710-5215-b67b-67564ad9f02f
        description: Die naturalistische Entwicklungs-Idee ließ Nietzsche den Übermenschen nicht als das
