  - term: Freiheit
    chunk_id: 4ebd8d51-27b6-5a94-ab6d-8624aaf0dbae
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Freiheit ist für diese Auffassung kein Zustand, der einem Menschen von Natur aus zukommt,
      sondern eine Fähigkeit, die er durch Einsicht erlangt. Frei sein heißt, die dem eigenen
      Handeln zugrunde liegenden Vorstellungen und Beweggründe aus sich selbst heraus bestimmen zu
      können. Dies geschieht durch die moralische Fantasie, die aus der eigenen Ideenwelt schöpft.
      Ein Mensch handelt frei, wenn er nicht aus blindem Drang oder äußeren Zwängen, sondern aus
      bewussten, selbst gewählten Motiven tätig wird. Der freie Mensch ist sein eigener Gesetzgeber;
      er lässt sich keine Vorschriften von einer äußeren Macht geben, sondern folgt dem, was als
      Gedankeninhalt in seiner Persönlichkeit lebt. Freiheit ist unmöglich, wenn etwas außerhalb des
      Menschen seine moralischen Vorstellungen bestimmt – sei es ein mechanischer Prozess oder ein
      außerweltlicher Gott.


      Im gesellschaftlichen Zusammenleben zeigt sich die Freiheit darin, dass der freie Mensch aus
      eigenem Antrieb das vollbringt, was der Staat von einem selbstsüchtigen Menschen fordern
      müsste. In einer Gemeinschaft freier Menschen bedarf es keiner Zwangsgesetze. Der Freie lebt
      im Vertrauen darauf, dass der andere Freie mit ihm einer geistigen Welt angehört und sich in
      seinen Intentionen mit ihm begegnen wird. Ein Aufeinanderprallen ist bei sittlich freien
      Menschen ausgeschlossen, denn sie folgen nicht blinden Trieben oder äußeren Geboten, sondern
      ihren eigenen Intuitionen aus der gemeinsamen Ideenwelt.
    references:
      - chunk_id: b1e94c9e-3b36-520c-b1e7-147227934833
        description: Der freie Mensch vollbringt aus eigenem Antrieb, was der Staat von einem
