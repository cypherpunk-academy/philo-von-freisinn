    text: "Die Dreigliederung des sozialen Organismus ist ein Gedanke, der aus der Erkenntnis der
      gegenwärtigen Lebenswirklichkeit entwickelt ist. Sie unterscheidet drei eigenständige Bereiche
      des gesellschaftlichen Zusammenlebens: das Geistesleben, das Rechtsleben und das
      Wirtschaftsleben. Diese drei Glieder sollen nicht von einem zentralen Punkt aus verwaltet
      werden, sondern jedes in sich selbstständig organisiert sein. Ihre Einheit entsteht nicht
      durch eine übergeordnete Verwaltung, sondern durch das lebendige Zusammenwirken der drei
      Bereiche und dadurch, dass jeder Mensch mit seinen Interessen allen drei Gliedern angehört.
      Das Geistesleben, zu dem Erziehung und Bildung gehören, braucht Freiheit von staatlicher
      Bevormundung, um seine befruchtende Kraft entfalten zu können. Das Rechtsleben beruht auf dem
      Prinzip der demokratischen Gleichheit, in dem die Menschen als Gleiche ihre Rechtsverhältnisse
      gestalten. Das Wirtschaftsleben hingegen erfordert eine solidarische Zusammenarbeit, die in
      Assoziationen der Produzenten, Händler und Konsumenten organisiert wird. Die Dreigliederung
      ist kein abstraktes Programm, das der Wirklichkeit übergestülpt werden soll. Sie will vielmehr
      die Grundlage schaffen, auf der die sozialen Kräfte der Gegenwart – wie die moderne Technik
      und der veränderte Wissenschaftsgeist – zu einer menschenwürdigen Gestaltung des
      Zusammenlebens führen können."
    references:
      - chunk_id: b10be3db-1d92-5322-b8d6-32b66f1ed334
        description: Befruchtende Gedanken für Rechts- und Wirtschaftsleben können nur von einem auf sich
          selbst gestellten Geistesleben kommen.
        relevance: 0.9
      - chunk_id: 6df4fac8-61b5-537a-84cb-c332c6810ee1
        description: Die drei Glieder des sozialen Organismus sollen nicht in einer abstrakten Einheit
