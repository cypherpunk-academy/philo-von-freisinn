        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 0.9986
  - term: Psychologie
    chunk_id: 8bb35809-cb2f-5f86-b77f-b4f5020a140a
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Psychologie ist für diese Betrachtungsweise die Wissenschaft von der Seele, aber nicht als
      bloße Beschreibung innerer Zustände. Eine wahrhafte Psychologie kann nur gewonnen werden, wenn
      man auf die Beschaffenheit des Geistes als eines Tätigen eingeht. Die Seele zeigt sich nicht
      als ein ruhender Gegenstand, den man wie einen Stein von außen betrachten und in einen
      äußerlichen Zusammenhang bringen könnte. Sie offenbart sich vielmehr im tätigen Denken, in dem
      der Mensch sich als unmittelbar Tätiges erfühlen kann. Das Denken ist dabei Betrachtung, es
      richtet den Blick nach außen auf ein Gegenüberstehendes. Eine Psychologie, die die Seele nur
      nach den Methoden der Mechanik oder Physik erfassen will, verliert gerade das aus dem Auge,
      worauf es ankommt: den Geist selbst als den Produzenten seiner Äußerungen. Sie begründet eine
      „Seelenlehre ohne Seele“. Die eigentliche Aufgabe der Psychologie mündet in die Forderung der
      Selbsterkenntnis. Die Menschenseele kann von dem Erlebnis mit dem „Erkenne dich selbst“ denken
      und empfinden, dass alles Seelenleben nicht seinen Anlagen entspricht, das nicht durch dieses
      Erlebnis aus dem Lebenstraum erwacht. So wird die Psychologie zu einer Erkenntnis, die nicht
      in festen Gesetzen aufgeht, sondern durch ihr Eigenleben und durch die Verwandtschaft dieses
      Eigenlebens mit dem ganzen menschlichen Seelenleben ihre Berechtigung erweist."
    references:
      - chunk_id: 122acafb-4bbf-5bb0-ab29-9a2a585af7c7
        description: Eine wahrhafte Psychologie gewinnt man nur, wenn man auf die Beschaffenheit des Geistes
          als eines Tätigen eingeht, nicht durch äußerliche Zusammenhänge wie bei unorganischen
          Naturen.
        relevance: 0.95
      - chunk_id: fa9c2477-a053-5641-9c3f-8e0fb6740239
        description: Der Mensch kann sich im Gedanken als unmittelbar Tätiges erfühlen, das seine Tätigkeit
          überschauen kann.
        relevance: 0.9
      - chunk_id: 771bf9a9-85b4-5506-aaf1-577112a7bc45
        description: Die Menschenseele kann durch das Erlebnis des 'Erkenne dich selbst' aus dem Lebenstraum
          erwachen, ähnlich wie aus dem dumpfen Kindeserleben die Erinnerungskraft erwächst.
        relevance: 0.85
      - chunk_id: a5568ad8-99e8-54c4-b8d3-daf47b74c343
        description: Die Seele erstarkt im Selbsterleben ihres Eigenwesens, der Gedanke verschmilzt mit der
          Selbsterkenntnis und kann nicht mehr als äußere Wahrnehmung angesehen werden.
        relevance: 0.8
      - chunk_id: e343077c-3182-597f-adf1-b057abe217ca
        description: Die gegenwärtige Weltanschauung glaubt nur an allgemeingültige Gesetze in festen
          Begriffen, was eine wahre Seelen-Erkenntnis behindert.
        relevance: 0.75
      - chunk_id: ef261844-0543-5218-8a53-9a9ec67e49e4
        description: Die Anschauung wird ein Glied lebendigen Seelenlebens, keine fertige, abgeschlossene
          Antwort.
        relevance: 0.7
      - chunk_id: 8768ec12-935d-5f3a-af54-ad9b87a5c0de
        description: Eine wahre Geisteswissenschaft ist nötig, um die Individualität der kindlichen Natur zu
