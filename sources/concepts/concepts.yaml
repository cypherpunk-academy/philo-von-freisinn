          Zwangsgesetze.
        relevance: 0.9
      - chunk_id: 27c4e7a6-54b4-5312-a449-6c4f2cd216d0
        description: Das Handeln aus rein ideeller Intuition ist individuell auf den besonderen Fall geprägt
