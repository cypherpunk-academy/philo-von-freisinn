  - term: Bestimmung
    chunk_id: 9b3fd1b9-5a8d-5e92-ab9c-4815749e0b95
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Begriff „Bestimmung“ trägt bei Steiner einen doppelsinnigen Charakter. Er meint einerseits
      eine äußere Festlegung, andererseits eine innere Ausrichtung. In den erkenntnistheoretischen
      Schriften bezeichnet „Bestimmung“ den Vorgang, durch den der Mensch einem zunächst
      unbestimmten Wahrnehmungs- oder Gedankeninhalt eine klare Gestalt gibt. Der Weltinhalt als
      gegebener ist ganz bestimmungslos; erst durch das Denken wird er bestimmt. Das Gegebene durch
      das Denken bestimmen heißt Erkennen. Die Welt wird durch das erkennende Ich bestimmt; der
      Mensch vollendet die Wirklichkeit durch sein Denken. Die Realisierung des Erkennens geschieht
      durch Freiheit, denn das Ich kann sich durch Freiheit in Tätigkeit versetzen.


      In den sozialphilosophischen Schriften meint „Bestimmung“ die selbstgewählte Aufgabe des
      Menschen in der Gemeinschaft. Der Mensch bestimmt sich selbst durch freie Initiative. Die
      Summe seines Daseins ist nicht ohne ihn selbst bestimmt; sein wahrer Begriff als sittlicher
      Mensch ist mit dem Wahrnehmungsbild „Mensch“ nicht im Voraus objektiv vereinigt. Der Mensch
      muss selbsttätig seinen Begriff mit der Wahrnehmung Mensch vereinigen. Das Wesen der freien
      Selbstbestimmung zu untersuchen, ist die Aufgabe einer auf diese Erkenntnistheorie gestützten
      Ethik.


      Bestimmung ist bei Steiner kein Fatum, sondern ein schöpferischer Akt. Der Mensch bestimmt
      sich im Erkennen und Handeln aus eigener Initiative heraus.
    references:
      - chunk_id: 5eef0a56-4f0a-5a88-a94e-d33b6a6c2735
        description: Der Weltinhalt als gegebener ist ganz bestimmungslos; die erkennende Tätigkeit muss
          einen Machtspruch tun, um Ordnung zu schaffen.
        relevance: 0.95
      - chunk_id: a4f087d2-6ccc-5bb8-9ba3-f136d7ab15a7
        description: Das Ich kann sich durch Freiheit in Tätigkeit versetzen und realisiert durch
          Selbstbestimmung die Kategorie des Erkennens; die Untersuchung der freien Selbstbestimmung
          ist Aufgabe einer auf die Erkenntnistheorie gestü...
        relevance: 0.95
      - chunk_id: afe8783e-d8d8-589f-bc96-43c4b77cae49
        description: Das Ich kann zu keiner wirklichen Bestimmung kommen, wenn es nicht etwas Inhaltsvolles
          voraussetzt, das ihm die Bestimmung des Gegebenen ermöglicht.
        relevance: 0.85
  - term: Beweis
    chunk_id: cba90573-3fbe-5ac6-a5c9-8f927a5a8f1e
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Ein Beweis ist ein nachträgliches Hilfsmittel der Verständigung, nicht aber ein letztgültiges
      Fundament der Erkenntnis. Er führt von bereits anerkannten Sätzen zu einem neuen Satz, doch
      die Gültigkeit jener Sätze selbst kann nicht durch einen weiteren Beweis gesichert werden. Die
      beweisende Methode, wie sie in der Mechanik angewendet wird, stützt sich auf eine bestimmte
      Regel: Unter gegebenen Voraussetzungen wird bestimmt, was eintreten muss. Sie ist
      wissenschaftlich, weil sie eine Erscheinung vollständig mit dem Begriff durchtränkt und
      Wahrnehmung und Denken zur Deckung bringt.


      Die eigentliche Erkenntnis liegt jedoch nicht in der formalen Ableitung, sondern im Akt des
      Denkens selbst. Ein Beweis verbindet entweder einen Begriff mit einer Wahrnehmung oder zwei
      Begriffe. Die sachlichen Gründe für diese Verbindung können aber jenseits dessen liegen, was
      die Begriffe selbst enthalten. Formelle Gründe wie Widerspruchslosigkeit oder bestimmte Axiome
      leiten zwar auf eine bestimmte Gedankenverbindung, haben aber auf die Sache selbst keinen
      Einfluss. Die Behauptung stützt sich dann auf etwas, das man sachlich nie erreichen kann; eine
      wirkliche Einsicht ist nicht möglich. Man weiß nur als Außenstehender von der Sache.


      Daher ist zwischen logischer Beweisführung und wirklicher Erkenntnis zu unterscheiden. Der
      Beweis ist ein Werkzeug der Darstellung und der Verständigung, nicht aber der ursprünglichen
      Wahrheitsfindung. Die unmittelbare Einsicht in die Sache selbst gewinnt man allein im tätigen
      Vollzug des Denkens.
    references:
      - chunk_id: 6c82d0ed-a28d-5476-aae7-6e7840bdaa1f
        description: Eine wissenschaftliche Behauptung verbindet entweder einen Begriff mit einer
          Wahrnehmung oder zwei Begriffe; die sachlichen Gründe für die Verbindung können jenseits
          dessen liegen, was die Begriffe selbst enthalten, u...
        relevance: 0.95
      - chunk_id: 52b46d9e-1321-5cb3-a62e-a10a2509f5f8
        description: Die Methode der Mechanik ist die beweisende; jeder Beweis stützt sich auf eine
          bestimmte Regel, unter gegebenen Voraussetzungen wird bestimmt, was eintreten muss, und
          wir begreifen eine einzelne Erscheinung unter Zugr...
        relevance: 0.9
      - chunk_id: 27bd6da5-804d-5e37-8a2f-0c212dfda2a3
        description: Jede Annahme eines Seinsgrundes außerhalb der Idee ist ein Unding; der Seinsgrund ist
          in die Welt ausgegossen und zeigt sich im Denken in seiner vollendetsten Form, sodass das
          Denken den Inhalt des Weltgrundes selbst...
        relevance: 0.7
  - term: Bewusstsein
    chunk_id: 6019f983-d9fd-5f78-a13c-20b13ed72f5a
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Bewusstsein entsteht nach Rudolf Steiner dort, wo das Denken sich selbst ergreift und seine
      eigene Tätigkeit beobachtet. Im gewöhnlichen Alltag erscheint uns das Denken zunächst selbst
      als eine Erfahrungssache, ähnlich wie ein äußerer Eindruck. Wir stehen jedoch innerhalb des
      Prozesses, der aus einzelnen Gedankenelementen Verbindungen schafft. Dadurch ist uns nicht nur
      das vollendete Ergebnis gegeben, sondern das Wirkende selbst. Steiner unterscheidet zwischen
      Wahrnehmungsbewusstsein und denkendem Bewusstsein. Die Wahrnehmung ist der Teil der
      Wirklichkeit, der objektiv gegeben wird; der Begriff dagegen wird subjektiv durch Intuition
      aus der Gedankenwelt geschöpft. Erst der Zusammenhang beider – die denkende Beobachtung, die
      weder einseitig den Begriff noch die Wahrnehmung für sich betrachtet – ergibt volle
      Wirklichkeit. Das Denken ist kein bloßes Abbilden von etwas Äußerem, sondern ein Erzeugen von
      Zusammenhängen. Bewusstsein ist kein statischer Zustand, sondern ein Prozess, der sich
      steigern lässt. Die Entwicklung des Gedankenlebens schreitet durch Epochen fort: Anfangs wirkt
      der Gedanke wie eine Wahrnehmung von außen; später lernt die Seele ihn als ihr eigenes
      Erzeugnis fühlen. Auf dieser Stufe wird der Gedanke nicht mehr als etwas Fremdes, sondern als
      selbsttätig Hervorgebrachtes erlebt. Bewusstsein im vollen Sinne bedeutet daher, die eigene
      denkerische Tätigkeit nicht nur zu vollziehen, sondern in ihrem Vollzug zu erfassen und sich
      als deren Urheber zu erkennen."
    references:
      - chunk_id: a5568ad8-99e8-54c4-b8d3-daf47b74c343
        description: Die Entwicklung des Gedankenlebens durchläuft vier Epochen, in denen der Gedanke
          zunächst wie eine Wahrnehmung von außen wirkt und die Seele ihn später als eigenes
          Erzeugnis fühlt.
        relevance: 0.9
      - chunk_id: 578d6e3f-8f5a-57dd-901d-6259e915a580
        description: Der Mensch nimmt beim Denken nur die letzte Phase seiner denkerischen Tätigkeit wahr,
          ähnlich wie er sein Gesicht nur im Spiegel sieht.
        relevance: 0.8
      - chunk_id: fa9c2477-a053-5641-9c3f-8e0fb6740239
        description: Der Mensch erlebt im Gedanken sich als unmittelbar Tätiges, das seine Tätigkeit
          überschauen kann.
        relevance: 0.8
      - chunk_id: ee2de37d-8216-5413-8227-3eabf6d93f96
        description: Die höchste Stufe des individuellen Lebens ist das begriffliche Denken ohne Rücksicht
          auf einen bestimmten Wahrnehmungsgehalt, wobei der Begriff durch reine Intuition aus der
          ideellen Sphäre bestimmt wird.
        relevance: 0.8
      - chunk_id: 1e7ec70e-04e7-5a99-8a3e-24b8665416b5
        description: Der Schnitt zwischen Wahrnehmen und Denken tritt erst auf, wenn der Betrachtende den
