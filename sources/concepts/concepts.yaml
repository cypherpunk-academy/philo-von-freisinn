        relevance: 0.6
  - term: Außenwelt
    chunk_id: 190770f6-567d-5102-9f17-f163ead51baa
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die Außenwelt tritt dem Menschen zunächst als sinnlich wahrnehmbare Erscheinung entgegen. Sie
      zeigt sich als eine unendliche Mannigfaltigkeit von Farben, Tönen, Gestalten und Kräften, die
      im Raum und in der Zeit auftreten. Dieses unmittelbar gegebene Weltbild ist jedoch
      zusammenhanglos: Die einzelnen Sinneseindrücke stehen in keiner inneren Beziehung zueinander,
      sie sind bloß ein Nebeneinander ohne erkennbare Ordnung.


      Die Wahrnehmungen selbst sind nicht die Wirklichkeit an sich. Das Bild, das du von einem
      Gegenstand erhältst, hängt von deinem Standort ab – so wie die Bäume einer Allee aus der Ferne
      kleiner erscheinen als aus der Nähe. Die Außenwelt tritt dir also in einer Form entgegen, die
      durch deine eigene Stellung zum Wahrgenommenen mitbestimmt ist.


      Um die Außenwelt zu verstehen, genügt es nicht, sie bloß passiv anzustarren. Die
      Undurchsichtigkeit der Erscheinungen kann nur überwunden werden, wenn du das Denken an sie
      heranträgst. Das Denken bringt die einzelnen Tatsachen in einen Zusammenhang, es zeigt, wie
      ein Vorgang das Ergebnis einer bestimmten Konstellation von Elementen ist. Ohne diese
      Tätigkeit des Denkens bliebe die Außenwelt ein beziehungsloses Nebeneinander, das du zwar
      beschreiben, aber niemals begreifen könntest. Erst im Zusammenspiel von Erfahrung und Denken
      erschließt sich dir die Wirklichkeit in ihrer inneren Ordnung.
    references:
      - chunk_id: aaa5ba5a-2d65-520e-88ba-ca292533ae15
        description: Die sinnliche Auffassung der Wirklichkeit ist die erste Tätigkeit, und die unendliche
          Mannigfaltigkeit von Gestalten, Kräften, Farben, Tönen usw. muss mit dem ordnenden
          Verstand durchdrungen werden.
        relevance: 0.95
      - chunk_id: 59876cd1-09bc-5935-b12e-38cc4801136d
        description: Das Wahrnehmungsbild hängt vom Standort des Betrachters ab, wie die Bäume einer Allee
          aus der Ferne kleiner erscheinen.
        relevance: 0.95
      - chunk_id: c63937e9-05df-514c-8c01-b849f2841708
        description: Die Welt der Farben, Töne usw. ist nicht eine objektive Wirklichkeit draußen, sondern
          wird durch die Einrichtung unserer Sinne und unseres Gehirns hervorgebracht.
        relevance: 0.9
      - chunk_id: eedd7db3-1964-5505-ba28-9a1089dc45c0
        description: Der Anfang muss mit dem unmittelbar gegebenen Weltbild gemacht werden, das
          zusammenhanglos ist und noch keiner gedanklichen Bestimmung unterworfen wurde.
        relevance: 0.9
      - chunk_id: 224714c3-9fce-5bf9-a528-5d21bb4f67aa
        description: Wenn die Kombination der Tatsachen in der unmittelbaren Erfahrung nicht genügt, müssen
          Bedingungen geschaffen werden, damit ein Vorgang als notwendige Folge dieser Bedingungen
          erscheint.
        relevance: 0.85
      - chunk_id: 5b7fa03d-1721-5400-99ba-db2f8d48d6ab
        description: Solange das Gegebene bloß passiv angestarrt wird, findet sich kein Ansatzpunkt für das
          Erkennen; es muss etwas dem Erkennen Homogenes im Gegebenen geben.
        relevance: 0.85
      - chunk_id: 919225a7-3711-5a9c-b9ca-f00df0923ced
        description: Die erste Form der Wirklichkeit wird als Erscheinung für die Sinne bezeichnet, wobei
          Sinn alle leiblichen und geistigen Organe der Wahrnehmung umfasst.
        relevance: 0.85
      - chunk_id: 8c202f12-cee3-52d7-b08c-7b54d646f343
        description: Wissen entsteht erst, wenn die Gegenstände der Erfahrung im Zusammenhang betrachtet werden.
        relevance: 0.8
      - chunk_id: aa924c54-5676-574b-972a-5e4db2a6aa1f
        description: Es wird gefragt, wo im Weltbild etwas zu finden ist, das nicht bloß gegeben, sondern im
          Erkenntnisakt hervorgebracht ist.
        relevance: 0.8
      - chunk_id: a01d0cd4-9fa9-5c62-85dd-e0628c6275f7
        description: Reine Erfahrung ist die Form der Wirklichkeit, wenn wir ihr mit vollständiger
          Entäußerung unseres Selbst entgegentreten.
        relevance: 0.75
  - term: Begierde
    chunk_id: 1e531a24-5706-5821-9df8-ee8e6273139d
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die Begierde ist ein seelischer Vorgang, der sich im Einzelfall auf einen bestimmten
      Gegenstand richtet. Sie ist durch ein Streben gekennzeichnet, das auf Befriedigung zielt, und
      hängt mit einem Mangel oder einem Unbefriedigtsein zusammen. Der Wert der Befriedigung bemisst
      sich nicht allein an der erzielten Lust, sondern am Verhältnis dieser Lust zur Größe des
      Begehrens. Je größer die Begierde, desto mehr Unlust nimmt man in Kauf, um sie zu stillen. Die
      Begierde selbst ist der Maßstab, an dem die Lust gemessen wird.


      Die Begierde unterscheidet sich grundlegend von einem bewussten, freien Wollen. Während das
      freie Wollen aus einem bewussten Beweggrund entspringt, folgt die Begierde einem unbewussten
      Antrieb. Sie übt einen Zwang auf den Menschen aus, ähnlich wie Hunger oder Durst. Freiheit
      besteht nicht darin, der Vernunft zu folgen, während man den animalischen Begierden
      unterworfen ist, denn auch ein vernünftiger Entschluss kann mit derselben Notwendigkeit
      auftreten wie ein Trieb. Die Begierde macht den Menschen unfrei, weil sie ihn von äußeren
      Reizen und inneren Trieben abhängig macht.


      In sozialer Hinsicht ist der Mensch, der seinen sinnlichen Trieben folgt, selbstsüchtig. Er
      würde nur seinem eigenen Wohlsein nachgehen, wenn nicht der Staat durch Zwangsgesetze das
      Zusammenleben regeln würde. Der freie Mensch hingegen vollbringt aus eigenem Antrieb, was der
      Staat von dem selbstsüchtigen Menschen fordern muss.
    references:
      - chunk_id: e27da02a-b545-54be-bbb3-30ca34777f27
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 1
      - chunk_id: 3f7bb6f6-61f4-5d8c-9515-907f82a5d4d6
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 0.997
      - chunk_id: d86aea3e-73cf-501c-b38b-d3dde93e8ed4
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 0.9919
  - term: Begriff
    chunk_id: 218e5bc9-f8bb-5c5f-831b-b79f190bf730
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Begriff ist das Ergebnis einer inneren Tätigkeit des Denkens, nicht ein Abbild eines
      äußeren Gegenstandes. Er entsteht, wenn das Denken auf eine Wahrnehmung reagiert und zu ihr
      ein ideelles Gegenstück hinzufügt. Dieses ideelle Gegenstück, das nach dem Verschwinden des
      wahrgenommenen Gegenstandes zurückbleibt, ist der Begriff. Wahrnehmung und Begriff sind zwei
      Seiten der Wirklichkeit; erst ihre Verbindung ergibt volle Wirklichkeit. Die Wahrnehmung
      allein ist ein zusammenhangloses Chaos, der Begriff für sich betrachtet eine bloß abstrakte
      Gedankenwelt. Die denkende Beobachtung, die beide Seiten zusammenhält, erschließt erst die
      Wirklichkeit.


      Der Begriff stammt aus dem Denken selbst, nicht aus der Wahrnehmung. Die Sinnesobjekte
      veranlassen uns zwar, einen bestimmten Gedankeninhalt aus der Einheit aller möglichen Gedanken
      hervorzutreiben, aber sie liefern nicht die Bausteine dazu. Diese müssen wir aus uns selbst
      holen. Ohne Begriff bliebe die Wahrnehmung stumm; ohne Wahrnehmung bliebe der Begriff leer.
      Die Zuordnung von Begriff und Wahrnehmung ist ein schöpferischer Akt des Erkennens. Die
      Begriffe schließen sich zu einem gesetzmäßigen Ganzen zusammen; an Einzeldingen gebildete
      Begriffe fallen in Gesamtbegriffe zusammen. Der Begriff ist somit das ideelle Gegenstück zur
      Wahrnehmung, das aus dem Denken hervorgeht und erst mit ihr zusammen die volle Wirklichkeit
      ergibt.
    references:
      - chunk_id: f24caff5-b63a-5d3e-959d-e5b61ac79ca5
        description: Begriffe entstehen durch das Denken als ideelles Gegenstück zur Wahrnehmung und bleiben
          nach Verschwinden des Gegenstandes zurück.
        relevance: 0.95
      - chunk_id: f111f561-a4fe-5212-afb0-5eba342c83fd
        description: Der Begriff wird aus der Gedankenwelt hervorgeholt, nicht aus dem Sinnesobjekt; die
          Bestimmungen des Gedankens stammen aus dem Denken selbst.
        relevance: 0.9
      - chunk_id: 8c502fb1-3f0f-5682-bb2a-b7439277dba5
        description: Der Begriff ist nicht das Bild eines äußeren Gegenstandes im Bewusstsein, sondern wird
          als Gedanke vorgefunden.
        relevance: 0.85
      - chunk_id: 70ae0829-e15c-5bcc-9c52-8e45063d1b85
        description: Durch das Denken entsteht der Begriff als das, was wir vom Ding von innen empfangen.
        relevance: 0.8
      - chunk_id: 4dbf84ba-d2a6-5b21-8abd-15d00cfba34e
        description: Das Wahrnehmungselement erhält Wirklichkeitsbestimmung erst durch das Denken; außerhalb
          des Denkens kann die Wirklichkeit nicht erfasst werden.
        relevance: 0.8
      - chunk_id: 1494c6c3-da7b-551b-86d4-41387d5c332c
        description: Das Begriffssystem ist keine bloße Fotografie der Außenwelt; der Inhalt des Denkens
          wird nicht nur von außen genommen.
        relevance: 0.75
      - chunk_id: 1e7ec70e-04e7-5a99-8a3e-24b8665416b5
        description: Der Schnitt zwischen Wahrnehmen und Denken tritt erst auf, wenn der Betrachtende den
          Dingen gegenübertritt.
        relevance: 0.7
      - chunk_id: 6630bc65-5a23-5819-aac3-7428dcf5455f
        description: Sinneswahrnehmung löst sich in ideellen Inhalt auf; Gedankenbestimmungen sind nicht
          bloße Merkmale der Gegenstände.
        relevance: 0.7
  - term: Begriffswelt
    chunk_id: a672f5e7-84e3-507f-81cf-cbcfe1d9c606
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die Begriffswelt ist der innere Bereich des Denkens, der die Sinneseindrücke zu geordneten
      Vorstellungen verarbeitet. Sie steht der Wahrnehmungswelt gegenüber, die ohne sie ein
      zusammenhangloses Chaos bliebe. Erst im Zusammenhang beider ergibt sich volle Wirklichkeit:
      Die Wahrnehmung liefert den objektiven Teil, der Begriff den subjektiv durch Intuition
      gegebenen. Die geistige Organisation des Menschen reißt die Wirklichkeit in diese beiden
      Faktoren auseinander; die denkende Beobachtung führt sie wieder zusammen.


      Die Begriffswelt ist kein fertiges System, das dem Menschen von außen vorgegeben wäre. Sie
      wird vom Menschen selbsttätig hervorgebracht, indem er die Gedanken aus der Gedankenwelt
      entnimmt und in den Sinnesobjekten wiedererkennt. Das Sinnesobjekt veranlasst ihn zwar, in
      einem bestimmten Augenblick einen bestimmten Gedankeninhalt aus der Einheit aller möglichen
      Gedanken herauszutreiben, liefert ihm aber nicht die Bausteine dazu. Diese muss er aus sich
      selbst herausholen.


      Jeder Mensch gibt seinem Begriffsleben durch seinen Standort und seine Wahrnehmungssphäre ein
      individuelles Gepräge. Die besondere Bestimmtheit, mit der er die allgemeinen Begriffe denkt,
      ist ein Ergebnis seines Lebensplatzes. Hinzu kommt die Prägung durch seine spezielle
      Organisation, die sich etwa in den Gefühlen ausdrückt, die er mit seinen Wahrnehmungen
      verbindet. Die Begriffswelt ist daher kein bloßes Abbild der Außenwelt, sondern ein
      eigenständiges, vom Menschen aktiv gestaltetes Reich, das die Wirklichkeit erst verstehbar
      macht.
    references:
      - chunk_id: f111f561-a4fe-5212-afb0-5eba342c83fd
