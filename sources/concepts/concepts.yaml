        relevance: 0.5
  - term: Erfahrung
    chunk_id: afa1a8dc-f24d-5f79-b0c5-76344285469d
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Erfahrung ist nicht das, was dem Menschen von außen einfach zufällt. Sie beginnt zwar mit der
      sinnlichen Wahrnehmung, bleibt aber nicht bei dieser stehen. Die bloße Wahrnehmung, wie sie
      sich dem Menschen darbietet, ist ein zusammenhangloses Chaos von Farben, Tönen, Formen und
      Kräften. Sie enthält für sich genommen noch keine Wirklichkeit, sondern nur eine unendliche
      Mannigfaltigkeit von Einzelheiten ohne innere Beziehung zueinander. Erst durch das Denken wird
      aus diesem Chaos Erfahrung. Der Mensch bringt das Denken aktiv hinzu: Er verbindet die
      Wahrnehmungen mit Begriffen und ordnet sie in einen gesetzmäßigen Zusammenhang ein. Dieser
      Vorgang ist kein bloßes Registrieren, sondern ein schöpferischer Akt. Die denkende
      Beobachtung, die weder einseitig den Begriff noch die Wahrnehmung für sich betrachtet, sondern
      den Zusammenhang beider, ergibt erst volle Wirklichkeit. Was der Mensch auf diese Weise
      gewinnt, hat einen doppelten Ursprung: Erfahrung und Denken. Es ist nicht mehr reine
      Erfahrung, sondern ein lebendiges, durchdrungenes Ganzes. Das Denken selbst nimmt dabei
      innerhalb der Erfahrung eine Ausnahmestellung ein, denn es führt durch seinen eigenen Inhalt
      über die bloßen Einzelheiten hinaus. Erfahrung ist daher kein passives Empfangen, sondern eine
      Tätigkeit, in der der Mensch die Wirklichkeit erst hervorbringt, indem er sie denkend
      verwandelt.


      **Quellen:** GA 3, GA 4, GA 18, GA 24 Erst in dieser Verbindung von Wahrnehmung und Denken
      entsteht das, was man im vollen Sinne Erfahrung nennen kann.
    references:
      - chunk_id: aaa5ba5a-2d65-520e-88ba-ca292533ae15
        description: Die sinnliche Auffassung der Wirklichkeit ist die erste Tätigkeit, und der ordnende
          Verstand durchdringt die Mannigfaltigkeit von Gestalten, Kräften, Farben und Tönen.
        relevance: 0.86
      - chunk_id: 1d4dbddc-ac6f-5ddd-bb53-d954fe5173fd
