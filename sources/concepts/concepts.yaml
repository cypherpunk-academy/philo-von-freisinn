        relevance: 0.7
  - term: Empfindung
    chunk_id: c298a513-c5bc-5f2f-86a4-8bc4f40c4f41
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Empfindung ist der unmittelbare, leibgebundene Eindruck eines äußeren oder inneren Vorgangs
      auf das Bewusstsein. Sie entsteht durch die Einwirkung der Außenwelt auf die Sinnesorgane:
      Licht, Farbe und Wärme sind das, womit die Sinnesnerven auf einen Reiz von außen antworten.
      Auch der Tastsinn liefert nicht die Gegenstände selbst, sondern nur die eigenen Zustände des
      Organismus. Die Empfindung bleibt daher zunächst subjektiv – sie sagt etwas über den Zustand
      des eigenen Leibes aus, nicht über die Sache an sich. Die Seele setzt die einzelnen, durch das
      Gehirn vermittelten Empfindungen (etwa Gesichts-, Tast- und Gehörempfindungen) zu Körpern
      zusammen. Was auf diese Weise zustande kommt, ist jedoch nicht mehr reine Erfahrung, sondern
      hat bereits einen doppelten Ursprung: Erfahrung und Denken. Denn erst durch die Verbindung mit
      dem Denken wird aus der bloßen Empfindung eine bewusste Wahrnehmung, die sich in den
      gesetzmäßigen Zusammenhang der Wirklichkeit eingliedern lässt. Die bloße Empfindung für sich
      genommen bleibt ein zusammenhangloses Einzelnes; erst die denkende Beobachtung, die den
      Zusammenhang von Wahrnehmung und Begriff erfasst, führt zur vollen Wirklichkeit. Empfindung
      ist somit der notwendige Ausgangspunkt aller Erfahrung, aber sie bedarf des Denkens, um zur
      Erkenntnis zu werden."
    references:
