  - term: Gattung
    chunk_id: 8a9e432c-c43f-5011-9fc4-98054acab41e
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die Gattung bezeichnet kein bloßes äußeres Klassifikationsmerkmal, sondern eine innere,
      gesetzmäßige Wirklichkeit, die sich in den einzelnen Exemplaren ausdrückt. Sie ist das
      gestaltende Prinzip, das der äußeren Erscheinung eines Organismus zugrunde liegt. Während in
      der unorganischen Natur eine Tatsache aus anderen Tatsachen erklärt werden kann, bedarf es in
      der organischen Welt eines zusätzlichen Faktors: eines inneren Prinzips, das sich nicht passiv
      von äußeren Einwirkungen bestimmen lässt, sondern sich aktiv aus sich selbst heraus unter
      deren Einfluss formt. Dieses innere Prinzip ist die Gattung als lebendige Idee, die der
      denkenden Anschauung zugänglich ist. Sie ist eine reale, gestaltende Kraft; der einzelne
      Organismus ist die Erscheinung dieser übergeordneten Wirklichkeit. Die spezialisierte Gestalt
      eines Lebewesens muss daher aus diesem inneren Prinzip abgeleitet werden, während die äußeren
      Umstände erklären, warum sich gerade diese besondere Form entwickelt hat.


      Für den Menschen verhält es sich anders. Er trägt zwar als Naturwesen ebenfalls gattungsmäßige
      Züge an sich, die durch Rasse, Volk oder Familie bedingt sind. Von diesem Gattungsmäßigen
      macht er sich jedoch frei. Das menschlich Gattungsmäßige ist, richtig erlebt, nichts die
      Freiheit Einschränkendes. Der Mensch entwickelt Eigenschaften, deren Bestimmungsgrund nur in
      ihm selbst zu suchen ist. Das Gattungsmäßige dient ihm dabei nur als Mittel, um seine
      besondere Wesenheit auszudrücken.
    references:
      - chunk_id: e9dc7b4d-5d2a-57b6-b743-daef6daf965a
        description: Der Mensch macht sich vom Gattungsmäßigen frei, das seine Freiheit nicht einschränkt,
          und das Gattungsmäßige dient ihm nur als Mittel, um seine besondere Wesenheit
          auszudrücken.
        relevance: 0.95
      - chunk_id: 602e40f8-cbdc-526a-a13a-ccc7975f3c51
        description: Die spezialisierte Gestalt eines organischen Wesens muss aus einem inneren Prinzip
