  - term: Tugend
    chunk_id: 801c3858-fce4-55e5-a684-efe34dfcb812
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Tugend ist kein moralisches Gebot, das von außen an den Menschen herantritt, sondern die Folge
      innerer Einsicht. Sie entsteht nicht aus einem kategorischen Imperativ oder einer Stimme der
      Pflicht, der man sich unterwerfen müsste. Tugendhaft handelt vielmehr, wer aus eigener
      Erkenntnis handelt, nicht aus Autoritäten oder äußeren Zwängen. Der Antrieb zum Handeln liegt
      nicht außerhalb, sondern im Menschen selbst. Das Wollen ist souverän: Es vollführt nur, was
      als Gedankeninhalt in der menschlichen Persönlichkeit liegt. Der Mensch ist sein eigener
      Gesetzgeber.


      Damit löst sich der Tugendbegriff aus jeder starren Morallehre. Tugend ist lebendig, wandelbar
      und individuell. Sie zeigt sich in der Fähigkeit, das eigene Wollen zu durchschauen, sodass
      Handeln aus freiem Geist erfolgt. Wer tugendhaft handelt, handelt nicht aus Pflichtgefühl,
      sondern aus Einsicht. Tugend ist die praktische Seite der Freiheit: Sie verwirklicht sich in
      dem Maße, wie ein Mensch seine sittlichen Ideale als eigenes freies Erzeugnis begreift und
      ausführt, was er sich selbst als Norm vorschreibt.


      Erst wenn ein Mensch die Beweggründe seines Handelns klar erkennend durchdringt, macht er eine
      Eroberung im Gebiet der Freiheit. Tugend ist dann nichts anderes als das Auslebenlassen jenes
      intuitiven Gehalts, der den Sittlichkeitsgehalt des Individuums ausmacht. Auf dieser Stufe
      fallen Triebfeder und Motiv zusammen: Die Handlung wird nicht durch eine äußere Norm bestimmt,
      sondern durch ihren idealen Gehalt.
    references:
      - chunk_id: c8f876e1-ab52-59f6-b379-79da2d789da7
