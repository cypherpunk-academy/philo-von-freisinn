  - term: Dreigliederungsidee
    chunk_id: 0851d030-f594-5ca2-862a-949ac15add26
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Die Dreigliederungsidee unterscheidet drei eigenständige Bereiche des gesellschaftlichen
      Lebens: das Geistesleben, das Rechtsleben und das Wirtschaftsleben. Jeder dieser Bereiche
      folgt eigenen Prinzipien und soll von einem eigenen Mittelpunkt aus verwaltet werden. Das
      Geistesleben, zu dem Erziehung und Unterricht gehören, braucht Freiheit und muss unabhängig
      von staatlicher Lenkung und wirtschaftlichen Interessen aus sich selbst heraus wirken können.
      Das Rechtsleben beruht auf Gleichheit und entfaltet sich am besten in einem selbständigen,
      demokratischen Rechtsorganismus. Das Wirtschaftsleben schließlich ist assoziativ zu gestalten
      und benötigt fortwährend Korrektur von außen, da es aus sich selbst heraus keine gesunden
      sozialen Verhältnisse hervorbringen kann. Die drei Bereiche dürfen nicht vermischt werden:
      Wenn wirtschaftliche Macht das Rechtsleben bestimmt oder der Staat das Geistesleben lenkt,
      entstehen Ungleichgewichte. Die Dreigliederungsidee ist kein starres Modell, sondern eine
      Anregung, die Gesellschaft aus den natürlichen Lebensbereichen des Menschen heraus zu
      verstehen. Sie wendet sich an Menschen, die den Mut haben, von den Äußerlichkeiten des Lebens
      zu dessen innerer Wesenheit vorzudringen. Die Einheit des sozialen Organismus wird durch diese
      Gliederung nicht gefährdet, denn jeder Mensch gehört mit seinen Interessen allen drei
      Teilbereichen an."
    references:
