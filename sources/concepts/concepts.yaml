        relevance: 0.9
  - term: Philosophie
    chunk_id: fa03e05e-931d-5f22-8d8c-c10faf525bce
    language: de
    tags:
      - concept
      - assistant-generated
    text: Philosophie ist für diese Betrachtungsweise keine bloße Gedankenkonstruktion oder abstrakte
      Lehre, sondern eine methodische Selbstbesinnung des Menschen auf sein Erkennen und Handeln.
      Ihr Ausgangspunkt liegt in der unmittelbaren Erfahrung, dass der Mensch sich zur Welt
      verhalten kann – und dass ein Unterschied besteht zwischen einem bewussten Beweggrund des
      Handelns und einem unbewussten Antrieb. Philosophie fragt daher nach Wahrheit, die der Mensch
      selbst verantworten kann, und nach Impulsen für eigenes Handeln. Sie ist Arbeit des Menschen
      an sich selbst, um das Denken zu einem selbstständigen, schöpferischen Organ zu schulen. Es
      geht nicht darum, die Welt zu erschaffen, sondern sie zu begreifen. Der Philosoph sucht nicht
      die Ausgangspunkte für das Schaffen, sondern für das Begreifen des Vorhandenen. Philosophie
      ist eine besondere Form, dem menschlichen Seelenbedürfnis Befriedigung zu geben, das in der
      Forderung „Erkenne dich selbst“ seinen Ausdruck findet. Ihr Ziel ist keine festgefügte Lehre,
      sondern eine Haltung, die man sich erarbeitet. Sie dient der allseitigen Entfaltung der ganzen
      Menschennatur und der Erhöhung des Daseinswertes der menschlichen Persönlichkeit. Die
      entscheidende Frage ist, wie sich Philosophie als Kunst zur Freiheit des Menschen verhält.
      Freiheit wird dabei nicht als Willkür verstanden, sondern als die Fähigkeit, aus eigener
      Einsicht zu handeln, indem man die Beweggründe seines Tuns aus sich selbst heraus bestimmt.
    references:
      - chunk_id: fab83a13-1c8b-5705-b2a2-1a64ecd6a698
        description: Dem Philosophen geht es nicht um die Weltschöpfung, sondern um das Begreifen derselben;
          er sucht die Ausgangspunkte für das Begreifen, nicht für das Schaffen.
        relevance: 0.95
      - chunk_id: 253376a8-cfe6-5599-bafb-06699dae7833
        description: Die Hauptfrage ist, wie sich die Philosophie als Kunst zur Freiheit des Menschen
          verhält; alle anderen Ausführungen dienen der Aufklärung dieser Frage.
        relevance: 0.95
      - chunk_id: c8f876e1-ab52-59f6-b379-79da2d789da7
        description: Es gibt einen Unterschied zwischen einem bewussten Beweggrund des Handelns und einem
          unbewussten Antrieb, was zu unterschiedlicher Beurteilung der Handlung führt.
        relevance: 0.9
      - chunk_id: dbafbb83-9ca1-5cbc-b610-883bbbeee36c
        description: Freiheit muss dem menschlichen Wollen zugesprochen werden, insofern es rein ideelle
          Intuitionen verwirklicht, die nicht von äußerer Notwendigkeit abhängen.
        relevance: 0.85
      - chunk_id: 874d125c-dab5-5df2-8946-f266437a9696
        description: Nicht alles menschliche Handeln ist frei; der unfreie Teil ist der, wo wir die Gesetze
          des Handelns nicht als Wissen besitzen, der freie Teil ist das sittliche Gebiet.
        relevance: 0.8
      - chunk_id: e31976d4-1f2b-56f0-a0ce-5687fee5ab33
        description: Unser Leben setzt sich aus Handlungen der Freiheit und der Unfreiheit zusammen; der
          freie Geist ist die reinste Ausprägung der menschlichen Natur.
        relevance: 0.8
  - term: Politik
    chunk_id: a1fe4b1f-9cad-59cd-a58e-0a936f5c6d86
    language: de
    tags:
      - concept
      - assistant-generated
    text: Politik ist im Rahmen der Dreigliederung des sozialen Organismus dem mittleren Glied, dem
      rechtlich-politischen Bereich, zugeordnet. Dieser Bereich umfasst in erster Linie die Polizei-
      und Verwaltungstätigkeit auf rechtlicher Grundlage. Geregelt wird er durch ein demokratisch
      gewähltes Parlament, das sich ausschließlich mit rein staatlich-politischen Fragen befasst.
      Dadurch kann es weder das freie Geistesleben noch das eigenständige Wirtschaftsleben stören
      oder bevormunden. Die Legitimation für dieses Rechtsleben entsteht aus dem demokratischen
      Diskurs mündiger Bürger, die ihre Rechte gegenüber einander regeln. Alles, was sich auf die
      Rechtsverhältnisse der am Wirtschaftsleben beteiligten Personen bezieht, insbesondere die
      Arbeit, die Menschen füreinander leisten, wird aus der Wirtschaftsverwaltung ausgesondert und
      in dieses demokratische Parlament verwiesen. Politik im engeren Sinne ist also die Gestaltung
      der rechtlichen Beziehungen zwischen den Menschen, die unabhängig von den Interessen des
      Wirtschaftslebens und den Impulsen des freien Geisteslebens erfolgt. Sie schafft die Ordnung,
      in der sich ein wahres Gemeinsamkeitsgefühl und der Wille, für die Gemeinschaft zu arbeiten,
      entwickeln können. Die Aufgabe der Politik ist es, den Rahmen zu setzen, innerhalb dessen sich
      die anderen beiden Glieder des sozialen Organismus frei entfalten können.
    references:
      - chunk_id: fae84b03-1b08-546a-8ca9-4d2e07020a98
        description: Alles, was sich auf die Rechtsverhältnisse der am Wirtschaftsleben beteiligten Personen
          bezieht, insbesondere die Arbeit, wird aus der Wirtschaftsverwaltung ausgesondert und in
          ein demokratisches Parlament verwiesen.
        relevance: 0.95
      - chunk_id: caaad29e-5ebb-5572-9f61-3e6d9373001e
        description: Das demokratisch orientierte Rechtsstaatsleben gibt dem Arbeitswillen die notwendigen
          Impulse, und in den Beziehungen, wenn jeder Mündige seine Rechte regelt, entzündet sich
          der Wille, für die Gemeinschaft zu arbeiten.
        relevance: 0.9
      - chunk_id: a4bc6284-8a30-5aa2-ab13-c916e5c79604
        description: Ein neben dem Wirtschaftskreis bestehender Rechtsorganismus und ein unabhängiges
          Geistesleben bewirken den Ausgleich im sozialen Organismus.
        relevance: 0.85
      - chunk_id: c4b67d01-9074-536d-abdb-eebcd4cb9107
        description: Das geistige Glied im dreigliedrigen sozialen Organismus umfasst Wissenschaft, Kunst,
          Religion und Erziehungswesen und muss in vollkommener Freiheit von staatlichen Eingriffen
          seine Aufgabe erfüllen.
        relevance: 0.8
      - chunk_id: 4be517bc-8132-52bd-8671-ce78a0a12318
        description: Eine Gemeinschaft ist nur im dreigliedrigen sozialen Organismus möglich, der ein freies
          Geistesleben, ein demokratisch orientiertes Staatsleben und ein selbständiges
          Wirtschaftsleben hat.
        relevance: 0.75
      - chunk_id: 7918111a-47aa-5a1b-bbdb-20e388438195
        description: Das Rechtsleben wird im selbständigen Rechtsglied des sozialen Organismus geregelt, das
          Geistesleben in völliger Freiheit im selbständigen Geistesglied.
        relevance: 0.7
  - term: Produktionsmittel
    chunk_id: 0e66208d-07fc-5906-927f-ab3f2af66b1c
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Produktionsmittel sind vergegenständlichte Arbeit vergangener Generationen. Ein Rock, den ein
      Schneider für sich selbst anfertigt, ist nicht einfach ein Kleidungsstück, sondern ein
      Produktionsmittel: Er dient nicht dem unmittelbaren Verbrauch, sondern ermöglicht dem
      Schneider, für andere zu arbeiten. Damit ist der Wert eines Produktionsmittels nicht direkt
      aus den Bedürfnissen des Einzelnen ableitbar, sondern ergibt sich erst aus dem gesamten
      sozialen Zusammenhang. Die freie Verfügung über Produktionsmittel ist notwendig, damit der
      Einzelne seine individuellen Fähigkeiten fruchtbar für die Allgemeinheit einsetzen kann. Wer
      diese Verfügung unterbindet, lähmt die freie Anwendung menschlicher Geschicklichkeit. Zugleich
      dürfen Produktionsmittel nicht dazu dienen, über andere Menschen zu herrschen. Der Rechtsstaat
      wird privates Eigentum an Kapital nicht grundsätzlich verhindern, solange die Verwaltung
      dieses Eigentums einen Dienst für das Ganze bedeutet. Entscheidend ist, dass das
      Eigentumsrecht in dem Augenblick verändert werden kann, in dem es in ein Mittel zur
      ungerechtfertigten Machtentfaltung umschlägt. Die Verwaltung der Produktionsmittel soll daher
      nicht vom politischen Staat oder von privaten Kapitalinteressen allein ausgehen, sondern von
      einem freien Geistesleben, das die wirtschaftlichen Prozesse aus sachlichem Interesse an der
      Hervorbringung von Leistungen heraus gestaltet."
    references:
      - chunk_id: 73ee3342-63ab-5d65-8c20-823786aecb6b
        description: Die freie Verfügung über Produktionsmittel ist notwendig, damit individuelle
