        relevance: 0.7
      - chunk_id: f111f561-a4fe-5212-afb0-5eba342c83fd
        description: Ein Begriff wird aus dem Fond der Gedankenwelt hervorgeholt, unabhängig davon, wo und
          wann er erfasst wird; alle Bestimmungen des Gedankens stammen aus der Gedankenwelt.
        relevance: 0.7
      - chunk_id: c27ead6d-62e0-53e6-a90b-66de3046d6dc
        description: Auch innere Zustände wie Gefühle und das Denken selbst treten in derselben Form in den
          Horizont des Bewusstseins ein wie äußere Dinge.
        relevance: 0.6
      - chunk_id: 224714c3-9fce-5bf9-a528-5d21bb4f67aa
        description: Wenn die Kombination der Tatsachen in der unmittelbaren Erfahrung nicht genügt, müssen
