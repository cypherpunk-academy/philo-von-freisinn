  - term: Empfinden
    chunk_id: 3c32c6c9-2428-5d1e-86e5-887daed97f70
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Das Empfinden ist jener Vorgang, durch den der Mensch unmittelbar von einer sinnlichen
      Wahrnehmung innerlich berührt wird. Es ist die Seite der Erfahrung, die sich dem Bewusstsein
      ebenso aufdrängt wie ein äußerer Eindruck: Ein Gefühl der Lust oder des Schmerzes tritt in
      derselben Weise in den Horizont des Bewusstseins wie ein Lichteindruck oder ein Ton. Das
      Empfinden ist damit an den einzelnen, flüchtigen Sinneseindruck gebunden und vergeht mit ihm.
      Es unterscheidet sich grundlegend vom Denken. Während das Denken tätig den Begriff einer Sache
      bildet, wird die Empfindung in der Seele durch einen Gegenstand erzeugt, ähnlich wie ein
      fallender Stein eine Veränderung an dem Gegenstand bewirkt, auf den er trifft. Die Empfindung
      steht daher nicht in demselben Verhältnis zu ihrem Gegenstand wie der Begriff. Sie ist für die
      Beobachtung in genau derselben Weise gegeben wie der sie veranlassende Vorgang selbst. Die
      bloße sinnliche Auffassung der Wirklichkeit, die reine Erfahrung, liefert zunächst nur ein
      zusammenhangloses Chaos von Empfindungen. Erst durch das Denken, das die gesetzmäßigen
      Beziehungen zwischen den Wahrnehmungen herstellt, wird aus diesem Chaos eine geordnete
      Wirklichkeit. Weder die bloße Empfindung für sich noch der abstrakte Begriff für sich
      enthalten die volle Wirklichkeit. Diese ergibt sich allein aus dem Zusammenhang beider, aus
      der denkenden Beobachtung, die das Empfinden mit dem Begriff verbindet."
    references:
      - chunk_id: aaa5ba5a-2d65-520e-88ba-ca292533ae15
        description: Die sinnliche Auffassung der Wirklichkeit ist die erste Tätigkeit, und die unendliche
          Mannigfaltigkeit von Gestalten, Kräften, Farben, Tönen wird mit dem ordnenden Verstand
          durchdrungen.
        relevance: 0.9
      - chunk_id: c27ead6d-62e0-53e6-a90b-66de3046d6dc
        description: Innere Zustände wie Gefühle treten in derselben Form in den Horizont des Bewusstseins
          wie äußere Eindrücke, und auch das Denken selbst tritt so auf.
        relevance: 0.9
      - chunk_id: 7dc23363-6811-5966-ae57-06177ae4912e
        description: Die Lust steht nicht in demselben Verhältnis zu ihrem Gegenstand wie der Begriff, den
