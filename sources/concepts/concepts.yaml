        relevance: 0.7
      - chunk_id: 5cee11a3-32e6-5136-9bf0-45b677b1cb27
        description: Es gibt Menschen, die den Weg zum Geist nicht finden können und bei dem Materiellen
          stehen bleiben.
        relevance: 0.6
      - chunk_id: ed059e25-58b7-56b0-a682-6a1dafe2917d
        description: Spiritualisten erkennen den Geist als das Realste an, leugnen aber die Bedeutung des
          Materiellen und seiner Gesetze und sind daher einseitig.
        relevance: 0.6
  - term: Materie
    chunk_id: a61eccc3-6f1a-5590-b627-d18bd60f30b9
    language: de
    tags:
      - concept
      - assistant-generated
    text: Materie ist nicht das Fundament der Wirklichkeit, sondern eine Erscheinungsform, die aus der
      Tätigkeit des menschlichen Organismus hervorgeht. Sie ist ebenso sehr Produkt der eigenen
      Organisation wie Farbe oder Ton. Der Mensch ist so eingerichtet, dass er nicht aus seinem
      eigenen Bereich heraustreten kann; auch das, was jenseits seiner Grenze liegt, kann er sich
      nur durch seine Vorstellung vergegenwärtigen. Die Materie ist daher kein Ding an sich, das
      unabhängig vom Menschen existiert, sondern ein Inhalt, den die Wahrnehmung liefert und der
      erst durch das Denken in einen Zusammenhang gebracht werden muss. Die Wahrnehmung ist der
      objektiv gegebene Teil der Wirklichkeit, der Begriff der subjektiv durch Intuition gegebene.
      Erst der Zusammenhang beider ergibt volle Wirklichkeit. Betrachtet man die bloße Wahrnehmung
      für sich, hat man ein zusammenhangloses Chaos; betrachtet man die Gesetzmäßigkeit der
      Wahrnehmungen für sich, hat man nur abstrakte Begriffe. Die denkende Beobachtung, die beide
      Seiten verbindet, führt zur Wirklichkeit. Ein rein materielles Denken, das den Menschen als
      bloßes Produkt stofflicher Abläufe missversteht, macht ihn unfrei. Der Materialismus hat eine
      eingeschränkte Berechtigung, denn die Verfolgung der materiellen Zusammenhänge führt zuletzt
      zur Anschauung des Geistes. Die Materie ist demnach nicht der Gegensatz zum Geist, sondern
      diejenige Seite der Wirklichkeit, die auf geistige Tätigkeit verweist.
    references:
      - chunk_id: dc4f16d2-a5d3-5d98-99f8-193e5919898f
        description: Materie ist ebenso gut nur Produkt meiner Organisation wie die Farbe oder der Ton, und
          auch wenn wir von Dingen an sich sprechen, kommen wir nicht aus unserem eigenen Bereich
          hinaus.
        relevance: 0.95
      - chunk_id: 134bb849-a47f-5894-836c-2c260198b10b
        description: Den Materialismus bekämpfen oder zum Zerrbild machen kann nicht die Aufgabe einer
          geschichtlichen Darstellung sein, denn er hat seine eingeschränkte Berechtigung.
        relevance: 0.9
      - chunk_id: 1e7ec70e-04e7-5a99-8a3e-24b8665416b5
        description: Der Schnitt zwischen Wahrnehmen und Denken ist erst vorhanden, wo ich den Dingen
          gegenübertrete.
        relevance: 0.85
      - chunk_id: 0ae1ef84-d26f-5de0-9491-3e19f8734e60
        description: Die Tätigkeit des Denkens ist nicht als eine subjektive aufzufassen, und die durch das
          Denken hergestellten Beziehungen haben nicht bloß subjektive Geltung.
        relevance: 0.85
      - chunk_id: aaa5ba5a-2d65-520e-88ba-ca292533ae15
        description: Die sinnliche Auffassung der Wirklichkeit ist die erste Tätigkeit, und wir müssen die
          unendliche Mannigfaltigkeit mit dem ordnenden Verstand durchdringen.
        relevance: 0.8
      - chunk_id: acdbfab6-3114-5232-b8b4-4eb8590689ce
        description: Eine Wahrnehmung wie Rot steht in Zusammenhang mit anderen Wahrnehmungen, und diesen
          Zusammenhang bezeichne ich als einen Gegenstand der Sinnenwelt.
        relevance: 0.8
      - chunk_id: 8c202f12-cee3-52d7-b08c-7b54d646f343
        description: Wissen entsteht erst, wenn wir die Gegenstände der Erfahrung im Zusammenhang betrachten.
        relevance: 0.8
      - chunk_id: e7e99b38-5149-5529-a58e-2fdd67ad520b
        description: Beim Denken vollbringen wir das Schaffen vor dem Erkennen; wir müssen resolut darauf
