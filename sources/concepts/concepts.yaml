        relevance: 0.7
  - term: Entscheidung
    chunk_id: 82810829-a552-5abd-acad-e26c91590a8e
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Eine Entscheidung ist der bewusste Abschluss eines inneren Vorgangs, in dem Denken und Wollen
      zusammenwirken. Sie entsteht nicht aus blindem Drang oder äußerem Zwang, sondern aus einem
      erkannten Beweggrund. Die entscheidende Frage ist nicht, ob ich einen gefassten Entschluss
      ausführen kann, sondern wie der Entschluss in mir entsteht. Erst wenn ich ein Wissen von den
      Gründen meines Handelns habe, unterscheidet sich meine Handlung von einer solchen aus
      unbewusstem Antrieb.


      Die höchste Stufe des Handelns ist erreicht, wenn die Triebfeder nicht aus einer bestimmten
      Wahrnehmung, sondern aus dem reinen Denken selbst kommt. In diesem Fall handelt der Mensch aus
      einer Intuition, deren Inhalt nicht bloß individuell, sondern ideell und damit allgemein ist.
      Ein solcher Antrieb ist nicht mehr an die persönliche charakterologische Anlage gebunden,
      sondern entspringt unmittelbar der ideellen Sphäre. Die Entscheidung wird hier zur
      Verwirklichung eines rein gedanklichen Gehalts im Wollen.


      Entscheidung ist in diesem Sinne individuell, aber nicht willkürlich, denn sie gründet in
      objektiver Erkenntnis. Der Handelnde lässt sich durch den Wahrnehmungsinhalt einer Situation
      nicht bestimmen, sondern bildet sich einen Erkenntnisbegriff, dem er den moralischen Begriff
      aus seiner Intuition hinzufügt. Eine wirkliche Entscheidung ist daher immer der Moment, in dem
      der Mensch aus Einsicht handelt und nicht aus bloßer Gewohnheit oder äußerem Anstoß.
    references:
      - chunk_id: c8f876e1-ab52-59f6-b379-79da2d789da7
        description: Ein bewusster Beweggrund führt zu einer anderen Beurteilung der Handlung als ein
          unbewusster Antrieb.
        relevance: 0.95
      - chunk_id: b4044e98-59b2-50c2-b9d8-49b63ba609b7
