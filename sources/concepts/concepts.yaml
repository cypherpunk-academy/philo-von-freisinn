        relevance: 0.9985
  - term: Erkenntnis
    chunk_id: 642b37b4-052e-52fa-b7ab-f7a7db23288e
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Erkenntnis ist kein passives Aufnehmen von Eindrücken, sondern ein aktiver Vorgang. Die
      Wahrnehmung allein bietet nur ein zusammenhangloses Chaos, eine unvollständige Seite der
      Wirklichkeit. Die andere Seite ist der Begriff, der aus dem Inneren des Menschen durch
      Intuition hinzugebracht wird. Erst die Verbindung von Wahrnehmung und Begriff im Erkenntnisakt
      ergibt volle Wirklichkeit. Das Denken ist das Organ, das diese Synthese herstellt. Es greift
      über das bloße Sondersein des Menschen hinaus und bezieht sich auf das allgemeine Weltensein.
      Dadurch entsteht der Trieb der Erkenntnis. Der Mensch muss die Dinge auf zweifache Art zu sich
      sprechen lassen: einen Teil sagen sie ihm freiwillig, den anderen muss er ihnen durch sein
      Denken entlocken. Die Erkenntnis ist somit ein schöpferischer Vorgang, der die ursprünglich
      unvollständig gegebene Welt durch die Enthüllung ihrer zweiten Seite ergänzt. Sie beruht
      darauf, dass der Weltinhalt nicht fertig und abgeschlossen ist, sondern einer Ergänzung durch
      den Menschen bedarf. Die Fragen der Erkenntnis stellt sich der Mensch selbst aus dem klaren
      Element des Denkens heraus. Von einer unüberwindlichen Grenze der Erkenntnis kann dabei nicht
      gesprochen werden; was heute unaufgeklärt bleibt, kann morgen durch Fortschreiten von
      Wahrnehmung und Denken gefunden werden. Die Erkenntnis führt den Menschen aus der bloßen
      Betrachtung in das konkrete individuelle Leben, in dem er mit voller Kraft tätig sein kann."
    references:
      - chunk_id: 1e7ec70e-04e7-5a99-8a3e-24b8665416b5
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 1
      - chunk_id: 70ae0829-e15c-5bcc-9c52-8e45063d1b85
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 0.9942
      - chunk_id: a5568ad8-99e8-54c4-b8d3-daf47b74c343
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 0.9918
  - term: Erkenntnisprozess
    chunk_id: 02ff25e9-153a-58b0-81ed-d1082de976ab
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Erkenntnisprozess ist kein passives Aufnehmen äußerer Tatsachen, sondern ein lebendiges
      Geschehen, an dem der Mensch aktiv mitwirkt. Die Wirklichkeit tritt dem Menschen in zwei
      getrennten Faktoren entgegen: der Wahrnehmung und dem Begriff. Die Wahrnehmung ist der
      objektiv gegebene Teil der Wirklichkeit, der Begriff der subjektiv durch Intuition gegebene.
      Erst die Vereinigung beider ergibt volle Wirklichkeit. Betrachtet man die bloße Wahrnehmung
      für sich, hat man ein zusammenhangloses Chaos; betrachtet man die Gesetzmäßigkeit für sich,
      hat man nur abstrakte Begriffe. Die denkende Beobachtung hingegen betrachtet den Zusammenhang
      beider.


      Das Denken nimmt dabei eine besondere Stellung ein. Weil der Mensch innerhalb des
      Denkprozesses steht, ist ihm nicht nur das Bewirkte gegeben, sondern das Wirkende selbst. Im
      Denken hält er das Weltgeschehen an einem Zipfel, wo er dabei sein muss, wenn etwas zustande
      kommt. Der Mensch erlebt den Gedanken als etwas unmittelbar Tätiges, das er überschauen kann.
      Der Erkenntnisakt ist die Synthese von Wahrnehmung und Begriff, die das ganze Ding erst
      ausmachen. Durch das Denken lebt sich der Mensch geistig in die Wirklichkeit hinein, und das
      Wahrnehmungselement erhält seine Wirklichkeitsbestimmung erst, wenn es im Denken ergriffen
      wird. Erkenntnis ist somit ein freies, selbstbestimmtes Tun, das den Menschen befähigt, die
      volle Wirklichkeit zu erfassen.
    references:
      - chunk_id: a5568ad8-99e8-54c4-b8d3-daf47b74c343
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 1
      - chunk_id: fffa2ea6-c7b6-5378-bcd3-06500cdc8a80
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 0.9947
      - chunk_id: 224714c3-9fce-5bf9-a528-5d21bb4f67aa
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 0.9943
  - term: Erkenntnistheorie
    chunk_id: 6e0bc87f-287a-5ab2-8054-d504773703a8
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die Erkenntnistheorie fragt nach den Bedingungen der Möglichkeit von Erkenntnis. Sie
      untersucht das Verhältnis von Denken und Wirklichkeit. Dabei zeigt sich, dass das Denken kein
      bloßes Werkzeug ist, mit dem der Mensch eine ihm äußerliche Welt abbildet. Es ist ein
      lebendiger Vorgang, der selbst zur Wirklichkeit gehört. Das Denken ist nicht passiv, sondern
      produktiv. Es überwindet die Grenze zwischen Subjekt und Objekt in einem einheitlichen
      Prozess. Die Wahrheit ist keine fertige Größe, die es abzubilden gilt. Sie ist ein lebendiges
      Geschehen, das der Mensch im Denken hervorbringt.


      Die Wirklichkeit zerfällt für den Menschen in zwei Faktoren: die Wahrnehmung, die objektiv
      gegeben ist, und den Begriff, der subjektiv durch Intuition erfasst wird. Erst im Zusammenhang
      beider, in der denkenden Beobachtung, entsteht volle Wirklichkeit. Die bloße Wahrnehmung für
      sich genommen ist ein zusammenhangloses Chaos. Der abstrakte Begriff für sich genommen ist
      leer. Das Denken ist eine Totalität in sich, die sich selbst genug ist. Es darf nicht zu
      Dingen seine Zuflucht nehmen, die es nicht in sich selbst findet. Alles geht zuletzt im Denken
      auf. Die Erkenntnistheorie zeigt so, dass das Denken der Kern der Welt ist, indem sie den
      Zusammenhang des Denkens mit der übrigen Wirklichkeit aufdeckt. Sie führt den Menschen an den
      Punkt, an dem er das Denken als seine eigene, innerlich erlebte Tätigkeit erkennt und damit
      einen festen Grund für das Verständnis der Welt gewinnt.
    references:
      - chunk_id: fffa2ea6-c7b6-5378-bcd3-06500cdc8a80
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 1
      - chunk_id: a5568ad8-99e8-54c4-b8d3-daf47b74c343
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 0.9954
      - chunk_id: d06a0db8-93de-573a-955e-2b9b772acf51
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 0.9952
  - term: Erleben
    chunk_id: b73f310e-ada8-5eed-b18a-25c58742c3c8
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Das unmittelbar gegebene Weltbild, wie es dem Menschen vor jeder gedanklichen Bestimmung
      vorliegt, ist der Ort des Erlebens. Es ist der zusammenhanglose Strom von Eindrücken, Farben,
      Tönen, Gestalten, an dem der Mensch vorüberzieht und der an ihm vorüberzieht, ohne dass darin
      bereits etwas unterschieden oder aufeinander bezogen wäre. In diesem Zustand ist kein
      Gegenstand bedeutungsvoller als ein anderer. Das Erleben ist die erste Tätigkeit der Seele:
      die sinnliche Auffassung der Wirklichkeit. Was sich hier darbietet, ist reine Erfahrung, der
      Stoff, den der Mensch festhalten muss. Doch das Erleben allein bleibt blind und ungeordnet.
      Erst wenn der Mensch mit dem ordnenden Verstand in dieses unmittelbar Gegebene eingreift, die
      gegenseitigen Abhängigkeiten der Einzelheiten aufklärt und die Tatsachen in ideelle
      Verhältnisse bringt, entsteht Erkenntnis. Diese hat dann einen doppelten Ursprung: Erfahrung
      und Denken. Das Erleben liefert den Gehalt, das Denken die Form. Ohne das Erleben bliebe das
      Erkennen leer, ohne das Erkennen bliebe das Erleben blind. Im Erleben selbst liegt noch keine
      Freiheit und keine Selbstbestimmung; diese entstehen erst dort, wo das Ich die beiden Elemente
      – das Gegebene und den Begriff – in einem Akt freier Tätigkeit vereinigt. Das Erleben ist
      somit die notwendige Grundlage, auf der alle Erkenntnis und alles bewusste Handeln aufbauen
      kann."
    references:
      - chunk_id: eedd7db3-1964-5505-ba28-9a1089dc45c0
        description: Das unmittelbar gegebene Weltbild liegt vor jeder gedanklichen Bestimmung und ist ein
          zusammenhangloser Strom von Eindrücken.
        relevance: 1
      - chunk_id: aaa5ba5a-2d65-520e-88ba-ca292533ae15
        description: Die sinnliche Auffassung der Wirklichkeit ist die erste Tätigkeit, und der ordnende
          Verstand durchdringt die Mannigfaltigkeit der Eindrücke.
        relevance: 0.95
      - chunk_id: a4f087d2-6ccc-5bb8-9ba3-f136d7ab15a7
        description: Das Ich kann sich durch Freiheit in Tätigkeit versetzen und durch Selbstbestimmung die
          Kategorie des Erkennens realisieren.
        relevance: 0.85
  - term: Erscheinung
    chunk_id: 39fa4d7a-d09d-587e-99ac-189602b08990
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Mit „Erscheinung“ ist die erste Form gemeint, in der uns die Wirklichkeit begegnet: ein
      wahrnehmbares Ding oder ein wahrnehmbarer Vorgang, sofern er im Raum oder in der Zeit
      auftritt. Dazu gehören nicht nur die Eindrücke der äußeren Sinne wie Farbe, Ton, Wärme oder
      Härte, sondern auch das, was der sogenannte innere Sinn an unmittelbaren Tatsachen des
      seelischen Erlebens vermittelt. Die Erscheinung ist das, was den Sinnen zunächst gegeben ist,
      bevor das Denken an sie herantritt.


      Diese Erscheinung ist jedoch nicht die ganze Wirklichkeit. Sie ist nur eine Seite. Die andere
      Seite ist der Begriff, der durch das Denken hinzugefügt wird. Die Erscheinung allein ist
      stumm; sie fordert zur denkenden Tätigkeit auf. Erst die Vereinigung von Wahrnehmung und
      Begriff ergibt volle Wirklichkeit. Betrachtet man die bloße Wahrnehmung für sich, hat man kein
      zusammenhängendes Ganzes, sondern ein bloßes Chaos von Einzelheiten ohne innere Beziehung. Das
      Wahrnehmungsbild ist zudem abhängig vom Standort des Betrachters und von den Bedingungen
      seiner Sinne. Es ist daher nicht einfach mit dem Wesen der Sache selbst gleichzusetzen. Die
      Erscheinung ist die Außenseite, die Hülle, die den Menschen auffordert, weiterzuforschen und
      durch das Denken zur wahren Wirklichkeit vorzudringen.
    references:
      - chunk_id: 919225a7-3711-5a9c-b9ca-f00df0923ced
        description: Die erste Form der Wirklichkeit wird Erscheinung für die Sinne genannt, wobei Sinn alle
          leiblichen und geistigen Organe der Wahrnehmung umfasst.
        relevance: 0.95
      - chunk_id: 5c73281a-82f0-5593-89ba-b4f1a63a12de
        description: Die Erscheinung ist nur die unwesentliche Außenseite der Wirklichkeit, eine Hülle, die
          das wahre Wesen verbirgt und zur weiteren Forschung auffordert.
        relevance: 0.95
      - chunk_id: 59876cd1-09bc-5935-b12e-38cc4801136d
        description: Das Wahrnehmungsbild ist abhängig vom Standort des Betrachters und nicht objektiv, wie
          das Beispiel der Allee zeigt.
        relevance: 0.9
      - chunk_id: d87f7fb3-2410-51c4-9901-a2e7c916887e
        description: Die bloße Wahrnehmung eines Dings ist keine Totalität; erst die denkende Betrachtung
          ergänzt sie, wie das Beispiel der Rosenknospe zeigt.
        relevance: 0.85
      - chunk_id: c63937e9-05df-514c-8c01-b849f2841708
        description: Die Welt der Farben und Töne ist nicht objektiv, sondern durch die Einrichtung der
          Sinne und des Gehirns hervorgebracht.
        relevance: 0.8
      - chunk_id: 8c202f12-cee3-52d7-b08c-7b54d646f343
        description: Wissen entsteht erst, wenn Wahrnehmungsgegenstände im Zusammenhang betrachtet werden.
