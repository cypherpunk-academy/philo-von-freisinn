        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 0.9838
  - term: Gedankenerleben
    chunk_id: 09d5af4d-774c-5a30-abf5-87a715c45ab9
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Das Gedankenerleben bezeichnet jene innere Tätigkeit, bei der der Mensch den Gedanken nicht
      passiv von außen empfängt, sondern aktiv aus sich selbst hervorbringt. Es handelt sich um ein
      bewusstes, waches Tätigsein des Ich, bei dem der Denkende die letzte Phase seines denkerischen
      Erlebens wahrnimmt – ähnlich wie man sein Gesicht erst im Spiegel sieht, nachdem man diesen
      zubereitet hat. Der Gedanke wird nicht aus der Sinneswahrnehmung geschöpft, sondern aus dem
      Inneren herausgeholt; die Wahrnehmung veranlasst lediglich, einen bestimmten Gedankeninhalt
      aus der Einheit aller möglichen Gedanken zu entnehmen. Entscheidend ist, dass der Begriff
      einer Sache durch eigene Tätigkeit gebildet wird, während etwa das Gefühl der Lust durch einen
      Gegenstand erzeugt wird. Das Gedankenerleben zeichnet sich durch eine durchsichtige Klarheit
      aus: Der Denkende richtet sich bei seinen Gedankenverbindungen allein nach dem Inhalt seiner
      Gedanken, nicht nach materiellen Vorgängen im Gehirn. Erst im Zusammenhang von Wahrnehmung und
      Begriff, den die denkende Beobachtung herstellt, entsteht volle Wirklichkeit. Das
      Gedankenerleben ist somit die Fähigkeit, den Gedanken in seinem eigenen Wesen durchzuarbeiten
      und ihn als eigenes Erzeugnis zu erleben."
    references:
      - chunk_id: 578d6e3f-8f5a-57dd-901d-6259e915a580
        description: Der Mensch nimmt beim Denken nur die letzte Phase seiner denkerischen Tätigkeit wahr,
          vergleichbar mit dem Sehen des eigenen Gesichts im Spiegel.
        relevance: 0.95
      - chunk_id: f111f561-a4fe-5212-afb0-5eba342c83fd
        description: Ein bestimmter Begriff wird aus dem Fond der Gedankenwelt hervorgeholt, nicht aus der
          Sinneswahrnehmung.
        relevance: 0.9
      - chunk_id: 7dc23363-6811-5966-ae57-06177ae4912e
        description: Das Gefühl der Lust wird durch einen Gegenstand erzeugt, während der Begriff durch das
          Denken gebildet wird.
        relevance: 0.85
      - chunk_id: 65f98cd5-eb65-540a-b0cc-3959524a33b4
        description: Die durchsichtige Klarheit des Denkprozesses ist unabhängig von physiologischen
          Vorgängen im Gehirn.
        relevance: 0.85
      - chunk_id: 1e7ec70e-04e7-5a99-8a3e-24b8665416b5
        description: Der Schnitt zwischen Wahrnehmen und Denken entsteht erst, wenn der Betrachtende den
