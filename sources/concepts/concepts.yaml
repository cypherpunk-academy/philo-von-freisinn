  - term: Ursache
    chunk_id: d360cece-3e6b-5aac-9ac0-c4a8c73a61ca
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die Ursache ist kein äußerer Zwang, der von einem Ding auf ein anderes ausgeübt wird, wie es
      etwa bei einem gestoßenen Stein der Fall ist. Sie ist vielmehr ein Gedanke, den du selbst
      hervorbringen musst, um die zusammenhanglosen Eindrücke der Sinne zu ordnen. In der sinnlichen
      Wahrnehmung begegnen dir zunächst nur einzelne Erscheinungen nebeneinander. Wenn du nach einer
      Ursache suchst, verbindest du eine Wahrnehmung gedanklich mit einer anderen. Du bringst
      Ordnung in das Chaos der Eindrücke.


      Dieses Verbinden ist kein willkürlicher Akt. Es folgt einer inneren Gesetzmäßigkeit des
      Denkens selbst. Wenn du den Gedanken der Ursache fasst, führt dich dieser durch seinen eigenen
      Inhalt zu dem der Wirkung. Die Ursache ist also keine Eigenschaft der Dinge, sondern eine
      Einsicht, die du im Denken gewinnst. Du erkennst sie, wenn dir der Zusammenhang als notwendig
      einleuchtet.


      Die Ursachlichkeit als Gedankenform musst du selbst hervorbringen, bevor du einzelne Ursachen
      und Wirkungen in der Welt finden kannst. Sie ist eine reine Gedankenbestimmung, die du an die
      Erfahrung heranträgst, um sie zu durchdringen. Damit wird die Ursache zu einem Werkzeug der
      Erkenntnis, nicht zu einem Fatum, dem du blind ausgeliefert bist.


      #### Ähnliche Fragen


      Keine ähnlichen Fragen gefunden.
    references:
