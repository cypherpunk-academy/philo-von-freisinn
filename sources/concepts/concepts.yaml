begriffe:
  - term: Anschauung
    chunk_id: d8300bf2-22f4-53bf-8498-f3b80d2a9247
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die bloße Wahrnehmung für sich genommen ist noch keine Wirklichkeit, sondern ein „zusammenhangloses Chaos“. Betrachtet man umgekehrt nur die Gesetzmäßigkeit der Wahrnehmungen, so hat man es bloß mit abstrakten Begriffen zu tun. Sobald eine Wahrnehmung im Beobachtungshorizont auftaucht, wird jedoch auch das Denken tätig und verbindet einen Begriff mit ihr. Wahrnehmung und Begriff machen erst zusammen das ganze Ding aus. Die Wirklichkeit liegt daher nicht im abstrakten Begriff, sondern in der „denkenden Beobachtung“, die den Zusammenhang beider betrachtet.

      Bei der Erkenntnis des Organischen, des Typus, reicht das nicht mehr aus. Hier muss der Geist selbst „anschauend“ sein. Er übernimmt die Tätigkeit, die in der unorganischen Naturwissenschaft die Sinne besorgen und die man Anschauung nennt. Die Urteilskraft muss „denkend anschauen und anschauend denken“. Goethe nennt dieses Vermögen „anschauende Urteilskraft“. Der Begriff ist dabei nicht mehr bloße Zusammenfassung eines Mannigfaltigen, sondern mit dem Gegenstand eins geworden: Man schaut den Begriff als Idee selbst an. Der Geist muss „mit der Form den Inhalt erzeugen“. Später beschreibt Steiner, dass das gewöhnliche Denken im Vergleich zum „erkrafteten”, bildhaft-lebendigen Denken blass und schattenhaft ist. Das Erkraften des Denkens gilt ihm als erste Stufe übersinnlicher Erkenntnis (Imagination).
    references:
      - chunk_id: aaa5ba5a-2d65-520e-88ba-ca292533ae15
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 1
      - chunk_id: 1e7ec70e-04e7-5a99-8a3e-24b8665416b5
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 0.9996
      - chunk_id: fa9c2477-a053-5641-9c3f-8e0fb6740239
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 0.9986
  - term: Assoziation
    chunk_id: 390dcbf7-fea3-5715-8f5e-565058dfb23a
    language: de
    tags:
      - concept
      - assistant-generated
    text: Das Denken nimmt innerhalb der Erfahrung eine Ausnahmestellung ein. Während die
      Sinneswahrnehmungen zunächst zusammenhanglos nebeneinanderstehen, offenbart sich im Denken ein
      Element, das aus sich selbst heraus gesetzmäßige Verbindungen herstellt. Der Gedanke der
      Ursache etwa führt durch seinen eigenen Inhalt zu dem der Wirkung. Diese Tätigkeit des
      Verknüpfens erscheint dem Menschen zunächst als sein eigenes Tun. Ob dieses Tun tatsächlich
      Ausfluss eines selbständigen Wesens ist oder ob es durch die im Bewusstsein vorhandenen
      Gedanken und Gedankenverbindungen bestimmt wird, ist eine offene Frage. Die unmittelbare
      Beobachtung zeigt jedoch, dass der Mensch sich genötigt fühlt, zu den gegebenen Gegenständen
      und Vorgängen Begriffe und Begriffsverbindungen zu suchen. Dabei richtet er sich nicht nach
      materiellen Vorgängen in seinem Gehirn, sondern nach dem Inhalt der Gedanken selbst. In einem
      anderen Zusammenhang, nämlich dem der sozialen Dreigliederungsidee, werden Assoziationen als
      praktische Bildungen verstanden. Es sind Zusammenschlüsse, die auf der Grundlage dieser Idee
      gebildet werden können, ähnlich wie Konsortien oder Gesellschaften. Sie sollen sich durch ihre
      innere Kraft und Berechtigung neben die alten Einrichtungen stellen und diese allmählich aus
      der sozialen Organisation herauslösen. Die Assoziation ist hier ein Mittel, um soziale
      Einzeleinrichtungen zu schaffen, von denen aus eine Umbildung des Ganzen ihren Ausgang nehmen
      kann.
    references:
      - chunk_id: 1d4dbddc-ac6f-5ddd-bb53-d954fe5173fd
        description: Das Denken nimmt innerhalb der Erfahrung eine Ausnahmestellung ein und führt über die
          Zusammenhanglosigkeit der Sinneswahrnehmungen hinaus.
        relevance: 0.95
      - chunk_id: 85f84dad-4667-52e4-b5b1-959f739b9586
        description: Die Frage, ob die Tätigkeit des Denkens Ausfluss eines selbständigen Wesens ist oder
          durch vorhandene Gedanken und Gedankenverbindungen bestimmt wird, wird als offen
          dargestellt.
        relevance: 0.9
      - chunk_id: aaa5ba5a-2d65-520e-88ba-ca292533ae15
        description: Der Mensch fühlt das Bedürfnis, die Mannigfaltigkeit der Sinneseindrücke mit dem
          ordnenden Verstand zu durchdringen und gegenseitige Abhängigkeiten aufzuklären.
        relevance: 0.85
      - chunk_id: ebecb8b2-a721-52f4-b02a-948b3dda4eda
        description: Assoziationsbildungen können unmittelbar in die Wirklichkeit umgesetzt werden und
          dienen als Mittel zur sozialen Umbildung.
        relevance: 0.8
      - chunk_id: 65f98cd5-eb65-540a-b0cc-3959524a33b4
        description: Die Klarheit über den Denkprozess ist unabhängig von der Kenntnis physiologischer
          Grundlagen; beobachtet wird der Gedankeninhalt, nicht der materielle Vorgang im Gehirn.
        relevance: 0.75
      - chunk_id: 0ae1ef84-d26f-5de0-9491-3e19f8734e60
        description: Die Tätigkeit des Denkens ist nicht als subjektiv aufzufassen, und die durch das Denken
          hergestellten Beziehungen haben nicht bloß subjektive Geltung.
        relevance: 0.7
      - chunk_id: dc4f16d2-a5d3-5d98-99f8-193e5919898f
        description: Der Mensch fühlt sich genötigt, zu den Empfindungen materielle Bewegungsvorgänge
          hinzuzudenken, aber die Materie ist ebenso Produkt der Organisation wie Farbe oder Ton.
        relevance: 0.65
      - chunk_id: 8c502fb1-3f0f-5682-bb2a-b7439277dba5
        description: Gedanken werden so genommen, wie sie vorgefunden werden, ohne vorgefasste Meinung über
