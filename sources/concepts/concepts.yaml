        relevance: 0.9
      - chunk_id: d02aeb6d-b4d6-5004-9b60-bd8216154bc6
        description: Die gegebene Welt mit Begriffen zu durchdringen ist denkende Betrachtung; das Denken
          bringt im Erkennen einen eigenen Inhalt hervor.
        relevance: 0.9
      - chunk_id: fa9c2477-a053-5641-9c3f-8e0fb6740239
        description: Der Mensch erlebt im Denken eine unmittelbare Tätigkeit, die er überschauen kann.
        relevance: 0.7
  - term: Wesenheit
    chunk_id: ab40c527-bd38-523a-8fe4-d8a67cb4ebc5
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Begriff „Wesenheit“ bezeichnet eine konkrete, in sich geschlossene, wirkende Einheit, die
      aus eigenem inneren Impuls handelt. Eine solche Wesenheit ist nicht statisch, sondern befindet
      sich in einem beständigen Werden und Wirken. Sie kann nicht allein aus äußeren Umständen oder
      aus den Gesetzen einer Gattung erklärt werden, sondern nur aus sich selbst heraus. Der Mensch
      etwa entwickelt Eigenschaften und Funktionen, deren Bestimmungsgrund nur in ihm selbst gesucht
      werden kann. Das Gattungsmäßige dient ihm dabei lediglich als Mittel, um seine besondere
      Wesenheit in ihm auszudrücken und ihr die seinem eigenen Wesen gemäße Form zu geben.


      Eine Wesenheit ist kein bloß erdachtes oder erträumtes Ideal, sondern ein reales Element, das
      sich in der eigenen inneren Tätigkeit an die Oberfläche arbeitet. Sie zeigt sich in der
      Fähigkeit, aus sich selbst heraus tätig zu sein und die eigene Persönlichkeit als ein Zentrum
      zu erleben, von dem Denken, Fühlen und Wollen ausgehen. Frei handelt, wer aus dieser eigenen
      Wesenheit heraus handelt, losgelöst von bloß gattungsmäßigen Bestimmungen. Die Erforschung des
      eigenen Wesens führt an einen Punkt, wo man sich sagen kann: Hier bin ich nicht mehr bloß
      „Ich“, hier liegt etwas, was mehr als „Ich“ ist. In diesem Sinne ist die Wesenheit der innere,
      selbsttätige Kern, der das Individuum in seiner Besonderheit trägt und der nur durch sich
      selbst erklärt werden kann.
    references:
      - chunk_id: cb70c9d2-c875-598d-9b1c-9b615e173198
        description: Ein Ideal arbeitet sich in der Wesenheit als reales Element an die Oberfläche und ist
          kein erdachtes oder erträumtes Ideal.
        relevance: 0.95
      - chunk_id: e9dc7b4d-5d2a-57b6-b743-daef6daf965a
        description: Der Mensch macht sich vom Gattungsmäßigen frei, entwickelt Eigenschaften aus sich
          selbst und nutzt das Gattungsmäßige nur als Mittel, um seine besondere Wesenheit
          auszudrücken.
        relevance: 0.95
      - chunk_id: b05b7df9-dfe5-53ba-80cd-5f38f376a313
        description: Die Erforschung des Wesens führt zu einem Punkt, wo man nicht mehr bloß 'Ich' ist,
          sondern etwas, was mehr als 'Ich' ist.
        relevance: 0.9
      - chunk_id: 5c11a628-0833-5d2f-a5f9-216952e3a83c
        description: Denken, Fühlen und Wollen gehen vom 'Ich' aus, und jede Tätigkeit der Persönlichkeit
          ist mit diesem Zentrum des Wesens verbunden.
        relevance: 0.85
  - term: Wirtschaft
    chunk_id: 6d7975aa-d8b2-5c64-a2c4-624d152e9f83
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die Wirtschaft ist in der Dreigliederung des sozialen Organismus ein eigenständiger Bereich,
      der nach seinen eigenen Gesetzmäßigkeiten funktioniert. Sie ist weder dem Staat noch dem
      Geistesleben untergeordnet, sondern bildet ein selbständiges Glied neben diesen beiden. Ihr
      Kern liegt nicht im Gewinnstreben oder in der Kapitalvermehrung, sondern im sachlichen
      Interesse an der Hervorbringung von Produkten und Leistungen. Wirtschaften bedeutet, dass
      Menschen füreinander sorgen: Der Wert einer Ware hängt nicht allein von der eigenen Arbeit ab,
      sondern von den Leistungen aller am Wirtschaftskreislauf Beteiligten. Geld ist in diesem Sinne
      eine Anweisung auf künftige Gegenleistungen.


      Die Organisation der Wirtschaft erfolgt nicht durch staatliche Lenkung oder durch den freien
      Markt allein, sondern durch Assoziationen, in denen sich Produzenten, Händler und Konsumenten
      nach wirtschaftlichen Gesichtspunkten zusammenschließen. In diesen Assoziationen regeln die
      Beteiligten gemeinsam Produktion, Preisbildung und Kreditvergabe. Jeder Mensch hat darin genau
      so viel Einfluss, wie seiner Leistung entspricht. Arbeit wird nicht als Ware behandelt,
      sondern als persönlicher Beitrag zur Gemeinschaft. Die Wirtschaft dient letztlich einem
      höheren Zweck: Sie soll dem Menschen die Freiheit geben, sich im Geistesleben und im
      Rechtsleben nach eigenen Impulsen zu entfalten. Ohne diese Dreigliederung wird der Mensch zum
      bloßen Rad im Wirtschaftsmechanismus.
    references:
      - chunk_id: 5e7db331-cce9-54e2-a0b9-682c359f1efc
        description: Hohe semantische Aehnlichkeit zum finalen Text.
        relevance: 1
