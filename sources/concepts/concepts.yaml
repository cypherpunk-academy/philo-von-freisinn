        relevance: 0.8
  - term: Moral
    chunk_id: 15f7dbf8-8f49-5c7a-9dd0-b86c57c133be
    language: de
    tags:
      - concept
      - assistant-generated
    text: Moral wird nicht als Sammlung von Geboten oder gesellschaftlichen Konventionen verstanden,
      sondern als eine Fähigkeit des Menschen, aus eigener Einsicht zu handeln. Die sittlichen
      Ideale sind kein Abbild von etwas außer uns, sondern unser eigenes freies Erzeugnis. Ein
      kategorischer Imperativ oder eine Stimme aus dem Jenseits, die uns vorschreibt, was wir zu tun
      haben, wird abgelehnt. Der Mensch ist sein eigener Gesetzgeber. Moralische Handlung entsteht
      aus Erkenntnis und freier Einsicht, nicht aus Zwang. Solange die Beweggründe bloß natürliche
      oder unklare Motive sind, empfinden wir sie als von außen zwingend. Sobald es uns gelingt, ein
      solches Motiv klar erkennend zu durchdringen, machen wir eine Eroberung im Gebiet der
      Freiheit. Frei sein heißt, die dem Handeln zugrunde liegenden Vorstellungen durch die
      moralische Fantasie von sich aus bestimmen zu können. Diese moralische Fantasie ist die Quelle
      für das Handeln des freien Geistes. Sie produziert aus der Summe der Ideen die konkreten
      Vorstellungen für den einzelnen Fall. Die sittlichen Ideale entspringen aus dieser moralischen
      Fantasie; sie sind Intuitionen, die der Mensch will, weil ihre Verwirklichung seine höchste
      Lust ist. Der ethische Individualismus stellt diesen individuellen, intuitiven Gehalt als die
      höchste moralische Triebfeder dar. Moral ist somit keine äußere Norm, sondern die innere Tat
      eines Menschen, der aus Erkenntnis heraus frei und verantwortungsvoll handelt.
    references:
      - chunk_id: 85cba29d-7761-5c34-b327-1efa42cc1cf2
        description: Sittliche Ideale sind kein Abbild von etwas außer uns, sondern nur in uns vorhanden;
