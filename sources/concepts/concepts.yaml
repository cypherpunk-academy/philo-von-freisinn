        relevance: 0.9885
  - term: Wirtschaftsleben
    chunk_id: 9a1c592b-dc51-57c3-890b-85d6262df16e
    language: de
    tags:
      - concept
      - assistant-generated
    text: Das Wirtschaftsleben ist in der Dreigliederung des sozialen Organismus ein eigenständiger
      Funktionsbereich, der auf seinem eigenen Boden steht und vom Staat getrennt ist. Es umfasst
      die Befriedigung menschlicher Bedürfnisse durch Produktion und Konsumtion. Anders als im
      marxistischen Sozialismus, der den Staat zur wirtschaftlichen Organisation macht, wird das
      Wirtschaftsleben vom Staat losgelöst. Es soll nicht durch eine zentralistische Verwaltung oder
      staatliche Bevormundung gesteuert werden, sondern aus den Anforderungen des Wirtschaftslebens
      selbst heraus gestaltet sein. Die Grundlage dafür ist die freie Initiative wirtschaftender
      Menschen, die sich in Assoziationen zusammenschließen. Diese Assoziationen entstehen aus den
      Produktionserfordernissen und Konsumtionsinteressen und organisieren den Wirtschaftskreislauf
      durch lebendigen Verkehr zwischen Produktion und Konsumtion. In diesen Assoziationen werden
      Entscheidungen über Kreditgewährung und Preisbildung getroffen, wobei nicht einseitige
      Gewinninteressen, sondern sachgemäße Bedürfnisse der Gemeinschaft leitend sind. Das
      Wirtschaftsleben kann sich so unabhängig von politischen Grenzen entfalten und strebt einem
      freien Wirtschaftsverkehr zu. Die Trennung der drei Glieder verhindert, dass wirtschaftliche
      Interessen in das Rechts- oder Geistesleben übergreifen. So wird das Wirtschaftsleben zu einem
      selbständigen, aus seinen eigenen Kräften heraus gestalteten Bereich des sozialen Organismus.
    references:
      - chunk_id: d91d5efd-41ef-56eb-a0a8-3bb0cacdc8cf
        description: Die Dreigliederung stellt das Wirtschaftsleben auf eigenen Boden, löst es vom Staat und
          lehnt zentralistische Verwaltung ab.
        relevance: 1
      - chunk_id: 001d294d-69c5-58d6-b656-a12b575629e4
        description: Das Wirtschaftsleben kommt durch Assoziationen aus Produktionserfordernissen und
          Konsumtionsinteressen zustande, die über Kreditgewährung entscheiden.
        relevance: 1
      - chunk_id: ec62efab-7d2b-53f2-8fbb-abc2fbc2fbb7
        description: Im assoziativ gestalteten Wirtschaftssystem wirken nur wirtschaftliche Werte, die sich
          durch Assoziationen herausbilden, und der Einzelne erhält Einfluss entsprechend seiner
          Leistung.
        relevance: 0.9
      - chunk_id: a9743ea0-dfce-59fb-9519-07c177d125ee
        description: Ein Wirtschaftsleben ohne staatliche Beteiligung entsteht aus unbeeinflussten
          wirtschaftlichen Erfahrungen und besonderen wirtschaftlichen Untergründen.
        relevance: 0.9
      - chunk_id: d4f39cf7-c704-55b7-91d3-3b27f96d0e76
        description: Durch die Dreigliederung wird der wirtschaftliche Kreislauf unabhängig von politischen
          Grenzen und strebt freien Wirtschaftsverkehr an.
        relevance: 0.9
      - chunk_id: 5e7db331-cce9-54e2-a0b9-682c359f1efc
        description: Die Dreigliederung stülpt keinen staatsähnlichen Plan über wirtschaftliche Beziehungen,
          sondern fördert Assoziationen gleichgerichteter Wirtschaftszweige.
        relevance: 0.9
      - chunk_id: 99383742-49fd-5d75-821b-275b146e470e
        description: Der Wirtschaftskreislauf wird durch sachgemäße Maßnahmen der Wirtschaftskorporationen
          geregelt, und demokratisches Hineinwirken würde die Sacherkenntnis unterdrücken.
        relevance: 0.8
      - chunk_id: 391029c1-56c2-5c9f-894d-f9358a52755b
        description: In Assoziationen regeln Menschen aus Einsicht und Interesse die Gütererzeugung,
