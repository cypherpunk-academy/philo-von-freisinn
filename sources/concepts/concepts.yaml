        relevance: 0.2
  - term: Metamorphose
    chunk_id: 8feddced-6269-5088-bfe7-bd1290c863f7
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Metamorphose bezeichnet bei Goethe und in der daran anschließenden Betrachtungsweise einen
      inneren, gesetzmäßigen Bildungsvorgang, bei dem ein ursprüngliches Grundgebilde in
      verschiedenen Stufen wiederkehrt, ohne sich selbst zu verlieren. Das deutlichste Beispiel ist
      die Pflanze: Das Blatt mit dem Knoten, an dem es sich entwickelt, ist das Grundorgan. Es nimmt
      in der äußeren Erscheinung nacheinander die Gestalt von Keimblatt, Laubblatt, Kelchblatt,
      Kronenblatt, Staubgefäß und Fruchtblatt an. Es sind immer dieselben Organe, die in
      vielfältigen Bestimmungen die Vorschrift der Natur erfüllen. Die Bildungskraft wiederholt das
      Grundgebilde auf jeder Stufe, zieht sich im Kelch zusammen, breitet sich in der Krone aus und
      findet in der Befruchtung, die Goethe eine geistige Anastomose nennt, zur neuen Einheit.
      Entscheidend ist, dass dieser Vorgang nicht bloß sinnlich beobachtbar ist, sondern als ein
      sinnlich-übersinnlicher erfasst werden muss. Was das leibliche Auge sieht, ist nur die Folge
      eines lebendigen Ganzen durcheinander wirkender Bildungsgesetze, die dem geistigen Auge allein
      zugänglich sind. Die Begriffe wie Urpflanze oder Urtier müssen beweglich gedacht werden: Sie
      sind nicht abgeschlossen, sondern durchkriechen die ganze Entwicklung des Pflanzen- oder
      Tierreichs, indem sie sich verändern wie das Dreieck, das spitzwinklig oder stumpfwinklig sein
      kann. Diese Beweglichkeit der Begriffe aufzunehmen, ist die Voraussetzung, um das Werden in
      der Natur nicht starr, sondern lebendig zu erfassen."
    references:
      - chunk_id: e7e052f2-cca8-52d3-b521-587470924279
        description: Goethes Begriffe Urpflanze und Urtier müssen beweglich gedacht werden, um sie zu verstehen.
        relevance: 0.95
      - chunk_id: c78b8892-0d35-562b-b89e-2ab2910a78ab
        description: Goethe stellte sich die Keimung, das Wachstum und die Umwandlung der Organe als
          sinnlich-übersinnlichen Vorgang vor, der in der Idee bei allen Pflanzen derselbe ist.
        relevance: 0.95
      - chunk_id: ced92a06-9734-57a5-a84d-8c042846b9fb
        description: Im Kelch zieht sich die Pflanzengestalt zusammen, in der Krone breitet sie sich aus,
          und die Bildungskraft wiederholt das Grundgebilde auf jeder Stufe.
        relevance: 0.95
      - chunk_id: 7605a080-826d-5db5-ab51-047dec30c4b7
        description: Goethes Vorstellung vom Wesen des Lebens betont das Ganze der Pflanzennatur als
          Lebendiges, nicht nur die Identität der Organe.
        relevance: 0.9
      - chunk_id: 9630cb46-e358-5dae-ac7b-933f916218dc
        description: Man muss Goethes Verhältnis zu den Dingen belauschen und das Innerste seiner
          Persönlichkeit erfassen, um die Einheit seiner Anschauungen zu verstehen.
        relevance: 0.6
  - term: Metaphysik
    chunk_id: a35f3f6f-1a7c-5004-b587-0f4c4428c0bd
    language: de
    tags:
      - concept
      - assistant-generated
    text: Die Metaphysik im herkömmlichen Verständnis geht von der Annahme aus, dass hinter der uns
      zugänglichen Erscheinungswelt ein Reich von unerkennbaren „Dingen an sich“ verborgen liege.
      Diese Vorstellung wird abgelehnt. Wer in der uns vorliegenden Welt nur einen Abglanz eines
      jenseitigen, unerforschlichen Wirkens sieht, der kann in der beweisenden Methode nur einen
      Ersatz für die mangelnde Einsicht in das Wesen der Dinge erblicken. Eine solche Haltung
      übersieht, dass das Denken kein bloßes Abbilden einer äußeren Welt ist, sondern ein lebendiger
      Vorgang, der die Wirklichkeit in ihrem Wesen erfasst. Das Denken ist eine Totalität in sich,
      die sich selbst genug ist. Es darf nicht, um etwas zu erklären, zu Dingen seine Zuflucht
      nehmen, die es nicht in sich selbst findet. Alles geht zuletzt im Denken auf. Die
      entscheidende Einsicht ist, dass wir im Denken den Kern der Welt wesenhaft erfassen. Damit
      wird die alte Metaphysik, die ein unerkennbares Jenseits postuliert, überflüssig. An ihre
      Stelle tritt eine Erkenntnishaltung, die das Denken als unmittelbaren Zugang zur Wirklichkeit
      versteht. Die wahre Erkenntnis beruht auf der Erfahrung des Denkens als einer Tätigkeit, die
      selbst zur Wirklichkeit gehört. Die Frage nach dem Wesen der Welt ist keine Frage nach einem
      verborgenen Hintergrund, sondern die Aufgabe, den Ideengehalt der Welt im Denken zu finden.
    references:
      - chunk_id: faa3947f-0d26-59a5-aca2-7bdd4e446643
        description: Das Denken ist der Kern der Welt, und die Erkenntnistheorie zeigt den Zusammenhang des
          Denkens mit der übrigen Wirklichkeit.
        relevance: 0.95
      - chunk_id: f891920c-bfc9-589c-96c7-0e00573db03a
        description: Die Intuition bedeutet innerhalb der wissenschaftlichen Richtung, die das Denken als
          wesenhaften Erfasser des Weltkerns versteht, etwas anderes als in jener, die das Wesen in
          ein unerforschbares Jenseits verlegt.
        relevance: 0.95
      - chunk_id: 8c502fb1-3f0f-5682-bb2a-b7439277dba5
        description: Man muss sich von der vorgefassten Meinung frei halten, der Begriff sei das Bild
          innerhalb des Bewusstseins, das Aufschluss über einen außerhalb liegenden Gegenstand gibt.
        relevance: 0.85
      - chunk_id: a8a720cf-7f41-5b8a-9f30-6b10fe1c770e
        description: Man hat nicht das Recht, Ergebnisse einer Beobachtung zurückzuweisen, weil sie
          Vorstellungen widersprechen, die man aus Gedankenneigungen ohne Beobachtung für richtig
          hält.
        relevance: 0.7
      - chunk_id: fab83a13-1c8b-5705-b2a2-1a64ecd6a698
        description: Dem Philosophen handelt es sich nicht um die Weltschöpfung, sondern um das Begreifen
          derselben, und er hat die Ausgangspunkte für das Begreifen der Welt zu suchen.
        relevance: 0.6
  - term: Metaphysischer Realismus
    chunk_id: c6dca7b2-4d58-5f11-8515-0e6425d4b2a5
    language: de
    tags:
      - concept
      - assistant-generated
    text: "Eine Weltanschauung, die annimmt, es gebe eine von uns unabhängige, an sich bestehende
      Wirklichkeit, die dem Erkennen als fertige, äußere Welt gegenübersteht. Diese Wirklichkeit
      soll hinter den Wahrnehmungen liegen und durch das Denken erschlossen werden können. Der
      metaphysische Realismus konstruiert neben der wahrnehmbaren Realität eine unwahrnehmbare, die
      er der ersten analog denkt. Er ist deshalb notwendig ein Dualismus: Er trennt die Welt in eine
      „Welt an sich“ und eine „Welt für uns“. Er kann sich nicht dazu entschließen, den Begriff als
      gleichberechtigten Faktor neben der Wahrnehmung anzuerkennen. Stattdessen setzt er für die
      Beziehungen zwischen den Wahrnehmungen, die nur durch das Denken ausdrückbar sind, willkürlich
      eine dem Wahrnehmbaren ähnliche Realität hinzu. So entstehen hypothetische Kräfte oder
      Wesenheiten, die unwahrnehmbar sind, aber Wahrnehmungsqualitäten besitzen sollen. Der
      metaphysische Realismus muss konsequent die Freiheit leugnen, weil er im Menschen nur den
      Vollstrecker von notwendig ihm aufgedrängten Prinzipien sieht. Der Mensch erscheint als
      abhängig von einer vorgegebenen Ordnung. Die entscheidende Schwierigkeit liegt darin, dass das
      Denken hier nicht als aktives, gestaltendes Element verstanden wird, sondern nur als Mittel,
      um eine bereits fertige Wirklichkeit nachträglich zu erkennen. Damit verfehlt dieser
      Standpunkt, dass die Wahrheit nicht empfangen, sondern im Vollzug des Denkens erst geschaffen
      wird."
    references:
      - chunk_id: f4c5a620-0ea1-5353-9d7d-ca6c9c0fa271
        description: Der naive und der metaphysische Realismus leugnen die Freiheit, weil sie den Menschen
          als Vollstrecker notwendig aufgedrängter Prinzipien sehen.
        relevance: 0.9
      - chunk_id: 86a37aa2-833a-56d5-8e60-183ea2160ef7
        description: Der metaphysische Realismus ist eine widerspruchsvolle Mischung aus naivem Realismus
          und Idealismus, der unwahrnehmbare Wesenheiten mit Wahrnehmungsqualitäten annimmt.
        relevance: 0.9
      - chunk_id: 8fd9cadf-4b41-5503-8c78-142b9c6f958d
        description: Der metaphysische Realismus konstruiert neben der wahrnehmbaren eine unwahrnehmbare
          Realität und ist deshalb notwendig Dualismus.
        relevance: 0.9
      - chunk_id: d008fc8e-bb84-55c0-8cfe-ab6ad367b8b3
        description: Die höchste Wahrheit kann nicht empfangen, sondern muss geschaffen werden, da
          Abhängigkeit von einem fertigen Wesen die Unabhängigkeit des Menschen aufhebt.
        relevance: 0.8
      - chunk_id: c6c79236-88e7-57e8-ac97-c4ac3e50596f
        description: Der metaphysische Realismus fragt, wodurch das Subjekt affiziert wird, während der
          Monismus die Wahrnehmung durch das Subjekt bestimmt sieht und das Denken als Mittel zur
          Aufhebung dieser Bestimmtheit ansieht.
        relevance: 0.7
      - chunk_id: 4dbf84ba-d2a6-5b21-8abd-15d00cfba34e
        description: Das Denken ist das Element, durch das der Mensch sich geistig in die Wirklichkeit
          hineinlebt, und die Wahrnehmung erhält erst im Denken ihre Wirklichkeitsbestimmung.
        relevance: 0.7
      - chunk_id: afa5315e-e47f-566b-9894-4b87d048bba5
        description: Der metaphysische Realist gewinnt die Gestalt seiner Dinge an sich durch
          Induktionsschlüsse aus Wahrnehmungen.
        relevance: 0.6
      - chunk_id: 1aa6b5ab-65ad-536b-a1b7-20bb7843a6fc
        description: Der erste Schritt über den naiven Standpunkt hinaus besteht in der Frage, wie sich das
          Denken zur Wahrnehmung verhält.
        relevance: 0.5
  - term: Monade
    chunk_id: bbc027e0-8fa2-529f-847e-870c564a4371
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Die Monade ist ein Begriff, den Gottfried Wilhelm Leibniz in die Philosophie eingeführt hat,
      um das Wesen der Wirklichkeit zu beschreiben. Für Leibniz ist die Monade eine selbständige,
      streng in sich abgeschlossene geistige Einheit, die kein Fenster nach außen hat. Nichts kann
      von außen in sie hineingelangen; alles, was sie erlebt, vorstellt oder empfindet, ist das
      Ergebnis ihrer eigenen Tätigkeit. Die Welt besteht in Wahrheit nur aus solchen Monaden, die
      sich in ihrem Innenleben unterscheiden: von dumpfen, schlafenden bis hin zur wachen
      menschlichen Seelenmonade und zur göttlichen Urmonade. Was der Mensch mit seinen Sinnen als
      äußere Welt wahrnimmt, ist nur ein Scheinbild, ein Nebel, der durch das Zusammensein vieler
      Monaden entsteht.


      Diese Auffassung wird jedoch in einer entscheidenden Hinsicht weitergeführt. Die Monade ist
      nicht als starres, fertiges Ding zu verstehen, sondern als ein lebendiger, sich entwickelnder
      Wesenskern. Sie ist das, was im Menschen als individuelles Ich wirkt. Indem der Mensch denkt,
      hebt er die Schranke zwischen sich und der Welt auf. Die Monade wird so zum Ort, an dem die
      Welt sich selbst bewusst wird. In der selbständigen Tätigkeit des Erkennens verwirklicht der
      Mensch seine Freiheit. Die Monade ist kein abgeschlossenes Produkt, sondern ein Werden. Auf
      diesem Weg kann der Mensch die Stufe des freien Geistes erreichen, indem er sich aus eigenen
      inneren Impulsen heraus entwickelt und zugleich klar erkennt, wo die Grenzen seiner Freiheit
      liegen.
    references:
      - chunk_id: 1e94046e-b4d3-5d80-b6c4-d27fe5fcd003
        description: Leibniz sieht die Menschenseele als selbständige, in sich abgeschlossene Monade, die
          nur erlebt, was in ihr ist; die äußere Welt ist ein Scheinbild, hinter dem die wahre Welt
          aus Monaden mit prästabilierter Harmonie l...
        relevance: 0.95
      - chunk_id: c177e7cd-85b6-5df9-b6cd-b4301749d5a6
        description: Alles Erleben, Vorstellen und Empfinden der Monade ist Ergebnis ihrer eigenen
          Tätigkeit; nichts Äußeres kann in sie eindringen, daher hat die Monade keine Fenster, und
          alle wirklichen Wesen sind Monaden.
        relevance: 0.95
      - chunk_id: aade5ed8-cc98-5712-8f93-d487d3d5be42
        description: Leibniz' Weltbild ist aus dem selbstbewussten Ich heraus gestaltet, um das Ich als
          Wirklichkeit zu behaupten, und es nimmt nichts von der Außenwelt als Wahrheit hin.
        relevance: 0.85
      - chunk_id: 3ea3892a-d12a-5e90-972a-acd23da03883
        description: Leibniz sucht die Rechtfertigung des Ich-Bewusstseins, indem er die Seele als Monade
          denkt, die Selbstbewusstsein als Wissen von sich selbst offenbart.
        relevance: 0.8
      - chunk_id: e8692bac-5a0b-57fa-b292-3622c3d79d8e
        description: Leibniz ist ein Philosoph, der geistige Grundwesen der Welt annimmt und über das
          Vorurteil hinausgeht, dass etwas bloß materiell existieren könne.
        relevance: 0.7
      - chunk_id: e0a9a588-ba07-5997-8611-f98b30f7d3e6
        description: Es gibt Menschen, die sich nicht bis zur Monade erheben und stattdessen die äußere
          Realität von Kräften beherrscht sehen.
        relevance: 0.5
      - chunk_id: 07f50e30-1ed9-54b0-bbde-4753b4104487
        description: Der Monismus als Freiheitsphilosophie erkennt den Menschen nicht als abgeschlossenes
          Produkt, sondern als sich entwickelndes Wesen.
        relevance: 0.4
  - term: Monismus
    chunk_id: e365226f-5161-5bfa-be4f-b6461ab0440b
    language: de
    tags:
      - concept
      - assistant-generated
    text: >-
      Der Monismus ist eine Weltauffassung, die davon ausgeht, dass die Wirklichkeit ihrem Wesen
      nach eine Einheit ist. Die Welt erscheint dem Menschen zunächst als Zweiheit: als Wahrnehmung
      und als Denken, als Subjekt und Objekt. Der Monismus erkennt jedoch, dass diese Trennung nicht
      in der Sache selbst liegt, sondern durch die Organisation des Menschen bedingt ist. Das
      Erkennen überwindet diese Zweiheit, indem es die Wahrnehmung mit dem durch das Denken
      erarbeiteten Begriff zu einer einheitlichen Wesenheit zusammenfügt. So wird aus der gegebenen
      Zweiheit eine gedanklich erarbeitete Einheit.


      Im Gegensatz dazu steht der Dualismus, der zwei voneinander absolut verschiedene Welten
      annimmt, etwa Geist und Materie, und der dann vergeblich nach einer Brücke zwischen ihnen
      sucht. Der Monismus hingegen sucht das Wirkliche nicht hinter der Erfahrung, sondern in ihr
      selbst. Er zeigt, dass der Mensch mit seinem Erkennen die Wirklichkeit in ihrer wahren Gestalt
      ergreift, nicht in einem subjektiven Bild. Das Denken hat die Kraft, die Wirklichkeit zu
      verbürgen.


      Der Monismus ist zugleich Freiheitsphilosophie. Er betrachtet den Menschen nicht als ein
      fertiges, sondern als ein sich entwickelndes Wesen. Er fragt, ob auf dieser Entwicklungsbahn
      die Stufe des freien Geistes erreicht werden kann. Der Mensch ist nicht als freier Geist
      geboren, sondern kann sich zu einem solchen entwickeln, indem er durch sein Denken die Einheit
      von Ich und Welt tätig herstellt.
    references:
      - chunk_id: 5c239bee-6bfa-564a-80e4-63d06c3d4c70
        description: Die volle Wirklichkeit erscheint dem Menschen zunächst als Zweiheit von Wahrnehmung und
          Denken, und das Erkennen überwindet diese Zweiheit, indem es aus beiden Elementen das
          ganze Ding zusammenfügt.
        relevance: 0.95
      - chunk_id: 07f50e30-1ed9-54b0-bbde-4753b4104487
