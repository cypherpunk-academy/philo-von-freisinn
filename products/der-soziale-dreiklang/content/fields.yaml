# Der soziale Dreiklang — alle zwölf Felder
# Single Source of Truth für A4, A2, A0 und Web

product:
  name: Der soziale Dreiklang
  subtitle: Geist, Recht und Wirtschaft — Harmonie und Ungleichgewicht
  author: Philo von Freisinn
  slug: der-soziale-dreiklang
  language: de

spheres:
  geist:
    name: Geistesleben
    principle: Freiheit
    color: Blau/Violett + Gold
    motif: aufsteigende Spirale, Taube/Schwan
  recht:
    name: Rechtsleben
    principle: Gleichheit
    color: Rosé/Grün
    motif: gespiegelte Symmetrie, Doppelform/Waage
  wirtschaft:
    name: Wirtschaftsleben
    principle: Brüderlichkeit
    color: Ocker/Rot-Erdton
    motif: vernetzte Kreise, kreisende Ströme/Ketten

fields:

  # --- Harmonie (Diagonale) ---

  - id: harmonie-geist
    number: 1
    type: harmony
    matrix: { row: geist, col: geist }
    principle: Freiheit
    status: final
  - id: harmonie-recht
    number: 2
    type: harmony
    matrix: { row: recht, col: recht }
    principle: Gleichheit
    status: final
  - id: harmonie-wirtschaft
    number: 3
    type: harmony
    matrix: { row: wirtschaft, col: wirtschaft }
    principle: Brüderlichkeit
    status: final

  # --- Übergriffe (Off-Diagonale) ---

  - id: uebergriff-geist-recht
    number: 4
    type: imbalance
    matrix: { row: geist, col: recht }
    from: geist
    to: recht
    status: final
    title: Der Geist greift nach dem Staat
    corruption: Glaube wird zu Gesetz · Theokratie
    thought: >-
      Eine geistige Idee — ein Glaube, eine Weltanschauung — verlässt ihre freie
      Sphäre und macht sich zur Grundlage staatlicher Gewalt. Aus Überzeugung wird
      Zwang, aus Bekenntnis wird Recht.
    examples:
      - label: Religiöse Landnahme
        text: >-
          „Eretz Israel" als religiöse Begründung staatlicher Territorialansprüche;
          ebenso die Islamische Republik Iran.
      - label: Herrschende Lüge
        text: >-
          Golf von Tonkin, irakische „Massenvernichtungswaffen" — die Presse wird
          zur Kriegslegitimation eingespannt.

  - id: uebergriff-geist-wirtschaft
    number: 5
    type: imbalance
    matrix: { row: geist, col: wirtschaft }
    from: geist
    to: wirtschaft
    status: final
    title: Das Dogma diktiert den Markt
    corruption: Lehre bestimmt Produktion
    thought: >-
      Eine geistige Doktrin schreibt vor, was produziert, gehandelt und konsumiert
      werden darf — statt dass realer Bedarf und assoziative Vernunft den Ausschlag
      geben.
    examples:
      - label: Religiöse Wirtschaftsgebote
        text: >-
          Zinsverbot (Islamic Finance), Halal-/Koscher-Zertifizierung als
          Marktregime.
      - label: Ideologische Planwirtschaft
        text: Eine Weltanschauung bestimmt die Produktion statt des Bedarfs.

  - id: uebergriff-recht-geist
    number: 6
    type: imbalance
    matrix: { row: recht, col: geist }
    from: recht
    to: geist
    status: final
    title: Der Staat beherrscht den Geist
    corruption: Macht bestimmt Wahrheit
    thought: >-
      Der Staat greift nach Religion, Bildung, Presse und Wissenschaft und schreibt
      vor, was geglaubt, gelehrt und gewusst werden darf. Die Freiheit des Geistes
      wird dem Zwang geopfert.
    examples:
      - label: Staatsreligion / Staatsatheismus
        text: Verordneter Lehrplan, Pressezensur.
      - label: Lyssenkoismus
        text: Der Staat diktiert, was als wahr zu gelten hat.

  - id: uebergriff-recht-wirtschaft
    number: 7
    type: imbalance
    matrix: { row: recht, col: wirtschaft }
    from: recht
    to: wirtschaft
    status: final
    title: Der Staat lenkt die Wirtschaft
    corruption: Gewalt setzt Preise
    thought: >-
      Staatliche Gewalt greift unmittelbar in Produktion, Preise und Handel ein,
      statt nur den Rechtsrahmen zu sichern, in dem die Wirtschaft sich selbst
      assoziativ ordnet.
    examples:
      - label: Planwirtschaft
        text: Verstaatlichung, staatliche Preisfestsetzung.
      - label: Sanktionen & Zölle
        text: Handel als politische Waffe statt wirtschaftlicher Vernunft.

  - id: uebergriff-wirtschaft-recht
    number: 8
    type: imbalance
    matrix: { row: wirtschaft, col: recht }
    from: wirtschaft
    to: recht
    status: final
    title: Das Geld kauft das Recht
    corruption: Vorrecht wird Ware
    thought: >-
      Wirtschaftliche Macht kauft sich Gesetze und Vorrechte. Was für alle gleich
      gelten sollte, wird käuflich — das Recht hört auf, Recht zu sein, und wird
      zur Ware.
    examples:
      - label: Lobbyismus & Parteienfinanzierung
        text: Faktisch käufliche Gesetze.
      - label: Vorrechte als Ware
        text: Golden Visa, Bodenrente/Miete, Patente.

  - id: uebergriff-wirtschaft-geist
    number: 9
    type: imbalance
    matrix: { row: wirtschaft, col: geist }
    from: wirtschaft
    to: geist
    status: final
    title: Der Profit kauft die Wahrheit
    corruption: Geld bestimmt Wissen
    thought: >-
      Das Wirtschaftsleben kolonisiert Forschung, Bildung, Presse und Kultur.
      Erkenntnis und Aufmerksamkeit folgen nicht mehr der Wahrheit, sondern dem
      Profit.
    examples:
      - label: Gekaufte Forschung
        text: Tabak-, Zucker-, Pharma-Studien im Dienst des Auftraggebers.
      - label: Aufmerksamkeitsökonomie
        text: Werbefinanzierte Presse; Medien folgen dem Profit, nicht der Wahrheit.

  # --- Kombinationsfelder ---

  - id: kombination-geist-recht-wirtschaft
    number: 10
